/* ================= i18n (Arabic/English toggle) ================= */
// Same pattern as hr-system.jsx's i18n scaffold (see that file for the full rationale) -
// keyed by the Arabic text itself so every call site just wraps its existing string as
// t("..."). This file shares no imports with hr-system.jsx, so this scaffold (and its own
// TRANSLATIONS dictionary at the bottom of this file) is a separate, independent copy.
const LangContext = createContext({ lang: "ar", dir: "rtl", t: (s) => s, toggle: () => {} });
function useLang() { return useContext(LangContext); }
function autoT(t, v) { return typeof v === "string" ? t(v) : v; }
function translate(lang, ar, vars) {
  let s = lang === "en" ? (TRANSLATIONS[ar] ?? ar) : ar;
  if (vars) Object.keys(vars).forEach((k) => { s = s.split(`{${k}}`).join(vars[k]); });
  return s;
}
function useLangState() {
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem("hr_employee_portal_lang") === "en" ? "en" : "ar"; } catch { return "ar"; }
  });
  useEffect(() => { try { localStorage.setItem("hr_employee_portal_lang", lang); } catch {} }, [lang]);
  const dir = lang === "en" ? "ltr" : "rtl";
  const t = (ar, vars) => translate(lang, ar, vars);
  const toggle = () => setLang((l) => (l === "ar" ? "en" : "ar"));
  return { lang, dir, t, toggle };
}
function LangToggle({ className = "" }) {
  const { lang, toggle } = useLang();
  return (
    <button onClick={toggle} className={`flex items-center gap-1.5 rounded-lg border border-stone-300 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-stone-50 ${className}`}>
      <Languages size={13} /> {lang === "ar" ? "English" : "العربية"}

}
// TRANSLATIONS (Arabic -> English) lives at the very bottom of this file, right before the
// root render call.

const STATUS_LABELS = { present: "حاضر", absent: "غائب", late: "متأخر", leave: "إجازة" };
const STATUS_COLORS = {
  present: "bg-emerald-50 text-emerald-700 border-emerald-200",
  absent: "bg-rose-50 text-rose-700 border-rose-200",
  late: "bg-amber-50 text-amber-700 border-amber-200",
  leave: "bg-sky-50 text-sky-700 border-sky-200",
};
const REQUEST_KINDS = {
  leave: { label: "إجازة", icon: <CalendarCheck size={14} /> },
  late: { label: "تأخير / استئذان", icon: <Clock size={14} /> },

// "pending_ceo" is advance-only: a department head's "approve" on a teammate's advance
// request never finalizes it - it reroutes the request to the CEO (see planAdvanceDecision
// below) for a mandatory final sign-off, since advances directly cut into payroll.
const REQUEST_STATUS_LABELS = { pending: "قيد المراجعة", pending_ceo: "بانتظار اعتماد الرئيس التنفيذي", approved: "متوافَق عليه", rejected: "مرفوض" };
const REQUEST_STATUS_COLORS = {
  pending: "bg-amber-50 text-amber-700 border-amber-200",
  pending_ceo: "bg-sky-50 text-sky-700 border-sky-200",
  approved: "bg-emerald-50 text-emerald-700 border-emerald-200",
  rejected: "bg-rose-50 text-rose-700 border-rose-200",
};
const AR_MONTHS = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
const EN_MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

function fmtMoney(n) { return (Number(n) || 0).toLocaleString("en-US", { maximumFractionDigits: 0 }); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function yearKey(d) { return d.slice(0, 4); }
function ymLabel(ym, lang) {
  const [y, m] = String(ym || "").split("-").map(Number);
  const months = lang === "en" ? EN_MONTHS : AR_MONTHS;
  return months[m - 1] ? `${months[m - 1]} ${y}` : ym;
}
// Every calendar date from `from` to `to` inclusive, as "YYYY-MM-DD" strings. Capped at 45
// days as a safety net against a mistyped date range creating a runaway batch of writes.
function dateRange(from, to) {
  const out = [];
  let d = new Date(`${from}T00:00:00`);
  const end = new Date(`${to}T00:00:00`);
  let guard = 0;
  while (d <= end && guard < 45) {
    out.push(d.toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
    guard++;
  }
  return out;
}
// Who should approve a request from this employee: normally their department head, but if
// THEY are the department head, escalate to the CEO instead - a department head can never be
// the one who approves their own request (also enforced server-side in firestore.rules).
function resolveApprover(employee, orgChart) {
  // .trim() هنا لازم يتطابق بالظبط مع نفس المنطق في تطبيق الإدارة (resolveDirectManager/
  // buildOrgTree) - وإلا أي مسافة زيادة/ناقصة في حقل القسم بتاع الموظف تخلي المطابقة مع مفتاح
  // departmentHeads تفشل بصمت، والطلب يتسجل من غير مسؤول (approverId = null) رغم إن الموظف
  // متحدد صح كرئيس قسم في الهيكل التنظيمي.
  const dept = (employee.department || "").trim();
  const headId = (orgChart.departmentHeads || {})[dept];
  const amIHead = headId === employee.id;
  const approverId = amIHead ? orgChart.ceoEmployeeId : headId;
  return approverId && approverId !== employee.id ? approverId : null;
}
// Pure decision-planning for TeamRequestsSection's decide(id, status) - kept separate from
// the actual Firestore calls so the branching (in particular the advance-escalates-to-CEO
// rule) can be unit tested without a live database. `employee` is whoever is currently
// deciding (i.e. req's current approver); `orgChart` is the live orgChart/main doc.
//   - Rejecting is always final, at any stage, for any kind.
//   - Approving a leave/late request is always final (single-stage, as before).
//   - Approving an advance request is only final when the person deciding IS the org's CEO
//     (either because the request was already routed straight to them - a department head's
//     own request - or because it already went through the escalate step below once).
//     Otherwise "approve" doesn't finalize anything - it reroutes the request to the CEO.
function planAdvanceDecision(req, status, employee, orgChart) {
  if (status === "rejected") return { action: "reject" };
  if (req.kind === "advance" && orgChart.ceoEmployeeId !== employee.id) {
    if (!orgChart.ceoEmployeeId) return { action: "blocked" };
    return { action: "escalate", approverId: orgChart.ceoEmployeeId };
  }
  return { action: "finalize" };
}

/* ================= التقييم الدوري (نصف سنوي/سنوي) - نسخة مطابقة تمامًا لنفس الثوابت
   ومعادلات الحساب الموجودة في تطبيق الإدارة (hr-system.jsx: REVIEW_TYPES/PERIODIC_REVIEW_TYPES/
   COMPETENCY_ITEMS/REVIEW_RATING_BANDS/computeReviewScore). الملفين ملهمش أي imports مشتركة،
   فالنسخة دي لازم تتحدّث يدويًا لو أي حاجة اتغيرت في النسخة الأصلية بالإدارة. ================= */
const REVIEW_TYPES = ["نصف سنوي", "سنوي", "منتصف فترة الاختبار", "نهاية فترة الاختبار"];
const PERIODIC_REVIEW_TYPES = ["نصف سنوي", "سنوي"];
const COMPETENCY_ITEMS = [
  { key: "discipline", title: "الالتزام والانضباط", desc: "الالتزام بمواعيد العمل واللوائح" },
  { key: "teamwork", title: "العمل الجماعي والتعاون", desc: "العمل مع الفريق وتسهيل المهام" },
  { key: "problemSolving", title: "حل المشكلات والتفكير التحليلي", desc: "التعامل مع التحديات" },
  { key: "communication", title: "التواصل الفعال", desc: "وضوح الرسائل مع الزملاء والإدارة" },
  { key: "initiative", title: "المبادرة والتطوير الذاتي", desc: "السعي لتعلم مهارات جديدة" },
];
const REVIEW_RATING_BANDS = [
  { min: 90, label: "ممتاز (Exceeds)" },
  { min: 75, label: "جيد جداً (Meets)" },
  { min: 60, label: "مرضي (Needs Improvement)" },
  { min: -Infinity, label: "ضعيف (Below)" },
];
function reviewRatingForPercentage(pct) {
  return (REVIEW_RATING_BANDS.find((b) => pct >= b.min) || REVIEW_RATING_BANDS[REVIEW_RATING_BANDS.length - 1]).label;
}
function computeReviewScore(kpis, competencies) {
  const kpiList = kpis || [];
  const compList = competencies || [];
  const kpiWeightTotal = kpiList.reduce((s, k) => s + (Number(k.weight) || 0), 0);
  const kpiContribution = kpiList.reduce((s, k) => s + ((Number(k.weight) || 0) / 100) * (Number(k.managerScore) || 0), 0);
  const competencyCount = compList.length || 1;
  const competencySum = compList.reduce((s, c) => s + (Number(c.managerScore) || 0), 0);
  const competencyContribution = (competencySum / competencyCount) * 0.4;
  const finalScoreOutOf5 = kpiContribution + competencyContribution;
  const finalPercentage = (finalScoreOutOf5 / 5) * 100;
  const finalRating = reviewRatingForPercentage(finalPercentage);
  return { kpiWeightTotal, kpiContribution, competencySum, competencyContribution, finalScoreOutOf5, finalPercentage, finalRating };
}
// المدير المباشر اللي هيكمّل تقييم الموظف ده - بنفس منطق resolveApprover بالظبط (رئيس القسم،
// أو الرئيس التنفيذي لو الموظف نفسه رئيس قسم)، لأن ده نفس سؤال "مين المسؤول عن الموظف ده"
// بتاع الطلبات بالظبط. لو رجعت null (مفيش رئيس قسم/تنفيذي محدد)، التقييم بيتسجل من غير
// managerId - وهيفضل "awaiting_manager" لحد ما شؤون الأفراد تكمّله يدويًا من تطبيق الإدارة.
function resolveReviewManagerId(employee, orgChart) {
  return resolveApprover(employee, orgChart);
}
function uid(p) { return `${p}_${Date.now()}_${Math.floor(Math.random() * 100000)}`; }
const RATING_TONE_CLS = {

  teal: "border-teal-300 bg-teal-50 text-teal-700",
  amber: "border-amber-300 bg-amber-50 text-amber-700",

}

const inputCls = "w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm text-slate-800 outline-none focus:border-teal-600 focus:ring-2 focus:ring-teal-100";

/* ================= PAYROLL ================= */
function PayrollSection({ employee }) {
  const { t, lang } = useLang();
  const [payslips, setPayslips] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [selectedYm, setSelectedYm] = useState(null);

  useEffect(() => {
    const q = query(collection(db, "payslips"), where("employeeId", "==", employee.id));
    const unsub = onSnapshot(q, (snap) => {
      const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.ym < b.ym ? 1 : -1));
      setPayslips(rows);
      setLoaded(true);
      setSelectedYm((cur) => (cur && rows.some((r) => r.ym === cur)) ? cur : (rows[0]?.ym || null));
    }, () => setLoaded(true));
    return unsub;
  }, [employee.id]);

  if (!loaded) return <div className="flex justify-center py-10"><Loader2 className="animate-spin text-teal-700" size={22} /></div>;
  if (payslips.length === 0) return <EmptyState text="لسه مفيش مرتب متاح — شؤون الأفراد لسه ما فعّلتش عرض المرتب في البوابة." />;

  const row = payslips.find((r) => r.ym === selectedYm) || payslips[0];
  const additions = (row.overtimePay || 0) + (row.bonus || 0);
  const deductions = (row.absenceDeduction || 0) + (row.penaltyDeduction || 0) + (row.advanceDeduction || 0) + (row.insuranceDeduction || 0) + (row.taxDeduction || 0);

  return (
    <div>
      <div className="no-print mb-4 flex items-center justify-between gap-2">
        <select className={`${inputCls} w-auto`} value={selectedYm || ""} onChange={(e) => setSelectedYm(e.target.value)}>
          {payslips.map((r) => <option key={r.ym} value={r.ym}>{ymLabel(r.ym, lang)}</option>)}
        </select>
        <button onClick={() => window.print()} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">
          <Printer size={14} /> {t("طباعة")}
        </button>
      </div>

      <Card className="print-area p-6">
        <div className="mb-4 flex items-start justify-between border-b border-stone-100 pb-4">
          <div>
            <h3 className="text-base font-bold text-slate-800">{t("إيصال مرتب")} — {ymLabel(row.ym, lang)}</h3>
            <p className="text-xs text-slate-400">{employee.name}{employee.position ? ` · ${employee.position}` : ""}</p>
          </div>
          <span className={`rounded-full border px-2.5 py-1 text-xs font-semibold ${row.paid ? "border-emerald-300 bg-emerald-50 text-emerald-700" : "border-stone-200 text-slate-400"}`}>{row.paid ? t("تم الصرف") : t("لسه لم يُصرف")}</span>
        </div>

        <div className="space-y-2 text-sm">
          <div className="flex justify-between"><span className="text-slate-500">{t("الراتب الأساسي")}</span><span className="tabular-nums font-medium text-slate-800">{fmtMoney(row.base)}</span></div>
          {row.overtimePay > 0 && <div className="flex justify-between"><span className="text-slate-500">{t("وقت إضافي ({h} س)", { h: row.overtimeHours })}</span><span className="tabular-nums font-medium text-emerald-700">+{fmtMoney(row.overtimePay)}</span></div>}
          {row.bonus > 0 && <div className="flex justify-between"><span className="text-slate-500">{t("مكافأة")}</span><span className="tabular-nums font-medium text-emerald-700">+{fmtMoney(row.bonus)}</span></div>}
          {row.absenceDeduction > 0 && <div className="flex justify-between"><span className="text-slate-500">{t("خصم غياب ({n} يوم)", { n: row.absentDays })}</span><span className="tabular-nums font-medium text-rose-600">-{fmtMoney(row.absenceDeduction)}</span></div>}
          {row.lateDeduction > 0 && <div className="flex justify-between"><span className="text-slate-500">{t("خصم تأخير ({n} دقيقة)", { n: row.lateMinutes })}</span><span className="tabular-nums font-medium text-rose-600">-{fmtMoney(row.lateDeduction)}</span></div>}

function NewRequestForm({ onSubmit, busy, msg }) {
  const { t } = useLang();
  const [kind, setKind] = useState("leave");
  const [form, setForm] = useState({ dateFrom: "", dateTo: "", date: "", minutes: "", amount: "", reason: "" });

  function set(patch) { setForm((f) => ({ ...f, ...patch })); }

  function handleSubmit(e) {
    e.preventDefault();
    if (kind === "leave") {
      if (!form.dateFrom || !form.dateTo || form.dateFrom > form.dateTo) return;
      onSubmit({ kind, dateFrom: form.dateFrom, dateTo: form.dateTo, reason: form.reason });
    } else if (kind === "late") {
      if (!form.date || !(Number(form.minutes) > 0)) return;
      onSubmit({ kind, date: form.date, minutes: Number(form.minutes), reason: form.reason });
    } else {
      if (!(Number(form.amount) > 0)) return;
      onSubmit({ kind, amount: Number(form.amount), reason: form.reason });
    }
    set({ dateFrom: "", dateTo: "", date: "", minutes: "", amount: "", reason: "" });
  }

  return (
    <Card className="mb-5 p-5">
      <h3 className="mb-3 text-sm font-bold text-slate-800">{t("طلب جديد")}</h3>
      <div className="mb-4 flex gap-2">
        {Object.entries(REQUEST_KINDS).map(([k, v]) => (
          <button key={k} type="button" onClick={() => setKind(k)} className={`flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold ${kind === k ? "bg-teal-800 text-white" : "bg-stone-100 text-slate-500 hover:bg-stone-200"}`}>{v.icon}{t(v.label)}</button>
        ))}
      </div>
      <form onSubmit={handleSubmit} className="space-y-3">
        {kind === "leave" && (
          <div className="grid grid-cols-2 gap-3">
            <Field label="من تاريخ"><input required type="date" className={inputCls} value={form.dateFrom} onChange={(e) => set({ dateFrom: e.target.value })} /></Field>
            <Field label="لحد تاريخ"><input required type="date" className={inputCls} value={form.dateTo} onChange={(e) => set({ dateTo: e.target.value })} /></Field>
          </div>
        )}
        {kind === "late" && (
          <div className="grid grid-cols-2 gap-3">
            <Field label="التاريخ"><input required type="date" className={inputCls} value={form.date} onChange={(e) => set({ date: e.target.value })} /></Field>
            <Field label="عدد الدقايق"><input required type="number" min="1" className={inputCls} value={form.minutes} onChange={(e) => set({ minutes: e.target.value })} placeholder={t("مثلًا 30")} /></Field>

          <Field label="المبلغ المطلوب (ج.م)"><input required type="number" min="1" className={inputCls} value={form.amount} onChange={(e) => set({ amount: e.target.value })} placeholder={t("مثلًا 1000")} /></Field>
        )}

          <textarea rows={2} className={inputCls} value={form.reason} onChange={(e) => set({ reason: e.target.value })} placeholder={t("اكتب أي تفاصيل تساعد في مراجعة الطلب")} />
        </Field>
        {msg && <p className={`text-xs font-medium ${msg.tone === "rose" ? "text-rose-600" : "text-teal-700"}`}>{msg.text}</p>}
        <button disabled={busy} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900 disabled:opacity-50">
          {busy ? <Loader2 size={14} className="animate-spin" /> : <Plus size={14} />} {t("إرسال الطلب")}

function RequestsSection({ employee, orgChart, directory }) {
  const { t } = useLang();
  const [requests, setRequests] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  useEffect(() => {
    const q = query(collection(db, "requests"), where("employeeId", "==", employee.id));
    const unsub = onSnapshot(q, (snap) => {
      setRequests(snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1)));
      setLoaded(true);
    }, () => setLoaded(true));
    return unsub;
  }, [employee.id]);

  async function handleSubmit(payload) {
    setMsg(null);
    const approverId = resolveApprover(employee, orgChart);
    if (!approverId) {
      setMsg({ tone: "rose", text: t("مفيش حد محدد يقدر يوافق على طلبك (مفيش رئيس قسم أو رئيس تنفيذي مسجل) — كلّم شؤون الأفراد يظبطوا الهيكل التنظيمي الأول.") });
      return;
    }
    setBusy(true);
    try {
      const ref = doc(collection(db, "requests"));
      await setDoc(ref, {
        ...payload,
        employeeId: employee.id,
        employeeName: employee.name,
        department: employee.department || "",
        approverId,
        status: "pending",
        createdAt: new Date().toISOString(),
      });

      setMsg({ tone: "teal", text: approverName ? t("تم إرسال الطلب — هيوصل لـ {name} للمراجعة.", { name: approverName }) : t("تم إرسال الطلب للمراجعة.") });
    } catch (err) {
      setMsg({ tone: "rose", text: t("تعذّر إرسال الطلب. جرب تاني.") });

    </div>
  );
}

function TeamRequestsSection({ employee, requests, loaded, orgChart }) {
  const { t } = useLang();
  const [decideBusy, setDecideBusy] = useState(false);

  // Approving a leave/late request also writes the matching attendance record(s) - the same
  // `attendanceRecords` collection and doc-id shape (`${date}_${employeeId}`) the admin app
  // uses, merged in so nothing else on that date gets overwritten.
  // Approving an ADVANCE request goes through planAdvanceDecision first: a department head's
  // "approve" only escalates it to the CEO (status -> "pending_ceo", approverId reassigned) -
  // it never finalizes there. Only once the CEO approves does this write the matching
  // `advances` doc automatically, with a deterministic id ("req_<requestId>") so it's tied
  // 1:1 to the request Firestore rules already verified. Rejecting is always final, at
  // either stage.
  async function decide(req, status) {
    setDecideBusy(true);
    try {
      const plan = planAdvanceDecision(req, status, employee, orgChart);

      if (plan.action === "blocked") {
        alert(t("لازم يتحدد رئيس تنفيذي (CEO) في الهيكل التنظيمي الأول عشان تقدر توافق على طلبات السلف. كلّم شؤون الأفراد يظبطوا ده."));
        return;
      }
      if (plan.action === "escalate") {
        await updateDoc(doc(db, "requests", req.id), {
          status: "pending_ceo",
          approverId: plan.approverId,
          managerDecidedByName: employee.name,
          managerDecidedAt: new Date().toISOString(),
        });
        alert(t("تم إرسال طلب السلفة لاعتماد الرئيس التنفيذي (CEO) — هيختفي من قائمتك وهيتسجل تلقائي في تاب السلف بعد اعتماده."));
        return;
      }

      await updateDoc(doc(db, "requests", req.id), { status, decidedByName: employee.name, decidedAt: new Date().toISOString() });
      if (status === "approved") {
        if (req.kind === "leave") {
          const dates = dateRange(req.dateFrom, req.dateTo);
          await Promise.all(dates.map((d) =>
            setDoc(doc(db, "attendanceRecords", `${d}_${req.employeeId}`), { date: d, employeeId: req.employeeId, status: "leave" }, { merge: true })
          ));
        } else if (req.kind === "late") {
          // Carries the employee's own self-reported minutes straight into the attendance
          // record, so an approved late request actually deducts from payroll (see
          // computePayrollRow's lateDeduction in the admin app) instead of only flipping the
          // status badge with no minutes figure behind it.
          await setDoc(doc(db, "attendanceRecords", `${req.date}_${req.employeeId}`), { date: req.date, employeeId: req.employeeId, status: "late", lateMinutes: Number(req.minutes) || 0 }, { merge: true });
        } else if (req.kind === "advance") {
          await setDoc(doc(db, "advances", `req_${req.id}`), {
            employeeId: req.employeeId,
            date: todayISO(),
            totalAmount: Number(req.amount) || 0,
            installments: 1,
            notes: `سلفة معتمدة تلقائيًا من طلب بوابة الموظف (اعتماد الرئيس التنفيذي)${req.reason ? ` — ${req.reason}` : ""}`,
          });
        }
      }
    } catch (err) {
      alert(t("تعذّر تسجيل القرار — راجع اتصالك بالإنترنت وجرب تاني."));
    } finally { setDecideBusy(false); }
  }

  const pending = requests.filter((r) => r.status === "pending" || r.status === "pending_ceo");
  const decided = requests.filter((r) => r.status === "approved" || r.status === "rejected");

  if (!loaded) return <div className="flex justify-center py-10"><Loader2 className="animate-spin text-teal-700" size={22} /></div>;

  return (
    <div>
      <p className="mb-4 flex items-start gap-1.5 rounded-lg bg-stone-50 px-3 py-2 text-xs text-slate-400"><Info size={13} className="mt-0.5 shrink-0" />{t("الموافقة على إجازة أو تأخير بتسجّل الحضور تلقائي. طلب السلفة لما توافق عليه كمدير قسم بيروح لاعتماد نهائي من الرئيس التنفيذي (CEO)، وبعد اعتماده بيتسجل تلقائي في تاب السلف بنظام الأدمن.")}</p>
      <h3 className="mb-2 text-sm font-bold text-slate-700">{t("طلبات قيد المراجعة ({n})", { n: pending.length })}</h3>
      {pending.length === 0 ? <EmptyState text="مفيش طلبات محتاجة مراجعة دلوقتي." />
        : <div className="mb-6 space-y-2">{pending.map((r) => <RequestCard key={r.id} req={r} showEmployee onDecide={decide} decideBusy={decideBusy} />)}</div>}

      {decided.length > 0 && (
        <>
          <h3 className="mb-2 text-sm font-bold text-slate-700">{t("طلبات سابقة")}</h3>
          <div className="space-y-2">{decided.map((r) => <RequestCard key={r.id} req={r} showEmployee />)}</div>
        </>
      )}
    </div>
  );
}

/* ================= التقييم الدوري - "تقييماتي" (Self Appraisal) ================= */
// الموظف بيبدأ تقييم نفسه (نصف سنوي/سنوي) من هنا: بيختار النوع والسنة، يسجّل مؤشرات الأداء
// (KPIs - قابلة للإضافة/التعديل منه، وزنها الإجمالي 60%) بأوزانها ودرجة نفسه، ودرجة نفسه في
// بنود الكفاءات الخمسة الثابتة (Competencies - 40%). بعد ما يبعت التقييم بيبقى للقراءة
// بس (status: "awaiting_manager") لحد ما مديره المباشر يكمّله من حسابه هو (تاب "تقييمات الفريق")
// أو شؤون الأفراد تكمّله من تطبيق الإدارة - نفس فلسفة "HR عندها override كامل" المستخدمة هناك.
function blankAppraisalDraft(employee, settings, type) {
  const matchedKpis = (settings.kpiTemplates || []).filter((k) =>
    (k.scope === "department" && k.scopeValue === employee.department) || (k.scope === "position" && k.scopeValue === employee.position)
  );
  return {
    reviewType: type || PERIODIC_REVIEW_TYPES[0],
    year: String(new Date().getFullYear()),
    kpis: matchedKpis.map((k) => ({ id: k.id || uid("kpi"), title: k.title, weight: matchedKpis.length ? Math.round(60 / matchedKpis.length) : 0, target: k.target || "", selfScore: "" })),
    competencies: COMPETENCY_ITEMS.map((c) => ({ key: c.key, selfScore: "", notes: "" })),
    employeeNotes: "",
  };
}

function MySelfAppraisalSection({ employee, orgChart, settings }) {
  const { t } = useLang();
  const [reviews, setReviews] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const [draft, setDraft] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  useEffect(() => {
    // مهم: لازم نفلتر على reviewType في الكويري نفسها (مش بس بعد الجلب) - firestore.rules بتحط
    // شرط isPeriodicReviewType(resource.data.reviewType) جنب شرط employeeId في قاعدة القراءة،
    // وFirestore بيرفض أي list query كاملة (permission-denied) لو فيه شرط في الـ rule على حقل
    // الكويري نفسها ملهوش قيد مطابق صريح فيها - حتى لو كل الدوكيومنتات الفعلية بتحقق الشرط.
    // من غير where("reviewType","in",...) هنا، الكويري كانت بترفض بالكامل قبل حتى ما توصل لجزئية
    // employeeId - ده اللي كان بيمنع تقييم Hany Zakzouk من الظهور خالص عنده أو عند مديره.
    const q = query(collection(db, "reviews"), where("employeeId", "==", employee.id), where("reviewType", "in", PERIODIC_REVIEW_TYPES));
    const unsub = onSnapshot(q, (snap) => {
      setReviews(
        snap.docs.map((d) => ({ id: d.id, ...d.data() }))
          .sort((a, b) => ((a.submittedAt || a.date || "") < (b.submittedAt || b.date || "") ? 1 : -1))
      );
      setLoadError(null);
      setLoaded(true);
    }, (err) => {
      // مهم: لو الكويري اتمنعت (صلاحيات Firestore rules لسه مانشورة أو قديمة)، ماينفعش نسيب
      // القايمة تظهر فاضية من غير أي إشارة - ده بالظبط اللي كان بيسبب لبس "التقييم مش ظاهر"
      // رغم إن التقييم موجود فعلاً (شايفه تطبيق الإدارة اللي عنده صلاحية كاملة). بنسجل الخطأ
      // ونوريه بوضوح بدل "لسه معملتش أي تقييم" المضللة.
      console.error("MySelfAppraisalSection reviews query failed:", err);
      setLoadError((err && err.code) || "unknown");
      setLoaded(true);
    });
    return unsub;
  }, [employee.id]);

  function startNew(type) { setMsg(null); setDraft(blankAppraisalDraft(employee, settings, type)); }
  function addKpi() { setDraft((d) => ({ ...d, kpis: [...d.kpis, { id: uid("kpi"), title: "", weight: 0, target: "", selfScore: "" }] })); }
  function updateKpi(id, field, value) { setDraft((d) => ({ ...d, kpis: d.kpis.map((k) => (k.id === id ? { ...k, [field]: value } : k)) })); }
  function removeKpi(id) { setDraft((d) => ({ ...d, kpis: d.kpis.filter((k) => k.id !== id) })); }
  function updateCompetency(key, field, value) { setDraft((d) => ({ ...d, competencies: d.competencies.map((c) => (c.key === key ? { ...c, [field]: value } : c)) })); }

  async function submit(e) {
    e.preventDefault();
    setMsg(null);
    // حارس صلب ضد تجاوز مجموع أوزان الـ KPIs الـ 60% (مش بس تحذير لوني في الواجهة) - لازم
    // يتحقق هنا جوه الدالة نفسها مش بس في تعطيل الزرار، لأن الضغط على Enter جوه أي input في
    // الفورم بيطلق onSubmit حتى لو الزرار disabled بصريًا.
    const weightTotal = draft.kpis.reduce((s, k) => s + (Number(k.weight) || 0), 0);
    if (Math.abs(weightTotal - 60) > 1e-9) {
      setMsg({ tone: "rose", text: t("مجموع أوزان الـ KPIs لازم يساوي 60% بالظبط قبل الإرسال - المجموع الحالي {n}%.", { n: Math.round(weightTotal) }) });
      return;
    }
    const already = reviews.find((r) => r.reviewType === draft.reviewType && r.year === draft.year);
    if (already) {
      setMsg({ tone: "rose", text: t("عندك تقييم {type} لسنة {year} مسجل بالفعل - لو محتاج تعديل كلّم شؤون الأفراد.", { type: t(draft.reviewType), year: draft.year }) });
      return;
    }
    const managerId = resolveReviewManagerId(employee, orgChart);
    setBusy(true);
    try {
      await setDoc(doc(collection(db, "reviews")), {
        employeeId: employee.id,
        employeeName: employee.name,
        department: employee.department || "",
        reviewType: draft.reviewType,
        year: draft.year,
        status: "awaiting_manager",
        managerId: managerId || null,
        kpis: draft.kpis.map((k) => ({ id: k.id, title: k.title, weight: Number(k.weight) || 0, target: k.target || "", selfScore: k.selfScore === "" ? null : Number(k.selfScore), managerScore: null })),
        competencies: draft.competencies.map((c) => ({ key: c.key, notes: c.notes || "", selfScore: c.selfScore === "" ? null : Number(c.selfScore), managerScore: null })),
        employeeNotes: draft.employeeNotes,
        submittedAt: new Date().toISOString(),
      });
      setMsg({ tone: "teal", text: managerId ? t("تم إرسال تقييمك - هيوصل لمديرك المباشر لإكماله.") : t("تم تسجيل تقييمك - مفيش مدير مباشر محدد حاليًا، شؤون الأفراد هتكمّله يدويًا.") });
      setDraft(null);
    } catch (err) {
      setMsg({ tone: "rose", text: t("تعذّر إرسال التقييم. جرب تاني.") });
    } finally { setBusy(false); }
  }

  if (!loaded) return <div className="flex justify-center py-10"><Loader2 className="animate-spin text-teal-700" size={22} /></div>;

  return (
    <div>
      <p className="mb-4 flex items-start gap-1.5 rounded-lg bg-stone-50 px-3 py-2 text-xs text-slate-400"><Info size={13} className="mt-0.5 shrink-0" />{t("تقييمك بيتكوّن من مؤشرات أداء (KPIs - 60%) تقدر تضيفها وتعدّلها، وجدارات سلوكية ثابتة (Competencies - 40%). بعد ما تبعت تقييمك، بيوصل لمديرك المباشر يكمّله، والتقدير النهائي بيتحسب تلقائي.")}</p>

      {!draft && (
        <div className="mb-5 flex gap-2">
          {PERIODIC_REVIEW_TYPES.map((pt) => (
            <button key={pt} onClick={() => startNew(pt)} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Plus size={14} /> {t("تقييم {type} جديد", { type: t(pt) })}</button>
          ))}
        </div>
      )}

      {draft && (() => {
        const weightTotal = draft.kpis.reduce((s, k) => s + (Number(k.weight) || 0), 0);
        const weightOk = Math.abs(weightTotal - 60) < 1e-9;
        return (
          <Card className="mb-5 p-4">
            <form onSubmit={submit} className="space-y-3">
              <div className="grid grid-cols-3 gap-2">
                <select className={inputCls} value={draft.reviewType} onChange={(e) => setDraft({ ...draft, reviewType: e.target.value })}>
                  {PERIODIC_REVIEW_TYPES.map((pt) => <option key={pt} value={pt}>{t(pt)}</option>)}
                </select>
                <input placeholder={t("السنة")} className={inputCls} value={draft.year} onChange={(e) => setDraft({ ...draft, year: e.target.value })} />
                <div className={`flex items-center justify-center rounded-lg px-2 text-center text-xs font-semibold ${weightOk ? "bg-emerald-50 text-emerald-700" : "bg-amber-50 text-amber-700"}`}>
                  {t("مجموع أوزان الـ KPIs: {n}% (المطلوب 60%)", { n: Math.round(weightTotal) })}
                </div>
              </div>

              <div className="rounded-lg border border-stone-200 p-2">
                <div className="mb-1.5 flex items-center justify-between">
                  <span className="text-[11px] font-semibold text-slate-500">{t("مؤشرات الأداء (KPIs)")}</span>
                  <button type="button" onClick={addKpi} className="flex items-center gap-1 text-[11px] font-semibold text-teal-700 hover:text-teal-900"><Plus size={12} /> {t("إضافة مؤشر")}</button>
                </div>
                <div className="space-y-1.5">
                  {draft.kpis.map((k) => (
                    <div key={k.id} className="grid grid-cols-12 items-center gap-1.5 text-xs">
                      <input placeholder={t("اسم المؤشر")} className={`${inputCls} col-span-5`} value={k.title} onChange={(e) => updateKpi(k.id, "title", e.target.value)} />
                      <input type="number" step="1" min="0" max="100" placeholder={t("الوزن (%)")} className={`${inputCls} col-span-2`} value={k.weight} onChange={(e) => updateKpi(k.id, "weight", e.target.value)} />
                      <input placeholder={t("المستهدف")} className={`${inputCls} col-span-2`} value={k.target} onChange={(e) => updateKpi(k.id, "target", e.target.value)} />
                      <select className={`${inputCls} col-span-2`} value={k.selfScore} onChange={(e) => updateKpi(k.id, "selfScore", e.target.value)}>
                        <option value="">{t("تقييمي")}</option>{[1, 2, 3, 4, 5].map((n) => <option key={n} value={n}>{n}</option>)}
                      </select>
                      <button type="button" onClick={() => removeKpi(k.id)} className="col-span-1 flex justify-center text-slate-300 hover:text-rose-600"><Trash2 size={13} /></button>
                    </div>
                  ))}
                  {draft.kpis.length === 0 && <p className="text-[11px] text-slate-400">{t("مفيش مؤشرات مضافة لسه - دوس «إضافة مؤشر».")}</p>}
                </div>
              </div>

              <div className="rounded-lg border border-stone-200 p-2">
                <div className="mb-1.5 text-[11px] font-semibold text-slate-500">{t("الكفاءات (Competencies) - 40%")}</div>
                <div className="space-y-1.5">
                  {draft.competencies.map((c) => {
                    const meta = COMPETENCY_ITEMS.find((ci) => ci.key === c.key);
                    return (
                      <div key={c.key} className="grid grid-cols-12 items-center gap-1.5 text-xs">
                        <span className="col-span-7 text-slate-600" title={meta?.desc ? t(meta.desc) : ""}>{meta ? t(meta.title) : c.key}</span>
                        <select className={`${inputCls} col-span-2`} value={c.selfScore} onChange={(e) => updateCompetency(c.key, "selfScore", e.target.value)}>
                          <option value="">{t("تقييمي")}</option>{[1, 2, 3, 4, 5].map((n) => <option key={n} value={n}>{n}</option>)}
                        </select>
                        <input placeholder={t("ملاحظة")} className={`${inputCls} col-span-3`} value={c.notes} onChange={(e) => updateCompetency(c.key, "notes", e.target.value)} />
                      </div>
                    );
                  })}
                </div>
              </div>

              <Field label="ملاحظاتي"><textarea rows={2} className={inputCls} value={draft.employeeNotes} onChange={(e) => setDraft({ ...draft, employeeNotes: e.target.value })} /></Field>

              {msg && <p className={`text-xs font-medium ${msg.tone === "rose" ? "text-rose-600" : "text-teal-700"}`}>{msg.text}</p>}
              <div className="flex justify-end gap-2">
                <button type="button" onClick={() => { setDraft(null); setMsg(null); }} className="rounded-lg border border-stone-300 px-3.5 py-2 text-sm font-semibold text-slate-500 hover:bg-stone-100">{t("إلغاء")}</button>
                <button disabled={busy || !weightOk} title={weightOk ? "" : t("لازم مجموع أوزان الـ KPIs يساوي 60% بالظبط")} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900 disabled:opacity-50">
                  {busy ? <Loader2 size={14} className="animate-spin" /> : <Check size={14} />} {t("إرسال التقييم")}
                </button>
              </div>
            </form>
          </Card>
        );
      })()}

      <h3 className="mb-2 text-sm font-bold text-slate-700">{t("تقييماتي السابقة")}</h3>
      {loadError ? (
        <div className="rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-3 text-sm text-rose-700">
          {t("تعذّر تحميل تقييماتك (خطأ صلاحيات - {code}). لو بعتّ تقييم فعلاً ومش ظاهر، جرب تحديث الصفحة (Ctrl+Shift+R)، ولو استمرت المشكلة كلّم شؤون الأفراد.", { code: loadError })}
        </div>
      ) : reviews.length === 0 ? <EmptyState text="لسه معملتش أي تقييم دوري." /> : (
        <div className="space-y-2">{reviews.map((r) => <MyReviewCard key={r.id} r={r} />)}</div>
      )}
    </div>
  );
}

/* ================= التقييم الدوري - "تقييمات الفريق" (المدير بيكمّل تقييمات فريقه) ================= */
// نفس نمط TeamRequestsSection فوق بالظبط: كويري على reviews فلترة بـ managerId == حساب المدير
// الحالي (نفس اعتبارات Firestore rules بتاعة requests/approverId - لازم الفلتر يبقى على نفس
// الحقل اللي rule التاني بيتحقق منه عشان الـ list query يتقبل). المدير بيكمّل بس التقييمات
// اللي الموظف بدأها من نفسه (status: "awaiting_manager") - بدء تقييم من الصفر لموظف لسه ما
// قيّمش نفسه مقصور على تطبيق الإدارة (شؤون الأفراد) بقصد، مطابقة لتدفق العمل اللي المستخدم
// طلبه بالظبط (Self ثم Manager).
// reviews/loaded/loadError بقوا جايين من فوق كـ props (نفس نمط requests/teamRequests بالظبط)
// مش state داخلي - عشان EmployeePortal تقدر تحسب عدد التقييمات المستنية وتوريه كـ badge أحمر
// جنب تاب "تقييمات الفريق" في الـ nav (زي الـ badge الموجود أصلاً جنب "طلبات الفريق")، من غير
// ما تكرر نفس كويري onSnapshot مرتين (مرة هنا ومرة تانية جوه TeamReviewsSection).
function TeamReviewsSection({ employee, reviews, loaded, loadError }) {
  const { t } = useLang();
  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState(null);
  const [busy, setBusy] = useState(false);

  function startEdit(r) {
    setEditingId(r.id);
    setEditDraft({
      kpis: (r.kpis || []).map((k) => ({ ...k })),
      competencies: COMPETENCY_ITEMS.map((c) => {
        const existing = (r.competencies || []).find((x) => x.key === c.key);
        return existing ? { ...existing } : { key: c.key, selfScore: "", managerScore: "", notes: "" };
      }),
      managerNotes: r.managerNotes || "",
    });
  }
  function updateKpi(id, field, value) { setEditDraft((d) => ({ ...d, kpis: d.kpis.map((k) => (k.id === id ? { ...k, [field]: value } : k)) })); }
  function addKpi() { setEditDraft((d) => ({ ...d, kpis: [...d.kpis, { id: uid("kpi"), title: "", weight: 0, target: "", selfScore: "", managerScore: "" }] })); }
  function removeKpi(id) { setEditDraft((d) => ({ ...d, kpis: d.kpis.filter((k) => k.id !== id) })); }
  function updateCompetency(key, field, value) { setEditDraft((d) => ({ ...d, competencies: d.competencies.map((c) => (c.key === key ? { ...c, [field]: value } : c)) })); }

  async function submitCompletion(r, e) {
    e.preventDefault();
    // حارس صلب ضد تجاوز مجموع أوزان الـ KPIs الـ 60% (مش بس تحذير لوني في الواجهة زي الأول) -
    // لازم يتحقق هنا جوه الدالة نفسها مش بس في تعطيل الزرار، لأن الضغط على Enter جوه أي input في
    // الفورم بيطلق onSubmit حتى لو الزرار disabled بصريًا.
    const weightTotal = editDraft.kpis.reduce((s, k) => s + (Number(k.weight) || 0), 0);
    if (Math.abs(weightTotal - 60) > 1e-9) {
      alert(t("مجموع أوزان الـ KPIs لازم يساوي 60% بالظبط قبل الحفظ - المجموع الحالي {n}%.", { n: Math.round(weightTotal) }));
      return;
    }
    const cleanKpis = editDraft.kpis.map((k) => ({
      id: k.id, title: k.title, weight: Number(k.weight) || 0, target: k.target || "",
      selfScore: k.selfScore === "" || k.selfScore == null ? null : Number(k.selfScore),
      managerScore: k.managerScore === "" || k.managerScore == null ? null : Number(k.managerScore),
    }));
    const cleanCompetencies = editDraft.competencies.map((c) => ({
      key: c.key, notes: c.notes || "",
      selfScore: c.selfScore === "" || c.selfScore == null ? null : Number(c.selfScore),
      managerScore: c.managerScore === "" || c.managerScore == null ? null : Number(c.managerScore),
    }));
    const scored = computeReviewScore(cleanKpis, cleanCompetencies);
    setBusy(true);
    try {
      await updateDoc(doc(db, "reviews", r.id), {
        status: "completed",
        kpis: cleanKpis,
        competencies: cleanCompetencies,
        managerNotes: editDraft.managerNotes,
        ...scored,
        date: todayISO(),
        completedAt: todayISO(),
        completedByName: employee.name,
      });
      setEditingId(null);
      setEditDraft(null);
    } catch (err) {
      alert(t("تعذّر حفظ التقييم — راجع اتصالك بالإنترنت وجرب تاني."));
    } finally { setBusy(false); }
  }

  const pending = reviews.filter((r) => r.status === "awaiting_manager");
  const completed = reviews.filter((r) => r.status === "completed");

  if (!loaded) return <div className="flex justify-center py-10"><Loader2 className="animate-spin text-teal-700" size={22} /></div>;

  return (
    <div>
      <p className="mb-4 flex items-start gap-1.5 rounded-lg bg-stone-50 px-3 py-2 text-xs text-slate-400"><Info size={13} className="mt-0.5 shrink-0" />{t("لما أي حد من فريقك يبعت تقييم نفسه (نصف سنوي/سنوي)، هيظهر هنا عشان تكمّله بتقييمك (KPIs + الكفاءات)، والتقدير النهائي هيتحسب تلقائي.")}</p>

      <h3 className="mb-2 text-sm font-bold text-slate-700">{t("تقييمات مستنية إكمالك ({n})", { n: pending.length })}</h3>
      {loadError ? (
        <div className="mb-6 rounded-xl border border-rose-200 bg-rose-50 px-3.5 py-3 text-sm text-rose-700">
          {t("تعذّر تحميل تقييمات فريقك (خطأ صلاحيات - {code}). لو حد من فريقك بعت تقييم نفسه ومش ظاهر هنا، جرب تحديث الصفحة (Ctrl+Shift+R)، ولو استمرت المشكلة كلّم شؤون الأفراد.", { code: loadError })}
        </div>
      ) : pending.length === 0 ? <EmptyState text="مفيش تقييمات مستنية دلوقتي." /> : (
        <div className="mb-6 space-y-2">
          {pending.map((r) => (
            <Card key={r.id} className="p-3.5">
              <div className="mb-1.5 flex flex-wrap items-center justify-between gap-2">
                <span className="text-sm font-semibold text-slate-700">{r.employeeName} — {t(r.reviewType)} {r.year}</span>
                {editingId !== r.id && (
                  <button onClick={() => startEdit(r)} className="flex items-center gap-1 rounded-lg bg-teal-800 px-3 py-1.5 text-xs font-semibold text-white hover:bg-teal-900"><Check size={13} /> {t("إكمال التقييم")}</button>
                )}
              </div>
              {r.employeeNotes && <p className="mb-1 text-xs text-slate-500">{t("ملاحظات {name}: {n}", { name: r.employeeName, n: r.employeeNotes })}</p>}

              {editingId === r.id && editDraft && (() => {
                const weightTotal = editDraft.kpis.reduce((s, k) => s + (Number(k.weight) || 0), 0);
                const weightOk = Math.abs(weightTotal - 60) < 1e-9;
                const preview = computeReviewScore(editDraft.kpis, editDraft.competencies);
                return (
                  <form onSubmit={(e) => submitCompletion(r, e)} className="mt-2 space-y-3 rounded-lg border border-stone-200 bg-stone-50 p-3">
                    <div className={`rounded-lg px-2 py-1.5 text-center text-xs font-semibold ${weightOk ? "bg-emerald-50 text-emerald-700" : "bg-amber-50 text-amber-700"}`}>
                      {t("مجموع أوزان الـ KPIs: {n}% (المطلوب 60%)", { n: Math.round(weightTotal) })}
                    </div>
                    <div className="rounded-lg border border-stone-200 bg-white p-2">
                      <div className="mb-1.5 flex items-center justify-between">
                        <span className="text-[11px] font-semibold text-slate-500">{t("مؤشرات الأداء (KPIs)")}</span>
                        <button type="button" onClick={addKpi} className="flex items-center gap-1 text-[11px] font-semibold text-teal-700 hover:text-teal-900"><Plus size={12} /> {t("إضافة مؤشر")}</button>
                      </div>
                      <div className="space-y-1.5">
                        {editDraft.kpis.map((k) => (
                          <div key={k.id} className="grid grid-cols-12 items-center gap-1.5 text-xs">
                            <input placeholder={t("اسم المؤشر")} className={`${inputCls} col-span-4`} value={k.title} onChange={(e) => updateKpi(k.id, "title", e.target.value)} />
                            <input type="number" step="1" min="0" max="100" placeholder={t("الوزن (%)")} className={`${inputCls} col-span-2`} value={k.weight} onChange={(e) => updateKpi(k.id, "weight", e.target.value)} />
                            <span className="col-span-2 text-center text-slate-400">{t("موظف: {s}", { s: k.selfScore ?? "—" })}</span>
                            <select className={`${inputCls} col-span-2`} value={k.managerScore ?? ""} onChange={(e) => updateKpi(k.id, "managerScore", e.target.value)}>
                              <option value="">{t("تقييمك")}</option>{[1, 2, 3, 4, 5].map((n) => <option key={n} value={n}>{n}</option>)}
                            </select>
                            <button type="button" onClick={() => removeKpi(k.id)} className="col-span-2 flex justify-center text-slate-300 hover:text-rose-600"><Trash2 size={13} /></button>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div className="rounded-lg border border-stone-200 bg-white p-2">
                      <div className="mb-1.5 text-[11px] font-semibold text-slate-500">{t("الكفاءات (Competencies) - 40%")}</div>
                      <div className="space-y-1.5">
                        {editDraft.competencies.map((c) => {
                          const meta = COMPETENCY_ITEMS.find((ci) => ci.key === c.key);
                          return (
                            <div key={c.key} className="grid grid-cols-12 items-center gap-1.5 text-xs">
                              <span className="col-span-5 text-slate-600">{meta ? t(meta.title) : c.key}</span>
                              <span className="col-span-2 text-center text-slate-400">{t("موظف: {s}", { s: c.selfScore ?? "—" })}</span>
                              <select className={`${inputCls} col-span-2`} value={c.managerScore ?? ""} onChange={(e) => updateCompetency(c.key, "managerScore", e.target.value)}>
                                <option value="">{t("تقييمك")}</option>{[1, 2, 3, 4, 5].map((n) => <option key={n} value={n}>{n}</option>)}
                              </select>
                              <input placeholder={t("ملاحظة")} className={`${inputCls} col-span-3`} value={c.notes} onChange={(e) => updateCompetency(c.key, "notes", e.target.value)} />
                            </div>
                          );
                        })}
                      </div>
                    </div>
                    <Field label="ملاحظاتك"><textarea rows={2} className={inputCls} value={editDraft.managerNotes} onChange={(e) => setEditDraft({ ...editDraft, managerNotes: e.target.value })} /></Field>
                    <div className="flex flex-wrap items-center justify-between gap-2 rounded-lg bg-white px-3 py-2 text-xs">
                      <span className="font-semibold text-slate-600">{t("التقدير المتوقع: {rating} ({pct}%)", { rating: t(preview.finalRating), pct: Math.round(preview.finalPercentage) })}</span>
                      <div className="flex gap-2">
                        <button type="button" onClick={() => { setEditingId(null); setEditDraft(null); }} className="rounded-lg border border-stone-300 px-3 py-1.5 font-semibold text-slate-500 hover:bg-stone-100">{t("إلغاء")}</button>
                        <button disabled={busy || !weightOk} title={weightOk ? "" : t("لازم مجموع أوزان الـ KPIs يساوي 60% بالظبط")} className="rounded-lg bg-teal-800 px-3 py-1.5 font-semibold text-white hover:bg-teal-900 disabled:opacity-50">{t("حفظ التقييم")}</button>
                      </div>
                    </div>
                  </form>
                );
              })()}
            </Card>
          ))}
        </div>
      )}

      {completed.length > 0 && (
        <>
          <h3 className="mb-2 text-sm font-bold text-slate-700">{t("تقييمات سابقة")}</h3>
          <div className="space-y-2">
            {completed.map((r) => {
              const tone = ratingToneFor(r.finalRating);
              return (
                <Card key={r.id} className="p-3.5">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <span className="text-sm font-semibold text-slate-700">{r.employeeName} — {t(r.reviewType)} {r.year}</span>
                    <div className="flex items-center gap-2">
                      <span className={`rounded-full border px-2.5 py-0.5 text-xs font-semibold ${RATING_TONE_CLS[tone]}`}>{t(r.finalRating)}</span>
                      {Number.isFinite(r.finalPercentage) && <span className="text-xs font-semibold tabular-nums text-slate-500">{Math.round(r.finalPercentage)}%</span>}
                    </div>
                  </div>
                </Card>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

/* ================= PORTAL ================= */
function EmployeePortal({ authUid, onSignOut }) {
  const { t, lang } = useLang();
  const [employee, setEmployee] = useState(undefined); // undefined = loading, null = not found
  const [attendanceRecords, setAttendanceRecords] = useState([]);
  const [penalties, setPenalties] = useState([]);
  const [settings, setSettings] = useState({ leaveDefaultDays: 21 });
  const [orgChart, setOrgChart] = useState({ ceoEmployeeId: null, departmentHeads: {} });
  const [directory, setDirectory] = useState([]);
  const [tab, setTab] = useState("leave");

  useEffect(() => {
    const q = query(collection(db, "employees"), where("authUid", "==", authUid));
    const unsub = onSnapshot(q, (snap) => setEmployee(snap.empty ? null : { id: snap.docs[0].id, ...snap.docs[0].data() }),
      (err) => { console.error(err); setEmployee(null); });
    return unsub;
  }, [authUid]);

  useEffect(() => {
    const unsub = onSnapshot(doc(db, "settings", "main"), (snap) => { if (snap.exists()) setSettings((s) => ({ ...s, ...snap.data() })); });
    return unsub;
  }, []);

  useEffect(() => {
    const unsub = onSnapshot(doc(db, "orgChart", "main"), (snap) => { if (snap.exists()) setOrgChart(snap.data()); });
    return unsub;
  }, []);

  useEffect(() => {
    const unsub = onSnapshot(collection(db, "publicDirectory"), (snap) => setDirectory(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);

  useEffect(() => {
    if (!employee) return;
    const attQ = query(collection(db, "attendanceRecords"), where("employeeId", "==", employee.id));
    const unsubAtt = onSnapshot(attQ, (snap) => setAttendanceRecords(snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.date < b.date ? 1 : -1))));
    const penQ = query(collection(db, "penalties"), where("employeeId", "==", employee.id));
    const unsubPen = onSnapshot(penQ, (snap) => setPenalties(snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.date < b.date ? 1 : -1))));
    return () => { unsubAtt(); unsubPen(); };
  }, [employee?.id]);

  // "Manager" = this employee is the head of their own department per orgChart/main. Computed
  // here (not just inside render) because the team-requests subscription below needs it, and
  // hooks can't come after the early-returns further down. The CEO also gets the "team
  // requests" tab, since a department head's OWN request is routed to the CEO to approve.
  const isManager = !!(employee && employee.department && (orgChart.departmentHeads || {})[employee.department] === employee.id);
  const isCEO = !!(employee && orgChart.ceoEmployeeId === employee.id);
  const canApproveRequests = isManager || isCEO;
  const [teamRequests, setTeamRequests] = useState([]);
  const [teamRequestsLoaded, setTeamRequestsLoaded] = useState(false);
  useEffect(() => {
    if (!employee || !canApproveRequests) { setTeamRequests([]); setTeamRequestsLoaded(true); return; }
    // Filtered by approverId (not department) on purpose: Firestore only allows a security
    // rule that reads resource.data.X to grant a *list* query when X is also the field the
    // query filters on - the request docs are already routed 1:1 to the exact person meant
    // to decide them, via `approverId`, so this is both the correct AND the only query shape
    // Firestore's rules engine will actually allow to return results (a department-based
    // filter here would silently return zero, since the rule checks approverId not
    // department, and Firestore rejects/empties queries it can't statically verify against
    // the rule rather than filtering result-by-result).
    const q = query(collection(db, "requests"), where("approverId", "==", employee.id));
    const unsub = onSnapshot(q, (snap) => {
      setTeamRequests(snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1)));
      setTeamRequestsLoaded(true);
    }, () => setTeamRequestsLoaded(true));
    return unsub;
  }, [canApproveRequests, employee?.id]);

  // نفس فكرة teamRequests فوق بالظبط، لكن على reviews - مسحوبة هنا (مش جوه TeamReviewsSection)
  // عشان EmployeePortal تقدر تحسب pendingTeamReviewsCount وتوريه كـ badge أحمر جنب تاب "تقييمات
  // الفريق" في الـ nav، بالظبط زي الـ badge الموجود أصلاً جنب "طلبات الفريق" (pendingTeamCount).
  const [teamReviews, setTeamReviews] = useState([]);
  const [teamReviewsLoaded, setTeamReviewsLoaded] = useState(false);
  const [teamReviewsError, setTeamReviewsError] = useState(null);
  useEffect(() => {
    if (!employee || !canApproveRequests) { setTeamReviews([]); setTeamReviewsLoaded(true); return; }
    // لازم reviewType تتقيّد صراحة في الكويري زي managerId بالظبط - نفس سبب باگ permission-denied
    // اللي اتصلّح جوه TeamReviewsSection قبل كده (firestore.rules بتتحقق من الحقلين مع بعض).
    const q = query(collection(db, "reviews"), where("managerId", "==", employee.id), where("reviewType", "in", PERIODIC_REVIEW_TYPES));
    const unsub = onSnapshot(q, (snap) => {
      setTeamReviews(snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => ((a.submittedAt || a.date || "") < (b.submittedAt || b.date || "") ? 1 : -1)));
      setTeamReviewsError(null);
      setTeamReviewsLoaded(true);
    }, (err) => {
      console.error("EmployeePortal teamReviews query failed:", err);
      setTeamReviewsError((err && err.code) || "unknown");
      setTeamReviewsLoaded(true);
    });
    return unsub;
  }, [canApproveRequests, employee?.id]);

  if (employee === undefined) return <FullScreenLoader text="جاري تحميل بياناتك..." />;
  if (employee === null) return <NotProvisionedScreen />;

  const today = todayISO();
  const takenLeave = attendanceRecords.filter((r) => yearKey(r.date) === yearKey(today) && r.status === "leave").length;
  const entitlement = employee.leaveEntitlement ?? settings.leaveDefaultDays ?? 21;
  const remaining = entitlement - takenLeave;
  const penaltiesTotal = penalties.filter((p) => p.actionType === "خصم مالي").reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const pendingTeamCount = teamRequests.filter((r) => r.status === "pending" || r.status === "pending_ceo").length;
  const pendingTeamReviewsCount = teamReviews.filter((r) => r.status === "awaiting_manager").length;

  const TABS = [
    ["leave", "الإجازات", <CalendarCheck size={14} />],
    ["attendance", "الحضور", <Clock size={14} />],
    ["penalties", "الجزاءات", <AlertTriangle size={14} />],
    ["payroll", "المرتب", <Wallet size={14} />],
    ["requests", "طلباتي", <ClipboardList size={14} />],
    ["myReviews", "تقييماتي", <Star size={14} />],
    ["orgchart", "الهيكل التنظيمي", <Network size={14} />],
    ...(canApproveRequests ? [["team", "طلبات الفريق", <Users size={14} />]] : []),
    ...(canApproveRequests ? [["teamReviews", "تقييمات الفريق", <Star size={14} />]] : []),
  ];

  return (
    <div className="min-h-screen w-full bg-stone-50 font-sans text-slate-800 print:bg-white">
      <style>{`@media print { .no-print { display: none !important; } .print-area { display: block !important; } }`}</style>
      <header className="no-print border-b border-stone-200 bg-white">
        <div className="mx-auto flex max-w-3xl items-center justify-between px-5 py-4">
          <div>
            <div className="text-sm font-bold text-slate-800">{employee.name}</div>
            <div className="text-xs text-slate-400">{employee.position || "—"}{employee.department ? ` · ${employee.department}` : ""}</div>
          </div>
          <div className="flex items-center gap-2">
            <LangToggle />
            <button onClick={onSignOut} className="flex items-center gap-1.5 rounded-lg border border-stone-300 px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-stone-50">
              <LogOut size={14} /> {t("خروج")}
            </button>
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-3xl p-5">
        <div className="no-print mb-4 flex flex-wrap gap-2 border-b border-stone-200 pb-3">
          {TABS.map(([k, l, icon]) => (
            <button key={k} onClick={() => setTab(k)} className={`flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium ${tab === k ? "bg-teal-800 text-white" : "text-slate-500 hover:bg-stone-100"}`}>
              {icon}{t(l)}
              {k === "team" && pendingTeamCount > 0 && <span className="flex h-4 min-w-4 items-center justify-center rounded-full bg-rose-600 px-1 text-[10px] font-bold text-white">{pendingTeamCount}</span>}
              {k === "teamReviews" && pendingTeamReviewsCount > 0 && <span className="flex h-4 min-w-4 items-center justify-center rounded-full bg-rose-600 px-1 text-[10px] font-bold text-white">{pendingTeamReviewsCount}</span>}
            </button>
          ))}
        </div>

        {tab === "leave" && (
          <Card className="p-5">
            <div className="mb-4 grid grid-cols-3 gap-3">
              <div className="rounded-xl bg-stone-100 px-3 py-2.5 text-center"><div className="text-lg font-bold tabular-nums">{entitlement}</div><div className="text-[11px] text-slate-500">{t("مستحق سنويًا")}</div></div>
              <div className="rounded-xl bg-sky-50 px-3 py-2.5 text-center"><div className="text-lg font-bold tabular-nums text-sky-700">{takenLeave}</div><div className="text-[11px] text-sky-600">{t("مأخوذ هذا العام")}</div></div>
              <div className={`rounded-xl px-3 py-2.5 text-center ${remaining <= 2 ? "bg-rose-50" : "bg-emerald-50"}`}><div className={`text-lg font-bold tabular-nums ${remaining <= 2 ? "text-rose-700" : "text-emerald-700"}`}>{remaining}</div><div className={`text-[11px] ${remaining <= 2 ? "text-rose-600" : "text-emerald-600"}`}>{t("الرصيد المتبقي")}</div></div>
            </div>
            <p className="text-xs text-slate-400">{t("الأيام المأخوذة بتتحسب تلقائي من أيام «إجازة» المسجلة في سجل حضورك خلال السنة الحالية. عايز تطلب إجازة جديدة؟ روح تاب «طلباتي».")}</p>
          </Card>
        )}

        {tab === "attendance" && (
          attendanceRecords.length === 0 ? <EmptyState text="مفيش سجل حضور مسجل لسه." /> : (
            <Card className="overflow-hidden p-0">
              <div className="max-h-[480px] overflow-y-auto">
                <table className="w-full text-sm">
                  <thead className="sticky top-0 bg-stone-50">
                    <tr className="border-b border-stone-200 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">
                      <th className="px-4 py-2.5">{t("التاريخ")}</th><th className="px-4 py-2.5">{t("الحالة")}</th><th className="px-4 py-2.5">{t("دقايق التأخير")}</th><th className="px-4 py-2.5">{t("وقت إضافي")}</th>
                    </tr>
                  </thead>
                  <tbody>
                    {attendanceRecords.map((r) => (
                      <tr key={r.id} className="border-b border-stone-100 last:border-0">
                        <td className="px-4 py-2.5 tabular-nums text-slate-600">{r.date}</td>
                        <td className="px-4 py-2.5"><span className={`rounded-full border px-2.5 py-0.5 text-xs font-semibold ${STATUS_COLORS[r.status] || ""}`}>{t(STATUS_LABELS[r.status] || r.status)}</span></td>
                        <td className="px-4 py-2.5 tabular-nums text-slate-500">{r.status === "late" && r.lateMinutes ? t("{n} د", { n: r.lateMinutes }) : "—"}</td>
                        <td className="px-4 py-2.5 tabular-nums text-slate-500">{r.overtimeHours ? t("{n} س", { n: r.overtimeHours }) : "—"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Card>
          )
        )}

        {tab === "penalties" && (
          <div>
            {penaltiesTotal > 0 && (
              <Card className="mb-4 p-4">
                <div className="text-xs text-slate-500">{t("إجمالي الخصومات المالية")}</div>
                <div className="text-xl font-bold tabular-nums text-rose-700">{fmtMoney(penaltiesTotal)} <span className="text-sm font-normal text-slate-400">{t("ج.م")}</span></div>
              </Card>
            )}
            {penalties.length === 0 ? <EmptyState text="مفيش جزاءات مسجلة — الحمد لله." /> : (
              <div className="space-y-2">
                {penalties.map((p) => (
                  <Card key={p.id} className="p-3.5">
                    <div className="mb-1 flex items-center justify-between">
                      <span className="text-sm font-semibold text-slate-700">{t(p.actionType)}</span>
                      <span className="text-xs text-slate-400">{p.date}</span>
                    </div>
                    {p.reason && <p className="text-sm text-slate-600">{p.reason}</p>}
                    {p.amount ? <div className="mt-1 text-xs font-semibold text-rose-600">{t("خصم {amount} ج.م", { amount: fmtMoney(p.amount) })}</div> : null}
                    {p.notes && <p className="mt-1 text-xs text-slate-400">{p.notes}</p>}
                  </Card>
                ))}
              </div>
            )}
          </div>
        )}

        {tab === "payroll" && <PayrollSection employee={employee} />}
        {tab === "requests" && <RequestsSection employee={employee} orgChart={orgChart} directory={directory} />}
        {tab === "myReviews" && <MySelfAppraisalSection employee={employee} orgChart={orgChart} settings={settings} />}
        {tab === "orgchart" && <OrgChartSection employee={employee} orgChart={orgChart} directory={directory} />}
        {tab === "team" && canApproveRequests && <TeamRequestsSection employee={employee} requests={teamRequests} loaded={teamRequestsLoaded} orgChart={orgChart} />}
        {tab === "teamReviews" && canApproveRequests && <TeamReviewsSection employee={employee} reviews={teamReviews} loaded={teamReviewsLoaded} loadError={teamReviewsError} />}
      </main>
    </div>
  );
}

/* ================= AUTH GATE ================= */
function EmployeePortalApp() {
  const [authState, setAuthState] = useState("loading"); // loading | signedOut | signedIn
  const [user, setUser] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    const unsub = onAuthStateChanged(auth, (u) => { setUser(u); setAuthState(u ? "signedIn" : "signedOut"); });
    return unsub;
  }, []);

  async function handleLogin({ code, pin }) {
    setError(""); setBusy(true);
    try {
      await signInWithEmailAndPassword(auth, employeeAuthEmail(code), pin);
    } catch (err) {
      setError("كود الموظف أو الرقم السري غلط.");
    } finally { setBusy(false); }
  }

  const langState = useLangState();

  let content;
  if (authState === "loading") content = <FullScreenLoader text="جاري التحقق من الدخول..." />;
  else if (authState === "signedOut") content = <PortalLoginScreen onSubmit={handleLogin} busy={busy} error={error} />;
  else content = <EmployeePortal authUid={user.uid} onSignOut={() => signOut(auth)} />;

  return (
    <LangContext.Provider value={langState}>
      <div dir={langState.dir} className="font-sans">{content}</div>
    </LangContext.Provider>
  );
}
