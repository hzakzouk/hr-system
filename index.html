// ملحوظة: match بتحدد الكلمة (أو الكلمات) اللي بيتقارن بيها اسم عمود الملف عشان
// يتربط تلقائيًا بالحقل ده - لازم تكون كلمة مميزة للحقل ده بس، مش أول كلمة في label
// (لو استخدمنا أول كلمة في label هتلاقي "تاريخ الميلاد" و"تاريخ التعيين" الاتنين
// بيبدأوا بـ"تاريخ" فيتلخبطوا مع بعض ويتربطوا غلط بنفس العمود - ده كان باگ حقيقي حصل).
const EMPLOYEE_IMPORT_FIELDS = [
  { key: "employeeCode", label: "كود الموظف", match: ["كود"] },
  { key: "name", label: "الاسم", required: true, match: ["الاسم", "اسم الموظف"] },
  { key: "position", label: "الوظيفة", match: ["الوظيفة"] },
  { key: "department", label: "القسم", match: ["القسم"] },
  { key: "grade", label: "الدرجة (Grade)", match: ["الدرجة", "Grade"] },
  { key: "level", label: "المستوى الوظيفي (Level)", match: ["المستوى الوظيفي", "Level"] },
  { key: "branch", label: "الفرع (لو الشركة أكتر من موقع)", match: ["الفرع"] },
  { key: "phone", label: "رقم الموبايل", match: ["موبايل", "الهاتف", "تليفون"] },
  { key: "email", label: "الإيميل", match: ["الإيميل", "email", "بريد"] },
  { key: "nationalId", label: "الرقم القومي", match: ["الرقم القومي", "قومي"] },
  { key: "birthDate", label: "تاريخ الميلاد (تاريخ)", match: ["الميلاد"] },
  { key: "hireDate", label: "تاريخ التعيين (تاريخ)", match: ["التعيين"] },
  { key: "salary", label: "الراتب الأساسي (رقم)", match: ["الراتب", "المرتب"] },
  { key: "contractType", label: "نوع العقد", match: ["نوع العقد"] },
  { key: "contractStart", label: "بداية العقد (تاريخ)", match: ["بداية العقد", "بداية"] },
  { key: "contractEnd", label: "نهاية العقد (تاريخ، اختياري)", match: ["نهاية العقد", "نهاية"] },
  { key: "leaveEntitlement", label: "رصيد الإجازة السنوي (رقم، اختياري)", match: ["رصيد"] },
  { key: "weeklyOffDaysText", label: "أيام الإجازة الأسبوعية (مفصولة بفاصلة)", match: ["الإجازة الأسبوعية", "أسبوعية"] },
];

function EmployeeImportWizard({ employees, onImport, onCancel }) {
  const { t } = useLang();
  const [step, setStep] = useState(1);
  const [fileName, setFileName] = useState("");
  const [headers, setHeaders] = useState([]);
  const [rows, setRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [error, setError] = useState("");

  async function handleFile(file) {
    setError("");
    setFileName(file.name);
    try {
      const { headers, dataRows } = await parseSpreadsheetFile(file);
      setHeaders(headers);
      setRows(dataRows);
      // best-effort auto-mapping by matching header text - كل عمود بيتربط مرة واحدة بس
      // (usedIdx) عشان حقلين مختلفين (زي تاريخ الميلاد وتاريخ التعيين) ميتلخبطوش
      // ويتربطوا غلط بنفس العمود لمجرد إنهم بيبدأوا بنفس الكلمة الأولى.
      const auto = {};
      const usedIdx = new Set();
      EMPLOYEE_IMPORT_FIELDS.forEach((f) => {
        const words = f.match || [f.label.split(" ")[0]];
        const idx = headers.findIndex((h, i) => !usedIdx.has(i) && words.some((w) => h.includes(w)));
        if (idx !== -1) { auto[f.key] = idx; usedIdx.add(idx); }
      });
      setMapping(auto);
      setStep(2);
    } catch (e) { setError(e.message); }
  }

  function buildResult() {
    return rows.map((r) => {
      const rec = {};
      EMPLOYEE_IMPORT_FIELDS.forEach((f) => {
        const idx = mapping[f.key];
        // عمود مش متربط بأي حاجة في الملف ده = محدش قال حاجة عنه، فمنسيبوش يمسح قيمة
        // موجودة فعلاً للموظف (زي القسم أو تاريخ التعيين) لمجرد إن ملف التحديث ده كان
        // بس عن المرتب مثلًا. لو الحقل ده اتربط فعلاً بعمود، بياخد قيمته حتى لو فاضية.
        if (idx === undefined || idx === "") return;
        const raw = r[idx];
        if (f.key === "salary") rec.salary = Number(raw) || 0;
        else if (f.key === "leaveEntitlement") { const n = parseInt(String(raw).match(/\d+/)?.[0], 10); if (!isNaN(n)) rec.leaveEntitlement = n; }
        else if (f.key === "hireDate") rec.hireDate = excelSerialToISODate(raw) || todayISO();
        else if (f.key === "birthDate" || f.key === "contractStart" || f.key === "contractEnd") rec[f.key] = excelSerialToISODate(raw) || "";
        else if (f.key === "weeklyOffDaysText") {
          // بيقبل فواصل عادية أو "و" أو مسافات، وبيتسامح مع اختلاف رسم الألف/الهمزة وآخر الكلمة
          // (الجمعه/الجمعة) اللي بيحصل كتير في ملفات الإكسيل المكتوبة يدويًا.
          const norm = (s) => s.trim().replace(/[إأآ]/g, "ا").replace(/ة$/, "ه");
          const dayByNorm = {}; WEEKDAYS.forEach((d) => { dayByNorm[norm(d)] = d; });
          const parts = raw ? String(raw).split(/[,،\s]+/).map((s) => s.trim()).filter((s) => s && s !== "و") : [];
          const matched = parts.map((s) => dayByNorm[norm(s)]).filter(Boolean);
          rec.weeklyOffDays = matched.length ? matched : ["الجمعة"];
        }
        else rec[f.key] = String(raw || "").trim();
      });
      return rec;
    }).filter((r) => r.name);
  }

  const preview = step === 3 ? buildResult() : [];
  const matchStats = useMemo(() => {
    if (step !== 3) return { updated: 0, created: 0 };
    const byCode = {}, byName = {};
    employees.forEach((e) => {
      if (e.employeeCode) byCode[String(e.employeeCode).trim().toLowerCase()] = true;
      byName[e.name.trim().toLowerCase()] = true;
    });
    let updated = 0, created = 0;
    preview.forEach((r) => {
      const matched = (r.employeeCode && byCode[String(r.employeeCode).trim().toLowerCase()]) || byName[r.name.trim().toLowerCase()];
      if (matched) updated++; else created++;
    });
    return { updated, created };
  }, [preview, employees, step]);

  return (
    <div>
      {step === 1 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">{t("ارفع ملف فيه صف عناوين في الأول (الاسم، الوظيفة، الراتب...) وصف لكل موظف.")}</p>
          <FileDropZone onFile={handleFile} fileName={fileName} />
          {error && <p className="mt-2 text-sm text-rose-600">{t(error)}</p>}
        </div>
      )}
      {step === 2 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">{t("حدد أي عمود من ملفك يقابل كل حقل (سيبها فاضية لو مش موجودة).")}</p>
          <div className="max-h-96 space-y-2 overflow-y-auto">
            {EMPLOYEE_IMPORT_FIELDS.map((f) => (
              <div key={f.key} className="flex items-center gap-3">
                <span className="w-56 shrink-0 text-sm text-slate-600">{t(f.label)}{f.required && <span className="text-rose-500"> *</span>}</span>
                <select className={inputCls} value={mapping[f.key] ?? ""} onChange={(e) => setMapping({ ...mapping, [f.key]: e.target.value === "" ? undefined : Number(e.target.value) })}>
                  <option value="">{t("— تجاهل —")}</option>
                  {headers.map((h, i) => <option key={i} value={i}>{h}</option>)}
                </select>
              </div>
            ))}
          </div>
          <p className="mt-3 text-xs text-slate-400">{t("{n} صف اتقروا من الملف.", { n: rows.length })}</p>
          <div className="mt-4 flex justify-between border-t border-stone-200 pt-4">
            <button onClick={() => setStep(1)} className="flex items-center gap-1 rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50"><ArrowRight size={14} /> {t("رجوع")}</button>
            <button disabled={mapping.name === undefined} onClick={() => setStep(3)} className="flex items-center gap-1 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900 disabled:opacity-40">{t("معاينة")} <ArrowLeft size={14} /></button>
          </div>
        </div>
      )}
      {step === 3 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">{t("هيتم معالجة")} <strong>{preview.length}</strong> {t("صف — المطابقة بتتم بكود الموظف أو الاسم:")}</p>
          <div className="mb-3 flex gap-3">
            <div className="rounded-lg bg-sky-50 px-3 py-2 text-sm text-sky-700"><strong>{matchStats.updated}</strong> {t("هيتحدّث (موجود بالفعل)")}</div>
            <div className="rounded-lg bg-emerald-50 px-3 py-2 text-sm text-emerald-700"><strong>{matchStats.created}</strong> {t("هيتضاف كموظف جديد")}</div>
          </div>
          <div className="max-h-72 overflow-auto rounded-lg border border-stone-200">
            <table className="w-full text-xs">
              <thead><tr className="bg-stone-50"><th className="px-2 py-1.5 text-right">{t("الاسم")}</th><th className="px-2 py-1.5 text-right">{t("الوظيفة")}</th><th className="px-2 py-1.5 text-right">{t("الراتب")}</th></tr></thead>
              <tbody>{preview.slice(0, 8).map((r, i) => (
                <tr key={i} className="border-t border-stone-100"><td className="px-2 py-1.5">{r.name}</td><td className="px-2 py-1.5">{r.position || "—"}</td><td className="px-2 py-1.5 tabular-nums">{fmtMoney(r.salary)}</td></tr>
              ))}</tbody>
            </table>
          </div>
          <div className="mt-4 flex justify-between border-t border-stone-200 pt-4">
            <button onClick={() => setStep(2)} className="flex items-center gap-1 rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50"><ArrowRight size={14} /> {t("رجوع")}</button>
            <button onClick={() => onImport(preview)} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Check size={15} /> {t("تأكيد ({u} تحديث + {c} جديد)", { u: matchStats.updated, c: matchStats.created })}</button>
          </div>
        </div>
      )}
    </div>
  );
}

function EmployeeForm({ initial, settings, employees = [], onSave, onCancel }) {
  const { t } = useLang();
  const knownBranches = useMemo(() => [...new Set(employees.map((e) => (e.branch || "").trim()).filter(Boolean))], [employees]);
  const [form, setForm] = useState({
    employeeCode: initial?.employeeCode || "",
    name: initial?.name || "", position: initial?.position || "", department: initial?.department || "",
    grade: initial?.grade || "", level: initial?.level || "",
    branch: initial?.branch || "",
    phone: initial?.phone || "", email: initial?.email || "", nationalId: initial?.nationalId || "", hireDate: initial?.hireDate || todayISO(),
    salary: initial?.salary || "", contractType: initial?.contractType || CONTRACT_TYPES[0],
    contractStart: initial?.contractStart || todayISO(), contractEnd: initial?.contractEnd || "",
    birthDate: initial?.birthDate || "", weeklyOffDays: getWeeklyOffDays(initial || {}),
    leaveEntitlement: initial?.leaveEntitlement ?? settings.leaveDefaultDays,
  });
  // لما بيتعدّل مرتب موظف موجود بالفعل (initial موجود، مش موظف جديد) لازم يتكتب سبب التعديل
  // إجباريًا - salaryChanged بيقارن بالقيمة الأصلية وقت فتح الفورم مش أي قيمة لحظية تانية.
  const [salaryReason, setSalaryReason] = useState("");
  const [salaryReasonError, setSalaryReasonError] = useState("");
  const salaryChanged = !!initial && Number(form.salary) !== Number(initial.salary || 0);
  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  // اختيار الدرجة (Grade) بيملأ المستوى الوظيفي (Level) تلقائي من جدول شرائح الدرجات
  // (settings.salaryGradeBands) - بس لو الحقل لسه فاضي، عشان مايمحيش قيمة كتبها الأدمن يدويًا.
  function setGrade(g) {
    const band = (settings.salaryGradeBands || []).find((b) => b.grade === g);
    setForm((f) => ({ ...f, grade: g, level: !f.level && band ? band.level : f.level }));
  }
  function toggleOffDay(day) {
    setForm((f) => ({
      ...f,
      weeklyOffDays: f.weeklyOffDays.includes(day) ? f.weeklyOffDays.filter((d) => d !== day) : [...f.weeklyOffDays, day],
    }));
  }
  function submit(e) {
    e.preventDefault();
    if (!form.name.trim()) return;
    if (salaryChanged && !salaryReason.trim()) { setSalaryReasonError("لازم تكتب سبب تعديل المرتب."); return; }
    setSalaryReasonError("");
    onSave({
      ...form,
      salary: Number(form.salary) || 0,
      leaveEntitlement: Number(form.leaveEntitlement) || 0,
      ...(salaryChanged ? { salaryChangeReason: salaryReason.trim() } : {}),
    });
  }

  return (
    <form onSubmit={submit} className="space-y-4">
      <div className="grid grid-cols-2 gap-4">
        <Field label="كود الموظف (زي كود جهاز البصمة، اختياري)"><input className={inputCls} value={form.employeeCode} onChange={(e) => set("employeeCode", e.target.value)} /></Field>
        <Field label="الاسم بالكامل"><input required className={inputCls} value={form.name} onChange={(e) => set("name", e.target.value)} /></Field>
        <Field label="رقم الموبايل"><input className={inputCls} value={form.phone} onChange={(e) => set("phone", e.target.value)} /></Field>
        <Field label="الإيميل (اختياري)"><input type="email" className={inputCls} value={form.email} onChange={(e) => set("email", e.target.value)} placeholder="name@example.com" /></Field>
        <Field label="الوظيفة"><input className={inputCls} value={form.position} onChange={(e) => set("position", e.target.value)} /></Field>
        <Field label="القسم">
          <input list="departments" className={inputCls} value={form.department} onChange={(e) => set("department", e.target.value)} />
          <datalist id="departments">{DEPARTMENTS_DEFAULT.map((d) => <option key={d} value={d} />)}</datalist>
        </Field>
        <Field label="الدرجة (Grade)">
          <select className={inputCls} value={form.grade} onChange={(e) => setGrade(e.target.value)}>
            <option value="">{t("— بدون —")}</option>
            {(settings.salaryGradeBands || []).map((b) => <option key={b.grade} value={b.grade}>{b.grade}</option>)}
          </select>
        </Field>
        <Field label="المستوى الوظيفي (Level)"><input className={inputCls} value={form.level} onChange={(e) => set("level", e.target.value)} /></Field>
        <Field label="الفرع (لو الشركة أكتر من موقع)">
          <input list="branches" className={inputCls} value={form.branch} onChange={(e) => set("branch", e.target.value)} placeholder={t("مثلًا فرع المعادي")} />
          <datalist id="branches">{knownBranches.map((b) => <option key={b} value={b} />)}</datalist>
        </Field>
        <Field label="الرقم القومي"><input className={inputCls} value={form.nationalId} onChange={(e) => set("nationalId", e.target.value)} /></Field>
        <Field label="تاريخ الميلاد"><input type="date" className={inputCls} value={form.birthDate} onChange={(e) => set("birthDate", e.target.value)} /></Field>
        <Field label="تاريخ التعيين"><input type="date" className={inputCls} value={form.hireDate} onChange={(e) => set("hireDate", e.target.value)} /></Field>
        <Field label="الراتب الأساسي الشهري"><input type="number" min="0" className={inputCls} value={form.salary} onChange={(e) => set("salary", e.target.value)} /></Field>
        {salaryChanged && (
          <div className="col-span-2">
            <Field label="سبب تعديل المرتب (إجباري)">
              <input className={inputCls} value={salaryReason} onChange={(e) => { setSalaryReason(e.target.value); if (salaryReasonError) setSalaryReasonError(""); }} placeholder={t("مثلًا: علاوة سنوية، ترقية، تعديل سوق العمل...")} />
            </Field>
            {salaryReasonError && <p className="-mt-2 mb-2 text-xs font-semibold text-rose-600">{t(salaryReasonError)}</p>}
          </div>
        )}
        <Field label="نوع العقد">
          <select className={inputCls} value={form.contractType} onChange={(e) => set("contractType", e.target.value)}>
            {CONTRACT_TYPES.map((ct) => <option key={ct} value={ct}>{t(ct)}</option>)}
          </select>
        </Field>
        <Field label="بداية العقد"><input type="date" className={inputCls} value={form.contractStart} onChange={(e) => set("contractStart", e.target.value)} /></Field>
        <Field label="نهاية العقد (اختياري)"><input type="date" className={inputCls} value={form.contractEnd} onChange={(e) => set("contractEnd", e.target.value)} /></Field>
        <div className="col-span-2">
          <span className="mb-1.5 block text-sm font-medium text-slate-600">{t("أيام الإجازة الأسبوعية (اختر واحد أو أكتر)")}</span>
          <div className="flex flex-wrap gap-1.5">
            {WEEKDAYS.map((d) => (
              <button key={d} type="button" onClick={() => toggleOffDay(d)} className={`rounded-full border px-3 py-1 text-xs font-semibold ${form.weeklyOffDays.includes(d) ? "border-teal-700 bg-teal-800 text-white" : "border-stone-200 text-slate-500 hover:border-stone-300"}`}>{t(d)}</button>
            ))}
          </div>
        </div>
        <Field label="رصيد الإجازات السنوي (يوم)"><input type="number" min="0" className={inputCls} value={form.leaveEntitlement} onChange={(e) => set("leaveEntitlement", e.target.value)} /></Field>
      </div>
      <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">
        <button type="button" onClick={onCancel} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50">{t("إلغاء")}</button>
        <button type="submit" className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Save size={15} /> {t("حفظ")}</button>
      </div>
    </form>
  );
}

/* ---- Employee profile (leave / documents / reviews) ---- */
function EmployeeProfileModal({ employee, onClose, attendance, documents, setDocuments, reviews, setReviews, settings, employees, setEmployees, assets, setAssets, checklistItems, setChecklistItems, orgChart, requests = [] }) {
  const { t } = useLang();
  const [sub, setSub] = useState("info");
  const [pin, setPin] = useState("");
  const [portalBusy, setPortalBusy] = useState(false);
  const [portalMsg, setPortalMsg] = useState(null);
  // بيتفضل موجود بس جوه الجلسة دي (مش متسجل في Firestore ولا أي مكان دائم) عشان زرار
  // "إرسال عبر واتساب" يقدر يعرضه فورًا بعد التفعيل - نفس منطق "مفيش استرجاع مباشر"
  // اللي السيستم أصلاً بيقوله للأدمن، إحنا بس بنسهّل توصيله للحظة دي بالظبط.
  const [lastActivatedPin, setLastActivatedPin] = useState(null);
  const [confirmingReset, setConfirmingReset] = useState(false);

  async function enablePortal(e) {
    e.preventDefault();
    setPortalMsg(null);
    if (!employee.employeeCode) { setPortalMsg({ tone: "rose", text: "لازم تحدد كود الموظف الأول من زرار التعديل قبل ما تفعّل الدخول." }); return; }
    if (!/^\d{6,8}$/.test(pin)) { setPortalMsg({ tone: "rose", text: "الرقم السري لازم يكون من 6 لـ 8 أرقام (Firebase مش بيقبل باسورد أقل من 6 خانات)." }); return; }
    setPortalBusy(true);
    try {
      const authUid = await createEmployeeAuthAccount(employee.employeeCode, pin);
      setEmployees(employees.map((e) => (e.id === employee.id ? { ...e, authUid } : e)));
      setLastActivatedPin(pin);
      setPin("");
      setPortalMsg({ tone: "teal", text: "تم تفعيل الدخول. اديله كود الموظف والرقم السري ده." });
    } catch (err) {
      const already = err?.code === "auth/email-already-in-use";
      const weak = err?.code === "auth/weak-password";
      let text = "حصل خطأ أثناء التفعيل. جرب تاني.";
      if (already) text = "كود الموظف ده مستخدم بالفعل لحساب دخول موجود — لو ضاع الرقم السري، لازم تمسح الحساب من Firebase Console (Authentication → Users) وتجرب تاني.";
      else if (weak) text = "الرقم السري ضعيف جدًا بالنسبة لـ Firebase — جرب رقم من 6 أرقام أو أكتر.";
      else if (err?.code) text = `حصل خطأ أثناء التفعيل (${err.code}). جرب تاني.`;
      setPortalMsg({ tone: "rose", text });
    } finally { setPortalBusy(false); }
  }
  // "إعادة تعيين كود الدخول" مش بيقدر يغيّر باسورد حساب Firebase Auth موجود فعلاً من غير
  // باك إند (مفيش Cloud Function/Admin SDK متاح للتطبيق ده) - فالمسار الوحيد المتاح فعلاً
  // هو: يتمسح الحساب القديم يدويًا من Firebase Console الأول، وبعدين هنا بس بنسيب الأدمن
  // يمسح authUid المحلي عشان فورم "تفعيل الدخول" يظهر تاني ويقدر يحدد رقم سري جديد -
  // مش بيلمس Firebase Auth خالص.
  function forgetLocalPortalLink() {
    setEmployees(employees.map((e) => (e.id === employee.id ? { ...e, authUid: null } : e)));
    setConfirmingReset(false);
    setLastActivatedPin(null);
    setPortalMsg(null);
  }
  const today = todayISO();
  const takenLeave = Object.keys(attendance).filter((d) => yearKey(d) === yearKey(today) && getAttEntry(attendance, d, employee.id)?.status === "leave").length;
  const entitlement = employee.leaveEntitlement ?? settings.leaveDefaultDays;
  const remaining = entitlement - takenLeave;
  // مرضي/مأمورية مالهمش رصيد سنوي محدد (زي الإجازة العادية) - عدّاد استهلاك للسنة الحالية بس،
  // للمتابعة، مش لخصم من رصيد.
  const takenSick = Object.keys(attendance).filter((d) => yearKey(d) === yearKey(today) && getAttEntry(attendance, d, employee.id)?.status === "sick").length;
  const takenMission = Object.keys(attendance).filter((d) => yearKey(d) === yearKey(today) && getAttEntry(attendance, d, employee.id)?.status === "mission").length;
  // الإجازة العارضة بتتكتب في الحضور بحالة "leave" زي الإجازة العادية بالظبط (نفس اللون
  // والمعاملة في المرتب)، فمينفعش نميّزها من شيت الحضور - لازم نحسبها من طلبات الموظف
  // (requests) اللي نوعها "casual" وحالتها "موافق عليها" في السنة الحالية، بعدد الأيام
  // الفعلي في كل طلب (من dateFrom لحد dateTo شامل الطرفين) مش عدد الطلبات.
  const takenCasual = requests
    .filter((r) => r.employeeId === employee.id && r.kind === "casual" && r.status === "approved" && yearKey(r.dateFrom || "") === yearKey(today))
    .reduce((sum, r) => sum + (daysBetween(r.dateFrom, r.dateTo || r.dateFrom) + 1), 0);

  const empDocs = documents.filter((d) => d.employeeId === employee.id);
  const empReviews = reviews.filter((r) => r.employeeId === employee.id).sort((a, b) => (a.date < b.date ? 1 : -1));
  // فصل التقييمات الدورية الهيكلية (نصف سنوي/سنوي - الفورم الجديد) عن تقييمات فترة الاختبار
  // (الفورم البسيط القديم) - كل واحد ليه قسم وعرض مختلف تمامًا في تاب "التقييمات".
  const periodicReviews = empReviews.filter((r) => PERIODIC_REVIEW_TYPES.includes(r.reviewType));
  const probationReviews = empReviews.filter((r) => !PERIODIC_REVIEW_TYPES.includes(r.reviewType));

  const [docForm, setDocForm] = useState({ name: DOC_TYPES[0], expiryDate: "", status: "متوفر" });
  // مؤشرات الأداء (KPIs) الثابتة المرتبطة بقسم أو وظيفة الموظف ده (من مكتبة settings.kpiTemplates
  // اللي الأدمن بيديرها من تاب الإعدادات) - بتتحمّل تلقائي جوه فورم التقييم عشان الأدمن يدخل
  // القيمة الفعلية لكل مؤشر وقت ما يسجّل تقييم، من غير ما يحتاج يكتبها من الصفر كل مرة.
  const matchedKpis = (settings.kpiTemplates || []).filter((k) =>
    (k.scope === "department" && k.scopeValue === employee.department) || (k.scope === "position" && k.scopeValue === employee.position)
  );
  // الفورم البسيط ده بقى مخصص لتقييمات فترة الاختبار بس (PROBATION_REVIEW_TYPES) - التقييم
  // الدوري (نصف سنوي/سنوي) بقى ليه فورمه الهيكلي الخاص (appraisalDraft) تحت.
  const blankReviewForm = () => ({ date: today, score: 3, reviewer: "", notes: "", reviewType: PROBATION_REVIEW_TYPES[0], kpiScores: matchedKpis.map((k) => ({ kpiId: k.id, title: k.title, target: k.target || "", actual: "" })) });
  const [reviewForm, setReviewForm] = useState(blankReviewForm);

  function addDoc(e) {
    e.preventDefault();
    setDocuments([...documents, { id: uid("doc"), employeeId: employee.id, ...docForm }]);
    setDocForm({ name: DOC_TYPES[0], expiryDate: "", status: "متوفر" });
  }
  function removeDoc(id) { setDocuments(documents.filter((d) => d.id !== id)); }
  function setKpiActual(kpiId, actual) {
    setReviewForm((f) => ({ ...f, kpiScores: f.kpiScores.map((k) => (k.kpiId === kpiId ? { ...k, actual } : k)) }));
  }
  function addReview(e) {
    e.preventDefault();
    setReviews([{ id: uid("rev"), employeeId: employee.id, ...reviewForm, score: Number(reviewForm.score) }, ...reviews]);
    setReviewForm(blankReviewForm());
  }
  function removeReview(id) { setReviews(reviews.filter((r) => r.id !== id)); }

  /* ============= تقييم دوري هيكلي (نصف سنوي/سنوي) - Self + Manager + KPIs (60%) + Competencies
     (40%) = Final Score، مطابق لقالب الشركة (Performance Appraisal Form.xlsx). الأدمن من هنا
     يقدر يبدأ تقييم جديد من الصفر (ويملأ عمودي الموظف والمدير مباشرة لو حابب - مفيد لما ما فيش
     مدير مباشر زي حالة الـ CEO، أو المدير مش بيستخدم البوابة)، أو يكمّل/يعدّل تقييم بدأه الموظف
     من بوابة الموظف (هيوصل هنا بحالة status:"awaiting_manager" وعمود الموظف مسجّل بالفعل). ============= */
  function blankAppraisalDraft(type) {
    return {
      id: null,
      reviewType: type || PERIODIC_REVIEW_TYPES[0],
      year: String(new Date().getFullYear()),
      kpis: matchedKpis.map((k) => ({ id: k.id || uid("kpi"), title: k.title, weight: matchedKpis.length ? Math.round(60 / matchedKpis.length) : 0, target: k.target || "", selfScore: "", managerScore: "" })),
      competencies: COMPETENCY_ITEMS.map((c) => ({ key: c.key, selfScore: "", managerScore: "", notes: "" })),
      employeeNotes: "",
      managerNotes: "",
    };
  }
  const [showAppraisalForm, setShowAppraisalForm] = useState(false);
  const [appraisalDraft, setAppraisalDraft] = useState(null);
  function startNewAppraisal(type) {
    setAppraisalDraft(blankAppraisalDraft(type));
    setShowAppraisalForm(true);
  }
  function loadExistingIntoDraft(r) {
    setAppraisalDraft({
      id: r.id,
      reviewType: r.reviewType,
      year: r.year || String(new Date().getFullYear()),

    const weightTotal = appraisalDraft.kpis.reduce((s, k) => s + (Number(k.weight) || 0), 0);

      managerScore: c.managerScore === "" ? null : Number(c.managerScore),

      year: appraisalDraft.year,
      status: "completed",

      competencies: cleanCompetencies,
      employeeNotes: appraisalDraft.employeeNotes,
      managerNotes: appraisalDraft.managerNotes,
      ...scored,
      date: todayISO(),
      completedAt: todayISO(),

      appraisalDraft.id

/* ================= ATTENDANCE ================= */
function AttendanceTab({ employees, attendance, patchAttendance, settings }) {
  const { t, lang } = useLang();
  const [date, setDate] = useState(todayISO());
  const [importOpen, setImportOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("الكل");
  const dayRecord = attendance[date] || {};

  // Builds a sparse patch - only the (date, employeeId) pairs this import actually names, plus
  // whatever isNonWorkday-eligible gaps fillAbsence explicitly marks absent - rather than
  // spreading the full known `attendance` history the way this used to. See
  // syncAttendancePatch's comment (near its definition) for why that distinction matters.
  //
  // يوم عليه حالة "معتمدة" بالفعل (إجازة/مرضي/مأمورية - جاية من موافقة مدير على طلب الموظف)
  // مايتلمسش من استيراد ملف بيقترح حالة عادية (حاضر/غائب/متأخر) - ده بالظبط اللي كان بيحصل
  // مع هاني زكزوك: يوم إجازة معتمد كان بيترجع "متأخر" أول ما ملف البصمة يترفع تاني ولسه فيه
  // سطر لنفس اليوم. لو الملف نفسه رجّع حالة من النوع المعتمد (يعني موافق إنها إجازة/مرضي/
  // مأمورية)، التحديث بيتسمح بيه عادي.
  function importBulk(entries, fillAbsence, fromDate, toDate) {
    const patch = [];
    const touched = new Set();
    entries.forEach(({ empId, date: d, status, overtimeHours, lateMinutes }) => {
      const current = getAttEntry(attendance, d, empId) || { status: null, overtimeHours: 0, lateMinutes: 0 };
      if (shouldSkipAttendanceOverwrite(current, { status, lateMinutes })) {
        touched.add(`${d}_${empId}`);
        return;
      }
      // الاستيراد (ملف/جهاز بصمة) مبيحملش أي فكرة عن "إعفاء" - أي يوم بيوصله هنا فعليًا (يعني
      // عدّى shouldSkipAttendanceOverwrite فوق، فمش يوم معفي محمي) بيتكتب من غير إعفاء.
      patch.push({ date: d, employeeId: empId, status: status || current.status, overtimeHours: overtimeHours ?? current.overtimeHours, lateMinutes: lateMinutes ?? current.lateMinutes, lateExcused: false });
      touched.add(`${d}_${empId}`);
    });
    if (fillAbsence && fromDate && toDate) {
      let d = new Date(fromDate);
      const end = new Date(toDate);
      while (d <= end) {
        const ds = d.toISOString().slice(0, 10);
        employees.forEach((e) => {
          if (isNonWorkday(e, ds, settings.publicHolidays)) return;
          const key = `${ds}_${e.id}`;
          if (touched.has(key)) return;
          const existing = getAttEntry(attendance, ds, e.id);
          if (!existing || !existing.status) {
            patch.push({ date: ds, employeeId: e.id, status: "absent", overtimeHours: existing?.overtimeHours || 0, lateMinutes: 0 });
            touched.add(key);
          }
        });
        d.setDate(d.getDate() + 1);
      }
    }
    patchAttendance(patch);
    setImportOpen(false);
  }

  function setStatus(empId, status) {
    const current = getAttEntry(attendance, date, empId) || { status: null, overtimeHours: 0, lateMinutes: 0 };
    const nextStatus = current.status === status ? null : status;
    // Moving away from "late" (including toggling it off) clears any lateMinutes left over -
    // a day that isn't marked "late" should never carry a leftover minutes figure into payroll.
    const nextLateMinutes = nextStatus === "late" ? current.lateMinutes : 0;
    // لو لسه "متأخر"، الإعفاء (lateExcused) بيفضل زي ما هو - الأدمن بيلمس الحالة نفسها مش قرار
    // الإعفاء. لو اتشال من "متأخر" خالص، الإعفاء مالوش معنى أصلًا فبيترجع false.
    const nextLateExcused = nextStatus === "late" ? current.lateExcused : false;
    patchAttendance([{ date, employeeId: empId, status: nextStatus, overtimeHours: current.overtimeHours, lateMinutes: nextLateMinutes, lateExcused: nextLateExcused }]);
  }
  function setOvertime(empId, hours) {
    const current = getAttEntry(attendance, date, empId) || { status: null, overtimeHours: 0, lateMinutes: 0 };
    // بتحافظ على lateExcused زي ما هي - تعديل ساعات الإضافي مالوش أي علاقة بقرار إعفاء التأخير،
    // ومن غير كده syncAttendancePatch هيكتب "set" كامل من غيرها فتتمسح بالغلط.
    patchAttendance([{ date, employeeId: empId, status: current.status, overtimeHours: Number(hours) || 0, lateMinutes: current.lateMinutes, lateExcused: current.lateExcused }]);
  }
  // Entering minutes late auto-promotes the status to "late" (when it's currently unset or
  // "present") - this is the same rule the file importer applies (see buildResult below), so
  // "متأخر" and a real minutes figure can never disagree with each other inside this app, no
  // matter whether the number came from a click here or from an imported spreadsheet. An
  // explicit "غائب"/"إجازة" status is left alone - lateness doesn't apply to a day off, so a
  // number typed here while one of those is set is discarded (mirrors setStatus's own rule of
  // never letting a non-"late" record carry a stray lateMinutes value into payroll).
  function setLateMinutes(empId, minutes) {
    const current = getAttEntry(attendance, date, empId) || { status: null, overtimeHours: 0, lateMinutes: 0 };
    const mins = Number(minutes) || 0;
    const nextStatus = mins > 0 && (!current.status || current.status === "present") ? "late" : current.status;
    const nextLateMinutes = nextStatus === "late" ? mins : 0;
    // الأدمن بيكتب رقم دقايق حقيقي يدويًا هنا - ده قرار صريح إن التأخير ده مش (أو مبقاش) معفي،
    // فبيلغي أي إعفاء سابق (lateExcused: false). لو بيصفّر الرقم بس (مين=0) من غير ما يشيل الحالة
    // خالص، بنسيب الإعفاء زي ما هو (يمكن بيأكّد الإعفاء نفسه من غير قصد إنه يلغيه).
    const nextLateExcused = mins > 0 ? false : current.lateExcused;
    patchAttendance([{ date, employeeId: empId, status: nextStatus, overtimeHours: current.overtimeHours, lateMinutes: nextLateMinutes, lateExcused: nextLateExcused }]);
  }
  function shiftDay(delta) { const d = new Date(date); d.setDate(d.getDate() + delta); setDate(d.toISOString().slice(0, 10)); }

  // يوم عطلة رسمية/أسبوعية (isNonWorkday) بيتحسب "holiday" لكل موظف عليه العطلة دي، بغض النظر
  // عن أي سجل حضور خام مسجّل على نفس اليوم (زي بيانات مزامنة قديمة من قبل ما العطلة تتسجل) -
  // نفس القاعدة اللي صف الموظف الفردي تحت بيطبّقها (بادج "عطلة رسمية"/"إجازة أسبوعية" بدل أزرار
  // الحالة)، عشان كروت الإحصائيات فوق تتفق مع الجدول تحتها بدل ما تناقضه.
  const counts = employees.reduce((acc, e) => {
    if (isNonWorkday(e, date, settings.publicHolidays)) { acc.holiday++; return acc; }
    const st = getAttEntry(attendance, date, e.id)?.status;
    if (st) acc[st] = (acc[st] || 0) + 1;
    return acc;
  }, { present: 0, absent: 0, late: 0, leave: 0, sick: 0, mission: 0, holiday: 0 });
  // المتأخر لسه حاضر فعليًا - نفس القاعدة المتبعة في لوحة المتابعة وتقرير معدل الحضور:
  // كارت "حاضر" هنا لازم يشمل المتأخرين، و"متأخر" بيبقى بس توضيح لكام واحد من الحاضرين
  // ده كان متأخر (مش فئة منفصلة بتتشال من العدد).
  const presentIncludingLate = counts.present + counts.late;

  // الفلتر بيأثر بس على الجدول والتصدير - كروت الإحصائيات فوق بتفضل بتعرض إجمالي اليوم كله
  // (نفس منطق "الجزاءات والإنذارات": eyebrow/الكروت العلوية بتعكس الإجمالي، والفلتر بيأثر
  // على الليستة تحت بس).
  const filteredEmployees = useMemo(() => {
    const q = query.trim().toLowerCase();
    return employees.filter((e) => {
      if (q && !e.name.toLowerCase().includes(q)) return false;
      if (statusFilter !== "الكل") {
        const st = getAttEntry(attendance, date, e.id)?.status;
        if (statusFilter === "__unset__") { if (st) return false; }
        else if (st !== statusFilter) return false;
      }
      return true;
    });
  }, [employees, attendance, date, query, statusFilter]);
  const filtersActive = query.trim() || statusFilter !== "الكل";
  function clearFilters() { setQuery(""); setStatusFilter("الكل"); }

  function exportExcel() {
    const rows = filteredEmployees.map((e) => {
      const entry = getAttEntry(attendance, date, e.id);
      return {
        [t("الموظف")]: e.name,
        [t("الحالة")]: entry?.status ? t(STATUS_LABELS[entry.status] || entry.status) : "",
        [t("دقايق التأخير")]: entry?.lateMinutes || 0,
        [t("ساعات إضافي")]: entry?.overtimeHours || 0,
      };
    });
    exportRowsToExcel(rows, t("الحضور والانصراف"), `attendance-${date}`);
  }

  return (
    <div>
      <SectionTitle eyebrow="سجل يومي" title="الحضور والانصراف" action={
        <div className="flex items-center gap-2">
          <button onClick={exportExcel} disabled={filteredEmployees.length === 0} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50 disabled:opacity-40">
            <FileSpreadsheet size={15} /> {t("تصدير Excel")}
          </button>
          <button onClick={() => setImportOpen(true)} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50">
            <Upload size={15} /> {t("استيراد من ملف")}
          </button>
          <button onClick={() => shiftDay(-1)} className="rounded-lg border border-stone-300 p-2 hover:bg-stone-50">{lang === "en" ? <ChevronLeft size={16} /> : <ChevronRight size={16} />}</button>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className={`${inputCls} w-auto`} />
          <button onClick={() => shiftDay(1)} className="rounded-lg border border-stone-300 p-2 hover:bg-stone-50">{lang === "en" ? <ChevronRight size={16} /> : <ChevronLeft size={16} />}</button>
        </div>
      } />

      <div className="mb-5 grid grid-cols-3 gap-3 lg:grid-cols-7">
        <div className="rounded-xl bg-emerald-50 px-4 py-3 text-emerald-700"><div className="text-xl font-bold tabular-nums">{presentIncludingLate}</div><div className="text-xs font-medium">{t("حاضر")}</div></div>
        <div className="rounded-xl bg-rose-50 px-4 py-3 text-rose-700"><div className="text-xl font-bold tabular-nums">{counts.absent}</div><div className="text-xs font-medium">{t("غايب")}</div></div>
        <div className="rounded-xl bg-amber-50 px-4 py-3 text-amber-700"><div className="text-xl font-bold tabular-nums">{counts.late}</div><div className="text-xs font-medium">{t("متأخر")}</div></div>
        <div className="rounded-xl bg-sky-50 px-4 py-3 text-sky-700"><div className="text-xl font-bold tabular-nums">{counts.leave}</div><div className="text-xs font-medium">{t("إجازة")}</div></div>
        <div className="rounded-xl bg-purple-50 px-4 py-3 text-purple-700"><div className="text-xl font-bold tabular-nums">{counts.sick}</div><div className="text-xs font-medium">{t("مرضي")}</div></div>
        <div className="rounded-xl bg-indigo-50 px-4 py-3 text-indigo-700"><div className="text-xl font-bold tabular-nums">{counts.mission}</div><div className="text-xs font-medium">{t("مأمورية")}</div></div>
        <div className="rounded-xl bg-slate-100 px-4 py-3 text-slate-600"><div className="text-xl font-bold tabular-nums">{counts.holiday}</div><div className="text-xs font-medium">{t("عطلة")}</div></div>
      </div>

      {employees.length > 0 && (
        <div className="mb-4 flex flex-wrap items-center gap-2">
          <div className="flex min-w-[220px] flex-1 items-center gap-2 rounded-lg border border-stone-300 bg-white px-3 py-2">
            <Search size={16} className="text-slate-400" />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={t("دور باسم الموظف...")} className="w-full text-sm outline-none" />
          </div>
          <select className={`${inputCls} w-auto`} value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
            <option value="الكل">{t("كل الحالات")}</option>
            <option value="__unset__">{t("لسه ما اتسجلش")}</option>
            {Object.keys(STATUS_LABELS).map((st) => <option key={st} value={st}>{t(STATUS_LABELS[st])}</option>)}
          </select>
          {filtersActive && (
            <button onClick={clearFilters} className="rounded-lg border border-stone-300 px-3 py-2 text-xs font-semibold text-slate-500 hover:bg-stone-50">{t("مسح الفلاتر")}</button>
          )}
        </div>
      )}

      {employees.length === 0 ? <Card className="p-0"><EmptyState text="لسه معملتش أي موظف نشط." /></Card> : filteredEmployees.length === 0 ? (
        <Card className="p-0"><EmptyState text={filtersActive ? "مفيش موظفين مطابقين للفلتر." : "لسه معملتش أي موظف نشط."} /></Card>
      ) : (
        <Card className="overflow-x-auto p-0">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-stone-200 bg-stone-50 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">
                <th className="px-4 py-3">{t("الموظف")}</th><th className="px-4 py-3">{t("الحالة")}</th><th className="px-4 py-3">{t("دقايق التأخير")}</th><th className="px-4 py-3">{t("ساعات إضافي")}</th>
              </tr>
            </thead>
            <tbody>
              {filteredEmployees.map((e) => {
                const nonWorkReason = isNonWorkday(e, date, settings.publicHolidays);
                const entry = getAttEntry(attendance, date, e.id);
                return (
                  <tr key={e.id} className="border-b border-stone-100 last:border-0 hover:bg-stone-50">
                    <td className="px-4 py-3 font-medium text-slate-800">{e.name}</td>
                    <td className="px-4 py-3">
                      {nonWorkReason ? <StampBadge tone="slate">{nonWorkReason}</StampBadge> : (
                        <div className="flex gap-1.5">
                          {Object.keys(STATUS_LABELS).map((st) => (
                            <button key={st} onClick={() => setStatus(e.id, st)} className={`rounded-full border px-2.5 py-1 text-xs font-semibold transition-colors ${entry?.status === st ? STATUS_COLORS[st] : "border-stone-200 text-slate-400 hover:border-stone-300"}`}>{t(STATUS_LABELS[st])}</button>
                          ))}
                        </div>
                      )}
                    </td>
                    <td className="px-4 py-3">
                      <div className="flex items-center gap-1.5">
                        <input type="number" min="0" step="1" className="w-20 rounded-md border border-stone-200 px-2 py-1 text-xs tabular-nums outline-none focus:border-teal-500" value={entry?.lateMinutes || ""} onChange={(e2) => setLateMinutes(e.id, e2.target.value)} placeholder="0" />
                        {entry?.status === "late" && entry?.lateExcused && (
                          <span title={t("اتسامح فيه من مديره (طلب تأخير معتمد) - مش هيتخصم من المرتب")} className="rounded-full border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[10px] font-semibold text-emerald-700">{t("معفي")}</span>
                        )}
                      </div>
                    </td>
                    <td className="px-4 py-3">
                      <input type="number" min="0" step="0.5" className="w-20 rounded-md border border-stone-200 px-2 py-1 text-xs tabular-nums outline-none focus:border-teal-500" value={entry?.overtimeHours || ""} onChange={(e2) => setOvertime(e.id, e2.target.value)} placeholder="0" />
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </Card>
      )}

      <Modal open={importOpen} onClose={() => setImportOpen(false)} title="استيراد الحضور والانصراف" wide>
        <AttendanceImportWizard employees={employees} settings={settings} onImport={importBulk} onCancel={() => setImportOpen(false)} />
      </Modal>
    </div>
  );
}

const ATTENDANCE_IMPORT_FIELDS = [
  { key: "employeeCode", label: "كود الموظف (أدق لو متاح، زي كود جهاز البصمة)" },
  { key: "employeeName", label: "اسم الموظف" },
  { key: "date", label: "التاريخ", required: true },
  { key: "timeIn", label: "وقت الحضور (لو متاح)" },
  { key: "timeOut", label: "وقت الانصراف (لو متاح، اختياري)" },
  { key: "statusText", label: "الحالة الجاهزة (لو الملف بيقولها مباشرة)" },
  { key: "lateMinutes", label: "دقايق التأخير (لو الملف فيه عمود بيها — بتلغي أي حالة \"حاضر\" متضاربة معاها)" },
  { key: "overtimeHours", label: "ساعات إضافي (لو متاحة)" },
];

function AttendanceImportWizard({ employees, settings, onImport, onCancel }) {
  const { t } = useLang();
  const [step, setStep] = useState(1);
  const [fileName, setFileName] = useState("");
  const [headers, setHeaders] = useState([]);
  const [rows, setRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [error, setError] = useState("");
  const [fillAbsence, setFillAbsence] = useState(true);
  const [range, setRange] = useState({ from: "", to: "" });

  async function handleFile(file) {
    setError("");
    setFileName(file.name);
    try {
      const { headers, dataRows } = await parseSpreadsheetFile(file);
      setHeaders(headers);
      setRows(dataRows);
      const auto = {};
      ATTENDANCE_IMPORT_FIELDS.forEach((f) => {
        const idx = headers.findIndex((h) => {
          const hl = h.toLowerCase();
          if (f.key === "employeeName") return hl.includes("name") || h.includes("اسم") || hl.includes("employee");
          if (f.key === "date") return hl.includes("date") || h.includes("تاريخ");
          if (f.key === "timeIn") return hl.includes("in") || h.includes("حضور") || h.includes("دخول");
          if (f.key === "timeOut") return hl.includes("out") || h.includes("انصراف") || h.includes("خروج");
          if (f.key === "statusText") return hl.includes("status") || h.includes("حالة");
          if (f.key === "lateMinutes") return hl.includes("late") || h.includes("دقائق") || h.includes("تأخير");
          if (f.key === "overtimeHours") return hl.includes("overtime") || h.includes("إضافي");
          return false;
        });
        if (idx !== -1) auto[f.key] = idx;
      });
      setMapping(auto);
      setStep(2);
    } catch (e) { setError(e.message); }
  }

  function buildResult() {
    const nameToId = {};
    employees.forEach((e) => { nameToId[e.name.trim().toLowerCase()] = e.id; });
    const codeToId = {};
    employees.forEach((e) => { if (e.employeeCode) codeToId[String(e.employeeCode).trim().toLowerCase()] = e.id; });

    const results = [];
    const unmatchedNames = new Set();
    let minDate = null, maxDate = null;

    rows.forEach((r) => {
      const codeIdx = mapping.employeeCode;
      const nameIdx = mapping.employeeName;
      const dateIdx = mapping.date;
      if ((codeIdx === undefined && nameIdx === undefined) || dateIdx === undefined) return;

      let empId = null;
      let displayLabel = "";
      if (codeIdx !== undefined) {
        const rawCode = String(r[codeIdx] || "").trim();
        displayLabel = rawCode;
        empId = codeToId[rawCode.toLowerCase()];
      }
      if (!empId && nameIdx !== undefined) {
        const rawName = String(r[nameIdx] || "").trim();
        if (!displayLabel) displayLabel = rawName;
        empId = nameToId[rawName.toLowerCase()];
      }

      const isoDate = excelSerialToISODate(r[dateIdx]);
      if (!isoDate) return;
      if (!minDate || isoDate < minDate) minDate = isoDate;
      if (!maxDate || isoDate > maxDate) maxDate = isoDate;
      if (!empId) { unmatchedNames.add(displayLabel || "—"); return; }

      let lateMinutes;
      if (mapping.lateMinutes !== undefined) {
        const rawLate = r[mapping.lateMinutes];
        const n = Number(rawLate);
        if (rawLate !== null && rawLate !== "" && !isNaN(n)) lateMinutes = n;
      }
      let overtimeHours;
      if (mapping.overtimeHours !== undefined) {
        const rawOt = r[mapping.overtimeHours];
        const n = Number(rawOt);
        if (rawOt !== null && rawOt !== "" && !isNaN(n)) overtimeHours = n;
      }

      let status = null;
      // A real "late minutes" figure is ground truth and wins over whatever a separate
      // "Status"/statusText column says - a raw attendance export commonly marks someone
      // "Present" for having clocked in at all, even on a day they clocked in late, which is
      // exactly the mismatch reported live (an employee showing "present, not late" in this
      // app while a device export's own late-minutes column said 60). Trusting the minutes
      // column instead of the status text column resolves that at the source.
      if (lateMinutes > 0) {
        status = "late";
      } else if (mapping.statusText !== undefined) {
        status = normalizeStatusText(r[mapping.statusText]);
      }
      if (!status && mapping.timeIn !== undefined) {
        const inMin = parseTimeToMinutes(r[mapping.timeIn]);
        if (inMin !== null) {
          const startMin = parseTimeToMinutes(settings.workStartTime) ?? 540;
          const diff = inMin - startMin;
          if (diff > (settings.lateGraceMinutes || 0)) {
            status = "late";
            // No explicit Late Mins column was mapped - derive an actual minutes-late figure
            // from the real clock-in time instead of leaving it blank, so payroll still sees a
            // number to deduct against.
            if (lateMinutes === undefined) lateMinutes = diff;
          } else {
            status = "present";
          }
        }
      }
      if (!status) status = "present"; // a punch/row exists, so treat as present by default

      results.push({ empId, date: isoDate, status, overtimeHours, lateMinutes: status === "late" ? (lateMinutes || 0) : 0 });
    });

    return { results, unmatchedNames: [...unmatchedNames], minDate, maxDate };
  }

  const built = step === 3 ? buildResult() : { results: [], unmatchedNames: [], minDate: null, maxDate: null };

  function goPreview() {
    const b = buildResult();
    setRange({ from: b.minDate || todayISO(), to: b.maxDate || todayISO() });
    setStep(3);
  }

  return (
    <div>
      {step === 1 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">{t("يشتغل مع أي مصدر: تقرير جهاز البصمة (وقت حضور/انصراف)، أو ملف يدوي فيه عمود \"الحالة\" جاهز.")}</p>
          <FileDropZone onFile={handleFile} fileName={fileName} />
          {error && <p className="mt-2 text-sm text-rose-600">{t(error)}</p>}
        </div>
      )}
      {step === 2 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">{t("حدد الأعمدة. لازم التاريخ + (كود الموظف أو اسمه على الأقل) — بعد كده إما \"الحالة الجاهزة\" أو \"وقت الحضور\" (عشان نحسب متأخر تلقائي). لو حددت عمود \"دقايق التأخير\" هيبقى هو الأساس دايمًا (حتى لو عمود \"الحالة\" في نفس الملف بيقول \"حاضر\")، وهيتحسب منه خصم في المرتب تلقائي زي ساعات الإضافي بالظبط.")}</p>
          <div className="space-y-2">
            {ATTENDANCE_IMPORT_FIELDS.map((f) => (
              <div key={f.key} className="flex items-center gap-3">
                <span className="w-64 shrink-0 text-sm text-slate-600">{t(f.label)}{f.required && <span className="text-rose-500"> *</span>}</span>
                <select className={inputCls} value={mapping[f.key] ?? ""} onChange={(e) => setMapping({ ...mapping, [f.key]: e.target.value === "" ? undefined : Number(e.target.value) })}>
                  <option value="">{t("— تجاهل —")}</option>
                  {headers.map((h, i) => <option key={i} value={i}>{h}</option>)}
                </select>
              </div>
            ))}
          </div>
          <p className="mt-3 text-xs text-slate-400">{t("{n} صف اتقروا من الملف. الموظف بيتطابق بالاسم بالظبط مع اللي مسجل في تاب الموظفين.", { n: rows.length })}</p>
          <div className="mt-4 flex justify-between border-t border-stone-200 pt-4">
            <button onClick={() => setStep(1)} className="flex items-center gap-1 rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50"><ArrowRight size={14} /> {t("رجوع")}</button>
            <button disabled={(mapping.employeeCode === undefined && mapping.employeeName === undefined) || mapping.date === undefined} onClick={goPreview} className="flex items-center gap-1 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900 disabled:opacity-40">{t("معاينة")} <ArrowLeft size={14} /></button>
          </div>
        </div>
      )}
      {step === 3 && (
        <div>
          <p className="mb-2 text-sm text-slate-500">{t("هيتسجل")} <strong>{built.results.length}</strong> {t("سجل حضور.")}</p>
          {built.unmatchedNames.length > 0 && (
            <div className="mb-3 rounded-lg bg-amber-50 px-3 py-2 text-xs text-amber-700">
              <strong>{built.unmatchedNames.length}</strong> {t("اسم في الملف ملقيناش موظف مطابق له في النظام (اتجاهلوا):")} {built.unmatchedNames.slice(0, 6).join("، ")}{built.unmatchedNames.length > 6 ? "..." : ""}
            </div>
          )}
          <div className="mb-4 rounded-lg bg-stone-50 p-3">
            <label className="flex items-center gap-2 text-sm font-medium text-slate-700">
              <input type="checkbox" checked={fillAbsence} onChange={(e) => setFillAbsence(e.target.checked)} />
              {t("علّم أي موظف نشط مالوش سجل في يوم شغل (خلال الفترة دي) كـ \"غايب\" تلقائيًا")}
            </label>
            {fillAbsence && (
              <div className="mt-2 grid grid-cols-2 gap-3">
                <Field label="من تاريخ"><input type="date" className={inputCls} value={range.from} onChange={(e) => setRange({ ...range, from: e.target.value })} /></Field>
                <Field label="إلى تاريخ"><input type="date" className={inputCls} value={range.to} onChange={(e) => setRange({ ...range, to: e.target.value })} /></Field>
              </div>
            )}
          </div>
          <div className="mt-4 flex justify-between border-t border-stone-200 pt-4">
            <button onClick={() => setStep(2)} className="flex items-center gap-1 rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50"><ArrowRight size={14} /> {t("رجوع")}</button>
            <button onClick={() => onImport(built.results, fillAbsence, range.from, range.to)} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Check size={15} /> {t("تأكيد الاستيراد")}</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= PENALTIES (+ warnings) ================= */
function PenaltiesTab({ employees, penalties, setPenalties, penaltyCaseNotes, setPenaltyCaseNotes, onPrintCase }) {
  const { t } = useLang();
  const [modalOpen, setModalOpen] = useState(false);
  const [caseModalOpen, setCaseModalOpen] = useState(false);
  const [activeCaseId, setActiveCaseId] = useState(null);
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("الكل");
  const [actionTypeFilter, setActionTypeFilter] = useState("الكل");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  function add(data) { setPenalties([{ id: uid("pen"), ...data }, ...penalties]); setModalOpen(false); }
  function remove(id) {

              <Field label="تاريخ بدء التحقيق رسميًا"><input type="date" className={inputCls} value={p.investigationOpenedDate || ""} onChange={(e) => onUpdate({ investigationOpenedDate: e.target.value })} /></Field>
