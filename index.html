// Firestore write batches cap at 500 operations; chunk defensively well under that so a
// large bulk-attendance import or bulk employee import never risks hitting the limit.
async function commitOpsChunked(ops, chunkSize = 400) {
  for (let i = 0; i < ops.length; i += chunkSize) {
    const batch = writeBatch(db);
    ops.slice(i, i + chunkSize).forEach((op) => {
      if (op.type === "delete") batch.delete(op.ref);
      else batch.set(op.ref, op.data);
    });
    await batch.commit();
  }
}

// Diffs a "next full array" (the shape every Tab component already produces, e.g.
// setEmployees([...employees, newOne])) against the live Firestore-backed array, and
// writes only what changed. Lets every existing add/edit/delete call site in the app work
// unmodified — only the setter passed down needed to change from localStorage to this.
async function syncCollection(colName, currentArr, nextArr) {
  const nextIds = new Set(nextArr.map((x) => x.id));
  const ops = [];
  nextArr.forEach((item) => {
    const { id, ...rest } = item;
    ops.push({ type: "set", ref: doc(db, colName, id), data: rest });
  });
  currentArr.forEach((item) => {
    if (!nextIds.has(item.id)) ops.push({ type: "delete", ref: doc(db, colName, item.id) });
  });
  await commitOpsChunked(ops);
}

// Attendance used to be one localStorage blob shaped { [date]: { [employeeId]: entry } }.
// For the employee portal's security rules to be able to grant "read your own attendance
// only" (a rule can't slice a map field down to one key), each (date, employeeId) pair is
// now its own Firestore document. This function still accepts the old nested shape — every
// existing caller (AttendanceTab, bulk import) is untouched — and diffs it into per-record
// set/delete ops against the live flat `attendanceRecords` list.
async function syncAttendanceRecords(nextAttendance, currentRecords) {
  const ops = [];
  const nextIds = new Set();
  Object.entries(nextAttendance).forEach(([date, dayRec]) => {
    Object.entries(dayRec || {}).forEach(([employeeId, entry]) => {
      if (!entry || !entry.status) return;
      const id = `${date}_${employeeId}`;
      nextIds.add(id);
      ops.push({ type: "set", ref: doc(db, "attendanceRecords", id), data: { date, employeeId, status: entry.status, overtimeHours: Number(entry.overtimeHours) || 0 } });
    });
  });
  currentRecords.forEach((r) => {
    const id = `${r.date}_${r.employeeId}`;
    if (!nextIds.has(id)) ops.push({ type: "delete", ref: doc(db, "attendanceRecords", id) });
  });
  await commitOpsChunked(ops);
}

// payrollMeta used to be one blob shaped { [yearMonth]: { [employeeId]: meta } }; each
// year-month is now its own doc (id = "YYYY-MM") so it stays a manageable document size.
async function syncPayrollMeta(nextObj, currentDocs) {
  const nextYms = new Set(Object.keys(nextObj));
  const ops = [];
  nextYms.forEach((ym) => ops.push({ type: "set", ref: doc(db, "payrollMeta", ym), data: nextObj[ym] }));
  currentDocs.forEach((d) => { if (!nextYms.has(d.id)) ops.push({ type: "delete", ref: doc(db, "payrollMeta", d.id) }); });
  await commitOpsChunked(ops);
}

// Creates the employee's portal login (Firebase Auth email/password account, using their

// instance — calling createUserWithEmailAndPassword on the PRIMARY app would sign the admin
// out of their own session and into the new employee account, which is exactly what must
// not happen here.
async function createEmployeeAuthAccount(employeeCode, pin) {
  const secondaryApp = initializeApp(firebaseConfig, `secondary-${Date.now()}`);
  try {
    const secondaryAuth = getAuth(secondaryApp);
    const cred = await createUserWithEmailAndPassword(secondaryAuth, employeeAuthEmail(employeeCode), pin);
    await signOut(secondaryAuth);
    return cred.user.uid;
  } finally {
    await deleteApp(secondaryApp);
  }
}

// Live-subscribes to a whole collection. `loaded` flips true after the first snapshot
// (including an empty one) so the app's loading screen doesn't hang forever on a fresh,
// empty database.
function useFirestoreCollection(colName) {
  const [data, setData] = useState([]);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    const unsub = onSnapshot(
      collection(db, colName),
      (snap) => { setData(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoaded(true); },
      (err) => { console.error(`[${colName}]`, err); setLoaded(true); }
    );
    return unsub;
  }, [colName]);
  return [data, loaded];
}

// Live-subscribes to a single doc (settings/main, orgChart/main), falling back to the
// given default when the doc doesn't exist yet (brand-new database) or a field is missing.
function useFirestoreDoc(colName, docId, defaultValue) {
  const [data, setData] = useState(defaultValue);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    const unsub = onSnapshot(
      doc(db, colName, docId),
      (snap) => { setData(snap.exists() ? { ...defaultValue, ...snap.data() } : defaultValue); setLoaded(true); },
      (err) => { console.error(`[${colName}/${docId}]`, err); setLoaded(true); }
    );
    return unsub;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [colName, docId]);
  return [data, loaded];
}

function computeTax(annualTaxable, brackets) {
  if (annualTaxable <= 0) return 0;
  let tax = 0, lower = 0;
  for (const b of brackets) {
    const upper = b.upTo === null ? Infinity : b.upTo;
    if (annualTaxable > lower) {
      const slice = Math.min(annualTaxable, upper) - lower;
      tax += slice * (b.rate / 100);
      lower = upper;
    }
    if (annualTaxable <= upper) break;
  }
  return Math.round(tax);
}

function getWeeklyOffDays(emp) {
  if (Array.isArray(emp.weeklyOffDays) && emp.weeklyOffDays.length) return emp.weeklyOffDays;
  if (emp.weeklyOffDay) return [emp.weeklyOffDay]; // backward compatibility with older single-day records
  return ["الجمعة"];
}

function isNonWorkday(emp, dateStr, holidays) {
  const dow = new Date(dateStr + "T00:00:00").getDay();
  const offDays = getWeeklyOffDays(emp);
  if (offDays.some((d) => weekdayIndex(d) === dow)) return "إجازة أسبوعية";
  const h = (holidays || []).find((x) => x.date === dateStr);
  if (h) return h.name || "عطلة رسمية";
  return null;
}

function parseTimeToMinutes(val) {
  if (val === null || val === undefined || val === "") return null;
  if (typeof val === "number") {
    // Excel time serial (fraction of a day) or already-minutes guard
    if (val > 0 && val < 1) return Math.round(val * 24 * 60);
    return null;
  }
  const s = String(val).trim();
  const m = s.match(/(\d{1,2}):(\d{2})/);
  if (!m) return null;
  let h = parseInt(m[1], 10);
  const min = parseInt(m[2], 10);
  if (/pm/i.test(s) && h < 12) h += 12;
  if (/am/i.test(s) && h === 12) h = 0;
  return h * 60 + min;
}

function excelSerialToISODate(val) {
  if (val === null || val === undefined || val === "") return null;
  if (typeof val === "number") {
    const utcDays = val - 25569;
    const d = new Date(utcDays * 86400 * 1000);
    return d.toISOString().slice(0, 10);
  }
  const s = String(val).trim();
  // try common formats: YYYY-MM-DD, DD/MM/YYYY, DD-MM-YYYY
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  const d = new Date(s);
  if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
  return null;
}

function advanceDeductionForMonth(adv, ym) {
  const start = adv.date.slice(0, 7);
  const [sy, sm] = start.split("-").map(Number);
  const [cy, cm] = ym.split("-").map(Number);
  const passed = (cy - sy) * 12 + (cm - sm);
  if (passed < 0 || passed >= adv.installments) return 0;
  return Math.round(adv.totalAmount / adv.installments);
}

function advanceRemaining(adv) {
  const nowYm = todayISO().slice(0, 7);
  let paidMonths = 0;
  const start = adv.date.slice(0, 7);
  const [sy, sm] = start.split("-").map(Number);
  const [cy, cm] = nowYm.split("-").map(Number);
  const passed = (cy - sy) * 12 + (cm - sm) + 1;
  paidMonths = Math.max(0, Math.min(passed, adv.installments));
  const paid = Math.round((adv.totalAmount / adv.installments) * paidMonths);
  return Math.max(0, adv.totalAmount - paid);
}

/* ================= DASHBOARD ================= */
function Dashboard({ employees, attendance, penalties, advances, settings, documents }) {
  const today = todayISO();
  const presentToday = employees.filter((e) => getAttEntry(attendance, today, e.id)?.status === "present").length;
  const absentToday = employees.filter((e) => getAttEntry(attendance, today, e.id)?.status === "absent").length;
  const lateToday = employees.filter((e) => getAttEntry(attendance, today, e.id)?.status === "late").length;

  const thisMonth = monthKey(today);
  const penaltiesTotal = penalties.filter((p) => monthKey(p.date) === thisMonth && p.actionType === "خصم مالي").reduce((s, p) => s + (Number(p.amount) || 0), 0);

  const alerts = [];
  const in30 = new Date(); in30.setDate(in30.getDate() + 30);
  employees.forEach((e) => {
    if (e.contractEnd) {
      const end = new Date(e.contractEnd);
      if (end >= new Date() && end <= in30) alerts.push({ tone: "amber", icon: <FileText size={14} />, text: `عقد ${e.name} بينتهي في ${e.contractEnd}` });
    }
    const takenLeave = Object.keys(attendance).filter((d) => yearKey(d) === yearKey(today) && getAttEntry(attendance, d, e.id)?.status === "leave").length;
    const remaining = (e.leaveEntitlement ?? settings.leaveDefaultDays) - takenLeave;
    if (remaining <= 2) alerts.push({ tone: "rose", icon: <CalendarCheck size={14} />, text: `رصيد إجازات ${e.name} باقيله ${remaining} يوم بس` });
    if (e.birthDate) {
      const bd = new Date(e.birthDate);
      const thisYearBd = new Date(new Date().getFullYear(), bd.getMonth(), bd.getDate());
      const diffDays = Math.round((thisYearBd - new Date()) / 86400000);
      if (diffDays >= 0 && diffDays <= 7) alerts.push({ tone: "teal", icon: <Cake size={14} />, text: `عيد ميلاد ${e.name} بعد ${diffDays === 0 ? "النهاردة" : diffDays + " يوم"}` });
    }
  });
  advances.forEach((a) => {
    const remaining = advanceRemaining(a);
    const emp = employees.find((e) => e.id === a.employeeId);
    if (remaining > 0 && remaining <= Math.round(a.totalAmount / a.installments)) {
      alerts.push({ tone: "emerald", icon: <HandCoins size={14} />, text: `سلفة ${emp?.name || ""} هتخلص القسط الجاي` });
    }
  });
  documents.forEach((d) => {
    if (d.expiryDate) {
      const exp = new Date(d.expiryDate);
      if (exp >= new Date() && exp <= in30) {
        const emp = employees.find((e) => e.id === d.employeeId);
        alerts.push({ tone: "amber", icon: <ShieldAlert size={14} />, text: `${d.name} بتاع ${emp?.name || ""} بينتهي في ${d.expiryDate}` });
      }
    }
  });

  return (
    <div>
      <SectionTitle eyebrow={new Date().toLocaleDateString("ar-EG", { weekday: "long", year: "numeric", month: "long", day: "numeric" })} title="لوحة المتابعة" />
      <div className="grid grid-cols-2 gap-4 md:grid-cols-4">
        <KpiCard label="إجمالي الموظفين" value={employees.length} icon={<Users size={18} />} tone="teal" />
        <KpiCard label="حاضر النهاردة" value={presentToday} icon={<Check size={18} />} tone="emerald" />
        <KpiCard label="غايب النهاردة" value={absentToday} icon={<UserX size={18} />} tone="rose" />
        <KpiCard label="متأخر النهاردة" value={lateToday} icon={<Clock size={18} />} tone="amber" />
      </div>

      <div className="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-3">
        <Card className="p-5 lg:col-span-2">
          <div className="mb-4 flex items-center justify-between">
            <h3 className="font-bold text-slate-800">حالة الحضور اليوم</h3>
          </div>
          {employees.length === 0 ? <EmptyState text="لسه معملتش أي موظف. ابدأ من تاب «الموظفون والعقود»." /> : (
            <div className="space-y-2">
              {employees.slice(0, 8).map((e) => {
                const st = getAttEntry(attendance, today, e.id)?.status;
                return (
                  <div key={e.id} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2">
                    <div><div className="text-sm font-medium text-slate-700">{e.name}</div><div className="text-xs text-slate-400">{e.position || "—"}</div></div>
                    {st ? <span className={`rounded-full border px-2.5 py-0.5 text-xs font-semibold ${STATUS_COLORS[st]}`}>{STATUS_LABELS[st]}</span>
                      : <span className="rounded-full border border-stone-200 px-2.5 py-0.5 text-xs text-slate-400">لسه ما اتسجلش</span>}
                  </div>
                );
              })}
            </div>
          )}
        </Card>

        <div className="space-y-6">
          <Card className="p-5">
            <div className="mb-3 flex items-center gap-2"><Bell size={16} className="text-amber-600" /><h3 className="font-bold text-slate-800">تنبيهات</h3></div>
            {alerts.length === 0 ? <p className="text-sm text-slate-400">مفيش تنبيهات دلوقتي.</p> : (
              <div className="space-y-2.5 max-h-64 overflow-y-auto">
                {alerts.map((a, i) => (
                  <div key={i} className={`flex items-start gap-2 rounded-lg border px-2.5 py-2 text-xs ${a.tone === "rose" ? "border-rose-200 bg-rose-50 text-rose-700" : a.tone === "amber" ? "border-amber-200 bg-amber-50 text-amber-700" : a.tone === "emerald" ? "border-emerald-200 bg-emerald-50 text-emerald-700" : "border-teal-200 bg-teal-50 text-teal-700"}`}>
                    {a.icon}<span>{a.text}</span>
                  </div>
                ))}
              </div>
            )}
          </Card>
          <Card className="p-5">
            <div className="mb-3 flex items-center gap-2"><TrendingDown size={16} className="text-rose-600" /><h3 className="font-bold text-slate-800">خصومات الجزاءات هذا الشهر</h3></div>
            <div className="text-2xl font-bold text-slate-800 tabular-nums">{fmtMoney(penaltiesTotal)} <span className="text-sm font-normal text-slate-400">ج.م</span></div>
          </Card>
        </div>
      </div>
    </div>
  );
}

function EmployeesTab({ employees, setEmployees, settings, onOpen, attendance, setAttendance, penalties, setPenalties, advances, setAdvances, documents, setDocuments, reviews, setReviews, payrollMeta, setPayrollMeta }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [importOpen, setImportOpen] = useState(false);
  const [mergeOpen, setMergeOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [query, setQuery] = useState("");
  const visible = employees.filter((e) => e.status === "active" || !e.status);
  const filtered = visible.filter((e) => e.name.includes(query) || (e.position || "").includes(query) || (e.department || "").includes(query));
  const dupGroups = useMemo(() => findDuplicateGroups(visible), [visible]);

  function save(data) {
    if (editing) setEmployees(employees.map((e) => (e.id === editing.id ? { ...editing, ...data } : e)));
    else setEmployees([...employees, { id: uid("emp"), status: "active", leaveEntitlement: settings.leaveDefaultDays, ...data }]);
    setModalOpen(false);
  }
  function markResigned(emp) {
    setEmployees(employees.map((e) => (e.id === emp.id ? { ...e, status: "resigned", resignationDate: todayISO() } : e)));
  }
  function importBulk(newRecords) {
    const byCode = {};
    const byName = {};
    employees.forEach((e) => {
      if (e.employeeCode) byCode[String(e.employeeCode).trim().toLowerCase()] = e.id;
      byName[e.name.trim().toLowerCase()] = e.id;
    });

    let updated = employees.slice();
    let updatedCount = 0, createdCount = 0;

    newRecords.forEach((rec) => {
      let matchId = null;
      if (rec.employeeCode) matchId = byCode[String(rec.employeeCode).trim().toLowerCase()];
      if (!matchId && rec.name) matchId = byName[rec.name.trim().toLowerCase()];

      if (matchId) {
        updated = updated.map((e) => (e.id === matchId ? { ...e, ...rec } : e));
        updatedCount++;
      } else {
        updated = [...updated, { id: uid("emp"), status: "active", leaveEntitlement: settings.leaveDefaultDays, ...rec }];
        createdCount++;
        // so that duplicate rows within the same import file also match each other
        if (rec.employeeCode) byCode[String(rec.employeeCode).trim().toLowerCase()] = updated[updated.length - 1].id;
        if (rec.name) byName[rec.name.trim().toLowerCase()] = updated[updated.length - 1].id;
      }
    });

    setEmployees(updated);
    setImportOpen(false);
    alert(`تم التحديث: ${updatedCount} موظف موجود، وإضافة ${createdCount} موظف جديد.`);
  }

  return (
    <div>
      <SectionTitle eyebrow={`${visible.length} موظف نشط`} title="الموظفون والعقود" action={
        <div className="flex items-center gap-2">
          {dupGroups.length > 0 && (
            <button onClick={() => setMergeOpen(true)} className="flex items-center gap-1.5 rounded-lg border border-amber-500 bg-amber-50 px-3.5 py-2 text-sm font-semibold text-amber-700 hover:bg-amber-100">
              <Users size={16} /> دمج المكررات ({dupGroups.length})
            </button>
          )}
          <button onClick={() => setImportOpen(true)} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3.5 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50">
            <Upload size={16} /> استيراد جماعي
          </button>
          <button onClick={() => { setEditing(null); setModalOpen(true); }} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">
            <Plus size={16} /> موظف جديد
          </button>
        </div>
      } />

      <div className="mb-4 flex items-center gap-2 rounded-lg border border-stone-300 bg-white px-3 py-2">
        <Search size={16} className="text-slate-400" />
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="دور بالاسم أو الوظيفة أو القسم..." className="w-full text-sm outline-none" />
      </div>

      {filtered.length === 0 ? <Card className="p-0"><EmptyState text={visible.length === 0 ? "لسه معملتش أي موظف." : "مفيش نتائج مطابقة."} /></Card> : (
        <Card className="overflow-hidden p-0">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-stone-200 bg-stone-50 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">
                <th className="px-4 py-3">كود</th><th className="px-4 py-3">الاسم</th><th className="px-4 py-3">الوظيفة</th><th className="px-4 py-3">القسم</th>
                <th className="px-4 py-3">نوع العقد</th><th className="px-4 py-3">نهاية العقد</th><th className="px-4 py-3">الراتب الأساسي</th><th className="px-4 py-3"></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((e) => (
                <tr key={e.id} className="border-b border-stone-100 last:border-0 hover:bg-stone-50">
                  <td className="px-4 py-3 text-slate-500 tabular-nums">{e.employeeCode || "—"}</td>

                      <button onClick={() => { setEditing(e); setModalOpen(true); }} className="rounded-md p-1.5 text-slate-400 hover:bg-stone-100 hover:text-teal-700"><Pencil size={15} /></button>

                    </div>
                  </td>
                </tr>

            </tbody>

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editing ? "تعديل بيانات موظف" : "إضافة موظف جديد"} wide>

          onDone={() => setMergeOpen(false)}

      </Modal>
    </div>
  );

// Arabic names typed by different people almost never match byte-for-byte even when
// they're clearly "the same name": hamza on/off the alef (أحمد vs احمد), alef maksura vs
// ya (يحيى vs يحيي), ta marbuta vs ha (سارة vs ساره), invisible tashkeel/tatweel/zero-width
// characters pasted in from Word or a fingerprint-device export, extra spaces, etc.
// A plain trim+lowercase (the old implementation) treats every one of those as a *different*
// person, which is why the "دمج المكررات" button was staying hidden even with obvious
// duplicates in the table. This normalizer folds all of that down to one comparable key.
function normalizeNameKey(name) {
  return String(name || "")
    .normalize("NFKC")
    // strip tashkeel / harakat / quranic annotation marks (U+064B-U+065F, U+0670)
    .replace(/[\u064B-\u065F\u0670]/g, "")
    // strip tatweel / kashida (U+0640)
    .replace(/\u0640/g, "")
    // strip zero-width & bidi control characters: ZWSP/ZWNJ/ZWJ/LRM/RLM (U+200B-U+200F) + BOM (U+FEFF)
    .replace(/[\u200B-\u200F\uFEFF]/g, "")
    // unify alef variants (U+0622 U+0623 U+0625 U+0671) -> alef (U+0627)
    .replace(/[\u0622\u0623\u0625\u0671]/g, "\u0627")
    // unify alef maksura (U+0649) -> ya (U+064A)
    .replace(/\u0649/g, "\u064A")
    // unify ta marbuta (U+0629) -> ha (U+0647) — common alt-spelling of the same name
    .replace(/\u0629/g, "\u0647")
    // drop standalone hamza (U+0621) — kept on ؤ/ئ since those change pronunciation
    .replace(/\u0621/g, "")
    // collapse all whitespace (incl. NBSP) and trim
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

const ARABIC_INDIC_DIGITS = "٠١٢٣٤٥٦٧٨٩";
// Employee codes suffer the same kind of cosmetic mismatch: Arabic-Indic digits from a
// fingerprint device export ("١٠٤٢") vs Western digits typed manually ("1042"), stray
// spaces/dashes, or inconsistent leading zeros ("007" vs "7"). Normalize before comparing.
function normalizeCode(code) {
  if (code === null || code === undefined) return "";
  let s = String(code).trim();
  if (!s) return "";
  s = s.replace(/[٠-٩]/g, (d) => String(ARABIC_INDIC_DIGITS.indexOf(d)));
  s = s.replace(/[^a-zA-Z0-9؀-ۿ]/g, "").toLowerCase();
  if (/^\d+$/.test(s)) s = String(parseInt(s, 10));
  return s;
}

function findDuplicateGroups(employees) {
  // union-find over employee ids: same normalized name OR same non-empty employeeCode => same group
  const parent = {};
  employees.forEach((e) => { parent[e.id] = e.id; });
  function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  function union(a, b) { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; }

  const byName = {};
  const byCode = {};
  employees.forEach((e) => {
    const nk = normalizeNameKey(e.name);
    if (nk) { if (byName[nk]) union(byName[nk], e.id); else byName[nk] = e.id; }
    const ck = normalizeCode(e.employeeCode);
    if (ck) { if (byCode[ck]) union(byCode[ck], e.id); else byCode[ck] = e.id; }
  });

  const groupsMap = {};
  employees.forEach((e) => {
    const root = find(e.id);
    if (!groupsMap[root]) groupsMap[root] = [];
    groupsMap[root].push(e);
  });
  return Object.values(groupsMap).filter((g) => g.length > 1);
}

function DuplicateMergeWizard({ groups, allEmployees, setEmployees, attendance, setAttendance, penalties, setPenalties, advances, setAdvances, documents, setDocuments, reviews, setReviews, payrollMeta, setPayrollMeta, onDone }) {
  const [keepChoice, setKeepChoice] = useState(() => {
    const init = {};
    groups.forEach((g, i) => { init[i] = g[0].id; });
    return init;
  });

  function applyMerge() {
    let employees = allEmployees.slice();
    let att = attendance;
    let pens = penalties;
    let advs = advances;
    let docs = documents;
    let revs = reviews;
    let pay = payrollMeta;

    groups.forEach((group, i) => {
      const keepId = keepChoice[i];
      const otherIds = group.map((e) => e.id).filter((id) => id !== keepId);
      if (otherIds.length === 0) return;

      // fill blanks on the kept record from duplicates
      const keptRecord = employees.find((e) => e.id === keepId);
      let mergedFields = {};
      for (const other of group) {
        if (other.id === keepId) continue;
        Object.keys(other).forEach((k) => {
          if (k === "id") return;
          const curVal = mergedFields[k] ?? keptRecord[k];
          if ((curVal === "" || curVal === undefined || curVal === null || curVal === 0) && other[k]) {
            mergedFields[k] = other[k];
          }
        });
      }
      employees = employees.map((e) => (e.id === keepId ? { ...e, ...mergedFields } : e));
      employees = employees.filter((e) => !otherIds.includes(e.id));

      // remap attendance: move a duplicate's day entry to keepId only if keepId has no entry that day
      const newAtt = {};
      Object.keys(att).forEach((date) => {
        const dayRec = { ...att[date] };
        otherIds.forEach((oid) => {
          if (dayRec[oid]) {
            if (!dayRec[keepId]) dayRec[keepId] = dayRec[oid];
            delete dayRec[oid];
          }
        });
        newAtt[date] = dayRec;
      });
      att = newAtt;

      // remap penalties / advances / documents / reviews: simple employeeId swap
      pens = pens.map((p) => (otherIds.includes(p.employeeId) ? { ...p, employeeId: keepId } : p));
      advs = advs.map((a) => (otherIds.includes(a.employeeId) ? { ...a, employeeId: keepId } : a));
      docs = docs.map((d) => (otherIds.includes(d.employeeId) ? { ...d, employeeId: keepId } : d));
      revs = revs.map((r) => (otherIds.includes(r.employeeId) ? { ...r, employeeId: keepId } : r));

      // remap payroll meta: for each month, move duplicate's meta to keepId only if keepId has none
      const newPay = {};
      Object.keys(pay).forEach((ym) => {
        const monthRec = { ...pay[ym] };
        otherIds.forEach((oid) => {
          if (monthRec[oid]) {
            if (!monthRec[keepId]) monthRec[keepId] = monthRec[oid];
            delete monthRec[oid];
          }
        });
        newPay[ym] = monthRec;
      });
      pay = newPay;
    });

    setEmployees(employees);
    setAttendance(att);
    setPenalties(pens);
    setAdvances(advs);
    setDocuments(docs);
    setReviews(revs);
    setPayrollMeta(pay);
    onDone();
  }

  if (groups.length === 0) return <EmptyState text="مفيش تكرارات دلوقتي." />;

  return (
    <div className="space-y-5">
      <p className="text-sm text-slate-500">لقينا <strong>{groups.length}</strong> مجموعة موظفين مكررين (بنفس الاسم أو نفس الكود). اختار مين يفضل من كل مجموعة — والبيانات (حضور، جزاءات، سلف...) هتتنقل تلقائي للي هيفضل.</p>
      <div className="max-h-96 space-y-4 overflow-y-auto">
        {groups.map((group, i) => (
          <div key={i} className="rounded-lg border border-amber-200 bg-amber-50/40 p-3">
            <div className="mb-2 text-xs font-semibold text-amber-700">مجموعة {i + 1} — {group.length} نسخ</div>
            <div className="space-y-1.5">
              {group.map((e) => (
                <label key={e.id} className="flex items-center gap-2 rounded-md border border-stone-200 bg-white px-2.5 py-1.5 text-sm">
                  <input type="radio" name={`grp-${i}`} checked={keepChoice[i] === e.id} onChange={() => setKeepChoice({ ...keepChoice, [i]: e.id })} />
                  <span className="font-medium text-slate-800">{e.name}</span>
                  <span className="text-xs text-slate-400">{e.employeeCode ? `كود: ${e.employeeCode}` : ""} {e.position ? `· ${e.position}` : ""} {e.salary ? `· ${fmtMoney(e.salary)} ج.م` : ""}</span>
                </label>
              ))}
            </div>
          </div>
        ))}
      </div>
      <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">
        <button onClick={onDone} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50">إلغاء</button>
        <button onClick={applyMerge} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Check size={15} /> تأكيد الدمج</button>
      </div>
    </div>
  );
}

/* ---- Bulk import: shared file parsing ---- */
function parseSpreadsheetFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array", cellDates: false });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        if (!rows.length) return reject(new Error("الملف فاضي"));
        const headers = rows[0].map((h) => String(h).trim());
        const dataRows = rows.slice(1).filter((r) => r.some((c) => c !== ""));
        resolve({ headers, dataRows });
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error("تعذّرت قراءة الملف"));
    reader.readAsArrayBuffer(file);
  });
}

function FileDropZone({ onFile, fileName }) {
  const inputRef = useRef(null);
  return (
    <div
      onClick={() => inputRef.current?.click()}
      onDragOver={(e) => e.preventDefault()}
      onDrop={(e) => { e.preventDefault(); if (e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]); }}
      className="flex cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-stone-300 bg-stone-50 py-10 text-center hover:border-teal-400 hover:bg-teal-50/40"
    >
      <FileSpreadsheet size={28} className="text-slate-400" />
      <div className="text-sm font-medium text-slate-600">{fileName || "دوس هنا أو اسحب ملف Excel / CSV"}</div>
      <div className="text-xs text-slate-400">xlsx, xls, csv</div>
      <input ref={inputRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={(e) => e.target.files[0] && onFile(e.target.files[0])} />
    </div>
  );
}

const EMPLOYEE_IMPORT_FIELDS = [
  { key: "employeeCode", label: "كود الموظف" },
  { key: "name", label: "الاسم", required: true },
  { key: "position", label: "الوظيفة" },
  { key: "department", label: "القسم" },
  { key: "phone", label: "رقم الموبايل" },
  { key: "nationalId", label: "الرقم القومي" },
  { key: "hireDate", label: "تاريخ التعيين (تاريخ)" },
  { key: "salary", label: "الراتب الأساسي (رقم)" },
  { key: "contractType", label: "نوع العقد" },
  { key: "weeklyOffDaysText", label: "أيام الإجازة الأسبوعية (مفصولة بفاصلة)" },
];

function EmployeeImportWizard({ employees, onImport, onCancel }) {
  const [step, setStep] = useState(1);
  const [fileName, setFileName] = useState("");
  const [headers, setHeaders] = useState([]);
  const [rows, setRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [error, setError] = useState("");

  async function handleFile(file) {
    setError("");
    setFileName(file.name);
    try {
      const { headers, dataRows } = await parseSpreadsheetFile(file);
      setHeaders(headers);
      setRows(dataRows);
      // best-effort auto-mapping by matching header text
      const auto = {};
      EMPLOYEE_IMPORT_FIELDS.forEach((f) => {
        const idx = headers.findIndex((h) => h.toLowerCase().includes(f.key.toLowerCase()) || h.includes(f.label.split(" ")[0]));
        if (idx !== -1) auto[f.key] = idx;
      });
      setMapping(auto);
      setStep(2);
    } catch (e) { setError(e.message); }
  }

  function buildResult() {
    return rows.map((r) => {
      const rec = {};
      EMPLOYEE_IMPORT_FIELDS.forEach((f) => {
        const idx = mapping[f.key];
        const raw = idx !== undefined && idx !== "" ? r[idx] : "";
        if (f.key === "salary") rec.salary = Number(raw) || 0;
        else if (f.key === "hireDate") rec.hireDate = excelSerialToISODate(raw) || todayISO();
        else if (f.key === "weeklyOffDaysText") rec.weeklyOffDays = raw ? String(raw).split(/[,،]/).map((s) => s.trim()).filter((d) => WEEKDAYS.includes(d)) : ["الجمعة"];
        else rec[f.key] = String(raw || "").trim();
      });
      return rec;
    }).filter((r) => r.name);
  }

  const preview = step === 3 ? buildResult() : [];
  const matchStats = useMemo(() => {
    if (step !== 3) return { updated: 0, created: 0 };
    const byCode = {}, byName = {};
    employees.forEach((e) => {
      if (e.employeeCode) byCode[String(e.employeeCode).trim().toLowerCase()] = true;
      byName[e.name.trim().toLowerCase()] = true;
    });
    let updated = 0, created = 0;
    preview.forEach((r) => {
      const matched = (r.employeeCode && byCode[String(r.employeeCode).trim().toLowerCase()]) || byName[r.name.trim().toLowerCase()];
      if (matched) updated++; else created++;
    });
    return { updated, created };
  }, [preview, employees, step]);

  return (
    <div>
      {step === 1 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">ارفع ملف فيه صف عناوين في الأول (الاسم، الوظيفة، الراتب...) وصف لكل موظف.</p>
          <FileDropZone onFile={handleFile} fileName={fileName} />
          {error && <p className="mt-2 text-sm text-rose-600">{error}</p>}
        </div>
      )}
      {step === 2 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">حدد أي عمود من ملفك يقابل كل حقل (سيبها فاضية لو مش موجودة).</p>
          <div className="max-h-96 space-y-2 overflow-y-auto">
            {EMPLOYEE_IMPORT_FIELDS.map((f) => (
              <div key={f.key} className="flex items-center gap-3">
                <span className="w-56 shrink-0 text-sm text-slate-600">{f.label}{f.required && <span className="text-rose-500"> *</span>}</span>
                <select className={inputCls} value={mapping[f.key] ?? ""} onChange={(e) => setMapping({ ...mapping, [f.key]: e.target.value === "" ? undefined : Number(e.target.value) })}>
                  <option value="">— تجاهل —</option>
                  {headers.map((h, i) => <option key={i} value={i}>{h}</option>)}
                </select>
              </div>
            ))}
          </div>
          <p className="mt-3 text-xs text-slate-400">{rows.length} صف اتقروا من الملف.</p>
          <div className="mt-4 flex justify-between border-t border-stone-200 pt-4">
            <button onClick={() => setStep(1)} className="flex items-center gap-1 rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50"><ArrowRight size={14} /> رجوع</button>
            <button disabled={mapping.name === undefined} onClick={() => setStep(3)} className="flex items-center gap-1 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900 disabled:opacity-40">معاينة <ArrowLeft size={14} /></button>
          </div>
        </div>
      )}
      {step === 3 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">هيتم معالجة <strong>{preview.length}</strong> صف — المطابقة بتتم بكود الموظف أو الاسم:</p>
          <div className="mb-3 flex gap-3">
            <div className="rounded-lg bg-sky-50 px-3 py-2 text-sm text-sky-700"><strong>{matchStats.updated}</strong> هيتحدّث (موجود بالفعل)</div>
            <div className="rounded-lg bg-emerald-50 px-3 py-2 text-sm text-emerald-700"><strong>{matchStats.created}</strong> هيتضاف كموظف جديد</div>
          </div>
          <div className="max-h-72 overflow-auto rounded-lg border border-stone-200">
            <table className="w-full text-xs">
              <thead><tr className="bg-stone-50"><th className="px-2 py-1.5 text-right">الاسم</th><th className="px-2 py-1.5 text-right">الوظيفة</th><th className="px-2 py-1.5 text-right">الراتب</th></tr></thead>
              <tbody>{preview.slice(0, 8).map((r, i) => (
                <tr key={i} className="border-t border-stone-100"><td className="px-2 py-1.5">{r.name}</td><td className="px-2 py-1.5">{r.position || "—"}</td><td className="px-2 py-1.5 tabular-nums">{fmtMoney(r.salary)}</td></tr>
              ))}</tbody>
            </table>
          </div>
          <div className="mt-4 flex justify-between border-t border-stone-200 pt-4">
            <button onClick={() => setStep(2)} className="flex items-center gap-1 rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50"><ArrowRight size={14} /> رجوع</button>
            <button onClick={() => onImport(preview)} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Check size={15} /> تأكيد ({matchStats.updated} تحديث + {matchStats.created} جديد)</button>
          </div>
        </div>
      )}
    </div>
  );
}

function EmployeeForm({ initial, settings, onSave, onCancel }) {
  const [form, setForm] = useState({
    employeeCode: initial?.employeeCode || "",
    name: initial?.name || "", position: initial?.position || "", department: initial?.department || "",
    phone: initial?.phone || "", nationalId: initial?.nationalId || "", hireDate: initial?.hireDate || todayISO(),
    salary: initial?.salary || "", contractType: initial?.contractType || CONTRACT_TYPES[0],
    contractStart: initial?.contractStart || todayISO(), contractEnd: initial?.contractEnd || "",
    birthDate: initial?.birthDate || "", weeklyOffDays: getWeeklyOffDays(initial || {}),
    leaveEntitlement: initial?.leaveEntitlement ?? settings.leaveDefaultDays,
  });
  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  function toggleOffDay(day) {
    setForm((f) => ({
      ...f,
      weeklyOffDays: f.weeklyOffDays.includes(day) ? f.weeklyOffDays.filter((d) => d !== day) : [...f.weeklyOffDays, day],

  function submit(e) { e.preventDefault(); if (!form.name.trim()) return; onSave({ ...form, salary: Number(form.salary) || 0, leaveEntitlement: Number(form.leaveEntitlement) || 0 }); }

  return (
    <form onSubmit={submit} className="space-y-4">
      <div className="grid grid-cols-2 gap-4">
        <Field label="كود الموظف (زي كود جهاز البصمة، اختياري)"><input className={inputCls} value={form.employeeCode} onChange={(e) => set("employeeCode", e.target.value)} /></Field>
        <Field label="الاسم بالكامل"><input required className={inputCls} value={form.name} onChange={(e) => set("name", e.target.value)} /></Field>
        <Field label="رقم الموبايل"><input className={inputCls} value={form.phone} onChange={(e) => set("phone", e.target.value)} /></Field>
        <Field label="الوظيفة"><input className={inputCls} value={form.position} onChange={(e) => set("position", e.target.value)} /></Field>
        <Field label="القسم">

          <datalist id="departments">{DEPARTMENTS_DEFAULT.map((d) => <option key={d} value={d} />)}</datalist>

        <Field label="الرقم القومي"><input className={inputCls} value={form.nationalId} onChange={(e) => set("nationalId", e.target.value)} /></Field>
        <Field label="تاريخ الميلاد"><input type="date" className={inputCls} value={form.birthDate} onChange={(e) => set("birthDate", e.target.value)} /></Field>
        <Field label="تاريخ التعيين"><input type="date" className={inputCls} value={form.hireDate} onChange={(e) => set("hireDate", e.target.value)} /></Field>

          <select className={inputCls} value={form.contractType} onChange={(e) => set("contractType", e.target.value)}>

          </select>
        </Field>
        <Field label="بداية العقد"><input type="date" className={inputCls} value={form.contractStart} onChange={(e) => set("contractStart", e.target.value)} /></Field>
        <Field label="نهاية العقد (اختياري)"><input type="date" className={inputCls} value={form.contractEnd} onChange={(e) => set("contractEnd", e.target.value)} /></Field>
        <div className="col-span-2">
          <span className="mb-1.5 block text-sm font-medium text-slate-600">أيام الإجازة الأسبوعية (اختر واحد أو أكتر)</span>
          <div className="flex flex-wrap gap-1.5">
            {WEEKDAYS.map((d) => (
              <button key={d} type="button" onClick={() => toggleOffDay(d)} className={`rounded-full border px-3 py-1 text-xs font-semibold ${form.weeklyOffDays.includes(d) ? "border-teal-700 bg-teal-800 text-white" : "border-stone-200 text-slate-500 hover:border-stone-300"}`}>{d}</button>
            ))}
          </div>
        </div>
        <Field label="رصيد الإجازات السنوي (يوم)"><input type="number" min="0" className={inputCls} value={form.leaveEntitlement} onChange={(e) => set("leaveEntitlement", e.target.value)} /></Field>
      </div>
      <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">
        <button type="button" onClick={onCancel} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50">إلغاء</button>
        <button type="submit" className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Save size={15} /> حفظ</button>
      </div>
    </form>
  );

/* ---- Employee profile (leave / documents / reviews) ---- */
function EmployeeProfileModal({ employee, onClose, attendance, documents, setDocuments, reviews, setReviews, settings, employees, setEmployees }) {
  const [sub, setSub] = useState("leave");
  const [pin, setPin] = useState("");
  const [portalBusy, setPortalBusy] = useState(false);
  const [portalMsg, setPortalMsg] = useState(null);

  async function enablePortal(e) {
    e.preventDefault();
    setPortalMsg(null);
    if (!employee.employeeCode) { setPortalMsg({ tone: "rose", text: "لازم تحدد كود الموظف الأول من زرار التعديل قبل ما تفعّل الدخول." }); return; }
    if (!/^\d{4,6}$/.test(pin)) { setPortalMsg({ tone: "rose", text: "الرقم السري لازم يكون من 4 لـ 6 أرقام." }); return; }
    setPortalBusy(true);
    try {
      const authUid = await createEmployeeAuthAccount(employee.employeeCode, pin);
      setEmployees(employees.map((e) => (e.id === employee.id ? { ...e, authUid } : e)));
      setPin("");
      setPortalMsg({ tone: "teal", text: "تم تفعيل الدخول. اديله كود الموظف والرقم السري ده." });
    } catch (err) {
      const already = err?.code === "auth/email-already-in-use";
      setPortalMsg({ tone: "rose", text: already ? "كود الموظف ده مستخدم بالفعل لحساب دخول موجود — لو ضاع الرقم السري، لازم تمسح الحساب من Firebase Console (Authentication → Users) وتجرب تاني." : "حصل خطأ أثناء التفعيل. جرب تاني." });
    } finally { setPortalBusy(false); }
  }
  const today = todayISO();
  const takenLeave = Object.keys(attendance).filter((d) => yearKey(d) === yearKey(today) && getAttEntry(attendance, d, employee.id)?.status === "leave").length;
  const entitlement = employee.leaveEntitlement ?? settings.leaveDefaultDays;
  const remaining = entitlement - takenLeave;

  const empDocs = documents.filter((d) => d.employeeId === employee.id);
  const empReviews = reviews.filter((r) => r.employeeId === employee.id).sort((a, b) => (a.date < b.date ? 1 : -1));

  const [docForm, setDocForm] = useState({ name: DOC_TYPES[0], expiryDate: "", status: "متوفر" });
  const [reviewForm, setReviewForm] = useState({ date: today, score: 3, reviewer: "", notes: "" });

  function addDoc(e) {
    e.preventDefault();
    setDocuments([...documents, { id: uid("doc"), employeeId: employee.id, ...docForm }]);
    setDocForm({ name: DOC_TYPES[0], expiryDate: "", status: "متوفر" });
  }
  function removeDoc(id) { setDocuments(documents.filter((d) => d.id !== id)); }
  function addReview(e) {
    e.preventDefault();
    setReviews([{ id: uid("rev"), employeeId: employee.id, ...reviewForm, score: Number(reviewForm.score) }, ...reviews]);
    setReviewForm({ date: today, score: 3, reviewer: "", notes: "" });
  }

    <Modal open onClose={onClose} title={`ملف ${employee.name}`} wide>
      <div className="mb-4 flex gap-2 border-b border-stone-200 pb-3">
        {[["leave", "الإجازات", <CalendarCheck size={14} />], ["documents", "المستندات", <FileText size={14} />], ["reviews", "التقييمات", <Star size={14} />], ["portal", "بوابة الموظف", <Lock size={14} />]].map(([k, l, icon]) => (
          <button key={k} onClick={() => setSub(k)} className={`flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium ${sub === k ? "bg-teal-800 text-white" : "text-slate-500 hover:bg-stone-100"}`}>{icon}{l}</button>
        ))}
      </div>

      {sub === "leave" && (
        <div>
          <div className="mb-4 grid grid-cols-3 gap-3">
            <div className="rounded-xl bg-stone-100 px-3 py-2.5 text-center"><div className="text-lg font-bold tabular-nums">{entitlement}</div><div className="text-[11px] text-slate-500">مستحق سنويًا</div></div>
            <div className="rounded-xl bg-sky-50 px-3 py-2.5 text-center"><div className="text-lg font-bold tabular-nums text-sky-700">{takenLeave}</div><div className="text-[11px] text-sky-600">مأخوذ هذا العام</div></div>
            <div className={`rounded-xl px-3 py-2.5 text-center ${remaining <= 2 ? "bg-rose-50" : "bg-emerald-50"}`}><div className={`text-lg font-bold tabular-nums ${remaining <= 2 ? "text-rose-700" : "text-emerald-700"}`}>{remaining}</div><div className={`text-[11px] ${remaining <= 2 ? "text-rose-600" : "text-emerald-600"}`}>الرصيد المتبقي</div></div>
          </div>
          <p className="text-xs text-slate-400">الأيام المأخوذة بتتحسب تلقائي من أيام «إجازة» المسجلة في تاب الحضور والانصراف خلال السنة الحالية.</p>
        </div>
      )}

      {sub === "documents" && (
        <div>
          <p className="mb-3 flex items-start gap-1.5 rounded-lg bg-stone-50 px-3 py-2 text-xs text-slate-500"><Info size={14} className="mt-0.5 shrink-0" />ده سجل متابعة بس (اسم المستند وحالته وتاريخ انتهائه لو موجود)، مش رفع ملفات فعلي.</p>
          <form onSubmit={addDoc} className="mb-4 grid grid-cols-4 gap-2">
            <select className={inputCls} value={docForm.name} onChange={(e) => setDocForm({ ...docForm, name: e.target.value })}>{DOC_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}</select>

      {sub === "portal" && (

              <p className="text-sm text-emerald-700">الموظف يقدر يدخل بوابته بكود الموظف <strong>{employee.employeeCode}</strong> والرقم السري اللي حددته له وقت التفعيل.</p>
              <p className="mt-2 text-xs text-emerald-600">ناسي الرقم السري؟ مفيش استرجاع مباشر — لازم تمسح حساب الدخول بتاعه من Firebase Console (Authentication → Users، ابحث عن <code dir="ltr">{employeeAuthEmail(employee.employeeCode)}</code>)، وبعدها ارجع هنا وفعّل الدخول تاني برقم سري جديد.</p>
            </div>
          ) : (
            <div>
              <p className="mb-3 flex items-start gap-1.5 rounded-lg bg-stone-50 px-3 py-2 text-xs text-slate-500"><Info size={14} className="mt-0.5 shrink-0" />بعد التفعيل، الموظف هيقدر يدخل بوابته الخاصة ويشوف رصيد إجازاته وسجل حضوره وجزاءاته بس — من غير أي صلاحية تعديل أو رؤية بيانات زمايله.</p>
              <form onSubmit={enablePortal} className="flex items-end gap-2">

                  {portalBusy ? <Loader2 size={14} className="animate-spin" /> : <LogIn size={14} />} تفعيل الدخول

}

/* ================= ATTENDANCE ================= */
function AttendanceTab({ employees, attendance, setAttendance, settings }) {
  const [date, setDate] = useState(todayISO());
  const [importOpen, setImportOpen] = useState(false);
  const dayRecord = attendance[date] || {};

  function importBulk(entries, fillAbsence, fromDate, toDate) {
    const next = { ...attendance };
    entries.forEach(({ empId, date: d, status, overtimeHours }) => {
      next[d] = { ...(next[d] || {}) };
      const current = next[d][empId] || { status: null, overtimeHours: 0 };
      next[d][empId] = { status: status || current.status, overtimeHours: overtimeHours ?? current.overtimeHours };
    });
    if (fillAbsence && fromDate && toDate) {
      let d = new Date(fromDate);
      const end = new Date(toDate);
      while (d <= end) {
        const ds = d.toISOString().slice(0, 10);
        employees.forEach((e) => {
          if (isNonWorkday(e, ds, settings.publicHolidays)) return;
          const existing = (next[ds] || {})[e.id];
          if (!existing || !existing.status) {
            next[ds] = { ...(next[ds] || {}) };
            next[ds][e.id] = { status: "absent", overtimeHours: existing?.overtimeHours || 0 };
          }
        });
        d.setDate(d.getDate() + 1);
      }
    }
    setAttendance(next);
    setImportOpen(false);
  }

  function setStatus(empId, status) {
    const current = getAttEntry(attendance, date, empId) || { status: null, overtimeHours: 0 };
    const nextDay = { ...dayRecord };
    if (current.status === status) nextDay[empId] = { status: null, overtimeHours: current.overtimeHours };
    else nextDay[empId] = { status, overtimeHours: current.overtimeHours };
    setAttendance({ ...attendance, [date]: nextDay });
  }
  function setOvertime(empId, hours) {
    const current = getAttEntry(attendance, date, empId) || { status: null, overtimeHours: 0 };
    setAttendance({ ...attendance, [date]: { ...dayRecord, [empId]: { status: current.status, overtimeHours: Number(hours) || 0 } } });
  }
  function shiftDay(delta) { const d = new Date(date); d.setDate(d.getDate() + delta); setDate(d.toISOString().slice(0, 10)); }

  const counts = employees.reduce((acc, e) => { const st = getAttEntry(attendance, date, e.id)?.status; if (st) acc[st] = (acc[st] || 0) + 1; return acc; }, { present: 0, absent: 0, late: 0, leave: 0 });

  return (
    <div>
      <SectionTitle eyebrow="سجل يومي" title="الحضور والانصراف" action={
        <div className="flex items-center gap-2">
          <button onClick={() => setImportOpen(true)} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50">
            <Upload size={15} /> استيراد من ملف
          </button>
          <button onClick={() => shiftDay(-1)} className="rounded-lg border border-stone-300 p-2 hover:bg-stone-50"><ChevronRight size={16} /></button>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className={`${inputCls} w-auto`} />
          <button onClick={() => shiftDay(1)} className="rounded-lg border border-stone-300 p-2 hover:bg-stone-50"><ChevronLeft size={16} /></button>
        </div>
      } />

      <div className="mb-5 grid grid-cols-4 gap-3">
        <div className="rounded-xl bg-emerald-50 px-4 py-3 text-emerald-700"><div className="text-xl font-bold tabular-nums">{counts.present}</div><div className="text-xs font-medium">حاضر</div></div>
        <div className="rounded-xl bg-rose-50 px-4 py-3 text-rose-700"><div className="text-xl font-bold tabular-nums">{counts.absent}</div><div className="text-xs font-medium">غايب</div></div>
        <div className="rounded-xl bg-amber-50 px-4 py-3 text-amber-700"><div className="text-xl font-bold tabular-nums">{counts.late}</div><div className="text-xs font-medium">متأخر</div></div>
        <div className="rounded-xl bg-sky-50 px-4 py-3 text-sky-700"><div className="text-xl font-bold tabular-nums">{counts.leave}</div><div className="text-xs font-medium">إجازة</div></div>
      </div>

      {employees.length === 0 ? <Card className="p-0"><EmptyState text="لسه معملتش أي موظف نشط." /></Card> : (
        <Card className="overflow-hidden p-0">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-stone-200 bg-stone-50 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">
                <th className="px-4 py-3">الموظف</th><th className="px-4 py-3">الحالة</th><th className="px-4 py-3">ساعات إضافي</th>
              </tr>
            </thead>
            <tbody>
              {employees.map((e) => {
                const nonWorkReason = isNonWorkday(e, date, settings.publicHolidays);
                const entry = getAttEntry(attendance, date, e.id);
                return (
                  <tr key={e.id} className="border-b border-stone-100 last:border-0 hover:bg-stone-50">
                    <td className="px-4 py-3 font-medium text-slate-800">{e.name}</td>
                    <td className="px-4 py-3">
                      {nonWorkReason ? <StampBadge tone="slate">{nonWorkReason}</StampBadge> : (
                        <div className="flex gap-1.5">
                          {Object.keys(STATUS_LABELS).map((st) => (
                            <button key={st} onClick={() => setStatus(e.id, st)} className={`rounded-full border px-2.5 py-1 text-xs font-semibold transition-colors ${entry?.status === st ? STATUS_COLORS[st] : "border-stone-200 text-slate-400 hover:border-stone-300"}`}>{STATUS_LABELS[st]}</button>
                          ))}
                        </div>
                      )}
                    </td>
                    <td className="px-4 py-3">
                      <input type="number" min="0" step="0.5" className="w-20 rounded-md border border-stone-200 px-2 py-1 text-xs tabular-nums outline-none focus:border-teal-500" value={entry?.overtimeHours || ""} onChange={(e2) => setOvertime(e.id, e2.target.value)} placeholder="0" />
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </Card>
      )}

      <Modal open={importOpen} onClose={() => setImportOpen(false)} title="استيراد الحضور والانصراف" wide>
        <AttendanceImportWizard employees={employees} settings={settings} onImport={importBulk} onCancel={() => setImportOpen(false)} />
      </Modal>
    </div>
  );
}

const ATTENDANCE_IMPORT_FIELDS = [
  { key: "employeeCode", label: "كود الموظف (أدق لو متاح، زي كود جهاز البصمة)" },
  { key: "employeeName", label: "اسم الموظف" },
  { key: "date", label: "التاريخ", required: true },
  { key: "timeIn", label: "وقت الحضور (لو متاح)" },
  { key: "timeOut", label: "وقت الانصراف (لو متاح، اختياري)" },
  { key: "statusText", label: "الحالة الجاهزة (لو الملف بيقولها مباشرة)" },
];

function AttendanceImportWizard({ employees, settings, onImport, onCancel }) {
  const [step, setStep] = useState(1);
  const [fileName, setFileName] = useState("");
  const [headers, setHeaders] = useState([]);
  const [rows, setRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [error, setError] = useState("");
  const [fillAbsence, setFillAbsence] = useState(true);
  const [range, setRange] = useState({ from: "", to: "" });

  async function handleFile(file) {
    setError("");
    setFileName(file.name);
    try {
      const { headers, dataRows } = await parseSpreadsheetFile(file);
      setHeaders(headers);
      setRows(dataRows);
      const auto = {};
      ATTENDANCE_IMPORT_FIELDS.forEach((f) => {
        const idx = headers.findIndex((h) => {
          const hl = h.toLowerCase();
          if (f.key === "employeeName") return hl.includes("name") || h.includes("اسم") || hl.includes("employee");
          if (f.key === "date") return hl.includes("date") || h.includes("تاريخ");
          if (f.key === "timeIn") return hl.includes("in") || h.includes("حضور") || h.includes("دخول");
          if (f.key === "timeOut") return hl.includes("out") || h.includes("انصراف") || h.includes("خروج");
          if (f.key === "statusText") return hl.includes("status") || h.includes("حالة");
          return false;
        });
        if (idx !== -1) auto[f.key] = idx;
      });
      setMapping(auto);
      setStep(2);
    } catch (e) { setError(e.message); }
  }

  function buildResult() {
    const nameToId = {};
    employees.forEach((e) => { nameToId[e.name.trim().toLowerCase()] = e.id; });
    const codeToId = {};
    employees.forEach((e) => { if (e.employeeCode) codeToId[String(e.employeeCode).trim().toLowerCase()] = e.id; });

    const results = [];
    const unmatchedNames = new Set();
    let minDate = null, maxDate = null;

    rows.forEach((r) => {
      const codeIdx = mapping.employeeCode;
      const nameIdx = mapping.employeeName;
      const dateIdx = mapping.date;
      if ((codeIdx === undefined && nameIdx === undefined) || dateIdx === undefined) return;

      let empId = null;
      let displayLabel = "";
      if (codeIdx !== undefined) {
        const rawCode = String(r[codeIdx] || "").trim();
        displayLabel = rawCode;
        empId = codeToId[rawCode.toLowerCase()];
      }
      if (!empId && nameIdx !== undefined) {
        const rawName = String(r[nameIdx] || "").trim();
        if (!displayLabel) displayLabel = rawName;
        empId = nameToId[rawName.toLowerCase()];
      }

      const isoDate = excelSerialToISODate(r[dateIdx]);
      if (!isoDate) return;
      if (!minDate || isoDate < minDate) minDate = isoDate;
      if (!maxDate || isoDate > maxDate) maxDate = isoDate;
      if (!empId) { unmatchedNames.add(displayLabel || "—"); return; }

      let status = null;
      if (mapping.statusText !== undefined) {
        status = normalizeStatusText(r[mapping.statusText]);
      }
      if (!status && mapping.timeIn !== undefined) {
        const inMin = parseTimeToMinutes(r[mapping.timeIn]);
        if (inMin !== null) {
          const startMin = parseTimeToMinutes(settings.workStartTime) ?? 540;
          status = inMin > startMin + (settings.lateGraceMinutes || 0) ? "late" : "present";
        }
      }
      if (!status) status = "present"; // a punch/row exists, so treat as present by default

      results.push({ empId, date: isoDate, status, overtimeHours: undefined });
    });

    return { results, unmatchedNames: [...unmatchedNames], minDate, maxDate };
  }

  const built = step === 3 ? buildResult() : { results: [], unmatchedNames: [], minDate: null, maxDate: null };

  function goPreview() {
    const b = buildResult();
    setRange({ from: b.minDate || todayISO(), to: b.maxDate || todayISO() });
    setStep(3);
  }

  return (
    <div>
      {step === 1 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">يشتغل مع أي مصدر: تقرير جهاز البصمة (وقت حضور/انصراف)، أو ملف يدوي فيه عمود "الحالة" جاهز.</p>
          <FileDropZone onFile={handleFile} fileName={fileName} />
          {error && <p className="mt-2 text-sm text-rose-600">{error}</p>}
        </div>
      )}
      {step === 2 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">حدد الأعمدة. لازم التاريخ + (كود الموظف أو اسمه على الأقل) — بعد كده إما "الحالة الجاهزة" أو "وقت الحضور" (عشان نحسب متأخر تلقائي).</p>
          <div className="space-y-2">
            {ATTENDANCE_IMPORT_FIELDS.map((f) => (
              <div key={f.key} className="flex items-center gap-3">
                <span className="w-64 shrink-0 text-sm text-slate-600">{f.label}{f.required && <span className="text-rose-500"> *</span>}</span>
                <select className={inputCls} value={mapping[f.key] ?? ""} onChange={(e) => setMapping({ ...mapping, [f.key]: e.target.value === "" ? undefined : Number(e.target.value) })}>
                  <option value="">— تجاهل —</option>
                  {headers.map((h, i) => <option key={i} value={i}>{h}</option>)}
                </select>
              </div>
            ))}
          </div>
          <p className="mt-3 text-xs text-slate-400">{rows.length} صف اتقروا من الملف. الموظف بيتطابق بالاسم بالظبط مع اللي مسجل في تاب الموظفين.</p>
          <div className="mt-4 flex justify-between border-t border-stone-200 pt-4">
            <button onClick={() => setStep(1)} className="flex items-center gap-1 rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50"><ArrowRight size={14} /> رجوع</button>
            <button disabled={(mapping.employeeCode === undefined && mapping.employeeName === undefined) || mapping.date === undefined} onClick={goPreview} className="flex items-center gap-1 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900 disabled:opacity-40">معاينة <ArrowLeft size={14} /></button>
          </div>
        </div>
      )}
      {step === 3 && (
        <div>
          <p className="mb-2 text-sm text-slate-500">هيتسجل <strong>{built.results.length}</strong> سجل حضور.</p>
          {built.unmatchedNames.length > 0 && (
            <div className="mb-3 rounded-lg bg-amber-50 px-3 py-2 text-xs text-amber-700">
              <strong>{built.unmatchedNames.length}</strong> اسم في الملف ملقيناش موظف مطابق له في النظام (اتجاهلوا): {built.unmatchedNames.slice(0, 6).join("، ")}{built.unmatchedNames.length > 6 ? "..." : ""}
            </div>
          )}
          <div className="mb-4 rounded-lg bg-stone-50 p-3">
            <label className="flex items-center gap-2 text-sm font-medium text-slate-700">
              <input type="checkbox" checked={fillAbsence} onChange={(e) => setFillAbsence(e.target.checked)} />
              علّم أي موظف نشط مالوش سجل في يوم شغل (خلال الفترة دي) كـ "غايب" تلقائيًا
            </label>
            {fillAbsence && (
              <div className="mt-2 grid grid-cols-2 gap-3">
                <Field label="من تاريخ"><input type="date" className={inputCls} value={range.from} onChange={(e) => setRange({ ...range, from: e.target.value })} /></Field>
                <Field label="إلى تاريخ"><input type="date" className={inputCls} value={range.to} onChange={(e) => setRange({ ...range, to: e.target.value })} /></Field>
              </div>
            )}
          </div>
          <div className="mt-4 flex justify-between border-t border-stone-200 pt-4">
            <button onClick={() => setStep(2)} className="flex items-center gap-1 rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50"><ArrowRight size={14} /> رجوع</button>
            <button onClick={() => onImport(built.results, fillAbsence, range.from, range.to)} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Check size={15} /> تأكيد الاستيراد</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= PENALTIES (+ warnings) ================= */
function PenaltiesTab({ employees, penalties, setPenalties }) {
  const [modalOpen, setModalOpen] = useState(false);
  function add(data) { setPenalties([{ id: uid("pen"), ...data }, ...penalties]); setModalOpen(false); }
  function remove(id) { setPenalties(penalties.filter((p) => p.id !== id)); }
  function empName(id) { return employees.find((e) => e.id === id)?.name || "موظف سابق"; }
  const sorted = [...penalties].sort((a, b) => (a.date < b.date ? 1 : -1));
  const toneFor = (t) => t === "خصم مالي" ? "rose" : t === "فصل" ? "rose" : t === "إنذار كتابي" ? "amber" : "slate";

  return (
    <div>
      <SectionTitle eyebrow={`${penalties.length} إجراء مسجل`} title="الجزاءات والإنذارات" action={
        <button onClick={() => setModalOpen(true)} disabled={employees.length === 0} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900 disabled:opacity-40">
          <Plus size={16} /> تسجيل إجراء
        </button>
      } />
      {sorted.length === 0 ? <Card className="p-0"><EmptyState text="مفيش إجراءات مسجلة." /></Card> : (
        <Card className="overflow-hidden p-0">
          <table className="w-full text-sm">
            <thead><tr className="border-b border-stone-200 bg-stone-50 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">
              <th className="px-4 py-3">الموظف</th><th className="px-4 py-3">التاريخ</th><th className="px-4 py-3">نوع الإجراء</th><th className="px-4 py-3">السبب</th><th className="px-4 py-3">الخصم</th><th className="px-4 py-3"></th>
            </tr></thead>
            <tbody>
              {sorted.map((p) => (
                <tr key={p.id} className="border-b border-stone-100 last:border-0 hover:bg-stone-50">
                  <td className="px-4 py-3 font-medium text-slate-800">{empName(p.employeeId)}</td>
                  <td className="px-4 py-3 text-slate-500">{p.date}</td>
                  <td className="px-4 py-3"><StampBadge tone={toneFor(p.actionType)}>{p.actionType}</StampBadge></td>
                  <td className="px-4 py-3 text-slate-600">{p.reason}</td>
                  <td className="px-4 py-3 tabular-nums font-semibold text-rose-600">{p.actionType === "خصم مالي" ? `-${fmtMoney(p.amount)} ج.م` : "—"}</td>
                  <td className="px-4 py-3"><button onClick={() => remove(p.id)} className="rounded-md p-1.5 text-slate-400 hover:bg-rose-50 hover:text-rose-600"><Trash2 size={15} /></button></td>
                </tr>
              ))}
            </tbody>
          </table>

/* ================= PAYROLL ================= */
function PayrollTab({ employees, attendance, penalties, payrollMeta, setPayrollMeta, advances, settings }) {
  const [ym, setYm] = useState(todayISO().slice(0, 7));
  const [payslipEmp, setPayslipEmp] = useState(null);
  const meta = payrollMeta[ym] || {};

  function setMetaFor(empId, patch) { setPayrollMeta({ ...payrollMeta, [ym]: { ...meta, [empId]: { ...(meta[empId] || {}), ...patch } } }); }

  function computeRow(e) {
    let absentDays = 0, overtimeHours = 0;
    Object.keys(attendance).forEach((date) => {
      if (monthKey(date) !== ym) return;
      const entry = getAttEntry(attendance, date, e.id);
      if (!entry) return;
      if (entry.status === "absent") absentDays++;
      overtimeHours += Number(entry.overtimeHours) || 0;
    });
    const base = Number(e.salary) || 0;
    const perDay = base / 30;
    const absenceDeduction = Math.round(perDay * absentDays);
    const monthPenalties = penalties.filter((p) => p.employeeId === e.id && monthKey(p.date) === ym && p.actionType === "خصم مالي");
    const penaltyDeduction = monthPenalties.reduce((s, p) => s + (Number(p.amount) || 0), 0);
    const empAdvances = advances.filter((a) => a.employeeId === e.id);
    const advanceDeduction = empAdvances.reduce((s, a) => s + advanceDeductionForMonth(a, ym), 0);
    const hourlyRate = base / (30 * 8);
    const overtimePay = Math.round(hourlyRate * settings.overtimeMultiplier * overtimeHours);
    const empMeta = meta[e.id] || {};
    const bonus = Number(empMeta.bonus) || 0;

    const insuranceDeduction = Math.round((base * settings.insuranceRate) / 100);
    const annualTaxable = Math.max(0, base * 12 - insuranceDeduction * 12 - settings.personalExemptionAnnual);
    const taxDeduction = Math.round(computeTax(annualTaxable, settings.taxBrackets) / 12);

    const net = base - absenceDeduction - penaltyDeduction - advanceDeduction - insuranceDeduction - taxDeduction + overtimePay + bonus;
    return { emp: e, absentDays, overtimeHours, absenceDeduction, penaltyDeduction, advanceDeduction, insuranceDeduction, taxDeduction, overtimePay, bonus, net, paid: !!empMeta.paid };
  }

  const rows = employees.map(computeRow);
  const totals = rows.reduce((acc, r) => {
    acc.base += Number(r.emp.salary) || 0;
    acc.deductions += r.absenceDeduction + r.penaltyDeduction + r.advanceDeduction + r.insuranceDeduction + r.taxDeduction;
    acc.additions += r.overtimePay + r.bonus;
    acc.net += r.net;
    return acc;
  }, { base: 0, deductions: 0, additions: 0, net: 0 });

  function shiftMonth(delta) {
    const [y, m] = ym.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    setYm(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  }

  return (
    <div>
      <SectionTitle eyebrow="كشف رواتب شهري" title="المرتبات" action={
        <div className="flex items-center gap-2">
          <button onClick={() => shiftMonth(-1)} className="rounded-lg border border-stone-300 p-2 hover:bg-stone-50"><ChevronRight size={16} /></button>
          <input type="month" value={ym} onChange={(e) => setYm(e.target.value)} className={`${inputCls} w-auto`} />
          <button onClick={() => shiftMonth(1)} className="rounded-lg border border-stone-300 p-2 hover:bg-stone-50"><ChevronLeft size={16} /></button>
        </div>
      } />

      <p className="mb-4 flex items-start gap-1.5 rounded-lg bg-amber-50 px-3 py-2 text-xs text-amber-700"><Info size={14} className="mt-0.5 shrink-0" />خصومات التأمينات والضريبة تقديرية حسب النسب في تاب «الإعدادات» — راجعها مع محاسبك قبل الاعتماد عليها فعليًا.</p>

      <div className="mb-5 grid grid-cols-4 gap-3">
        <div className="rounded-xl bg-stone-100 px-4 py-3"><div className="text-lg font-bold tabular-nums text-slate-800">{fmtMoney(totals.base)}</div><div className="text-xs font-medium text-slate-500">إجمالي الرواتب الأساسية</div></div>
        <div className="rounded-xl bg-rose-50 px-4 py-3"><div className="text-lg font-bold tabular-nums text-rose-700">-{fmtMoney(totals.deductions)}</div><div className="text-xs font-medium text-rose-600">إجمالي الخصومات</div></div>
        <div className="rounded-xl bg-emerald-50 px-4 py-3"><div className="text-lg font-bold tabular-nums text-emerald-700">+{fmtMoney(totals.additions)}</div><div className="text-xs font-medium text-emerald-600">إضافي ومكافآت</div></div>
        <div className="rounded-xl bg-teal-800 px-4 py-3"><div className="text-lg font-bold tabular-nums text-white">{fmtMoney(totals.net)}</div><div className="text-xs font-medium text-teal-100">صافي المستحق</div></div>
      </div>

      {rows.length === 0 ? <Card className="p-0"><EmptyState text="لسه معملتش أي موظف نشط." /></Card> : (
        <Card className="overflow-hidden p-0">
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="border-b border-stone-200 bg-stone-50 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">
                <th className="px-3 py-3">الموظف</th><th className="px-3 py-3">الأساسي</th><th className="px-3 py-3">غياب</th><th className="px-3 py-3">جزاءات</th>
                <th className="px-3 py-3">سلف</th><th className="px-3 py-3">تأمينات</th><th className="px-3 py-3">ضريبة</th><th className="px-3 py-3">إضافي</th>
                <th className="px-3 py-3">مكافأة</th><th className="px-3 py-3">الصافي</th><th className="px-3 py-3">الحالة</th><th className="px-3 py-3"></th>
              </tr></thead>
              <tbody>
                {rows.map((r) => (
                  <tr key={r.emp.id} className="border-b border-stone-100 last:border-0 hover:bg-stone-50">
                    <td className="px-3 py-3 font-medium text-slate-800 whitespace-nowrap">{r.emp.name}</td>
                    <td className="px-3 py-3 tabular-nums text-slate-600">{fmtMoney(r.emp.salary)}</td>
                    <td className="px-3 py-3 tabular-nums text-rose-600">-{fmtMoney(r.absenceDeduction)}</td>
                    <td className="px-3 py-3 tabular-nums text-rose-600">-{fmtMoney(r.penaltyDeduction)}</td>
                    <td className="px-3 py-3 tabular-nums text-rose-600">-{fmtMoney(r.advanceDeduction)}</td>
                    <td className="px-3 py-3 tabular-nums text-rose-600">-{fmtMoney(r.insuranceDeduction)}</td>
                    <td className="px-3 py-3 tabular-nums text-rose-600">-{fmtMoney(r.taxDeduction)}</td>
                    <td className="px-3 py-3 tabular-nums text-emerald-600">+{fmtMoney(r.overtimePay)}</td>
                    <td className="px-3 py-3">
                      <input type="number" min="0" className="w-16 rounded-md border border-stone-200 px-1.5 py-1 text-xs tabular-nums outline-none focus:border-teal-500" value={meta[r.emp.id]?.bonus || ""} onChange={(e) => setMetaFor(r.emp.id, { bonus: e.target.value })} placeholder="0" />
                    </td>
                    <td className="px-3 py-3 tabular-nums font-bold text-slate-800 whitespace-nowrap">{fmtMoney(r.net)}</td>
                    <td className="px-3 py-3">
                      <button onClick={() => setMetaFor(r.emp.id, { paid: !r.paid })} className={`whitespace-nowrap rounded-full border px-2.5 py-1 text-xs font-semibold ${r.paid ? "border-emerald-300 bg-emerald-50 text-emerald-700" : "border-stone-200 text-slate-400"}`}>{r.paid ? "تم الصرف" : "لسه"}</button>
                    </td>
                    <td className="px-3 py-3"><button onClick={() => setPayslipEmp(r)} className="rounded-md p-1.5 text-slate-400 hover:bg-teal-50 hover:text-teal-700"><Printer size={15} /></button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {payslipEmp && <PayslipModal row={payslipEmp} ym={ym} onClose={() => setPayslipEmp(null)} />}
    </div>
  );
}

// Same JSON shape as the old localStorage-era backup file (hr_employees, hr_attendance,
// hr_payroll, ...) so a file downloaded before the Firestore migration is still a valid
// import here — this doubles as the one-time migration tool: export from Firestore any
// time as a safety copy, or import an old localStorage backup straight into Firestore.
const BACKUP_KEYS = ["hr_employees", "hr_attendance", "hr_penalties", "hr_payroll", "hr_advances", "hr_documents", "hr_reviews", "hr_settings", "hr_orgchart"];

function BackupSection({ employees, attendance, penalties, payrollMeta, advances, documents, reviews, settings, orgChart, upd }) {
  const fileRef = useRef(null);
  const [msg, setMsg] = useState(null); // { tone: "teal" | "rose", text }
  const [busy, setBusy] = useState(false);

  function exportBackup() {
    const payload = {
      app: "hr-system", exportedAt: new Date().toISOString(),
      data: {
        hr_employees: employees, hr_attendance: attendance, hr_penalties: penalties,
        hr_payroll: payrollMeta, hr_advances: advances, hr_documents: documents,
        hr_reviews: reviews, hr_settings: settings, hr_orgchart: orgChart,
      },
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `hr-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setMsg({ tone: "teal", text: "تم تحميل نسخة احتياطية من قاعدة البيانات الحالية." });
  }

  async function handleImportFile(file) {
    setMsg(null);
    setBusy(true);
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const data = parsed && parsed.data ? parsed.data : parsed;
      const imported = [];
      if (data.hr_employees) { upd.employees(data.hr_employees); imported.push("الموظفين"); }
      if (data.hr_attendance) { upd.attendance(data.hr_attendance); imported.push("الحضور"); }
      if (data.hr_penalties) { upd.penalties(data.hr_penalties); imported.push("الجزاءات"); }
      if (data.hr_payroll) { upd.payrollMeta(data.hr_payroll); imported.push("المرتبات"); }
      if (data.hr_advances) { upd.advances(data.hr_advances); imported.push("السلف"); }
      if (data.hr_documents) { upd.documents(data.hr_documents); imported.push("المستندات"); }
      if (data.hr_reviews) { upd.reviews(data.hr_reviews); imported.push("التقييمات"); }
      if (data.hr_settings) { upd.settings({ ...DEFAULT_SETTINGS, ...data.hr_settings }); imported.push("الإعدادات"); }
      if (data.hr_orgchart) { upd.orgChart({ ...DEFAULT_ORG_CHART, ...data.hr_orgchart }); imported.push("الهيكل التنظيمي"); }
      if (imported.length === 0) { setMsg({ tone: "rose", text: "الملف ده مش نسخة احتياطية من النظام ده — مفيش أي بيانات معروفة فيه." }); return; }
      setMsg({ tone: "teal", text: `تم إرسال ${imported.length} من مجموعات البيانات لقاعدة البيانات — التحديث بيظهر تلقائي في الشاشة خلال ثواني.` });
    } catch (err) {
      setMsg({ tone: "rose", text: "تعذّر قراءة الملف — تأكد إنه ملف JSON صحيح من نسخة احتياطية سابقة." });
    } finally {
      setBusy(false);
      if (fileRef.current) fileRef.current.value = "";
    }
  }

  return (
    <Card className="mb-6 p-5">
      <h3 className="mb-1 flex items-center gap-2 font-bold text-slate-800"><Save size={16} /> النسخ الاحتياطي والاستعادة</h3>
      <p className="mb-4 text-xs text-slate-500">
        البيانات دلوقتي متخزنة في قاعدة بيانات Firestore المشتركة، مش في متصفحك بس. برضه خد نسخة احتياطية بانتظام واحفظها في مكان آمن — نفس الزرار بيستخدم كمان لاستيراد نسخة قديمة (حتى لو كانت من زمن التخزين المحلي) مباشرة في قاعدة البيانات.
      </p>
      <div className="flex flex-wrap items-center gap-2">
        <button onClick={exportBackup} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">
          <Save size={15} /> تحميل نسخة احتياطية (JSON)
        </button>
        <button onClick={() => fileRef.current?.click()} disabled={busy} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3.5 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50 disabled:opacity-50">
          {busy ? <Loader2 size={15} className="animate-spin" /> : <Upload size={15} />} استيراد نسخة احتياطية
        </button>
        <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={(e) => e.target.files[0] && handleImportFile(e.target.files[0])} />
      </div>
      {msg && <p className={`mt-3 text-xs font-medium ${msg.tone === "rose" ? "text-rose-600" : "text-teal-700"}`}>{msg.text}</p>}
    </Card>
  );
}

    const next = { ...form, publicHolidays: form.publicHolidays.filter((h) => h.date !== date) };

        <Card className="p-5">
          <h3 className="mb-4 flex items-center gap-2 font-bold text-slate-800"><Landmark size={16} /> التأمينات والإجازات والإضافي</h3>
          <div className="grid grid-cols-3 gap-4">
            <Field label="نسبة التأمينات على الموظف (%)"><input type="number" step="0.1" className={inputCls} value={form.insuranceRate} onChange={(e) => setForm({ ...form, insuranceRate: Number(e.target.value) })} /></Field>
            <Field label="مضاعف أجر الوقت الإضافي"><input type="number" step="0.1" className={inputCls} value={form.overtimeMultiplier} onChange={(e) => setForm({ ...form, overtimeMultiplier: Number(e.target.value) })} /></Field>
            <Field label="رصيد الإجازة السنوي الافتراضي (يوم)"><input type="number" className={inputCls} value={form.leaveDefaultDays} onChange={(e) => setForm({ ...form, leaveDefaultDays: Number(e.target.value) })} /></Field>
            <Field label="معاد بداية الدوام الرسمي"><input type="time" className={inputCls} value={form.workStartTime} onChange={(e) => setForm({ ...form, workStartTime: e.target.value })} /></Field>
            <Field label="فترة سماح قبل اعتباره متأخر (دقيقة)"><input type="number" className={inputCls} value={form.lateGraceMinutes} onChange={(e) => setForm({ ...form, lateGraceMinutes: Number(e.target.value) })} /></Field>

        </Card>

        <Card className="p-5">

          <Field label="الإعفاء الشخصي السنوي (ج.م)"><input type="number" className={inputCls} value={form.personalExemptionAnnual} onChange={(e) => setForm({ ...form, personalExemptionAnnual: Number(e.target.value) })} /></Field>

      <Card className="mt-6 p-5">
