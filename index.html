/* ---------- dashboard alerts + email notifications (pure, testable helpers) ---------- */

// Same "contract ending / low leave balance / upcoming birthday / advance almost paid off /
// document expiring" scan the Dashboard has always done, pulled out as a standalone function
// so it can feed BOTH the Dashboard's JSX list (via ALERT_META below) and the plain-text email
// digest (via formatAlertLine) from one source of truth, instead of two copies drifting apart.
// Returns structured data only - no icons, no translated text.
function computeAlerts(employees, attendance, advances, documents, settings, todayISOStr, extra = {}) {
  const { reviews = [], candidates = [], requests = [], salaryIncreases = [], penalties = [] } = extra;
  const alerts = [];
  const today = new Date(todayISOStr);
  const in30 = new Date(today); in30.setDate(in30.getDate() + 30);
  employees.forEach((e) => {
    if (e.contractEnd) {
      const end = new Date(e.contractEnd);
      if (end >= today && end <= in30) alerts.push({ type: "contractEnd", employeeId: e.id, employeeName: e.name, date: e.contractEnd });
    }
    const takenLeave = Object.keys(attendance).filter((d) => yearKey(d) === yearKey(todayISOStr) && getAttEntry(attendance, d, e.id)?.status === "leave").length;
    const remaining = (e.leaveEntitlement ?? settings.leaveDefaultDays) - takenLeave;
    if (remaining <= 2) alerts.push({ type: "leaveLow", employeeId: e.id, employeeName: e.name, remaining });
    if (e.birthDate) {
      const bd = new Date(e.birthDate);
      const thisYearBd = new Date(today.getFullYear(), bd.getMonth(), bd.getDate());
      const diffDays = Math.round((thisYearBd - today) / 86400000);
      if (diffDays >= 0 && diffDays <= 7) alerts.push({ type: "birthday", employeeName: e.name, diffDays });
    }
    // فترة الاختبار قربت تخلص أو خلصت من غير قرار تثبيت صريح - محتاجة قرار من الأدمن.
    const probation = computeProbationStatus(e, settings, todayISOStr);
    if (probation.status === "awaiting_decision") {
      alerts.push({ type: "probationEnding", employeeId: e.id, employeeName: e.name, date: probation.endDate, overdue: true });
    } else if (probation.status === "probation") {
      const diffDays = daysBetween(todayISOStr, probation.endDate);
      if (diffDays <= 7) alerts.push({ type: "probationEnding", employeeId: e.id, employeeName: e.name, date: probation.endDate, overdue: false });
    }
    // تقييم دوري مستحق (أو قرّب يستحق خلال أسبوعين) بناءً على دورة settings.reviewCycleMonths.
    const dueDate = nextReviewDueDate(e, reviews, settings);
    if (dueDate) {
      const diffDays = daysBetween(todayISOStr, dueDate);
      if (diffDays <= 14) alerts.push({ type: "reviewDue", employeeId: e.id, employeeName: e.name, date: dueDate, overdue: diffDays < 0 });
    }
    // عنده تقييم سنوي مكتمل ولسه مفيش قرار نهائي على زيادة مرتبه (لا موافقة ولا رفض) - ده
    // التنبيه السنوي المطلوب: بمجرد ما مديره يكمّل تقييمه السنوي، شؤون الأفراد بتلاقي تنبيه هنا
    // يفكّرها تحسب/تراجع اقتراح الزيادة، وبيفضل ظاهر حتى لو الاقتراح اتولّد بالفعل من تاب
    // "زيادات الرواتب" لكن لسه status: "pending" (يعني لسه مستني موافقة أو رفض) - عشان التنبيه
    // معناه "محتاج قرارك"، مش بس "اتولّد اقتراح ليه"، ويختفي بس لما يتاخد قرار فعلي.
    const annualReview = latestCompletedAnnualReview(reviews, e.id);
    if (annualReview) {
      const decided = salaryIncreases.some((s) => s.employeeId === e.id && s.year === annualReview.year && s.status !== "pending");
      if (!decided) alerts.push({ type: "salaryIncreaseDue", employeeId: e.id, employeeName: e.name, year: annualReview.year });
    }
  });
  advances.forEach((a) => {
    const remaining = advanceRemaining(a);
    const emp = employees.find((e) => e.id === a.employeeId);
    if (remaining > 0 && remaining <= Math.round(a.totalAmount / a.installments)) {
      alerts.push({ type: "advanceAlmostDone", employeeName: emp?.name || "" });
    }
  });
  documents.forEach((d) => {
    if (d.expiryDate) {
      const exp = new Date(d.expiryDate);
      if (exp >= today && exp <= in30) {
        const emp = employees.find((e) => e.id === d.employeeId);
        alerts.push({ type: "docExpiry", documentId: d.id, employeeName: emp?.name || "", docName: d.name, date: d.expiryDate });
      }
    }
  });
  // مرشح واقف في مرحلة "عرض عمل" من غير ما يتحوّل لموظف أو يترفض لمدة طويلة - "تعيين متأخر".
  candidates.forEach((c) => {
    if (c.stage === "عرض عمل" && c.appliedDate) {
      const diffDays = daysBetween(c.appliedDate, todayISOStr);
      if (diffDays >= 14) alerts.push({ type: "staleOffer", candidateId: c.id, candidateName: c.name, position: c.position || "", appliedDate: c.appliedDate, diffDays });
    }
  });
  // طلب من بوابة الموظف (إجازة/إذن تأخير/سلفة) واقف من غير قرار لمدة طويلة.
  requests.forEach((r) => {
    if ((r.status === "pending" || r.status === "pending_ceo") && r.createdAt) {
      const diffDays = daysBetween(r.createdAt.slice(0, 10), todayISOStr);
      if (diffDays >= 2) alerts.push({ type: "requestPending", employeeName: r.employeeName || "", kind: r.kind || "", diffDays });
    }
  });
  // قضية تأديبية (تحقيق) قربت تفوت أو فاتت موعدها القانوني - بدء التحقيق (7 أيام)، قفله (3
  // شهور)، أو إصدار القرار (30 يوم). بيظهر لو فات الموعد فعلاً، أو قرّب خلال نافذة تحذير مناسبة
  // لطول المهلة نفسها (3 أيام للمواعيد القصيرة، أسبوعين لقفل التحقيق الأطول).
  penalties.forEach((p) => {
    const d = computePenaltyCaseDeadline(p, todayISOStr);
    if (!d) return;
    const warnDays = d.stage === "closeInvestigation" ? 14 : 3;
    const diffDays = daysBetween(todayISOStr, d.deadline);
    if (d.overdue || diffDays <= warnDays) {
      const emp = employees.find((e) => e.id === p.employeeId);
      alerts.push({ type: "disciplinaryDeadline", employeeName: emp?.name || "", stage: d.stage, date: d.deadline, overdue: d.overdue, penaltyId: p.id });
    }
  });
  return alerts;
}

// Stable dismiss-key for one computeAlerts() item - used by "لوحة المتابعة"'s per-item delete
// button (dismissedAlerts collection) to decide which items are currently hidden. computeAlerts()
// regenerates alert objects fresh on every render (they have no Firestore id of their own), so
// the key is built from the fields that identify *this specific occurrence* of the alert: an
// employee/candidate/document/penalty id plus whatever value would change if the underlying
// condition is renewed (a new deadline date, a new low-balance figure, a new deadline stage...).
// That's deliberate - dismissing hides this exact occurrence, but if the condition re-fires with
// a different value later (e.g. leave balance goes back up then drops again to a new number,
// or a probation end date gets pushed), the key changes and the alert reappears instead of
// staying silently hidden forever. Returns null for a type that isn't dismissable from here
// (currently every rendered CommandCenterTab alert type has a key).
function alertDismissKey(a) {
  switch (a.type) {
    case "contractEnd": return `contractEnd:${a.employeeId}:${a.date}`;
    case "leaveLow": return `leaveLow:${a.employeeId}:${a.remaining}`;
    case "probationEnding": return `probationEnding:${a.employeeId}:${a.date}`;
    case "reviewDue": return `reviewDue:${a.employeeId}:${a.date}`;
    case "salaryIncreaseDue": return `salaryIncreaseDue:${a.employeeId}:${a.year}`;
    case "docExpiry": return `docExpiry:${a.documentId}:${a.date}`;
    case "staleOffer": return `staleOffer:${a.candidateId}:${a.appliedDate}`;
    case "disciplinaryDeadline": return `disciplinaryDeadline:${a.penaltyId}:${a.stage}`;
    default: return null;
  }
}

// One Arabic plain-text line per alert, used by the email digest - deliberately NOT run
// through t()/TRANSLATIONS: the digest is Arabic-only regardless of the admin's current UI
// language toggle, since this is an outbound message (like the rest of the app's stored HR
// data) rather than on-screen UI text.
function formatAlertLine(a) {
  switch (a.type) {
    case "contractEnd": return `- عقد ${a.employeeName} بينتهي في ${a.date}`;
    case "leaveLow": return `- رصيد إجازات ${a.employeeName} باقيله ${a.remaining} يوم بس`;
    case "birthday": return `- عيد ميلاد ${a.employeeName} بعد ${a.diffDays === 0 ? "النهاردة" : `${a.diffDays} يوم`}`;
    case "advanceAlmostDone": return `- سلفة ${a.employeeName} هتخلص القسط الجاي`;
    case "docExpiry": return `- ${a.docName} بتاع ${a.employeeName} بينتهي في ${a.date}`;
    case "probationEnding": return a.overdue ? `- فترة اختبار ${a.employeeName} خلصت (${a.date}) ومحتاجة قرار تثبيت` : `- فترة اختبار ${a.employeeName} هتخلص في ${a.date}`;
    case "reviewDue": return a.overdue ? `- تقييم ${a.employeeName} الدوري متأخر (كان مستحق ${a.date})` : `- تقييم ${a.employeeName} الدوري مستحق في ${a.date}`;
    case "salaryIncreaseDue": return `- تقييم ${a.employeeName} السنوي (${a.year}) مكتمل ولسه محتاج مراجعة اقتراح زيادة المرتب`;
    case "staleOffer": return `- عرض العمل لـ${a.candidateName} (${a.position}) واقف من غير رد من ${a.diffDays} يوم`;
    case "requestPending": return `- طلب ${REQUEST_KIND_LABELS[a.kind] || a.kind} بتاع ${a.employeeName} مستني قرار من ${a.diffDays} يوم`;
    case "disciplinaryDeadline": return `- قضية ${a.employeeName} التأديبية: ${PENALTY_DEADLINE_STAGE_LABELS[a.stage] || a.stage} - ${a.overdue ? `الموعد فات (${a.date})` : `الموعد ${a.date}`}`;
    default: return "";
  }
}
function formatAlertsForEmail(alerts) {
  return alerts.map(formatAlertLine).filter(Boolean).join("\n");
}

// Sends the current alert list as one digest email via EmailJS (client-only - no Cloud
// Functions / Blaze plan needed). Throws a descriptive error (surfaced by the Dashboard button)
// rather than calling emailjs.send with obviously-incomplete config, or silently doing nothing.
async function sendAlertsEmail(alerts, notifySettings) {
  const { notifyServiceId, notifyTemplateId, notifyPublicKey, notifyRecipientEmail } = notifySettings;
  if (!notifyServiceId || !notifyTemplateId || !notifyPublicKey) {
    throw new Error("NOT_CONFIGURED");
  }
  if (!notifyRecipientEmail) throw new Error("NO_RECIPIENT");
  if (alerts.length === 0) throw new Error("NO_ALERTS");
  const templateParams = {
    to_email: notifyRecipientEmail,
    subject: `تنبيهات شؤون الأفراد - ${todayISO()}`,
    alerts_count: alerts.length,
    alerts_text: formatAlertsForEmail(alerts),
  };
  await emailjs.send(notifyServiceId, notifyTemplateId, templateParams, { publicKey: notifyPublicKey });
}

// كارت عرض تقييم دوري مُهيكل (نصف سنوي/سنوي) - بيوريك حالة التقييم (لسه عند المدير / مكتمل)،
// شارة التقدير النهائي بلون حسب النطاق (نفس REVIEW_RATING_BANDS)، تفصيل بنود الـ KPIs
// والـ Competencies بندًا بندًا (تقييم الموظف لنفسه جنب تقييم المدير المباشر)، وملاحظات الطرفين.
// مستخدم في EmployeeProfileModal (تاب "التقييمات") ولاحقًا في EvaluationsTab (تاب "التقييمات"
// العام في الشريط الجانبي).
function PeriodicReviewCard({ r, onEdit, onRemove }) {
  const { t } = useLang();
  const isCompleted = r.status === "completed";
  const rating = r.finalRating || "";
  const ratingTone = rating.includes("ممتاز") ? "emerald" : rating.includes("جيد جداً") ? "teal" : rating.includes("مرضي") ? "amber" : rating ? "rose" : "slate";
  return (
    <div className="rounded-lg border border-stone-100 p-3 text-sm">
      <div className="mb-2 flex flex-wrap items-center justify-between gap-2">
        <div className="flex flex-wrap items-center gap-2">
          <StampBadge tone="slate">{r.reviewType} {r.year}</StampBadge>
          {isCompleted ? <StampBadge tone={ratingTone}>{rating}</StampBadge> : <StampBadge tone="amber">{t("مستني تقييم المدير")}</StampBadge>}
          {isCompleted && Number.isFinite(r.finalPercentage) && <span className="text-xs font-semibold tabular-nums text-slate-500">{Math.round(r.finalPercentage)}%</span>}
        </div>
        <div className="flex items-center gap-2 text-xs text-slate-400">
          {r.date && <span>{r.date}</span>}
          <button onClick={onEdit} className="text-slate-300 hover:text-teal-700"><Pencil size={13} /></button>
          <button onClick={onRemove} className="text-slate-300 hover:text-rose-600"><Trash2 size={13} /></button>
        </div>
      </div>

      {isCompleted && (
        <div className="mb-2 grid grid-cols-3 gap-2 text-center">
          <div className="rounded-lg bg-stone-50 px-2 py-1.5"><div className="text-sm font-bold tabular-nums text-slate-700">{(r.kpiContribution ?? 0).toFixed(2)}</div><div className="text-[10px] text-slate-400">{t("KPIs (60%)")}</div></div>
          <div className="rounded-lg bg-stone-50 px-2 py-1.5"><div className="text-sm font-bold tabular-nums text-slate-700">{(r.competencyContribution ?? 0).toFixed(2)}</div><div className="text-[10px] text-slate-400">{t("الكفاءات (40%)")}</div></div>
          <div className="rounded-lg bg-teal-50 px-2 py-1.5"><div className="text-sm font-bold tabular-nums text-teal-800">{(r.finalScoreOutOf5 ?? 0).toFixed(2)} / 5</div><div className="text-[10px] text-teal-600">{t("التقدير الإجمالي")}</div></div>
        </div>
      )}

      {r.kpis?.length > 0 && (
        <div className="mt-2 space-y-1 border-t border-stone-100 pt-2">
          <div className="mb-0.5 text-[11px] font-semibold text-slate-500">{t("مؤشرات الأداء (KPIs)")}</div>
          {r.kpis.map((k) => (
            <div key={k.id} className="flex flex-wrap items-center justify-between gap-1 text-xs text-slate-500">
              <span className="text-slate-600">{k.title || "—"} <span className="text-slate-400">({Math.round(Number(k.weight) || 0)}%)</span></span>
              <span>{t("موظف: {s} - مدير: {m}", { s: k.selfScore ?? "—", m: k.managerScore ?? "—" })}</span>
            </div>
          ))}
        </div>
      )}

      {r.competencies?.length > 0 && (
        <div className="mt-2 space-y-1 border-t border-stone-100 pt-2">
          <div className="mb-0.5 text-[11px] font-semibold text-slate-500">{t("الكفاءات (Competencies) - 40%")}</div>
          {r.competencies.map((c) => {
            const meta = COMPETENCY_ITEMS.find((ci) => ci.key === c.key);
            return (
              <div key={c.key} className="flex flex-wrap items-center justify-between gap-1 text-xs text-slate-500">
                <span className="text-slate-600">{meta ? t(meta.title) : c.key}</span>
                <span>{t("موظف: {s} - مدير: {m}", { s: c.selfScore ?? "—", m: c.managerScore ?? "—" })}</span>
              </div>
            );
          })}
        </div>
      )}

      {(r.employeeNotes || r.managerNotes) && (
        <div className="mt-2 space-y-1 border-t border-stone-100 pt-2 text-xs text-slate-500">
          {r.employeeNotes && <p>{t("ملاحظات الموظف: {n}", { n: r.employeeNotes })}</p>}
          {r.managerNotes && <p>{t("ملاحظات المدير: {n}", { n: r.managerNotes })}</p>}
        </div>
      )}
    </div>
  );
}

// المكان المخصص لـ Head of HR يشوف فيه كل حاجة معلّقة محتاجة قرار منه في مكان واحد - بدل ما
// يدوّر في كل تاب لوحده أو يدخل بوابة الموظف عشان يشوف الطلبات. بيجمع: طلبات الموظفين
// المعلّقة، فترات اختبار محتاجة قرار تثبيت، تقييمات دورية مستحقة، عقود قربت تنتهي، عروض عمل
// واقفة (تعيينات متأخرة)، مستندات قربت تنتهي، وتشيك ليست ضم/خروج لسه ناقصة.
function CommandCenterSection({ title, icon, tone, items, emptyText, children }) {
  const { t } = useLang();
  const toneCls = { rose: "text-rose-700", amber: "text-amber-700", teal: "text-teal-700", slate: "text-slate-700" }[tone] || "text-slate-700";
  return (
    <Card className="p-5">
      <div className="mb-3 flex items-center justify-between">
        <div className={`flex items-center gap-2 font-bold ${toneCls}`}>{icon}<h3>{t(title)}</h3></div>
        <span className="rounded-full bg-stone-100 px-2 py-0.5 text-xs font-semibold tabular-nums text-slate-500">{items.length}</span>
      </div>
      {items.length === 0 ? <p className="text-sm text-slate-400">{t(emptyText)}</p> : (
        <div className="max-h-72 space-y-2 overflow-y-auto">{items.map(children)}</div>
      )}
    </Card>
  );
}

// "لوحة المتابعة" - الشاشة الرئيسية بعد الدخول: ملخص الحضور اليوم فوق، وتحته كل حاجة معلّقة
// محتاجة قرار أو تنبيه من الـ Head of HR في مكان واحد (كانت شاشتين منفصلتين - "لوحة المتابعة"
// القديمة و"المعلقات" - اتدمجوا في واحدة بعد ما اتقالنا إن قائمة أسامي الحضور مش مهمة وإن
// التنبيهات محتاجة تبقى فيها زرار أكشن مباشر بدل ما تبقى نص بس).
function CommandCenterTab({ employees, allEmployees, orgChart, attendance, penalties, advances, documents, settings, reviews, candidates, requests, checklistItems, assets, salaryIncreases, dismissedAlerts, setDismissedAlerts, onOpenEmployee, onGoToTab }) {
  const { t, lang } = useLang();
  const today = todayISO();

  // مفاتيح التنبيهات اللي HR اختار يخفيها من هنا (زرار الـ delete) - مش بيمسح أي سجل فعلي،
  // بس بيمنع العنصر ده بالذات من الظهور تاني في لوحة المتابعة. لو نفس الحالة "اتجددت" بقيمة
  // مختلفة بعدين (alertDismissKey بيتغيّر)، التنبيه بيرجع يظهر لوحده من غير أي تدخل.
  const dismissedKeys = useMemo(() => new Set((dismissedAlerts || []).map((d) => d.id)), [dismissedAlerts]);
  function dismiss(key) {
    if (!key || dismissedKeys.has(key)) return;
    setDismissedAlerts([...(dismissedAlerts || []), { id: key, dismissedAt: today }]);
  }

  // كروت الحضور هنا كان تاريخها مثبّت على "النهاردة" فعليًا من غير أي طريقة تغيّره - ده اللي
  // كان بيخلي الأدمن يحس إن الأعداد "مش بتتغير بتغيير التاريخ". دلوقتي عندها تاريخ مستقل خاص
  // بيها (attendanceDate) مع نفس أزرار التنقل اللي في تاب "الحضور والانصراف" بالظبط - افتراضيًا
  // بيبدأ بالنهاردة الحقيقي، لكن ينفع يتغيّر لأي يوم من غير ما يأثر على `today` المستخدم في باقي
  // حسابات الصفحة (التنبيهات، مواعيد العقود...) اللي لازم تفضل مربوطة بالتاريخ الحقيقي دايمًا.
  const [attendanceDate, setAttendanceDate] = useState(today);
  function shiftAttendanceDate(delta) { const d = new Date(attendanceDate); d.setDate(d.getDate() + delta); setAttendanceDate(d.toISOString().slice(0, 10)); }
  // المتأخر لسه حاضر فعليًا (جه الشغل بس متأخر) - يتحسب جوه "حاضر"، و"متأخر" بيبقى بس توضيح
  // لكام واحد من الحاضرين ده كان متأخر (مش فئة منفصلة بتتشال من إجمالي الحاضرين). عشان كده
  // حاضر + غايب + إجازة + مرضي + مأمورية + عطلة لازم يساووا إجمالي الموظفين دايمًا.
  //
  // يوم عطلة رسمية/أسبوعية (isNonWorkday) بيتحسب "عطلة" لكل موظف عليه العطلة دي، بغض النظر عن
  // أي سجل حضور خام مسجّل على نفس اليوم (زي بيانات مزامنة قديمة من قبل ما العطلة تتسجل في
  // الإعدادات) - ده اللي كان بيخلي الهيدر يعرض "42 حاضر" ليوم متسجل رسميًا كعطلة. نفس القاعدة
  // اللي تاب الحضور والانصراف بيطبّقها في عرض الصف الفردي (نص "عطلة رسمية"/"إجازة أسبوعية" بدل
  // أزرار الحالة) - هنا بنطبّقها على أرقام الهيدر كمان عشان الاتنين يتفقوا مع بعض.
  const holidayToday = employees.filter((e) => isNonWorkday(e, attendanceDate, settings.publicHolidays)).length;
  const presentToday = employees.filter((e) => { if (isNonWorkday(e, attendanceDate, settings.publicHolidays)) return false; const s = getAttEntry(attendance, attendanceDate, e.id)?.status; return s === "present" || s === "late"; }).length;
  const absentToday = employees.filter((e) => !isNonWorkday(e, attendanceDate, settings.publicHolidays) && getAttEntry(attendance, attendanceDate, e.id)?.status === "absent").length;
  const lateToday = employees.filter((e) => !isNonWorkday(e, attendanceDate, settings.publicHolidays) && getAttEntry(attendance, attendanceDate, e.id)?.status === "late").length;
  const leaveOnDate = employees.filter((e) => !isNonWorkday(e, attendanceDate, settings.publicHolidays) && getAttEntry(attendance, attendanceDate, e.id)?.status === "leave").length;
  const sickOnDate = employees.filter((e) => !isNonWorkday(e, attendanceDate, settings.publicHolidays) && getAttEntry(attendance, attendanceDate, e.id)?.status === "sick").length;
  const missionOnDate = employees.filter((e) => !isNonWorkday(e, attendanceDate, settings.publicHolidays) && getAttEntry(attendance, attendanceDate, e.id)?.status === "mission").length;

  const thisMonth = monthKey(today);
  const penaltiesTotal = penalties.filter((p) => monthKey(p.date) === thisMonth && p.actionType === "خصم مالي").reduce((s, p) => s + (Number(p.amount) || 0), 0);

  const alerts = useMemo(
    () => computeAlerts(employees, attendance, advances, documents, settings, today, { reviews, candidates, requests, salaryIncreases, penalties }),
    [employees, attendance, advances, documents, settings, today, reviews, candidates, requests, salaryIncreases, penalties]
  );
  // بيرجع بس التنبيهات اللي لسه مش متعمّلها dismiss (alertDismissKey بيرجع null لأي نوع مالوش
  // مفتاح مُعرّف - عمليًا كل الأنواع المعروضة هنا عندها واحد، فده حماية زيادة مش سلوك متوقع).
  const byType = (type) => alerts.filter((a) => a.type === type && !dismissedKeys.has(alertDismissKey(a)));

  const pendingRequests = requests.filter((r) => r.status === "pending" || r.status === "pending_ceo")
    .filter((r) => !dismissedKeys.has(`request:${r.id}`))
    .sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1));

  // بنجمّع بمفتاح (الموظف + نوع الخطوة) مش الموظف لوحده - عشان لو نفس الموظف كان عنده خطوات
  // ضم ناقصة وخروج ناقصة في نفس الوقت (نادر بس ممكن)، الاتنين يظهروا كصفين منفصلين بدل ما
  // واحد يمسح التاني. بنحتفظ بنص كل خطوة ناقصة (texts) عشان يظهر جوه القسم، مش بس العدد.
  const incompleteChecklists = useMemo(() => {
    const byKey = {};
    checklistItems.filter((c) => !c.done).forEach((c) => {
      const key = `${c.employeeId}__${c.type}`;
      if (!byKey[key]) byKey[key] = { employeeId: c.employeeId, type: c.type, count: 0, texts: [] };
      byKey[key].count++;
      byKey[key].texts.push(c.text);
    });
    // مفتاح الإخفاء بيتضمن نصوص البنود الناقصة نفسها (مرتّبة) - لو نفس البنود لسه ناقصة يفضل
    // مخفي، لكن لو بند اتعمل واتظهر بند جديد بدل منه (مجموعة مختلفة)، ده "تجدد" للحالة فيرجع يظهر.
    return Object.values(byKey)
      .map((c) => ({ ...c, dismissKey: `checklist:${c.employeeId}:${c.type}:${[...c.texts].sort().join("|")}` }))
      .filter((c) => !dismissedKeys.has(c.dismissKey));
  }, [checklistItems, dismissedKeys]);

  // أي عهدة (لابتوب، يونيفورم...) لسه ما اتسجّلش استرجاعها - لأي موظف حتى لو لسه شغال، مش بس
  // اللي استقالوا (المستخدم طلب كده صراحة: "أي عهدة لسه مش مرجّعة، لأي موظف").
  const outstandingAssets = useMemo(() => (assets || []).filter((a) => !a.returnedDate && !dismissedKeys.has(`asset:${a.id}`)), [assets, dismissedKeys]);

  function findEmployee(id) { return employees.find((e) => e.id === id); }
  function findEmployeeByName(name) { return employees.find((e) => e.name === name); }
  // بيدوّر في كل الموظفين (بما فيهم أي حد مش "نشط" حاليًا) - مش بس النشطين زي findEmployee.
  // مستخدمة تحديدًا لتحليل المسؤول عن قرار معلّق (رئيس قسم أو الرئيس التنفيذي)، عشان أي فلترة
  // بحالة الموظف ميبقاش سبب إن السيستم "يفقد" حد لسه مسؤول عن قرارات فعليًا.
  function findAnyEmployee(id) { return (allEmployees || employees).find((e) => e.id === id); }

  return (
    <div>
      <SectionTitle eyebrow={new Date().toLocaleDateString(lang === "en" ? "en-GB" : "ar-EG", { weekday: "long", year: "numeric", month: "long", day: "numeric" })} title="لوحة المتابعة" />

      <div className="mb-3 flex items-center justify-end gap-2">
        <span className="text-xs font-medium text-slate-400">{t("بيانات حضور يوم:")}</span>
        <button onClick={() => shiftAttendanceDate(-1)} className="rounded-lg border border-stone-300 p-1.5 hover:bg-stone-50">{lang === "en" ? <ChevronLeft size={14} /> : <ChevronRight size={14} />}</button>
        <input type="date" value={attendanceDate} onChange={(e) => setAttendanceDate(e.target.value)} className={`${inputCls} w-auto py-1.5 text-xs`} />
        <button onClick={() => shiftAttendanceDate(1)} className="rounded-lg border border-stone-300 p-1.5 hover:bg-stone-50">{lang === "en" ? <ChevronRight size={14} /> : <ChevronLeft size={14} />}</button>
        {attendanceDate !== today && (
          <button onClick={() => setAttendanceDate(today)} className="rounded-lg border border-teal-700 px-2.5 py-1.5 text-xs font-semibold text-teal-800 hover:bg-teal-50">{t("النهاردة")}</button>
        )}
      </div>

      <div className="grid grid-cols-2 gap-4 md:grid-cols-4 xl:grid-cols-8">
        <KpiCard label="إجمالي الموظفين" value={employees.length} icon={<Users size={18} />} tone="teal" />
        <KpiCard label="حاضر" value={presentToday} icon={<Check size={18} />} tone="emerald" />
        <KpiCard label="غايب" value={absentToday} icon={<UserX size={18} />} tone="rose" />
        <KpiCard label="متأخر" value={lateToday} icon={<Clock size={18} />} tone="amber" />
        <KpiCard label="إجازة" value={leaveOnDate} icon={<CalendarCheck size={18} />} tone="sky" />
        <KpiCard label="مرضي" value={sickOnDate} icon={<AlertTriangle size={18} />} tone="purple" />
        <KpiCard label="مأمورية" value={missionOnDate} icon={<Network size={18} />} tone="indigo" />
        <KpiCard label="عطلة" value={holidayToday} icon={<CalendarOff size={18} />} tone="slate" />
      </div>

      <Card className="mt-4 flex flex-wrap items-center justify-between gap-3 p-4">
        <div className="flex items-center gap-2 text-sm">
          <TrendingDown size={16} className="text-rose-600" />
          <span className="text-slate-500">{t("خصومات الجزاءات هذا الشهر:")}</span>
          <span className="font-bold text-slate-800 tabular-nums">{fmtMoney(penaltiesTotal)} {t("ج.م")}</span>
        </div>
      </Card>

      <div className="mt-6 grid grid-cols-1 gap-5 lg:grid-cols-2">
        <CommandCenterSection title="طلبات الموظفين المعلّقة" icon={<ClipboardList size={16} />} tone="rose" items={pendingRequests} emptyText="مفيش طلبات معلّقة دلوقتي.">
          {(r) => {
            // approverId بيتحدث أوتوماتيك لما الطلب يتصعّد لـ pending_ceo (بيبقى id الرئيس
            // التنفيذي بدل رئيس القسم) - فهو دايمًا المسؤول الحالي عن القرار، مهما كانت الحالة.
            // بندوّر في كل الموظفين (findAnyEmployee) مش النشطين بس - المسؤول (رئيس قسم أو رئيس
            // تنفيذي) ممكن يكون حالته في السيستم مش "نشط" بالظبط، وده لازم مايمنعش ظهور اسمه هنا.
            // لو approverId المسجّل على الطلب نفسه (وقت إنشائه) مبقاش بيتطابق مع حد موجود دلوقتي
            // (بيانات قديمة، أو الهيكل التنظيمي اتغيّر بعد كده) - بنرجع نحسب المسؤول لايف من
            // الهيكل التنظيمي الحالي بدل ما نسيب الطلب من غير مسؤول للأبد.
            const responsible = findAnyEmployee(r.approverId) || (() => {
              const requester = findAnyEmployee(r.employeeId) || findEmployeeByName(r.employeeName);
              if (!requester) return null;
              if (r.status === "pending_ceo") return findAnyEmployee(orgChart.ceoEmployeeId);
              return resolveDirectManager(requester, orgChart, allEmployees || employees);
            })();
            const msg = `مرحبًا ${responsible?.name || ""}،\nطلب ${REQUEST_KIND_LABELS[r.kind] || r.kind} من ${r.employeeName} مستني قرارك من ${daysBetween(r.createdAt.slice(0, 10), today)} يوم - يا ريت تراجعه من بوابة الموظف.`;
            const emailSubject = t("طلب {kind} مستني قرارك", { kind: t(REQUEST_KIND_LABELS[r.kind] || r.kind) });
            return (
              <div key={r.id} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
                <div>
                  <div className="font-medium text-slate-700">{r.employeeName}</div>
                  <div className="mt-1 flex items-center gap-2">
                    <StampBadge tone="amber">{t(REQUEST_KIND_LABELS[r.kind] || r.kind)}</StampBadge>
                    <span className="text-xs text-slate-400">{t(REQUEST_STATUS_LABELS[r.status] || r.status)}{responsible ? ` - ${responsible.name}` : ""}</span>
                  </div>
                </div>
                <div className="flex shrink-0 items-center gap-1.5">
                  {responsible
                    ? <RemindButton href={buildAlertWhatsAppLink(responsible, msg)} />
                    : <span className="text-[11px] text-amber-600">{t("تعذّر تحديد المسؤول - راجع الهيكل التنظيمي")}</span>}
                  {responsible && <EmailButton href={buildAlertEmailLink(responsible, emailSubject, msg)} />}
                  <DismissButton onClick={() => dismiss(`request:${r.id}`)} />
                </div>
              </div>
            );
          }}
        </CommandCenterSection>

        <CommandCenterSection title="فترة اختبار محتاجة قرار" icon={<ShieldAlert size={16} />} tone="amber" items={byType("probationEnding")} emptyText="مفيش فترات اختبار قربت تخلص دلوقتي.">
          {(a, i) => {
            const emp = findEmployeeByName(a.employeeName);
            return (
              <div key={i} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
                <div>
                  <div className="font-medium text-slate-700">{a.employeeName}</div>
                  <StampBadge tone={a.overdue ? "rose" : "amber"}>{a.overdue ? t("خلصت في {date}", { date: a.date }) : t("هتخلص في {date}", { date: a.date })}</StampBadge>
                </div>
                <div className="flex shrink-0 items-center gap-1.5">
                  <ReviewButton onClick={() => emp && onOpenEmployee(emp.id)} />
                  <DismissButton onClick={() => dismiss(alertDismissKey(a))} />
                </div>
              </div>
            );
          }}
        </CommandCenterSection>

        <CommandCenterSection title="قضايا تأديبية محتاجة إجراء" icon={<Gavel size={16} />} tone="rose" items={byType("disciplinaryDeadline")} emptyText="مفيش قضايا تأديبية قربت تفوت موعدها القانوني.">
          {(a, i) => (
            <div key={i} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
              <div>
                <div className="font-medium text-slate-700">{a.employeeName}</div>
                <div className="mt-1 flex items-center gap-2">
                  <StampBadge tone={a.overdue ? "rose" : "amber"}>{t(PENALTY_DEADLINE_STAGE_LABELS[a.stage] || a.stage)}</StampBadge>
                  <span className="text-xs text-slate-400">{a.overdue ? t("الموعد فات ({date})", { date: a.date }) : t("الموعد {date}", { date: a.date })}</span>
                </div>
              </div>
              <div className="flex shrink-0 items-center gap-1.5">
                <ReviewButton onClick={() => onGoToTab("penalties")} />
                <DismissButton onClick={() => dismiss(alertDismissKey(a))} />
              </div>
            </div>
          )}
        </CommandCenterSection>

        <CommandCenterSection title="تقييمات دورية مستحقة" icon={<Star size={16} />} tone="teal" items={byType("reviewDue")} emptyText="مفيش تقييمات مستحقة دلوقتي.">
          {(a, i) => {
            const emp = findEmployeeByName(a.employeeName);
            // التقييم الدوري بيعمله مدير الموظف المباشر (رئيس قسمه) مش الـ HR نفسه - فالتنبيه
            // بيروح للمدير، زي بالظبط طلبات الموظفين المعلّقة.
            const manager = emp ? resolveDirectManager(emp, orgChart, allEmployees || employees) : null;
            const msg = manager && emp ? `مرحبًا ${manager.name}،\nحان موعد التقييم الدوري لـ ${emp.name} (${a.overdue ? "متأخر - كان مستحق" : "مستحق"} ${a.date}) - يا ريت تتابعه.` : "";
            return (
              <div key={i} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
                <div>
                  <div className="font-medium text-slate-700">{a.employeeName}</div>
                  <div className="mt-1 flex items-center gap-2">
                    <StampBadge tone={a.overdue ? "rose" : "teal"}>{a.overdue ? t("متأخر - كان مستحق {date}", { date: a.date }) : t("مستحق {date}", { date: a.date })}</StampBadge>
                    {manager && <span className="text-xs text-slate-400">- {manager.name}</span>}
                  </div>
                </div>
                <div className="flex shrink-0 items-center gap-1.5">
                  {manager
                    ? <RemindButton href={buildAlertWhatsAppLink(manager, msg)} />
                    : <span className="text-[11px] text-amber-600">{t("تعذّر تحديد المسؤول - راجع الهيكل التنظيمي")}</span>}
                  <DismissButton onClick={() => dismiss(alertDismissKey(a))} />
                </div>
              </div>
            );
          }}
        </CommandCenterSection>

        <CommandCenterSection title="زيادات رواتب محتاجة مراجعة" icon={<TrendingUp size={16} />} tone="teal" items={byType("salaryIncreaseDue")} emptyText="مفيش زيادات رواتب مستنية مراجعة دلوقتي.">
          {(a, i) => (
            <div key={i} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
              <div>
                <div className="font-medium text-slate-700">{a.employeeName}</div>
                <StampBadge tone="teal">{t("تقييم {year} مكتمل", { year: a.year })}</StampBadge>
              </div>
              <div className="flex shrink-0 items-center gap-1.5">
                <ReviewButton onClick={() => onGoToTab("salaryIncrease")} />
                <DismissButton onClick={() => dismiss(alertDismissKey(a))} />
              </div>
            </div>
          )}
        </CommandCenterSection>

        <CommandCenterSection title="عقود قربت تنتهي" icon={<FileText size={16} />} tone="amber" items={byType("contractEnd")} emptyText="مفيش عقود قربت تنتهي خلال 30 يوم.">
          {(a, i) => {
            const emp = findEmployeeByName(a.employeeName);
            return (
              <div key={i} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
                <div>
                  <div className="font-medium text-slate-700">{a.employeeName}</div>
                  <span className="text-xs text-slate-400">{a.date}</span>
                </div>
                <div className="flex shrink-0 items-center gap-1.5">
                  <ReviewButton onClick={() => emp && onOpenEmployee(emp.id)} />
                  <DismissButton onClick={() => dismiss(alertDismissKey(a))} />
                </div>
              </div>
            );
          }}
        </CommandCenterSection>

        <CommandCenterSection title="عروض عمل واقفة (تعيينات متأخرة)" icon={<UserPlus size={16} />} tone="rose" items={byType("staleOffer")} emptyText="مفيش عروض عمل واقفة من غير رد.">
          {(a, i) => (
            <div key={i} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
              <div>
                <div className="font-medium text-slate-700">{a.candidateName} <span className="text-xs text-slate-400">({a.position})</span></div>
                <span className="text-xs text-rose-500">{t("{n} يوم", { n: a.diffDays })}</span>
              </div>
              <div className="flex shrink-0 items-center gap-1.5">
                <ReviewButton onClick={() => onGoToTab("recruitment")} />
                <DismissButton onClick={() => dismiss(alertDismissKey(a))} />
              </div>
            </div>
          )}
        </CommandCenterSection>

        <CommandCenterSection title="مستندات قربت تنتهي" icon={<ShieldAlert size={16} />} tone="amber" items={byType("docExpiry")} emptyText="مفيش مستندات قربت تنتهي.">
          {(a, i) => {
            const emp = findEmployeeByName(a.employeeName);
            const msg = `مرحبًا ${a.employeeName}،\nتذكير بسيط إن "${a.docName}" هيخلص في ${a.date} - يا ريت تجهزه لتجديده في أقرب وقت.`;
            return (
              <div key={i} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
                <div>
                  <div className="font-medium text-slate-700">{a.employeeName} <span className="text-xs text-slate-400">- {t(a.docName)}</span></div>
                  <span className="text-xs text-slate-400">{a.date}</span>
                </div>
                <div className="flex shrink-0 items-center gap-1.5">
                  <RemindButton href={emp ? buildAlertWhatsAppLink(emp, msg) : null} />
                  <DismissButton onClick={() => dismiss(alertDismissKey(a))} />
                </div>
              </div>
            );
          }}
        </CommandCenterSection>

        <CommandCenterSection title="تشيك ليست ضم/خروج لسه ناقصة" icon={<Check size={16} />} tone="slate" items={incompleteChecklists} emptyText="مفيش تشيك ليست ناقصة دلوقتي.">
          {(c) => {
            // findEmployee (النشطين بس) مش findAnyEmployee (كل الموظفين) - غلط كان بيسبب اسم
            // الموظف يظهر فاضي (بيرجع رقم الـ id الخام بدل الاسم) وزرار "مراجعة" مايعملش حاجة
            // خالص (emp && onOpenEmployee(...) كانت بتقف عند emp=undefined) لأي خطوة تشيك ليست
            // خروج (offboarding) - بالظبط الحالة اللي بتحصل لأي موظف اتنقل لموظفين سابقين، لأنه
            // بيطلع بره activeEmployees فورًا. خطوات الضم (onboarding) كانت شغالة عادي لأن
            // الموظف المعني لسه نشط وقتها.
            const emp = findAnyEmployee(c.employeeId);
            return (
              <div key={`${c.employeeId}_${c.type}`} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
                <div>
                  <div className="font-medium text-slate-700">{emp?.name || c.employeeId}</div>
                  <div className="mt-1 flex items-center gap-2">
                    <StampBadge tone="slate">{c.type === "onboarding" ? t("ضم") : t("خروج")}</StampBadge>
                    <span className="text-xs text-slate-500">{c.texts.map((tx) => t(tx)).join(lang === "en" ? ", " : "، ")}</span>
                  </div>
                </div>
                <div className="flex shrink-0 items-center gap-1.5">
                  <ReviewButton onClick={() => emp && onOpenEmployee(c.employeeId)} />
                  <DismissButton onClick={() => dismiss(c.dismissKey)} />
                </div>
              </div>
            );
          }}
        </CommandCenterSection>

        <CommandCenterSection title="عهدة لسه مش مرجّعة" icon={<Landmark size={16} />} tone="slate" items={outstandingAssets} emptyText="مفيش عهدة واقفة دلوقتي، كل حاجة اترجعت.">
          {(a) => {
            const emp = findAnyEmployee(a.employeeId);
            return (
              <div key={a.id} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
                <div>
                  <div className="font-medium text-slate-700">{emp?.name || a.employeeId}</div>
                  <div className="mt-1 flex items-center gap-2">
                    <StampBadge tone="slate">{a.name}</StampBadge>
                    <span className="text-xs text-slate-400">{t("اتسلّمت في {date}", { date: a.assignedDate })}</span>
                  </div>
                </div>
                <div className="flex shrink-0 items-center gap-1.5">
                  <ReviewButton onClick={() => emp && onOpenEmployee(emp.id)} />
                  <DismissButton onClick={() => dismiss(`asset:${a.id}`)} />
                </div>
              </div>
            );
          }}
        </CommandCenterSection>

        <CommandCenterSection title="رصيد إجازة منخفض" icon={<CalendarCheck size={16} />} tone="rose" items={byType("leaveLow")} emptyText="مفيش موظفين رصيدهم منخفض.">
          {(a, i) => {
            const emp = findEmployeeByName(a.employeeName);
            const msg = `مرحبًا ${a.employeeName}،\nتذكير بسيط إن رصيد إجازاتك باقيله ${a.remaining} يوم بس.`;
            return (
              <div key={i} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
                <div>
                  <div className="font-medium text-slate-700">{a.employeeName}</div>
                  <span className="text-xs text-rose-500">{t("{n} يوم باقي", { n: a.remaining })}</span>
                </div>
                <div className="flex shrink-0 items-center gap-1.5">
                  <RemindButton href={emp ? buildAlertWhatsAppLink(emp, msg) : null} />
                  <DismissButton onClick={() => dismiss(alertDismissKey(a))} />
                </div>
              </div>
            );
          }}
        </CommandCenterSection>
      </div>
    </div>
  );
}

/* ================= EMPLOYEES ================= */
function EmployeesTab({ employees, setEmployees, settings, onOpen, attendance, setAttendance, penalties, setPenalties, advances, setAdvances, documents, setDocuments, reviews, setReviews, payrollMeta, setPayrollMeta, onDelete, prefillCandidate, onPrefillConsumed, onCandidateConverted, checklistItems, setChecklistItems, requests }) {
  const { t } = useLang();
  const [modalOpen, setModalOpen] = useState(false);
  const [importOpen, setImportOpen] = useState(false);
  const [mergeOpen, setMergeOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [prefillData, setPrefillData] = useState(null); // draft data for a NEW employee seeded from a hired candidate
  const [convertingCandidateId, setConvertingCandidateId] = useState(null);
  const [query, setQuery] = useState("");
  const [selected, setSelected] = useState(() => new Set());
  const [confirmDelete, setConfirmDelete] = useState(null); // array of employees pending delete, or null
  const visible = employees.filter((e) => e.status === "active" || !e.status);
  const filtered = visible.filter((e) => e.name.includes(query) || (e.position || "").includes(query) || (e.department || "").includes(query));
  const dupGroups = useMemo(() => findDuplicateGroups(visible), [visible]);
  // موظفين فترة اختبارهم خلصت من غير قرار تثبيت صريح (زرار "تثبيت جماعي" تحت) - أساسًا لتصحيح
  // بيانات موظفين قدامى كانوا مستوردين قبل إضافة التثبيت التلقائي وقت الاستيراد (importBulk فوق)،
  // من غير ما يحتاج الأدمن يعيد رفع الملف أو يدخل على كل موظف لوحده.
  const overdueProbationEmployees = useMemo(
    () => visible.filter((e) => computeProbationStatus(e, settings, todayISO()).status === "awaiting_decision"),
    [visible, settings]
  );
  function confirmAllOverdueProbations() {
    if (overdueProbationEmployees.length === 0) return;
    const ids = new Set(overdueProbationEmployees.map((e) => e.id));
    const next = employees.map((e) => (ids.has(e.id) ? { ...e, probationConfirmedAt: addMonthsISO(e.hireDate, settings.probationMonths ?? 3) } : e));
    setEmployees(next);
    alert(t("تم تثبيت {n} موظف تلقائيًا (فترة اختبارهم كانت خلصت من غير قرار صريح).", { n: overdueProbationEmployees.length }));
  }

  // طلبات استقالة اتوافق عليها المدير من بوابة الموظف (بوابة الموظف مالهاش صلاحية تكتب على
  // employees/checklistItems مباشرة - راجع firestore.rules)، لسه محتاجة الأدمن ينفّذها فعليًا
  // (markResigned تحت - بينقل الموظف لموظفين سابقين وبيولّد تشيك ليست الخروج). بمجرد التنفيذ
  // الموظف بيطلع من "visible" فالبند ده بيختفي من هنا لوحده تلقائيًا - مفيش داعي نعلّم الطلب
  // نفسه كـ"متعالج" في requests.
  const approvedResignations = useMemo(
    () => (requests || [])
      .filter((r) => r.kind === "resign" && r.status === "approved")
      .map((r) => ({ req: r, emp: visible.find((e) => e.id === r.employeeId) }))
      .filter((x) => x.emp),
    [requests, visible]
  );

  // A candidate handed off from RecruitmentTab's "تحويل لموظف" - open the New Employee modal
  // pre-filled from their info, then immediately tell HRSystem we've picked it up (clears
  // prefillCandidate there so switching tabs away and back doesn't re-trigger this).
  useEffect(() => {
    if (!prefillCandidate) return;
    setConvertingCandidateId(prefillCandidate.id);
    setPrefillData({
      name: prefillCandidate.name || "", phone: prefillCandidate.phone || "",
      position: prefillCandidate.position || "", department: prefillCandidate.department || "",
      hireDate: todayISO(),
    });
    setEditing(null);
    setModalOpen(true);
    onPrefillConsumed();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [prefillCandidate]);

  function closeModal() {
    setModalOpen(false);
    setEditing(null);
    setPrefillData(null);
    setConvertingCandidateId(null);
  }

  function save(data) {
    // salaryChangeReason حقل مؤقت جاي من EmployeeForm بس لما المرتب اتغيّر فعليًا - بيتشال هنا
    // قبل الحفظ عشان معدش يتخزّن كجزء دائم من بيانات الموظف، وبيتبعت بدل منه كملاحظة منفصلة
    // لـ setEmployees عشان upd.employees تسجّله في سجل النشاط.
    const { salaryChangeReason, ...cleanData } = data;
    if (editing) {
      const reasonNote = salaryChangeReason
        ? { employeeName: editing.name || editing.id, reason: salaryChangeReason }
        : null;
      setEmployees(employees.map((e) => (e.id === editing.id ? { ...editing, ...cleanData } : e)), reasonNote);
    } else {
      const newId = uid("emp");
      setEmployees([...employees, { id: newId, status: "active", leaveEntitlement: settings.leaveDefaultDays, ...cleanData }]);
      if (convertingCandidateId) onCandidateConverted(convertingCandidateId, newId);
      // تشيك ليست الضم بتتولّد أوتوماتيك من القالب الافتراضي في الإعدادات - الأدمن يقدر يعدّلها
      // أو يشطب خطواتها من تاب "تشيك ليست الضم/الخروج" في بروفايل الموظف.
      const onboardingSteps = settings.onboardingChecklistItems || [];
      if (onboardingSteps.length) {
        setChecklistItems([
          ...checklistItems,
          ...onboardingSteps.map((text) => ({ id: uid("chk"), employeeId: newId, type: "onboarding", text, done: false, doneDate: null })),
        ]);
      }
    }
    closeModal();
  }
  function markResigned(emp) {
    setEmployees(employees.map((e) => (e.id === emp.id ? { ...e, status: "resigned", resignationDate: todayISO() } : e)));
    // نفس فكرة تشيك ليست الضم، بس بالقالب الافتراضي بتاع الخروج - وبس لو الموظف ده لسه معندوش
    // خطوات خروج مسجلة أصلاً (عشان لو حصل يترجع بالغلط وينقل تاني ميتكررش له نفس الخطوات).
    const alreadyHasOffboarding = checklistItems.some((c) => c.employeeId === emp.id && c.type === "offboarding");
    const offboardingSteps = settings.offboardingChecklistItems || [];
    if (!alreadyHasOffboarding && offboardingSteps.length) {
      setChecklistItems([
        ...checklistItems,
        ...offboardingSteps.map((text) => ({ id: uid("chk"), employeeId: emp.id, type: "offboarding", text, done: false, doneDate: null })),
      ]);
    }
  }
  function toggleSelected(id) {
    setSelected((s) => { const n = new Set(s); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  }
  const allFilteredSelected = filtered.length > 0 && filtered.every((e) => selected.has(e.id));
  const someFilteredSelected = filtered.some((e) => selected.has(e.id));
  function toggleSelectAllFiltered() {
    setSelected((s) => {
      const n = new Set(s);
      if (allFilteredSelected) filtered.forEach((e) => n.delete(e.id));
      else filtered.forEach((e) => n.add(e.id));
      return n;
    });
  }
  function runConfirmedDelete() {
    onDelete(confirmDelete.map((e) => e.id));
    setSelected((s) => { const n = new Set(s); confirmDelete.forEach((e) => n.delete(e.id)); return n; });
    setConfirmDelete(null);
  }
  function importBulk(newRecords) {
    const byCode = {};
    const byName = {};
    employees.forEach((e) => {
      if (e.employeeCode) byCode[String(e.employeeCode).trim().toLowerCase()] = e.id;
      byName[e.name.trim().toLowerCase()] = e.id;
    });

    let updated = employees.slice();
    let updatedCount = 0, createdCount = 0;

    newRecords.forEach((rec) => {
      let matchId = null;
      if (rec.employeeCode) matchId = byCode[String(rec.employeeCode).trim().toLowerCase()];
      if (!matchId && rec.name) matchId = byName[rec.name.trim().toLowerCase()];

      // موظف مستورد وعنده تاريخ تعيين خلّصت فترة اختباره بالفعل (زي ما هي محسوبة من
      // settings.probationMonths) - نعتبره متثبّت تلقائي بدل ما يفضل يظهر "محتاجة قرار" غلط
      // في بروفايله ولوحة المتابعة، لأن الاستيراد الجماعي غالبًا بيانات موظفين قدامى موجودين
      // فعلاً (زي ملف قاعدة بيانات الموظفين اللي رفعه المستخدم) مش تعيينات جديدة محتاجة قرار
      // تثبيت حقيقي. لو الموظف ده موجود بالفعل وعنده تاريخ تثبيت حقيقي متسجّل قبل كده، مبنلمسوش
      // - مانكتبش فوقه بتاريخ تخميني. مهم: بناخد تاريخ التعيين الفعلي (existing?.hireDate) لو
      // الملف ده مبيحدّثش عمود تاريخ التعيين نفسه (مثلًا ملف تحديث مرتبات بس) - مش بس rec.hireDate
      // من الملف الحالي، وإلا التصحيح مايشتغلش على أي تحديث لاحق غير عمود التعيين.
      const existing = matchId ? updated.find((e) => e.id === matchId) : null;
      const effectiveHireDate = rec.hireDate || existing?.hireDate;
      if (effectiveHireDate && !existing?.probationConfirmedAt) {
        const probationEnd = addMonthsISO(effectiveHireDate, settings.probationMonths ?? 3);
        if (todayISO() >= probationEnd) rec.probationConfirmedAt = probationEnd;
      }

      if (matchId) {
        updated = updated.map((e) => (e.id === matchId ? { ...e, ...rec } : e));
        updatedCount++;
      } else {
        updated = [...updated, { id: uid("emp"), status: "active", leaveEntitlement: settings.leaveDefaultDays, ...rec }];
        createdCount++;
        // so that duplicate rows within the same import file also match each other
        if (rec.employeeCode) byCode[String(rec.employeeCode).trim().toLowerCase()] = updated[updated.length - 1].id;
        if (rec.name) byName[rec.name.trim().toLowerCase()] = updated[updated.length - 1].id;
      }
    });

    setEmployees(updated);
    setImportOpen(false);
    alert(t("تم التحديث: {updated} موظف موجود، وإضافة {created} موظف جديد.", { updated: updatedCount, created: createdCount }));
  }

  return (
    <div>
      <SectionTitle eyebrow={t("{n} موظف نشط", { n: visible.length })} title="الموظفون والعقود" action={
        <div className="flex items-center gap-2">
          {selected.size > 0 && (
            <button onClick={() => setConfirmDelete(visible.filter((e) => selected.has(e.id)))} className="flex items-center gap-1.5 rounded-lg border border-rose-500 bg-rose-50 px-3.5 py-2 text-sm font-semibold text-rose-700 hover:bg-rose-100">
              <Trash2 size={16} /> {t("حذف المحدد ({n})", { n: selected.size })}
            </button>
          )}
          {dupGroups.length > 0 && (
            <button onClick={() => setMergeOpen(true)} className="flex items-center gap-1.5 rounded-lg border border-amber-500 bg-amber-50 px-3.5 py-2 text-sm font-semibold text-amber-700 hover:bg-amber-100">
              <Users size={16} /> {t("دمج المكررات ({n})", { n: dupGroups.length })}
            </button>
          )}
          {overdueProbationEmployees.length > 0 && (
            <button onClick={confirmAllOverdueProbations} title={t("للموظفين اللي فترة اختبارهم خلصت من زمان (زي بيانات مستوردة قديمة) ولسه من غير قرار تثبيت صريح")} className="flex items-center gap-1.5 rounded-lg border border-emerald-600 bg-emerald-50 px-3.5 py-2 text-sm font-semibold text-emerald-700 hover:bg-emerald-100">
              <ShieldCheck size={16} /> {t("تثبيت اللي خلصت فترة اختبارهم ({n})", { n: overdueProbationEmployees.length })}
            </button>
          )}
          <button onClick={() => setImportOpen(true)} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3.5 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50">
            <Upload size={16} /> {t("استيراد جماعي")}
          </button>
          <button onClick={() => { setEditing(null); setModalOpen(true); }} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">
            <Plus size={16} /> {t("موظف جديد")}
          </button>
        </div>
      } />

      <div className="mb-4 flex items-center gap-2 rounded-lg border border-stone-300 bg-white px-3 py-2">
        <Search size={16} className="text-slate-400" />
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={t("دور بالاسم أو الوظيفة أو القسم...")} className="w-full text-sm outline-none" />
      </div>

      {approvedResignations.length > 0 && (
        <Card className="mb-4 border-amber-300 bg-amber-50 p-4">

// Arabic names typed by different people almost never match byte-for-byte even when
// they're clearly "the same name": hamza on/off the alef (أحمد vs احمد), alef maksura vs
// ya (يحيى vs يحيي), ta marbuta vs ha (سارة vs ساره), invisible tashkeel/tatweel/zero-width
// characters pasted in from Word or a fingerprint-device export, extra spaces, etc.
// A plain trim+lowercase (the old implementation) treats every one of those as a *different*
// person, which is why the "دمج المكررات" button was staying hidden even with obvious
// duplicates in the table. This normalizer folds all of that down to one comparable key.
function normalizeNameKey(name) {
  return String(name || "")
    .normalize("NFKC")
    // strip tashkeel / harakat / quranic annotation marks (U+064B-U+065F, U+0670)
    .replace(/[\u064B-\u065F\u0670]/g, "")
    // strip tatweel / kashida (U+0640)
    .replace(/\u0640/g, "")
    // strip zero-width & bidi control characters: ZWSP/ZWNJ/ZWJ/LRM/RLM (U+200B-U+200F) + BOM (U+FEFF)
    .replace(/[\u200B-\u200F\uFEFF]/g, "")
    // unify alef variants (U+0622 U+0623 U+0625 U+0671) -> alef (U+0627)
    .replace(/[\u0622\u0623\u0625\u0671]/g, "\u0627")
    // unify alef maksura (U+0649) -> ya (U+064A)
    .replace(/\u0649/g, "\u064A")
    // unify ta marbuta (U+0629) -> ha (U+0647) — common alt-spelling of the same name
    .replace(/\u0629/g, "\u0647")
    // drop standalone hamza (U+0621) — kept on ؤ/ئ since those change pronunciation
    .replace(/\u0621/g, "")
    // collapse all whitespace (incl. NBSP) and trim
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

const ARABIC_INDIC_DIGITS = "٠١٢٣٤٥٦٧٨٩";
// Employee codes suffer the same kind of cosmetic mismatch: Arabic-Indic digits from a
// fingerprint device export ("١٠٤٢") vs Western digits typed manually ("1042"), stray
// spaces/dashes, or inconsistent leading zeros ("007" vs "7"). Normalize before comparing.
function normalizeCode(code) {
  if (code === null || code === undefined) return "";
  let s = String(code).trim();
  if (!s) return "";
  s = s.replace(/[٠-٩]/g, (d) => String(ARABIC_INDIC_DIGITS.indexOf(d)));
  s = s.replace(/[^a-zA-Z0-9؀-ۿ]/g, "").toLowerCase();
  if (/^\d+$/.test(s)) s = String(parseInt(s, 10));
  return s;
}

function findDuplicateGroups(employees) {
  // union-find over employee ids: same normalized name OR same non-empty employeeCode => same group
  const parent = {};
  employees.forEach((e) => { parent[e.id] = e.id; });
  function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  function union(a, b) { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; }

  const byName = {};
  const byCode = {};
  employees.forEach((e) => {
    const nk = normalizeNameKey(e.name);
    if (nk) { if (byName[nk]) union(byName[nk], e.id); else byName[nk] = e.id; }
    const ck = normalizeCode(e.employeeCode);
    if (ck) { if (byCode[ck]) union(byCode[ck], e.id); else byCode[ck] = e.id; }
  });

  const groupsMap = {};
  employees.forEach((e) => {
    const root = find(e.id);
    if (!groupsMap[root]) groupsMap[root] = [];
    groupsMap[root].push(e);
  });
  return Object.values(groupsMap).filter((g) => g.length > 1);
}

function DuplicateMergeWizard({ groups, allEmployees, setEmployees, attendance, setAttendance, penalties, setPenalties, advances, setAdvances, documents, setDocuments, reviews, setReviews, payrollMeta, setPayrollMeta, onDone }) {
  const { t } = useLang();
  const [keepChoice, setKeepChoice] = useState(() => {
    const init = {};
    groups.forEach((g, i) => { init[i] = g[0].id; });
    return init;
  });

  function applyMerge() {
    let employees = allEmployees.slice();
    let att = attendance;
    let pens = penalties;
    let advs = advances;
    let docs = documents;
    let revs = reviews;
    let pay = payrollMeta;

    groups.forEach((group, i) => {
      const keepId = keepChoice[i];
      const otherIds = group.map((e) => e.id).filter((id) => id !== keepId);
      if (otherIds.length === 0) return;

      // fill blanks on the kept record from duplicates
      const keptRecord = employees.find((e) => e.id === keepId);
      let mergedFields = {};
      for (const other of group) {
        if (other.id === keepId) continue;
        Object.keys(other).forEach((k) => {
          if (k === "id") return;
          const curVal = mergedFields[k] ?? keptRecord[k];
          if ((curVal === "" || curVal === undefined || curVal === null || curVal === 0) && other[k]) {
            mergedFields[k] = other[k];
          }
        });
      }
      employees = employees.map((e) => (e.id === keepId ? { ...e, ...mergedFields } : e));
      employees = employees.filter((e) => !otherIds.includes(e.id));

      // remap attendance: move a duplicate's day entry to keepId only if keepId has no entry that day
      const newAtt = {};
      Object.keys(att).forEach((date) => {
        const dayRec = { ...att[date] };
        otherIds.forEach((oid) => {
          if (dayRec[oid]) {
            if (!dayRec[keepId]) dayRec[keepId] = dayRec[oid];
            delete dayRec[oid];
          }
        });
        newAtt[date] = dayRec;
      });
      att = newAtt;

      // remap penalties / advances / documents / reviews: simple employeeId swap
      pens = pens.map((p) => (otherIds.includes(p.employeeId) ? { ...p, employeeId: keepId } : p));
      advs = advs.map((a) => (otherIds.includes(a.employeeId) ? { ...a, employeeId: keepId } : a));
      docs = docs.map((d) => (otherIds.includes(d.employeeId) ? { ...d, employeeId: keepId } : d));
      revs = revs.map((r) => (otherIds.includes(r.employeeId) ? { ...r, employeeId: keepId } : r));

      // remap payroll meta: for each month, move duplicate's meta to keepId only if keepId has none
      const newPay = {};
      Object.keys(pay).forEach((ym) => {
        const monthRec = { ...pay[ym] };
        otherIds.forEach((oid) => {
          if (monthRec[oid]) {
            if (!monthRec[keepId]) monthRec[keepId] = monthRec[oid];
            delete monthRec[oid];
          }
        });
        newPay[ym] = monthRec;
      });
      pay = newPay;
    });

    setEmployees(employees);
    setAttendance(att);
    setPenalties(pens);
    setAdvances(advs);
    setDocuments(docs);
    setReviews(revs);
    setPayrollMeta(pay);
    onDone();
  }

  if (groups.length === 0) return <EmptyState text="مفيش تكرارات دلوقتي." />;

  return (
    <div className="space-y-5">
      <p className="text-sm text-slate-500">{t("لقينا")} <strong>{groups.length}</strong> {t("مجموعة موظفين مكررين (بنفس الاسم أو نفس الكود). اختار مين يفضل من كل مجموعة — والبيانات (حضور، جزاءات، سلف...) هتتنقل تلقائي للي هيفضل.")}</p>
      <div className="max-h-96 space-y-4 overflow-y-auto">
        {groups.map((group, i) => (
          <div key={i} className="rounded-lg border border-amber-200 bg-amber-50/40 p-3">
            <div className="mb-2 text-xs font-semibold text-amber-700">{t("مجموعة {n} — {count} نسخ", { n: i + 1, count: group.length })}</div>
            <div className="space-y-1.5">
              {group.map((e) => (
                <label key={e.id} className="flex items-center gap-2 rounded-md border border-stone-200 bg-white px-2.5 py-1.5 text-sm">
                  <input type="radio" name={`grp-${i}`} checked={keepChoice[i] === e.id} onChange={() => setKeepChoice({ ...keepChoice, [i]: e.id })} />
                  <span className="font-medium text-slate-800">{e.name}</span>
                  <span className="text-xs text-slate-400">{e.employeeCode ? t("كود: {code}", { code: e.employeeCode }) : ""} {e.position ? `· ${e.position}` : ""} {e.salary ? `· ${fmtMoney(e.salary)} ${t("ج.م")}` : ""}</span>
                </label>
              ))}
            </div>
          </div>
        ))}
      </div>
      <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">
        <button onClick={onDone} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50">{t("إلغاء")}</button>
        <button onClick={applyMerge} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Check size={15} /> {t("تأكيد الدمج")}</button>
      </div>
    </div>
  );
}

/* ---- Bulk import: shared file parsing ---- */
function parseSpreadsheetFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array", cellDates: false });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        if (!rows.length) return reject(new Error("الملف فاضي"));
        const headers = rows[0].map((h) => String(h).trim());
        const dataRows = rows.slice(1).filter((r) => r.some((c) => c !== ""));
        resolve({ headers, dataRows });
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error("تعذّرت قراءة الملف"));
    reader.readAsArrayBuffer(file);
  });
}
