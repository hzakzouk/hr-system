            return (
              <div key={c.employeeId} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
                <div>
                  <div className="font-medium text-slate-700">{emp?.name || c.employeeId}</div>
                  <StampBadge tone="slate">{c.type === "onboarding" ? t("ضم") : t("خروج")} - {t("{n} خطوة ناقصة", { n: c.count })}</StampBadge>
                </div>
                <ReviewButton onClick={() => emp && onOpenEmployee(c.employeeId)} />
              </div>
            );
          }}
        </CommandCenterSection>

        <CommandCenterSection title="رصيد إجازة منخفض" icon={<CalendarCheck size={16} />} tone="rose" items={byType("leaveLow")} emptyText="مفيش موظفين رصيدهم منخفض.">
          {(a, i) => {
            const emp = findEmployeeByName(a.employeeName);
            const msg = `مرحبًا ${a.employeeName}،\nتذكير بسيط إن رصيد إجازاتك باقيله ${a.remaining} يوم بس.`;
            return (
              <div key={i} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
                <div>
                  <div className="font-medium text-slate-700">{a.employeeName}</div>
                  <span className="text-xs text-rose-500">{t("{n} يوم باقي", { n: a.remaining })}</span>
                </div>
                <RemindButton href={emp ? buildAlertWhatsAppLink(emp, msg) : null} />
              </div>
            );
          }}
        </CommandCenterSection>
      </div>
    </div>
  );
}

/* ================= EMPLOYEES ================= */
function EmployeesTab({ employees, setEmployees, settings, onOpen, attendance, setAttendance, penalties, setPenalties, advances, setAdvances, documents, setDocuments, reviews, setReviews, payrollMeta, setPayrollMeta, onDelete, prefillCandidate, onPrefillConsumed, onCandidateConverted, checklistItems, setChecklistItems }) {
  const { t } = useLang();
  const [modalOpen, setModalOpen] = useState(false);
  const [importOpen, setImportOpen] = useState(false);
  const [mergeOpen, setMergeOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [prefillData, setPrefillData] = useState(null); // draft data for a NEW employee seeded from a hired candidate
  const [convertingCandidateId, setConvertingCandidateId] = useState(null);
  const [query, setQuery] = useState("");
  const [selected, setSelected] = useState(() => new Set());
  const [confirmDelete, setConfirmDelete] = useState(null); // array of employees pending delete, or null
  const visible = employees.filter((e) => e.status === "active" || !e.status);
  const filtered = visible.filter((e) => e.name.includes(query) || (e.position || "").includes(query) || (e.department || "").includes(query));
  const dupGroups = useMemo(() => findDuplicateGroups(visible), [visible]);

  // A candidate handed off from RecruitmentTab's "تحويل لموظف" - open the New Employee modal
  // pre-filled from their info, then immediately tell HRSystem we've picked it up (clears
  // prefillCandidate there so switching tabs away and back doesn't re-trigger this).
  useEffect(() => {
    if (!prefillCandidate) return;
    setConvertingCandidateId(prefillCandidate.id);
    setPrefillData({
      name: prefillCandidate.name || "", phone: prefillCandidate.phone || "",
      position: prefillCandidate.position || "", department: prefillCandidate.department || "",
      hireDate: todayISO(),
    });
    setEditing(null);
    setModalOpen(true);
    onPrefillConsumed();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [prefillCandidate]);

  function closeModal() {
    setModalOpen(false);
    setEditing(null);
    setPrefillData(null);
    setConvertingCandidateId(null);
  }

  function save(data) {
    if (editing) {
      setEmployees(employees.map((e) => (e.id === editing.id ? { ...editing, ...data } : e)));
    } else {
      const newId = uid("emp");
      setEmployees([...employees, { id: newId, status: "active", leaveEntitlement: settings.leaveDefaultDays, ...data }]);
      if (convertingCandidateId) onCandidateConverted(convertingCandidateId, newId);
      // تشيك ليست الضم بتتولّد أوتوماتيك من القالب الافتراضي في الإعدادات - الأدمن يقدر يعدّلها
      // أو يشطب خطواتها من تاب "تشيك ليست الضم/الخروج" في بروفايل الموظف.
      const onboardingSteps = settings.onboardingChecklistItems || [];
      if (onboardingSteps.length) {
        setChecklistItems([
          ...checklistItems,
          ...onboardingSteps.map((text) => ({ id: uid("chk"), employeeId: newId, type: "onboarding", text, done: false, doneDate: null })),
        ]);
      }
    }
    closeModal();
  }
  function markResigned(emp) {
    setEmployees(employees.map((e) => (e.id === emp.id ? { ...e, status: "resigned", resignationDate: todayISO() } : e)));
    // نفس فكرة تشيك ليست الضم، بس بالقالب الافتراضي بتاع الخروج - وبس لو الموظف ده لسه معندوش
    // خطوات خروج مسجلة أصلاً (عشان لو حصل يترجع بالغلط وينقل تاني ميتكررش له نفس الخطوات).
    const alreadyHasOffboarding = checklistItems.some((c) => c.employeeId === emp.id && c.type === "offboarding");
    const offboardingSteps = settings.offboardingChecklistItems || [];
    if (!alreadyHasOffboarding && offboardingSteps.length) {
      setChecklistItems([
        ...checklistItems,
        ...offboardingSteps.map((text) => ({ id: uid("chk"), employeeId: emp.id, type: "offboarding", text, done: false, doneDate: null })),
      ]);
    }
  }
  function toggleSelected(id) {
    setSelected((s) => { const n = new Set(s); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  }
  const allFilteredSelected = filtered.length > 0 && filtered.every((e) => selected.has(e.id));
  const someFilteredSelected = filtered.some((e) => selected.has(e.id));
  function toggleSelectAllFiltered() {
    setSelected((s) => {
      const n = new Set(s);
      if (allFilteredSelected) filtered.forEach((e) => n.delete(e.id));
      else filtered.forEach((e) => n.add(e.id));
      return n;
    });
  }
  function runConfirmedDelete() {
    onDelete(confirmDelete.map((e) => e.id));
    setSelected((s) => { const n = new Set(s); confirmDelete.forEach((e) => n.delete(e.id)); return n; });
    setConfirmDelete(null);
  }
  function importBulk(newRecords) {
    const byCode = {};
    const byName = {};
    employees.forEach((e) => {
      if (e.employeeCode) byCode[String(e.employeeCode).trim().toLowerCase()] = e.id;
      byName[e.name.trim().toLowerCase()] = e.id;
    });

    let updated = employees.slice();
    let updatedCount = 0, createdCount = 0;

    newRecords.forEach((rec) => {
      let matchId = null;
      if (rec.employeeCode) matchId = byCode[String(rec.employeeCode).trim().toLowerCase()];
      if (!matchId && rec.name) matchId = byName[rec.name.trim().toLowerCase()];

      if (matchId) {
        updated = updated.map((e) => (e.id === matchId ? { ...e, ...rec } : e));
        updatedCount++;
      } else {
        updated = [...updated, { id: uid("emp"), status: "active", leaveEntitlement: settings.leaveDefaultDays, ...rec }];
        createdCount++;
        // so that duplicate rows within the same import file also match each other
        if (rec.employeeCode) byCode[String(rec.employeeCode).trim().toLowerCase()] = updated[updated.length - 1].id;
        if (rec.name) byName[rec.name.trim().toLowerCase()] = updated[updated.length - 1].id;
      }
    });

    setEmployees(updated);
    setImportOpen(false);
    alert(t("تم التحديث: {updated} موظف موجود، وإضافة {created} موظف جديد.", { updated: updatedCount, created: createdCount }));
  }

  return (
    <div>
      <SectionTitle eyebrow={t("{n} موظف نشط", { n: visible.length })} title="الموظفون والعقود" action={
        <div className="flex items-center gap-2">
          {selected.size > 0 && (
            <button onClick={() => setConfirmDelete(visible.filter((e) => selected.has(e.id)))} className="flex items-center gap-1.5 rounded-lg border border-rose-500 bg-rose-50 px-3.5 py-2 text-sm font-semibold text-rose-700 hover:bg-rose-100">
              <Trash2 size={16} /> {t("حذف المحدد ({n})", { n: selected.size })}
            </button>
          )}
          {dupGroups.length > 0 && (
            <button onClick={() => setMergeOpen(true)} className="flex items-center gap-1.5 rounded-lg border border-amber-500 bg-amber-50 px-3.5 py-2 text-sm font-semibold text-amber-700 hover:bg-amber-100">
              <Users size={16} /> {t("دمج المكررات ({n})", { n: dupGroups.length })}
            </button>
          )}
          <button onClick={() => setImportOpen(true)} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3.5 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50">
            <Upload size={16} /> {t("استيراد جماعي")}
          </button>
          <button onClick={() => { setEditing(null); setModalOpen(true); }} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">
            <Plus size={16} /> {t("موظف جديد")}
          </button>
        </div>
      } />

      <div className="mb-4 flex items-center gap-2 rounded-lg border border-stone-300 bg-white px-3 py-2">
        <Search size={16} className="text-slate-400" />
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={t("دور بالاسم أو الوظيفة أو القسم...")} className="w-full text-sm outline-none" />
      </div>

      {filtered.length === 0 ? <Card className="p-0"><EmptyState text={visible.length === 0 ? "لسه معملتش أي موظف." : "مفيش نتائج مطابقة."} /></Card> : (
        <Card className="overflow-hidden p-0">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-stone-200 bg-stone-50 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">
                <th className="w-8 px-4 py-3">
                  <input type="checkbox" checked={allFilteredSelected} ref={(el) => { if (el) el.indeterminate = someFilteredSelected && !allFilteredSelected; }} onChange={toggleSelectAllFiltered} className="h-4 w-4 rounded border-stone-300" />
                </th>
                <th className="px-4 py-3">{t("كود")}</th><th className="px-4 py-3">{t("الاسم")}</th><th className="px-4 py-3">{t("الوظيفة")}</th><th className="px-4 py-3">{t("القسم")}</th>
                <th className="px-4 py-3">{t("نوع العقد")}</th><th className="px-4 py-3">{t("نهاية العقد")}</th><th className="px-4 py-3">{t("الراتب الأساسي")}</th><th className="px-4 py-3"></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((e) => (
                <tr key={e.id} className={`border-b border-stone-100 last:border-0 hover:bg-stone-50 ${selected.has(e.id) ? "bg-rose-50/40" : ""}`}>
                  <td className="px-4 py-3"><input type="checkbox" checked={selected.has(e.id)} onChange={() => toggleSelected(e.id)} className="h-4 w-4 rounded border-stone-300" /></td>
                  <td className="px-4 py-3 text-slate-500 tabular-nums">{e.employeeCode || "—"}</td>
                  <td className="px-4 py-3 font-medium text-teal-800 cursor-pointer hover:underline" onClick={() => onOpen(e.id)}>{e.name}</td>
                  <td className="px-4 py-3 text-slate-600">{e.position || "—"}</td>
                  <td className="px-4 py-3 text-slate-600">{e.department || "—"}</td>
                  <td className="px-4 py-3"><StampBadge tone="teal">{e.contractType || "—"}</StampBadge></td>
                  <td className="px-4 py-3 text-slate-600">{e.contractEnd || t("غير محدد")}</td>
                  <td className="px-4 py-3 tabular-nums text-slate-700">{fmtMoney(e.salary)} {t("ج.م")}</td>
                  <td className="px-4 py-3">
                    <div className="flex items-center gap-1">
                      <button onClick={() => { setEditing(e); setModalOpen(true); }} className="rounded-md p-1.5 text-slate-400 hover:bg-stone-100 hover:text-teal-700"><Pencil size={15} /></button>
                      <button onClick={() => markResigned(e)} title={t("نقل لموظفين سابقين")} className="rounded-md p-1.5 text-slate-400 hover:bg-amber-50 hover:text-amber-600"><LogOut size={15} /></button>
                      <button onClick={() => setConfirmDelete([e])} title={t("حذف نهائي")} className="rounded-md p-1.5 text-slate-400 hover:bg-rose-50 hover:text-rose-600"><Trash2 size={15} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
      )}

      <Modal open={modalOpen} onClose={closeModal} title={editing ? "تعديل بيانات موظف" : convertingCandidateId ? "تحويل مرشح لموظف" : "إضافة موظف جديد"} wide>
        <EmployeeForm initial={editing || prefillData} settings={settings} employees={employees} onSave={save} onCancel={closeModal} />
      </Modal>

      <Modal open={importOpen} onClose={() => setImportOpen(false)} title="استيراد جماعي للموظفين" wide>
        <EmployeeImportWizard employees={employees} onImport={importBulk} onCancel={() => setImportOpen(false)} />
      </Modal>

      <Modal open={mergeOpen} onClose={() => setMergeOpen(false)} title="دمج الموظفين المكررين" wide>
        <DuplicateMergeWizard
          groups={dupGroups}
          allEmployees={employees} setEmployees={setEmployees}
          attendance={attendance} setAttendance={setAttendance}
          penalties={penalties} setPenalties={setPenalties}
          advances={advances} setAdvances={setAdvances}
          documents={documents} setDocuments={setDocuments}
          reviews={reviews} setReviews={setReviews}
          payrollMeta={payrollMeta} setPayrollMeta={setPayrollMeta}
          onDone={() => setMergeOpen(false)}
        />
      </Modal>

      {confirmDelete && (
        <EmployeeDeleteConfirmModal employees={confirmDelete} onConfirm={runConfirmedDelete} onCancel={() => setConfirmDelete(null)} />
      )}
    </div>
  );
}

// Arabic names typed by different people almost never match byte-for-byte even when
// they're clearly "the same name": hamza on/off the alef (أحمد vs احمد), alef maksura vs
// ya (يحيى vs يحيي), ta marbuta vs ha (سارة vs ساره), invisible tashkeel/tatweel/zero-width
// characters pasted in from Word or a fingerprint-device export, extra spaces, etc.
// A plain trim+lowercase (the old implementation) treats every one of those as a *different*
// person, which is why the "دمج المكررات" button was staying hidden even with obvious
// duplicates in the table. This normalizer folds all of that down to one comparable key.
function normalizeNameKey(name) {
  return String(name || "")
    .normalize("NFKC")
    // strip tashkeel / harakat / quranic annotation marks (U+064B-U+065F, U+0670)
    .replace(/[\u064B-\u065F\u0670]/g, "")
    // strip tatweel / kashida (U+0640)
    .replace(/\u0640/g, "")
    // strip zero-width & bidi control characters: ZWSP/ZWNJ/ZWJ/LRM/RLM (U+200B-U+200F) + BOM (U+FEFF)
    .replace(/[\u200B-\u200F\uFEFF]/g, "")
    // unify alef variants (U+0622 U+0623 U+0625 U+0671) -> alef (U+0627)
    .replace(/[\u0622\u0623\u0625\u0671]/g, "\u0627")
    // unify alef maksura (U+0649) -> ya (U+064A)
    .replace(/\u0649/g, "\u064A")
    // unify ta marbuta (U+0629) -> ha (U+0647) — common alt-spelling of the same name
    .replace(/\u0629/g, "\u0647")
    // drop standalone hamza (U+0621) — kept on ؤ/ئ since those change pronunciation
    .replace(/\u0621/g, "")
    // collapse all whitespace (incl. NBSP) and trim
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

const ARABIC_INDIC_DIGITS = "٠١٢٣٤٥٦٧٨٩";
// Employee codes suffer the same kind of cosmetic mismatch: Arabic-Indic digits from a
// fingerprint device export ("١٠٤٢") vs Western digits typed manually ("1042"), stray
// spaces/dashes, or inconsistent leading zeros ("007" vs "7"). Normalize before comparing.
function normalizeCode(code) {
  if (code === null || code === undefined) return "";
  let s = String(code).trim();
  if (!s) return "";
  s = s.replace(/[٠-٩]/g, (d) => String(ARABIC_INDIC_DIGITS.indexOf(d)));
  s = s.replace(/[^a-zA-Z0-9؀-ۿ]/g, "").toLowerCase();
  if (/^\d+$/.test(s)) s = String(parseInt(s, 10));
  return s;
}

function findDuplicateGroups(employees) {
  // union-find over employee ids: same normalized name OR same non-empty employeeCode => same group
  const parent = {};
  employees.forEach((e) => { parent[e.id] = e.id; });
  function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  function union(a, b) { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; }

  const byName = {};
  const byCode = {};
  employees.forEach((e) => {
    const nk = normalizeNameKey(e.name);
    if (nk) { if (byName[nk]) union(byName[nk], e.id); else byName[nk] = e.id; }
    const ck = normalizeCode(e.employeeCode);
    if (ck) { if (byCode[ck]) union(byCode[ck], e.id); else byCode[ck] = e.id; }
  });

  const groupsMap = {};
  employees.forEach((e) => {
    const root = find(e.id);
    if (!groupsMap[root]) groupsMap[root] = [];
    groupsMap[root].push(e);
  });
  return Object.values(groupsMap).filter((g) => g.length > 1);
}

function DuplicateMergeWizard({ groups, allEmployees, setEmployees, attendance, setAttendance, penalties, setPenalties, advances, setAdvances, documents, setDocuments, reviews, setReviews, payrollMeta, setPayrollMeta, onDone }) {
  const { t } = useLang();
  const [keepChoice, setKeepChoice] = useState(() => {
    const init = {};
    groups.forEach((g, i) => { init[i] = g[0].id; });
    return init;
  });

  function applyMerge() {
    let employees = allEmployees.slice();
    let att = attendance;
    let pens = penalties;
    let advs = advances;
    let docs = documents;
    let revs = reviews;
    let pay = payrollMeta;

    groups.forEach((group, i) => {
      const keepId = keepChoice[i];
      const otherIds = group.map((e) => e.id).filter((id) => id !== keepId);
      if (otherIds.length === 0) return;

      // fill blanks on the kept record from duplicates
      const keptRecord = employees.find((e) => e.id === keepId);
      let mergedFields = {};
      for (const other of group) {
        if (other.id === keepId) continue;
        Object.keys(other).forEach((k) => {
          if (k === "id") return;
          const curVal = mergedFields[k] ?? keptRecord[k];
          if ((curVal === "" || curVal === undefined || curVal === null || curVal === 0) && other[k]) {
            mergedFields[k] = other[k];
          }
        });
      }
      employees = employees.map((e) => (e.id === keepId ? { ...e, ...mergedFields } : e));
      employees = employees.filter((e) => !otherIds.includes(e.id));

      // remap attendance: move a duplicate's day entry to keepId only if keepId has no entry that day
      const newAtt = {};
      Object.keys(att).forEach((date) => {
        const dayRec = { ...att[date] };
        otherIds.forEach((oid) => {
          if (dayRec[oid]) {
            if (!dayRec[keepId]) dayRec[keepId] = dayRec[oid];
            delete dayRec[oid];
          }
        });
        newAtt[date] = dayRec;
      });
      att = newAtt;

      // remap penalties / advances / documents / reviews: simple employeeId swap
      pens = pens.map((p) => (otherIds.includes(p.employeeId) ? { ...p, employeeId: keepId } : p));
      advs = advs.map((a) => (otherIds.includes(a.employeeId) ? { ...a, employeeId: keepId } : a));
      docs = docs.map((d) => (otherIds.includes(d.employeeId) ? { ...d, employeeId: keepId } : d));
      revs = revs.map((r) => (otherIds.includes(r.employeeId) ? { ...r, employeeId: keepId } : r));

      // remap payroll meta: for each month, move duplicate's meta to keepId only if keepId has none
      const newPay = {};
      Object.keys(pay).forEach((ym) => {
        const monthRec = { ...pay[ym] };
        otherIds.forEach((oid) => {
          if (monthRec[oid]) {
            if (!monthRec[keepId]) monthRec[keepId] = monthRec[oid];
            delete monthRec[oid];
          }
        });
        newPay[ym] = monthRec;
      });
      pay = newPay;
    });

    setEmployees(employees);
    setAttendance(att);
    setPenalties(pens);
    setAdvances(advs);
    setDocuments(docs);
    setReviews(revs);
    setPayrollMeta(pay);
    onDone();
  }

  if (groups.length === 0) return <EmptyState text="مفيش تكرارات دلوقتي." />;

  return (
    <div className="space-y-5">
      <p className="text-sm text-slate-500">{t("لقينا")} <strong>{groups.length}</strong> {t("مجموعة موظفين مكررين (بنفس الاسم أو نفس الكود). اختار مين يفضل من كل مجموعة — والبيانات (حضور، جزاءات، سلف...) هتتنقل تلقائي للي هيفضل.")}</p>
      <div className="max-h-96 space-y-4 overflow-y-auto">
        {groups.map((group, i) => (
          <div key={i} className="rounded-lg border border-amber-200 bg-amber-50/40 p-3">
            <div className="mb-2 text-xs font-semibold text-amber-700">{t("مجموعة {n} — {count} نسخ", { n: i + 1, count: group.length })}</div>
            <div className="space-y-1.5">
              {group.map((e) => (
                <label key={e.id} className="flex items-center gap-2 rounded-md border border-stone-200 bg-white px-2.5 py-1.5 text-sm">
                  <input type="radio" name={`grp-${i}`} checked={keepChoice[i] === e.id} onChange={() => setKeepChoice({ ...keepChoice, [i]: e.id })} />
                  <span className="font-medium text-slate-800">{e.name}</span>
                  <span className="text-xs text-slate-400">{e.employeeCode ? t("كود: {code}", { code: e.employeeCode }) : ""} {e.position ? `· ${e.position}` : ""} {e.salary ? `· ${fmtMoney(e.salary)} ${t("ج.م")}` : ""}</span>
                </label>
              ))}
            </div>
          </div>
        ))}
      </div>
      <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">
        <button onClick={onDone} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50">{t("إلغاء")}</button>
        <button onClick={applyMerge} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Check size={15} /> {t("تأكيد الدمج")}</button>
      </div>
    </div>
  );
}

/* ---- Bulk import: shared file parsing ---- */
function parseSpreadsheetFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array", cellDates: false });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        if (!rows.length) return reject(new Error("الملف فاضي"));
        const headers = rows[0].map((h) => String(h).trim());
        const dataRows = rows.slice(1).filter((r) => r.some((c) => c !== ""));
        resolve({ headers, dataRows });
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error("تعذّرت قراءة الملف"));
    reader.readAsArrayBuffer(file);
  });
}

function FileDropZone({ onFile, fileName }) {
  const { t } = useLang();
  const inputRef = useRef(null);
  return (
    <div
      onClick={() => inputRef.current?.click()}
      onDragOver={(e) => e.preventDefault()}
      onDrop={(e) => { e.preventDefault(); if (e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]); }}
      className="flex cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-stone-300 bg-stone-50 py-10 text-center hover:border-teal-400 hover:bg-teal-50/40"
    >
      <FileSpreadsheet size={28} className="text-slate-400" />
      <div className="text-sm font-medium text-slate-600">{fileName || t("دوس هنا أو اسحب ملف Excel / CSV")}</div>
      <div className="text-xs text-slate-400">xlsx, xls, csv</div>
      <input ref={inputRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={(e) => e.target.files[0] && onFile(e.target.files[0])} />
    </div>
  );
}

// ملحوظة: match بتحدد الكلمة (أو الكلمات) اللي بيتقارن بيها اسم عمود الملف عشان
// يتربط تلقائيًا بالحقل ده - لازم تكون كلمة مميزة للحقل ده بس، مش أول كلمة في label
// (لو استخدمنا أول كلمة في label هتلاقي "تاريخ الميلاد" و"تاريخ التعيين" الاتنين
// بيبدأوا بـ"تاريخ" فيتلخبطوا مع بعض ويتربطوا غلط بنفس العمود - ده كان باگ حقيقي حصل).
const EMPLOYEE_IMPORT_FIELDS = [
  { key: "employeeCode", label: "كود الموظف", match: ["كود"] },
  { key: "name", label: "الاسم", required: true, match: ["الاسم", "اسم الموظف"] },
  { key: "position", label: "الوظيفة", match: ["الوظيفة"] },
  { key: "department", label: "القسم", match: ["القسم"] },
  { key: "branch", label: "الفرع (لو الشركة أكتر من موقع)", match: ["الفرع"] },
  { key: "phone", label: "رقم الموبايل", match: ["موبايل", "الهاتف", "تليفون"] },
  { key: "nationalId", label: "الرقم القومي", match: ["الرقم القومي", "قومي"] },
  { key: "birthDate", label: "تاريخ الميلاد (تاريخ)", match: ["الميلاد"] },
  { key: "hireDate", label: "تاريخ التعيين (تاريخ)", match: ["التعيين"] },
  { key: "salary", label: "الراتب الأساسي (رقم)", match: ["الراتب", "المرتب"] },
  { key: "contractType", label: "نوع العقد", match: ["نوع العقد"] },
  { key: "contractStart", label: "بداية العقد (تاريخ)", match: ["بداية العقد", "بداية"] },
  { key: "contractEnd", label: "نهاية العقد (تاريخ، اختياري)", match: ["نهاية العقد", "نهاية"] },
  { key: "leaveEntitlement", label: "رصيد الإجازة السنوي (رقم، اختياري)", match: ["رصيد"] },
  { key: "weeklyOffDaysText", label: "أيام الإجازة الأسبوعية (مفصولة بفاصلة)", match: ["الإجازة الأسبوعية", "أسبوعية"] },
];

function EmployeeImportWizard({ employees, onImport, onCancel }) {
  const { t } = useLang();
  const [step, setStep] = useState(1);
  const [fileName, setFileName] = useState("");
  const [headers, setHeaders] = useState([]);
  const [rows, setRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [error, setError] = useState("");

  async function handleFile(file) {
    setError("");
    setFileName(file.name);
    try {
      const { headers, dataRows } = await parseSpreadsheetFile(file);
      setHeaders(headers);
      setRows(dataRows);
      // best-effort auto-mapping by matching header text - كل عمود بيتربط مرة واحدة بس
      // (usedIdx) عشان حقلين مختلفين (زي تاريخ الميلاد وتاريخ التعيين) ميتلخبطوش
      // ويتربطوا غلط بنفس العمود لمجرد إنهم بيبدأوا بنفس الكلمة الأولى.
      const auto = {};
      const usedIdx = new Set();
      EMPLOYEE_IMPORT_FIELDS.forEach((f) => {
        const words = f.match || [f.label.split(" ")[0]];
        const idx = headers.findIndex((h, i) => !usedIdx.has(i) && words.some((w) => h.includes(w)));
        if (idx !== -1) { auto[f.key] = idx; usedIdx.add(idx); }
      });
      setMapping(auto);
      setStep(2);
    } catch (e) { setError(e.message); }
  }

  function buildResult() {
    return rows.map((r) => {
      const rec = {};
      EMPLOYEE_IMPORT_FIELDS.forEach((f) => {
        const idx = mapping[f.key];
        // عمود مش متربط بأي حاجة في الملف ده = محدش قال حاجة عنه، فمنسيبوش يمسح قيمة
        // موجودة فعلاً للموظف (زي القسم أو تاريخ التعيين) لمجرد إن ملف التحديث ده كان
        // بس عن المرتب مثلًا. لو الحقل ده اتربط فعلاً بعمود، بياخد قيمته حتى لو فاضية.
        if (idx === undefined || idx === "") return;
        const raw = r[idx];
        if (f.key === "salary") rec.salary = Number(raw) || 0;
        else if (f.key === "leaveEntitlement") { const n = parseInt(String(raw).match(/\d+/)?.[0], 10); if (!isNaN(n)) rec.leaveEntitlement = n; }
        else if (f.key === "hireDate") rec.hireDate = excelSerialToISODate(raw) || todayISO();
        else if (f.key === "birthDate" || f.key === "contractStart" || f.key === "contractEnd") rec[f.key] = excelSerialToISODate(raw) || "";
        else if (f.key === "weeklyOffDaysText") {
          // بيقبل فواصل عادية أو "و" أو مسافات، وبيتسامح مع اختلاف رسم الألف/الهمزة وآخر الكلمة
          // (الجمعه/الجمعة) اللي بيحصل كتير في ملفات الإكسيل المكتوبة يدويًا.
          const norm = (s) => s.trim().replace(/[إأآ]/g, "ا").replace(/ة$/, "ه");
          const dayByNorm = {}; WEEKDAYS.forEach((d) => { dayByNorm[norm(d)] = d; });
          const parts = raw ? String(raw).split(/[,،\s]+/).map((s) => s.trim()).filter((s) => s && s !== "و") : [];
          const matched = parts.map((s) => dayByNorm[norm(s)]).filter(Boolean);
          rec.weeklyOffDays = matched.length ? matched : ["الجمعة"];
        }
        else rec[f.key] = String(raw || "").trim();
      });
      return rec;
    }).filter((r) => r.name);
  }

  const preview = step === 3 ? buildResult() : [];
  const matchStats = useMemo(() => {
    if (step !== 3) return { updated: 0, created: 0 };
    const byCode = {}, byName = {};
    employees.forEach((e) => {
      if (e.employeeCode) byCode[String(e.employeeCode).trim().toLowerCase()] = true;
      byName[e.name.trim().toLowerCase()] = true;
    });
    let updated = 0, created = 0;
    preview.forEach((r) => {
      const matched = (r.employeeCode && byCode[String(r.employeeCode).trim().toLowerCase()]) || byName[r.name.trim().toLowerCase()];
      if (matched) updated++; else created++;
    });
    return { updated, created };
  }, [preview, employees, step]);

  return (
    <div>
      {step === 1 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">{t("ارفع ملف فيه صف عناوين في الأول (الاسم، الوظيفة، الراتب...) وصف لكل موظف.")}</p>
          <FileDropZone onFile={handleFile} fileName={fileName} />
          {error && <p className="mt-2 text-sm text-rose-600">{t(error)}</p>}
        </div>
      )}
      {step === 2 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">{t("حدد أي عمود من ملفك يقابل كل حقل (سيبها فاضية لو مش موجودة).")}</p>
          <div className="max-h-96 space-y-2 overflow-y-auto">
            {EMPLOYEE_IMPORT_FIELDS.map((f) => (
              <div key={f.key} className="flex items-center gap-3">
                <span className="w-56 shrink-0 text-sm text-slate-600">{t(f.label)}{f.required && <span className="text-rose-500"> *</span>}</span>
                <select className={inputCls} value={mapping[f.key] ?? ""} onChange={(e) => setMapping({ ...mapping, [f.key]: e.target.value === "" ? undefined : Number(e.target.value) })}>
                  <option value="">{t("— تجاهل —")}</option>
                  {headers.map((h, i) => <option key={i} value={i}>{h}</option>)}
                </select>
              </div>
            ))}
          </div>
          <p className="mt-3 text-xs text-slate-400">{t("{n} صف اتقروا من الملف.", { n: rows.length })}</p>
          <div className="mt-4 flex justify-between border-t border-stone-200 pt-4">
            <button onClick={() => setStep(1)} className="flex items-center gap-1 rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50"><ArrowRight size={14} /> {t("رجوع")}</button>
            <button disabled={mapping.name === undefined} onClick={() => setStep(3)} className="flex items-center gap-1 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900 disabled:opacity-40">{t("معاينة")} <ArrowLeft size={14} /></button>
          </div>
        </div>
      )}
      {step === 3 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">{t("هيتم معالجة")} <strong>{preview.length}</strong> {t("صف — المطابقة بتتم بكود الموظف أو الاسم:")}</p>
          <div className="mb-3 flex gap-3">
            <div className="rounded-lg bg-sky-50 px-3 py-2 text-sm text-sky-700"><strong>{matchStats.updated}</strong> {t("هيتحدّث (موجود بالفعل)")}</div>
            <div className="rounded-lg bg-emerald-50 px-3 py-2 text-sm text-emerald-700"><strong>{matchStats.created}</strong> {t("هيتضاف كموظف جديد")}</div>
          </div>
          <div className="max-h-72 overflow-auto rounded-lg border border-stone-200">
            <table className="w-full text-xs">
              <thead><tr className="bg-stone-50"><th className="px-2 py-1.5 text-right">{t("الاسم")}</th><th className="px-2 py-1.5 text-right">{t("الوظيفة")}</th><th className="px-2 py-1.5 text-right">{t("الراتب")}</th></tr></thead>
              <tbody>{preview.slice(0, 8).map((r, i) => (
                <tr key={i} className="border-t border-stone-100"><td className="px-2 py-1.5">{r.name}</td><td className="px-2 py-1.5">{r.position || "—"}</td><td className="px-2 py-1.5 tabular-nums">{fmtMoney(r.salary)}</td></tr>
              ))}</tbody>
            </table>
          </div>
          <div className="mt-4 flex justify-between border-t border-stone-200 pt-4">
            <button onClick={() => setStep(2)} className="flex items-center gap-1 rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50"><ArrowRight size={14} /> {t("رجوع")}</button>
            <button onClick={() => onImport(preview)} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Check size={15} /> {t("تأكيد ({u} تحديث + {c} جديد)", { u: matchStats.updated, c: matchStats.created })}</button>
          </div>
        </div>
      )}
    </div>
  );
}

function EmployeeForm({ initial, settings, employees = [], onSave, onCancel }) {
  const { t } = useLang();
  const knownBranches = useMemo(() => [...new Set(employees.map((e) => (e.branch || "").trim()).filter(Boolean))], [employees]);
  const [form, setForm] = useState({
    employeeCode: initial?.employeeCode || "",
    name: initial?.name || "", position: initial?.position || "", department: initial?.department || "",
    branch: initial?.branch || "",
    phone: initial?.phone || "", nationalId: initial?.nationalId || "", hireDate: initial?.hireDate || todayISO(),
    salary: initial?.salary || "", contractType: initial?.contractType || CONTRACT_TYPES[0],
    contractStart: initial?.contractStart || todayISO(), contractEnd: initial?.contractEnd || "",
    birthDate: initial?.birthDate || "", weeklyOffDays: getWeeklyOffDays(initial || {}),
    leaveEntitlement: initial?.leaveEntitlement ?? settings.leaveDefaultDays,
  });
  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  function toggleOffDay(day) {
    setForm((f) => ({
      ...f,
      weeklyOffDays: f.weeklyOffDays.includes(day) ? f.weeklyOffDays.filter((d) => d !== day) : [...f.weeklyOffDays, day],
    }));
  }
  function submit(e) { e.preventDefault(); if (!form.name.trim()) return; onSave({ ...form, salary: Number(form.salary) || 0, leaveEntitlement: Number(form.leaveEntitlement) || 0 }); }

  return (
    <form onSubmit={submit} className="space-y-4">
      <div className="grid grid-cols-2 gap-4">
        <Field label="كود الموظف (زي كود جهاز البصمة، اختياري)"><input className={inputCls} value={form.employeeCode} onChange={(e) => set("employeeCode", e.target.value)} /></Field>
        <Field label="الاسم بالكامل"><input required className={inputCls} value={form.name} onChange={(e) => set("name", e.target.value)} /></Field>
        <Field label="رقم الموبايل"><input className={inputCls} value={form.phone} onChange={(e) => set("phone", e.target.value)} /></Field>
        <Field label="الوظيفة"><input className={inputCls} value={form.position} onChange={(e) => set("position", e.target.value)} /></Field>
        <Field label="القسم">
          <input list="departments" className={inputCls} value={form.department} onChange={(e) => set("department", e.target.value)} />
          <datalist id="departments">{DEPARTMENTS_DEFAULT.map((d) => <option key={d} value={d} />)}</datalist>
        </Field>
        <Field label="الفرع (لو الشركة أكتر من موقع)">
          <input list="branches" className={inputCls} value={form.branch} onChange={(e) => set("branch", e.target.value)} placeholder={t("مثلًا فرع المعادي")} />
          <datalist id="branches">{knownBranches.map((b) => <option key={b} value={b} />)}</datalist>
        </Field>
        <Field label="الرقم القومي"><input className={inputCls} value={form.nationalId} onChange={(e) => set("nationalId", e.target.value)} /></Field>
        <Field label="تاريخ الميلاد"><input type="date" className={inputCls} value={form.birthDate} onChange={(e) => set("birthDate", e.target.value)} /></Field>
        <Field label="تاريخ التعيين"><input type="date" className={inputCls} value={form.hireDate} onChange={(e) => set("hireDate", e.target.value)} /></Field>
        <Field label="الراتب الأساسي الشهري"><input type="number" min="0" className={inputCls} value={form.salary} onChange={(e) => set("salary", e.target.value)} /></Field>
        <Field label="نوع العقد">
          <select className={inputCls} value={form.contractType} onChange={(e) => set("contractType", e.target.value)}>
            {CONTRACT_TYPES.map((ct) => <option key={ct} value={ct}>{t(ct)}</option>)}
          </select>
        </Field>
        <Field label="بداية العقد"><input type="date" className={inputCls} value={form.contractStart} onChange={(e) => set("contractStart", e.target.value)} /></Field>
        <Field label="نهاية العقد (اختياري)"><input type="date" className={inputCls} value={form.contractEnd} onChange={(e) => set("contractEnd", e.target.value)} /></Field>
        <div className="col-span-2">
          <span className="mb-1.5 block text-sm font-medium text-slate-600">{t("أيام الإجازة الأسبوعية (اختر واحد أو أكتر)")}</span>
          <div className="flex flex-wrap gap-1.5">
            {WEEKDAYS.map((d) => (
              <button key={d} type="button" onClick={() => toggleOffDay(d)} className={`rounded-full border px-3 py-1 text-xs font-semibold ${form.weeklyOffDays.includes(d) ? "border-teal-700 bg-teal-800 text-white" : "border-stone-200 text-slate-500 hover:border-stone-300"}`}>{t(d)}</button>
            ))}
          </div>
        </div>
        <Field label="رصيد الإجازات السنوي (يوم)"><input type="number" min="0" className={inputCls} value={form.leaveEntitlement} onChange={(e) => set("leaveEntitlement", e.target.value)} /></Field>
      </div>
      <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">
        <button type="button" onClick={onCancel} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50">{t("إلغاء")}</button>
        <button type="submit" className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Save size={15} /> {t("حفظ")}</button>
      </div>
    </form>
  );
}

/* ---- Employee profile (leave / documents / reviews) ---- */
function EmployeeProfileModal({ employee, onClose, attendance, documents, setDocuments, reviews, setReviews, settings, employees, setEmployees, assets, setAssets, checklistItems, setChecklistItems, orgChart }) {
  const { t } = useLang();
  const [sub, setSub] = useState("info");
  const [pin, setPin] = useState("");
  const [portalBusy, setPortalBusy] = useState(false);
  const [portalMsg, setPortalMsg] = useState(null);
  // بيتفضل موجود بس جوه الجلسة دي (مش متسجل في Firestore ولا أي مكان دائم) عشان زرار
  // "إرسال عبر واتساب" يقدر يعرضه فورًا بعد التفعيل - نفس منطق "مفيش استرجاع مباشر"
  // اللي السيستم أصلاً بيقوله للأدمن، إحنا بس بنسهّل توصيله للحظة دي بالظبط.
  const [lastActivatedPin, setLastActivatedPin] = useState(null);
  const [confirmingReset, setConfirmingReset] = useState(false);

  async function enablePortal(e) {
    e.preventDefault();
    setPortalMsg(null);
    if (!employee.employeeCode) { setPortalMsg({ tone: "rose", text: "لازم تحدد كود الموظف الأول من زرار التعديل قبل ما تفعّل الدخول." }); return; }
    if (!/^\d{6,8}$/.test(pin)) { setPortalMsg({ tone: "rose", text: "الرقم السري لازم يكون من 6 لـ 8 أرقام (Firebase مش بيقبل باسورد أقل من 6 خانات)." }); return; }
    setPortalBusy(true);
    try {
      const authUid = await createEmployeeAuthAccount(employee.employeeCode, pin);
      setEmployees(employees.map((e) => (e.id === employee.id ? { ...e, authUid } : e)));
      setLastActivatedPin(pin);
      setPin("");
      setPortalMsg({ tone: "teal", text: "تم تفعيل الدخول. اديله كود الموظف والرقم السري ده." });
    } catch (err) {
      const already = err?.code === "auth/email-already-in-use";
      const weak = err?.code === "auth/weak-password";
      let text = "حصل خطأ أثناء التفعيل. جرب تاني.";
      if (already) text = "كود الموظف ده مستخدم بالفعل لحساب دخول موجود — لو ضاع الرقم السري، لازم تمسح الحساب من Firebase Console (Authentication → Users) وتجرب تاني.";
      else if (weak) text = "الرقم السري ضعيف جدًا بالنسبة لـ Firebase — جرب رقم من 6 أرقام أو أكتر.";
      else if (err?.code) text = `حصل خطأ أثناء التفعيل (${err.code}). جرب تاني.`;
      setPortalMsg({ tone: "rose", text });
    } finally { setPortalBusy(false); }
  }
  // "إعادة تعيين كود الدخول" مش بيقدر يغيّر باسورد حساب Firebase Auth موجود فعلاً من غير
  // باك إند (مفيش Cloud Function/Admin SDK متاح للتطبيق ده) - فالمسار الوحيد المتاح فعلاً
  // هو: يتمسح الحساب القديم يدويًا من Firebase Console الأول، وبعدين هنا بس بنسيب الأدمن
  // يمسح authUid المحلي عشان فورم "تفعيل الدخول" يظهر تاني ويقدر يحدد رقم سري جديد -
  // مش بيلمس Firebase Auth خالص.
  function forgetLocalPortalLink() {
    setEmployees(employees.map((e) => (e.id === employee.id ? { ...e, authUid: null } : e)));
    setConfirmingReset(false);
    setLastActivatedPin(null);
    setPortalMsg(null);
  }
  const today = todayISO();
  const takenLeave = Object.keys(attendance).filter((d) => yearKey(d) === yearKey(today) && getAttEntry(attendance, d, employee.id)?.status === "leave").length;
  const entitlement = employee.leaveEntitlement ?? settings.leaveDefaultDays;
  const remaining = entitlement - takenLeave;

  const empDocs = documents.filter((d) => d.employeeId === employee.id);
  const empReviews = reviews.filter((r) => r.employeeId === employee.id).sort((a, b) => (a.date < b.date ? 1 : -1));

  const [docForm, setDocForm] = useState({ name: DOC_TYPES[0], expiryDate: "", status: "متوفر" });
  // مؤشرات الأداء (KPIs) الثابتة المرتبطة بقسم أو وظيفة الموظف ده (من مكتبة settings.kpiTemplates
  // اللي الأدمن بيديرها من تاب الإعدادات) - بتتحمّل تلقائي جوه فورم التقييم عشان الأدمن يدخل
  // القيمة الفعلية لكل مؤشر وقت ما يسجّل تقييم، من غير ما يحتاج يكتبها من الصفر كل مرة.
  const matchedKpis = (settings.kpiTemplates || []).filter((k) =>
    (k.scope === "department" && k.scopeValue === employee.department) || (k.scope === "position" && k.scopeValue === employee.position)
  );
  const blankReviewForm = () => ({ date: today, score: 3, reviewer: "", notes: "", reviewType: REVIEW_TYPES[0], kpiScores: matchedKpis.map((k) => ({ kpiId: k.id, title: k.title, target: k.target || "", actual: "" })) });
  const [reviewForm, setReviewForm] = useState(blankReviewForm);

  function addDoc(e) {
    e.preventDefault();
    setDocuments([...documents, { id: uid("doc"), employeeId: employee.id, ...docForm }]);
    setDocForm({ name: DOC_TYPES[0], expiryDate: "", status: "متوفر" });
  }
  function removeDoc(id) { setDocuments(documents.filter((d) => d.id !== id)); }
  function setKpiActual(kpiId, actual) {
    setReviewForm((f) => ({ ...f, kpiScores: f.kpiScores.map((k) => (k.kpiId === kpiId ? { ...k, actual } : k)) }));
  }
  function addReview(e) {
    e.preventDefault();
    setReviews([{ id: uid("rev"), employeeId: employee.id, ...reviewForm, score: Number(reviewForm.score) }, ...reviews]);
    setReviewForm(blankReviewForm());
  }
  function removeReview(id) { setReviews(reviews.filter((r) => r.id !== id)); }

  const empChecklist = checklistItems.filter((c) => c.employeeId === employee.id);
  const onboardingItems = empChecklist.filter((c) => c.type === "onboarding");
  const offboardingItems = empChecklist.filter((c) => c.type === "offboarding");
  const isFormer = employee.status === "resigned" || employee.status === "terminated";
  function toggleChecklistItem(id) {
    setChecklistItems(checklistItems.map((c) => (c.id === id ? { ...c, done: !c.done, doneDate: !c.done ? todayISO() : null } : c)));
  }
  function removeChecklistItem(id) { setChecklistItems(checklistItems.filter((c) => c.id !== id)); }
  const [newChecklistText, setNewChecklistText] = useState("");
  function addChecklistItem(type) {
    if (!newChecklistText.trim()) return;
    setChecklistItems([...checklistItems, { id: uid("chk"), employeeId: employee.id, type, text: newChecklistText.trim(), done: false, doneDate: null }]);
    setNewChecklistText("");
  }

  const empAssets = assets.filter((a) => a.employeeId === employee.id);
  const [assetForm, setAssetForm] = useState({ name: "", assignedDate: today });
  function addAsset(e) {
    e.preventDefault();
    if (!assetForm.name.trim()) return;
    setAssets([...assets, { id: uid("asset"), employeeId: employee.id, name: assetForm.name.trim(), assignedDate: assetForm.assignedDate, returnedDate: null }]);
    setAssetForm({ name: "", assignedDate: today });
  }
  function markAssetReturned(id) { setAssets(assets.map((a) => (a.id === id ? { ...a, returnedDate: todayISO() } : a))); }
  function removeAsset(id) { setAssets(assets.filter((a) => a.id !== id)); }

  return (
    <Modal open onClose={onClose} title={t("ملف {name}", { name: employee.name })} wide>
      <div className="mb-4 flex gap-2 border-b border-stone-200 pb-3">

          <button key={k} onClick={() => setSub(k)} className={`flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium ${sub === k ? "bg-teal-800 text-white" : "text-slate-500 hover:bg-stone-100"}`}>{icon}{t(l)}</button>

      </div>

      {sub === "info" && (
        <div className="grid grid-cols-2 gap-3 md:grid-cols-3">

            ["كود الموظف", employee.employeeCode || "—"],
            ["الاسم", employee.name],
            ["القسم", employee.department || "—"],
            ["الفرع", employee.branch || "—"],
            ["الوظيفة", employee.position || "—"],
            ["معاد بداية الدوام الرسمي", settings.workStartTime || "—"],
            ["عدد أيام العمل / الأسبوع", 7 - getWeeklyOffDays(employee).length],
            ["رصيد الإجازة السنوي", entitlement],
            ["الراتب الأساسي", `${fmtMoney(employee.salary)} ${t("ج.م")}`],
            ["أجر اليوم", `${fmtMoney((Number(employee.salary) || 0) / 30)} ${t("ج.م")}`],
            ["أجر الساعة", `${fmtMoney((Number(employee.salary) || 0) / (30 * 8))} ${t("ج.م")}`],
            ["تاريخ الميلاد", employee.birthDate || "—"],
            ["رقم الموبايل", employee.phone || "—"],
            ["الرقم القومي", employee.nationalId || "—"],
            ["تاريخ التعيين", employee.hireDate || "—"],
            ["نوع العقد", employee.contractType ? t(employee.contractType) : "—"],
            ["بداية العقد", employee.contractStart || "—"],
            ["نهاية العقد", employee.contractEnd || t("غير محدد")],
            ["أيام الإجازة الأسبوعية", getWeeklyOffDays(employee).map((d) => t(d)).join("، ")],
          ].map(([label, value]) => (
            <div key={label} className="rounded-lg border border-stone-100 px-3 py-2">
              <div className="text-[11px] text-slate-400">{t(label)}</div>
              <div className="mt-0.5 text-sm font-medium text-slate-700">{value}</div>
            </div>
          ))}
        </div>
      )}
      {sub === "info" && (() => {
        const probation = computeProbationStatus(employee, settings, todayISO());
        if (probation.status === "n/a") return null;
        const toneCls = probation.status === "confirmed" ? "border-emerald-200 bg-emerald-50 text-emerald-700"
          : probation.status === "awaiting_decision" ? "border-rose-200 bg-rose-50 text-rose-700"
          : "border-amber-200 bg-amber-50 text-amber-700";
        return (
          <div className={`mt-4 flex items-center justify-between rounded-xl border p-4 ${toneCls}`}>
            <div>
              <div className="flex items-center gap-1.5 font-semibold"><ShieldCheck size={16} />

              </div>
              <p className="mt-1 text-xs">
                {probation.status === "confirmed" ? t("اتثبّت في {date}", { date: probation.confirmedAt })

                {t("تثبيت الموظف الآن")}
              </button>
            )}
          </div>

      })()}

          <div className="mt-4 rounded-xl border border-stone-200 bg-stone-50 p-4">

            <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <div>
                <div className="text-[11px] text-slate-400">{t("المدير المباشر")}</div>

              </div>
              <div>
                <div className="text-[11px] text-slate-400">{t("الفريق تحت إدارته ({n})", { n: reports.length })}</div>

                    {reports.map((r) => <StampBadge key={r.id} tone="slate">{r.name}</StampBadge>)}
                  </div>
                )}
              </div>
            </div>
          </div>

      })()}

            </div>

                <div className="space-y-1.5">
                  {reviewForm.kpiScores.map((k) => (
                    <div key={k.kpiId} className="grid grid-cols-3 items-center gap-2 text-xs">
                      <span className="text-slate-600">{k.title}</span>
                      <span className="text-slate-400">{t("المستهدف: {target}", { target: k.target || "—" })}</span>
                      <input placeholder={t("القيمة الفعلية")} className={inputCls} value={k.actual} onChange={(e) => setKpiActual(k.kpiId, e.target.value)} />
                    </div>
                  ))}
                </div>
              </div>
            )}
            <textarea placeholder={t("ملاحظات التقييم")} rows={2} className={inputCls} value={reviewForm.notes} onChange={(e) => setReviewForm({ ...reviewForm, notes: e.target.value })} />
            <button className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3 py-1.5 text-xs font-semibold text-white hover:bg-teal-900"><Plus size={14} /> {t("تسجيل تقييم")}</button>
          </form>

                  <div className="mb-1 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <div className="flex items-center gap-1.5 font-semibold text-amber-600">{Array.from({ length: r.score }).map((_, i) => <Star key={i} size={13} fill="currentColor" />)}</div>
                      {r.reviewType && r.reviewType !== REVIEW_TYPES[0] && <StampBadge tone="amber">{r.reviewType}</StampBadge>}
                    </div>
                    <div className="flex items-center gap-2 text-xs text-slate-400"><span>{r.date}</span><button onClick={() => removeReview(r.id)} className="text-slate-300 hover:text-rose-600"><Trash2 size={13} /></button></div>
                  </div>
                  {r.reviewer && <div className="text-xs text-slate-400">{t("بمعرفة: {name}", { name: r.reviewer })}</div>}
                  {r.notes && <p className="mt-1 text-slate-600">{r.notes}</p>}
                  {r.kpiScores?.length > 0 && (
                    <div className="mt-2 space-y-1 border-t border-stone-100 pt-2">
                      {r.kpiScores.map((k) => (
                        <div key={k.kpiId} className="flex items-center justify-between text-xs text-slate-500">
                          <span>{k.title}</span>
                          <span>{t("المستهدف: {target} - الفعلي: {actual}", { target: k.target || "—", actual: k.actual || "—" })}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {sub === "checklist" && (
        <div>
          <p className="mb-3 flex items-start gap-1.5 rounded-lg bg-stone-50 px-3 py-2 text-xs text-slate-500"><Info size={14} className="mt-0.5 shrink-0" />{t("خطوات ضم الموظف بتتضاف تلقائي وقت ما يتسجّل. خطوات الخروج بتتضاف تلقائي وقت ما تتغيّر حالته لـ«سابق». تقدر تضيف خطوة إضافية لأي منهم يدويًا كمان.")}</p>

          <div className="mb-5">
            <h4 className="mb-2 text-sm font-bold text-slate-700">{t("خطوات الضم")}</h4>
            {onboardingItems.length === 0 ? <p className="text-xs text-slate-400">{t("مفيش خطوات ضم مسجلة.")}</p> : (
              <div className="space-y-1.5">
                {onboardingItems.map((c) => (
                  <label key={c.id} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
                    <span className="flex items-center gap-2">
                      <input type="checkbox" checked={c.done} onChange={() => toggleChecklistItem(c.id)} className="h-4 w-4 accent-teal-700" />
                      <span className={c.done ? "text-slate-400 line-through" : "text-slate-700"}>{t(c.text)}</span>
                    </span>
                    <button type="button" onClick={() => removeChecklistItem(c.id)} className="text-slate-300 hover:text-rose-600"><Trash2 size={13} /></button>
                  </label>
                ))}
              </div>
            )}
            <div className="mt-2 flex gap-2">
              <input placeholder={t("خطوة إضافية...")} className={inputCls} value={newChecklistText} onChange={(e) => setNewChecklistText(e.target.value)} />
              <button type="button" onClick={() => addChecklistItem("onboarding")} className="flex items-center gap-1 rounded-lg bg-teal-800 px-3 py-2 text-xs font-semibold text-white hover:bg-teal-900"><Plus size={14} /> {t("إضافة")}</button>
            </div>
          </div>

          {isFormer && (
            <div>
              <h4 className="mb-2 text-sm font-bold text-slate-700">{t("خطوات الخروج")}</h4>
              {offboardingItems.length === 0 ? <p className="text-xs text-slate-400">{t("مفيش خطوات خروج مسجلة.")}</p> : (
                <div className="space-y-1.5">
                  {offboardingItems.map((c) => (
                    <label key={c.id} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
                      <span className="flex items-center gap-2">
                        <input type="checkbox" checked={c.done} onChange={() => toggleChecklistItem(c.id)} className="h-4 w-4 accent-teal-700" />
                        <span className={c.done ? "text-slate-400 line-through" : "text-slate-700"}>{t(c.text)}</span>
                      </span>
                      <button type="button" onClick={() => removeChecklistItem(c.id)} className="text-slate-300 hover:text-rose-600"><Trash2 size={13} /></button>
                    </label>
                  ))}
                </div>
              )}
              <div className="mt-2 flex gap-2">
                <input placeholder={t("خطوة إضافية...")} className={inputCls} value={newChecklistText} onChange={(e) => setNewChecklistText(e.target.value)} />

              </div>
            </div>
          )}
        </div>

          <form onSubmit={addAsset} className="mb-4 grid grid-cols-3 gap-2">

        <div>

              <form onSubmit={enablePortal} className="flex items-end gap-2">

                </Field>
                <button type="button" onClick={() => setPin(randomPin())} className="flex items-center gap-1 rounded-lg border border-stone-300 px-2.5 py-2 text-xs font-medium text-slate-600 hover:bg-stone-50">
                  <RefreshCw size={13} /> {t("رقم عشوائي")}

                  {portalBusy ? <Loader2 size={14} className="animate-spin" /> : <LogIn size={14} />} {t("تفعيل الدخول")}

/* ================= ATTENDANCE ================= */
function AttendanceTab({ employees, attendance, patchAttendance, settings }) {
  const { t, lang } = useLang();
  const [date, setDate] = useState(todayISO());
  const [importOpen, setImportOpen] = useState(false);
  const dayRecord = attendance[date] || {};

  // Builds a sparse patch - only the (date, employeeId) pairs this import actually names, plus
  // whatever isNonWorkday-eligible gaps fillAbsence explicitly marks absent - rather than
  // spreading the full known `attendance` history the way this used to. See
  // syncAttendancePatch's comment (near its definition) for why that distinction matters.
  function importBulk(entries, fillAbsence, fromDate, toDate) {
    const patch = [];
    const touched = new Set();
    entries.forEach(({ empId, date: d, status, overtimeHours, lateMinutes }) => {
      const current = getAttEntry(attendance, d, empId) || { status: null, overtimeHours: 0, lateMinutes: 0 };
      patch.push({ date: d, employeeId: empId, status: status || current.status, overtimeHours: overtimeHours ?? current.overtimeHours, lateMinutes: lateMinutes ?? current.lateMinutes });
      touched.add(`${d}_${empId}`);
    });
    if (fillAbsence && fromDate && toDate) {
      let d = new Date(fromDate);
      const end = new Date(toDate);
      while (d <= end) {
        const ds = d.toISOString().slice(0, 10);
        employees.forEach((e) => {
          if (isNonWorkday(e, ds, settings.publicHolidays)) return;
          const key = `${ds}_${e.id}`;
          if (touched.has(key)) return;
          const existing = getAttEntry(attendance, ds, e.id);
          if (!existing || !existing.status) {
            patch.push({ date: ds, employeeId: e.id, status: "absent", overtimeHours: existing?.overtimeHours || 0, lateMinutes: 0 });
            touched.add(key);
          }
        });
        d.setDate(d.getDate() + 1);
      }
    }
    patchAttendance(patch);
    setImportOpen(false);
  }

  function setStatus(empId, status) {
    const current = getAttEntry(attendance, date, empId) || { status: null, overtimeHours: 0, lateMinutes: 0 };
    const nextStatus = current.status === status ? null : status;
    // Moving away from "late" (including toggling it off) clears any lateMinutes left over -
    // a day that isn't marked "late" should never carry a leftover minutes figure into payroll.
    const nextLateMinutes = nextStatus === "late" ? current.lateMinutes : 0;
    patchAttendance([{ date, employeeId: empId, status: nextStatus, overtimeHours: current.overtimeHours, lateMinutes: nextLateMinutes }]);
  }
  function setOvertime(empId, hours) {
    const current = getAttEntry(attendance, date, empId) || { status: null, overtimeHours: 0, lateMinutes: 0 };
    patchAttendance([{ date, employeeId: empId, status: current.status, overtimeHours: Number(hours) || 0, lateMinutes: current.lateMinutes }]);
  }
  // Entering minutes late auto-promotes the status to "late" (when it's currently unset or
  // "present") - this is the same rule the file importer applies (see buildResult below), so
  // "متأخر" and a real minutes figure can never disagree with each other inside this app, no
  // matter whether the number came from a click here or from an imported spreadsheet. An
  // explicit "غائب"/"إجازة" status is left alone - lateness doesn't apply to a day off, so a
  // number typed here while one of those is set is discarded (mirrors setStatus's own rule of
  // never letting a non-"late" record carry a stray lateMinutes value into payroll).
  function setLateMinutes(empId, minutes) {
    const current = getAttEntry(attendance, date, empId) || { status: null, overtimeHours: 0, lateMinutes: 0 };
    const mins = Number(minutes) || 0;
    const nextStatus = mins > 0 && (!current.status || current.status === "present") ? "late" : current.status;
    const nextLateMinutes = nextStatus === "late" ? mins : 0;
    patchAttendance([{ date, employeeId: empId, status: nextStatus, overtimeHours: current.overtimeHours, lateMinutes: nextLateMinutes }]);
  }
  function shiftDay(delta) { const d = new Date(date); d.setDate(d.getDate() + delta); setDate(d.toISOString().slice(0, 10)); }

  const counts = employees.reduce((acc, e) => { const st = getAttEntry(attendance, date, e.id)?.status; if (st) acc[st] = (acc[st] || 0) + 1; return acc; }, { present: 0, absent: 0, late: 0, leave: 0 });
  // المتأخر لسه حاضر فعليًا - نفس القاعدة المتبعة في لوحة المتابعة وتقرير معدل الحضور:
  // كارت "حاضر" هنا لازم يشمل المتأخرين، و"متأخر" بيبقى بس توضيح لكام واحد من الحاضرين
  // ده كان متأخر (مش فئة منفصلة بتتشال من العدد).
  const presentIncludingLate = counts.present + counts.late;

  return (
    <div>
      <SectionTitle eyebrow="سجل يومي" title="الحضور والانصراف" action={
        <div className="flex items-center gap-2">
          <button onClick={() => setImportOpen(true)} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50">
            <Upload size={15} /> {t("استيراد من ملف")}
          </button>
          <button onClick={() => shiftDay(-1)} className="rounded-lg border border-stone-300 p-2 hover:bg-stone-50">{lang === "en" ? <ChevronLeft size={16} /> : <ChevronRight size={16} />}</button>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className={`${inputCls} w-auto`} />
          <button onClick={() => shiftDay(1)} className="rounded-lg border border-stone-300 p-2 hover:bg-stone-50">{lang === "en" ? <ChevronRight size={16} /> : <ChevronLeft size={16} />}</button>
        </div>
      } />

      <div className="mb-5 grid grid-cols-4 gap-3">
        <div className="rounded-xl bg-emerald-50 px-4 py-3 text-emerald-700"><div className="text-xl font-bold tabular-nums">{presentIncludingLate}</div><div className="text-xs font-medium">{t("حاضر")}</div></div>
        <div className="rounded-xl bg-rose-50 px-4 py-3 text-rose-700"><div className="text-xl font-bold tabular-nums">{counts.absent}</div><div className="text-xs font-medium">{t("غايب")}</div></div>
        <div className="rounded-xl bg-amber-50 px-4 py-3 text-amber-700"><div className="text-xl font-bold tabular-nums">{counts.late}</div><div className="text-xs font-medium">{t("متأخر")}</div></div>
        <div className="rounded-xl bg-sky-50 px-4 py-3 text-sky-700"><div className="text-xl font-bold tabular-nums">{counts.leave}</div><div className="text-xs font-medium">{t("إجازة")}</div></div>
      </div>

      {employees.length === 0 ? <Card className="p-0"><EmptyState text="لسه معملتش أي موظف نشط." /></Card> : (
        <Card className="overflow-hidden p-0">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-stone-200 bg-stone-50 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">
                <th className="px-4 py-3">{t("الموظف")}</th><th className="px-4 py-3">{t("الحالة")}</th><th className="px-4 py-3">{t("دقايق التأخير")}</th><th className="px-4 py-3">{t("ساعات إضافي")}</th>
              </tr>
            </thead>
            <tbody>
              {employees.map((e) => {
                const nonWorkReason = isNonWorkday(e, date, settings.publicHolidays);
                const entry = getAttEntry(attendance, date, e.id);
                return (
                  <tr key={e.id} className="border-b border-stone-100 last:border-0 hover:bg-stone-50">
                    <td className="px-4 py-3 font-medium text-slate-800">{e.name}</td>
                    <td className="px-4 py-3">
                      {nonWorkReason ? <StampBadge tone="slate">{nonWorkReason}</StampBadge> : (
                        <div className="flex gap-1.5">
                          {Object.keys(STATUS_LABELS).map((st) => (
                            <button key={st} onClick={() => setStatus(e.id, st)} className={`rounded-full border px-2.5 py-1 text-xs font-semibold transition-colors ${entry?.status === st ? STATUS_COLORS[st] : "border-stone-200 text-slate-400 hover:border-stone-300"}`}>{t(STATUS_LABELS[st])}</button>
                          ))}
                        </div>
                      )}
                    </td>
                    <td className="px-4 py-3">
                      <input type="number" min="0" step="1" className="w-20 rounded-md border border-stone-200 px-2 py-1 text-xs tabular-nums outline-none focus:border-teal-500" value={entry?.lateMinutes || ""} onChange={(e2) => setLateMinutes(e.id, e2.target.value)} placeholder="0" />
                    </td>
                    <td className="px-4 py-3">
                      <input type="number" min="0" step="0.5" className="w-20 rounded-md border border-stone-200 px-2 py-1 text-xs tabular-nums outline-none focus:border-teal-500" value={entry?.overtimeHours || ""} onChange={(e2) => setOvertime(e.id, e2.target.value)} placeholder="0" />
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </Card>
      )}

      <Modal open={importOpen} onClose={() => setImportOpen(false)} title="استيراد الحضور والانصراف" wide>
        <AttendanceImportWizard employees={employees} settings={settings} onImport={importBulk} onCancel={() => setImportOpen(false)} />
      </Modal>
    </div>
  );
}

const ATTENDANCE_IMPORT_FIELDS = [
  { key: "employeeCode", label: "كود الموظف (أدق لو متاح، زي كود جهاز البصمة)" },
  { key: "employeeName", label: "اسم الموظف" },
  { key: "date", label: "التاريخ", required: true },
  { key: "timeIn", label: "وقت الحضور (لو متاح)" },
  { key: "timeOut", label: "وقت الانصراف (لو متاح، اختياري)" },
  { key: "statusText", label: "الحالة الجاهزة (لو الملف بيقولها مباشرة)" },
  { key: "lateMinutes", label: "دقايق التأخير (لو الملف فيه عمود بيها — بتلغي أي حالة \"حاضر\" متضاربة معاها)" },
  { key: "overtimeHours", label: "ساعات إضافي (لو متاحة)" },
];

function AttendanceImportWizard({ employees, settings, onImport, onCancel }) {
  const { t } = useLang();
  const [step, setStep] = useState(1);
  const [fileName, setFileName] = useState("");
  const [headers, setHeaders] = useState([]);
  const [rows, setRows] = useState([]);
  const [mapping, setMapping] = useState({});
  const [error, setError] = useState("");
  const [fillAbsence, setFillAbsence] = useState(true);
  const [range, setRange] = useState({ from: "", to: "" });

  async function handleFile(file) {
    setError("");
    setFileName(file.name);
    try {
      const { headers, dataRows } = await parseSpreadsheetFile(file);
      setHeaders(headers);
      setRows(dataRows);
      const auto = {};
      ATTENDANCE_IMPORT_FIELDS.forEach((f) => {
        const idx = headers.findIndex((h) => {
          const hl = h.toLowerCase();
          if (f.key === "employeeName") return hl.includes("name") || h.includes("اسم") || hl.includes("employee");
          if (f.key === "date") return hl.includes("date") || h.includes("تاريخ");
          if (f.key === "timeIn") return hl.includes("in") || h.includes("حضور") || h.includes("دخول");
          if (f.key === "timeOut") return hl.includes("out") || h.includes("انصراف") || h.includes("خروج");
          if (f.key === "statusText") return hl.includes("status") || h.includes("حالة");
          if (f.key === "lateMinutes") return hl.includes("late") || h.includes("دقائق") || h.includes("تأخير");
          if (f.key === "overtimeHours") return hl.includes("overtime") || h.includes("إضافي");
          return false;
        });
        if (idx !== -1) auto[f.key] = idx;
      });
      setMapping(auto);
      setStep(2);
    } catch (e) { setError(e.message); }
  }

  function buildResult() {
    const nameToId = {};
    employees.forEach((e) => { nameToId[e.name.trim().toLowerCase()] = e.id; });
    const codeToId = {};
    employees.forEach((e) => { if (e.employeeCode) codeToId[String(e.employeeCode).trim().toLowerCase()] = e.id; });

    const results = [];
    const unmatchedNames = new Set();
    let minDate = null, maxDate = null;

    rows.forEach((r) => {
      const codeIdx = mapping.employeeCode;
      const nameIdx = mapping.employeeName;
      const dateIdx = mapping.date;
      if ((codeIdx === undefined && nameIdx === undefined) || dateIdx === undefined) return;

      let empId = null;
      let displayLabel = "";
      if (codeIdx !== undefined) {
        const rawCode = String(r[codeIdx] || "").trim();
        displayLabel = rawCode;
        empId = codeToId[rawCode.toLowerCase()];
      }
      if (!empId && nameIdx !== undefined) {
        const rawName = String(r[nameIdx] || "").trim();
        if (!displayLabel) displayLabel = rawName;
        empId = nameToId[rawName.toLowerCase()];
      }

      const isoDate = excelSerialToISODate(r[dateIdx]);
      if (!isoDate) return;
      if (!minDate || isoDate < minDate) minDate = isoDate;
      if (!maxDate || isoDate > maxDate) maxDate = isoDate;
      if (!empId) { unmatchedNames.add(displayLabel || "—"); return; }

      let lateMinutes;
      if (mapping.lateMinutes !== undefined) {
        const rawLate = r[mapping.lateMinutes];
        const n = Number(rawLate);
        if (rawLate !== null && rawLate !== "" && !isNaN(n)) lateMinutes = n;
      }
      let overtimeHours;
      if (mapping.overtimeHours !== undefined) {
        const rawOt = r[mapping.overtimeHours];
        const n = Number(rawOt);
        if (rawOt !== null && rawOt !== "" && !isNaN(n)) overtimeHours = n;
      }

      let status = null;
      // A real "late minutes" figure is ground truth and wins over whatever a separate
      // "Status"/statusText column says - a raw attendance export commonly marks someone
      // "Present" for having clocked in at all, even on a day they clocked in late, which is
      // exactly the mismatch reported live (an employee showing "present, not late" in this
      // app while a device export's own late-minutes column said 60). Trusting the minutes
      // column instead of the status text column resolves that at the source.
      if (lateMinutes > 0) {
        status = "late";
      } else if (mapping.statusText !== undefined) {
        status = normalizeStatusText(r[mapping.statusText]);
      }
      if (!status && mapping.timeIn !== undefined) {
        const inMin = parseTimeToMinutes(r[mapping.timeIn]);
        if (inMin !== null) {
          const startMin = parseTimeToMinutes(settings.workStartTime) ?? 540;
          const diff = inMin - startMin;
          if (diff > (settings.lateGraceMinutes || 0)) {
            status = "late";
            // No explicit Late Mins column was mapped - derive an actual minutes-late figure
            // from the real clock-in time instead of leaving it blank, so payroll still sees a
            // number to deduct against.
            if (lateMinutes === undefined) lateMinutes = diff;
          } else {
            status = "present";
          }
        }
      }
      if (!status) status = "present"; // a punch/row exists, so treat as present by default

      results.push({ empId, date: isoDate, status, overtimeHours, lateMinutes: status === "late" ? (lateMinutes || 0) : 0 });
    });

    return { results, unmatchedNames: [...unmatchedNames], minDate, maxDate };
  }

  const built = step === 3 ? buildResult() : { results: [], unmatchedNames: [], minDate: null, maxDate: null };

  function goPreview() {
    const b = buildResult();
    setRange({ from: b.minDate || todayISO(), to: b.maxDate || todayISO() });
    setStep(3);
  }

  return (
    <div>
      {step === 1 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">{t("يشتغل مع أي مصدر: تقرير جهاز البصمة (وقت حضور/انصراف)، أو ملف يدوي فيه عمود \"الحالة\" جاهز.")}</p>
          <FileDropZone onFile={handleFile} fileName={fileName} />
          {error && <p className="mt-2 text-sm text-rose-600">{t(error)}</p>}
        </div>
      )}
      {step === 2 && (
        <div>
          <p className="mb-3 text-sm text-slate-500">{t("حدد الأعمدة. لازم التاريخ + (كود الموظف أو اسمه على الأقل) — بعد كده إما \"الحالة الجاهزة\" أو \"وقت الحضور\" (عشان نحسب متأخر تلقائي). لو حددت عمود \"دقايق التأخير\" هيبقى هو الأساس دايمًا (حتى لو عمود \"الحالة\" في نفس الملف بيقول \"حاضر\")، وهيتحسب منه خصم في المرتب تلقائي زي ساعات الإضافي بالظبط.")}</p>
          <div className="space-y-2">
            {ATTENDANCE_IMPORT_FIELDS.map((f) => (
              <div key={f.key} className="flex items-center gap-3">
                <span className="w-64 shrink-0 text-sm text-slate-600">{t(f.label)}{f.required && <span className="text-rose-500"> *</span>}</span>
                <select className={inputCls} value={mapping[f.key] ?? ""} onChange={(e) => setMapping({ ...mapping, [f.key]: e.target.value === "" ? undefined : Number(e.target.value) })}>
                  <option value="">{t("— تجاهل —")}</option>
                  {headers.map((h, i) => <option key={i} value={i}>{h}</option>)}
                </select>
              </div>
            ))}
          </div>
          <p className="mt-3 text-xs text-slate-400">{t("{n} صف اتقروا من الملف. الموظف بيتطابق بالاسم بالظبط مع اللي مسجل في تاب الموظفين.", { n: rows.length })}</p>
          <div className="mt-4 flex justify-between border-t border-stone-200 pt-4">
            <button onClick={() => setStep(1)} className="flex items-center gap-1 rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50"><ArrowRight size={14} /> {t("رجوع")}</button>
            <button disabled={(mapping.employeeCode === undefined && mapping.employeeName === undefined) || mapping.date === undefined} onClick={goPreview} className="flex items-center gap-1 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900 disabled:opacity-40">{t("معاينة")} <ArrowLeft size={14} /></button>
          </div>
        </div>
      )}
      {step === 3 && (
        <div>
          <p className="mb-2 text-sm text-slate-500">{t("هيتسجل")} <strong>{built.results.length}</strong> {t("سجل حضور.")}</p>
          {built.unmatchedNames.length > 0 && (
            <div className="mb-3 rounded-lg bg-amber-50 px-3 py-2 text-xs text-amber-700">
              <strong>{built.unmatchedNames.length}</strong> {t("اسم في الملف ملقيناش موظف مطابق له في النظام (اتجاهلوا):")} {built.unmatchedNames.slice(0, 6).join("، ")}{built.unmatchedNames.length > 6 ? "..." : ""}
            </div>
          )}
          <div className="mb-4 rounded-lg bg-stone-50 p-3">
            <label className="flex items-center gap-2 text-sm font-medium text-slate-700">
              <input type="checkbox" checked={fillAbsence} onChange={(e) => setFillAbsence(e.target.checked)} />
              {t("علّم أي موظف نشط مالوش سجل في يوم شغل (خلال الفترة دي) كـ \"غايب\" تلقائيًا")}
            </label>
            {fillAbsence && (
              <div className="mt-2 grid grid-cols-2 gap-3">
                <Field label="من تاريخ"><input type="date" className={inputCls} value={range.from} onChange={(e) => setRange({ ...range, from: e.target.value })} /></Field>
                <Field label="إلى تاريخ"><input type="date" className={inputCls} value={range.to} onChange={(e) => setRange({ ...range, to: e.target.value })} /></Field>
              </div>
            )}
          </div>
          <div className="mt-4 flex justify-between border-t border-stone-200 pt-4">
            <button onClick={() => setStep(2)} className="flex items-center gap-1 rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50"><ArrowRight size={14} /> {t("رجوع")}</button>
            <button onClick={() => onImport(built.results, fillAbsence, range.from, range.to)} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Check size={15} /> {t("تأكيد الاستيراد")}</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= PENALTIES (+ warnings) ================= */
function PenaltiesTab({ employees, penalties, setPenalties }) {
  const { t } = useLang();
  const [modalOpen, setModalOpen] = useState(false);
  function add(data) { setPenalties([{ id: uid("pen"), ...data }, ...penalties]); setModalOpen(false); }
  function remove(id) { setPenalties(penalties.filter((p) => p.id !== id)); }
  function empName(id) { return employees.find((e) => e.id === id)?.name || t("موظف سابق"); }
  const sorted = [...penalties].sort((a, b) => (a.date < b.date ? 1 : -1));
