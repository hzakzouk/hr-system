function FormerEmployeesTab({ employees, setEmployees, allEmployees, onDelete }) {
  const { t } = useLang();
  const [editing, setEditing] = useState(null);
  const [selected, setSelected] = useState(() => new Set());
  const [confirmDelete, setConfirmDelete] = useState(null);
  function saveSettlement(id, data) {
    setEmployees(allEmployees.map((e) => (e.id === id ? { ...e, ...data } : e)));
    setEditing(null);
  }
  function reactivate(id) {
    setEmployees(allEmployees.map((e) => (e.id === id ? { ...e, status: "active" } : e)));
  }
  function toggleSelected(id) {
    setSelected((s) => { const n = new Set(s); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  }
  const allSelected = employees.length > 0 && employees.every((e) => selected.has(e.id));
  const someSelected = employees.some((e) => selected.has(e.id));
  function toggleSelectAll() {
    setSelected((s) => {
      const n = new Set(s);
      if (allSelected) employees.forEach((e) => n.delete(e.id));
      else employees.forEach((e) => n.add(e.id));
      return n;
    });
  }
  function runConfirmedDelete() {
    onDelete(confirmDelete.map((e) => e.id));
    setSelected((s) => { const n = new Set(s); confirmDelete.forEach((e) => n.delete(e.id)); return n; });
    setConfirmDelete(null);
  }
  return (
    <div>
      <SectionTitle eyebrow={t("{n} موظف سابق", { n: employees.length })} title={t("موظفون سابقون")} action={
        selected.size > 0 && (
          <button onClick={() => setConfirmDelete(employees.filter((e) => selected.has(e.id)))} className="flex items-center gap-1.5 rounded-lg border border-rose-500 bg-rose-50 px-3.5 py-2 text-sm font-semibold text-rose-700 hover:bg-rose-100">
            <Trash2 size={16} /> {t("حذف المحدد ({n})", { n: selected.size })}
          </button>
        )
      } />
      {employees.length === 0 ? <Card className="p-0"><EmptyState text="مفيش موظفين سابقين مسجلين." /></Card> : (
        <Card className="overflow-hidden p-0">
          <table className="w-full text-sm">
            <thead><tr className="border-b border-stone-200 bg-stone-50 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">
              <th className="w-8 px-4 py-3">
                <input type="checkbox" checked={allSelected} ref={(el) => { if (el) el.indeterminate = someSelected && !allSelected; }} onChange={toggleSelectAll} className="h-4 w-4 rounded border-stone-300" />
              </th>
              <th className="px-4 py-3">{t("الاسم")}</th><th className="px-4 py-3">{t("تاريخ التعيين")}</th><th className="px-4 py-3">{t("تاريخ الاستقالة")}</th><th className="px-4 py-3">{t("تسوية نهاية الخدمة")}</th><th className="px-4 py-3"></th>
            </tr></thead>
            <tbody>
              {employees.map((e) => (
                <tr key={e.id} className={`border-b border-stone-100 last:border-0 hover:bg-stone-50 ${selected.has(e.id) ? "bg-rose-50/40" : ""}`}>
                  <td className="px-4 py-3"><input type="checkbox" checked={selected.has(e.id)} onChange={() => toggleSelected(e.id)} className="h-4 w-4 rounded border-stone-300" /></td>
                  <td className="px-4 py-3 font-medium text-slate-800">{e.name}</td>
                  <td className="px-4 py-3 text-slate-500">{e.hireDate}</td>
                  <td className="px-4 py-3 text-slate-500">{e.resignationDate}</td>
                  <td className="px-4 py-3 tabular-nums text-slate-700">{e.settlementAmount ? `${fmtMoney(e.settlementAmount)} ${t("ج.م")}` : "—"}</td>
                  <td className="px-4 py-3">
                    <div className="flex items-center gap-1">
                      <button onClick={() => setEditing(e)} className="rounded-md p-1.5 text-slate-400 hover:bg-stone-100 hover:text-teal-700"><Pencil size={15} /></button>
                      <button onClick={() => reactivate(e.id)} title={t("إعادة تفعيل")} className="rounded-md p-1.5 text-slate-400 hover:bg-emerald-50 hover:text-emerald-600"><Check size={15} /></button>
                      <button onClick={() => setConfirmDelete([e])} title={t("حذف نهائي")} className="rounded-md p-1.5 text-slate-400 hover:bg-rose-50 hover:text-rose-600"><Trash2 size={15} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
      )}
      <Modal open={!!editing} onClose={() => setEditing(null)} title={t("تسوية نهاية الخدمة")}>
        {editing && <SettlementForm emp={editing} onSave={(d) => saveSettlement(editing.id, d)} onCancel={() => setEditing(null)} />}
      </Modal>
      {confirmDelete && (
        <EmployeeDeleteConfirmModal employees={confirmDelete} onConfirm={runConfirmedDelete} onCancel={() => setConfirmDelete(null)} />
      )}
    </div>
  );
}

function PayrollTab({ employees, attendance, penalties, payrollMeta, setPayrollMeta, advances, settings, payslipDocs, onSyncPayslips }) {
  const { t, lang } = useLang();
  const [ym, setYm] = useState(todayISO().slice(0, 7));
  const [payslipEmp, setPayslipEmp] = useState(null);
  const meta = payrollMeta[ym] || {};

  function setMetaFor(empId, patch) { setPayrollMeta({ ...payrollMeta, [ym]: { ...meta, [empId]: { ...(meta[empId] || {}), ...patch } } }); }

  const rows = employees.map((e) => computePayrollRow(e, ym, attendance, penalties, advances, settings, meta));
  const syncedCount = payslipDocs.filter((d) => d.id.startsWith(`${ym}_`)).length;
  const totals = rows.reduce((acc, r) => {
    acc.base += Number(r.emp.salary) || 0;
    acc.deductions += r.absenceDeduction + r.lateDeduction + r.penaltyDeduction + r.advanceDeduction + r.insuranceDeduction + r.taxDeduction;
    acc.additions += r.overtimePay + r.bonus;
    acc.net += r.net;
    return acc;
  }, { base: 0, deductions: 0, additions: 0, net: 0 });

  function shiftMonth(delta) {
    const [y, m] = ym.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    setYm(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);

    <div>

        <p className="text-xs text-teal-700">
          {syncedCount === 0 ? t("بوابة الموظفين لسه ما شافتش مرتب الشهر ده.") : t("متزامن مع بوابة الموظفين: {synced} من {total} موظف.", { synced: syncedCount, total: rows.length })}

// Same JSON shape as the old localStorage-era backup file (hr_employees, hr_attendance,
// hr_payroll, ...) so a file downloaded before the Firestore migration is still a valid
// import here — this doubles as the one-time migration tool: export from Firestore any
// time as a safety copy, or import an old localStorage backup straight into Firestore.
const BACKUP_KEYS = ["hr_employees", "hr_attendance", "hr_penalties", "hr_payroll", "hr_advances", "hr_documents", "hr_reviews", "hr_settings", "hr_orgchart"];

function BackupSection({ employees, attendance, penalties, payrollMeta, advances, documents, reviews, settings, orgChart, upd }) {
  const { t } = useLang();
  const fileRef = useRef(null);
  const [msg, setMsg] = useState(null); // { tone: "teal" | "rose", text }
  const [busy, setBusy] = useState(false);

  function exportBackup() {
    const payload = {
      app: "hr-system", exportedAt: new Date().toISOString(),
      data: {
        hr_employees: employees, hr_attendance: attendance, hr_penalties: penalties,
        hr_payroll: payrollMeta, hr_advances: advances, hr_documents: documents,
        hr_reviews: reviews, hr_settings: settings, hr_orgchart: orgChart,
      },
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `hr-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setMsg({ tone: "teal", text: t("تم تحميل نسخة احتياطية من قاعدة البيانات الحالية.") });
  }

  async function handleImportFile(file) {
    setMsg(null);
    setBusy(true);
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const data = parsed && parsed.data ? parsed.data : parsed;
      const imported = [];
      if (data.hr_employees) { upd.employees(data.hr_employees); imported.push("الموظفين"); }
      if (data.hr_attendance) { upd.attendance(data.hr_attendance); imported.push("الحضور"); }
      if (data.hr_penalties) { upd.penalties(data.hr_penalties); imported.push("الجزاءات"); }
      if (data.hr_payroll) { upd.payrollMeta(data.hr_payroll); imported.push("المرتبات"); }
      if (data.hr_advances) { upd.advances(data.hr_advances); imported.push("السلف"); }
      if (data.hr_documents) { upd.documents(data.hr_documents); imported.push("المستندات"); }
      if (data.hr_reviews) { upd.reviews(data.hr_reviews); imported.push("التقييمات"); }
      if (data.hr_settings) { upd.settings({ ...DEFAULT_SETTINGS, ...data.hr_settings }); imported.push("الإعدادات"); }
      if (data.hr_orgchart) { upd.orgChart({ ...DEFAULT_ORG_CHART, ...data.hr_orgchart }); imported.push("الهيكل التنظيمي"); }
      if (imported.length === 0) { setMsg({ tone: "rose", text: t("الملف ده مش نسخة احتياطية من النظام ده — مفيش أي بيانات معروفة فيه.") }); return; }
      setMsg({ tone: "teal", text: t("تم إرسال {n} من مجموعات البيانات لقاعدة البيانات — التحديث بيظهر تلقائي في الشاشة خلال ثواني.", { n: imported.length }) });
    } catch (err) {
      setMsg({ tone: "rose", text: t("تعذّر قراءة الملف — تأكد إنه ملف JSON صحيح من نسخة احتياطية سابقة.") });
    } finally {
      setBusy(false);
      if (fileRef.current) fileRef.current.value = "";
    }
  }

  return (
    <Card className="mb-6 p-5">
      <h3 className="mb-1 flex items-center gap-2 font-bold text-slate-800"><Save size={16} /> {t("النسخ الاحتياطي والاستعادة")}</h3>
      <p className="mb-4 text-xs text-slate-500">
        {t("البيانات دلوقتي متخزنة في قاعدة بيانات Firestore المشتركة، مش في متصفحك بس. برضه خد نسخة احتياطية بانتظام واحفظها في مكان آمن — نفس الزرار بيستخدم كمان لاستيراد نسخة قديمة (حتى لو كانت من زمن التخزين المحلي) مباشرة في قاعدة البيانات.")}
      </p>
      <div className="flex flex-wrap items-center gap-2">
        <button onClick={exportBackup} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">
          <Save size={15} /> {t("تحميل نسخة احتياطية (JSON)")}
        </button>
        <button onClick={() => fileRef.current?.click()} disabled={busy} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3.5 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50 disabled:opacity-50">
          {busy ? <Loader2 size={15} className="animate-spin" /> : <Upload size={15} />} {t("استيراد نسخة احتياطية")}
        </button>
        <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={(e) => e.target.files[0] && handleImportFile(e.target.files[0])} />
      </div>
      {msg && <p className={`mt-3 text-xs font-medium ${msg.tone === "rose" ? "text-rose-600" : "text-teal-700"}`}>{msg.text}</p>}
    </Card>
  );
}

// Turns one changed field's raw value (from or to) into short displayable text - passed
// through t() by the caller afterwards, so a canonical Arabic value (a status, a stage, an
// action type) still translates correctly in English mode.
function formatAuditValue(v) {
  if (v === null || v === undefined || v === "") return "—";
  if (Array.isArray(v)) return v.length === 0 ? "—" : v.map((x) => (typeof x === "object" && x !== null ? JSON.stringify(x) : String(x))).join("، ");
  if (typeof v === "boolean") return v ? "نعم" : "لا";
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}

function AuditLogTab({ auditLog }) {
  const { t } = useLang();
  const [collectionFilter, setCollectionFilter] = useState("all");
  const [search, setSearch] = useState("");

  const sorted = useMemo(() => [...(auditLog || [])].sort((a, b) => (b.at || "").localeCompare(a.at || "")), [auditLog]);

  const filtered = useMemo(() => sorted.filter((e) => {
    if (collectionFilter !== "all" && e.collection !== collectionFilter) return false;
    if (search.trim() && !(e.actorEmail || "").toLowerCase().includes(search.trim().toLowerCase())) return false;
    return true;
  }), [sorted, collectionFilter, search]);

  const visible = filtered.slice(0, 300);

  return (
    <div>
      <SectionTitle eyebrow={t("سجل كل التعديلات المسجلة على النظام")} title="سجل النشاط" />

        <EmptyState text="مفيش أي نشاط مسجل لسه." />

        <div className="space-y-2.5">
          {visible.map((e) => <AuditLogEntryCard key={e.id} entry={e} />)}

// Small hand-rolled vertical bar chart (no external charting library) - callers pass already-
// translated `label` strings, so this component never needs useLang() itself.
function MiniBarChart({ bars, formatValue, maxValue }) {
  const max = maxValue ?? Math.max(1, ...bars.map((b) => Math.abs(b.value) || 0));
  const toneCls = { teal: "bg-teal-700", emerald: "bg-emerald-600", rose: "bg-rose-600", amber: "bg-amber-500" };
  return (
    <div className="flex h-40 items-end gap-2">
      {bars.map((b, i) => (
        <div key={i} className="flex flex-1 flex-col items-center gap-1">
          <span className="text-[10px] font-semibold tabular-nums text-slate-500">{formatValue ? formatValue(b.value) : b.value}</span>
          <div className="flex w-full flex-1 items-end">
            <div className={`w-full rounded-t-md ${toneCls[b.tone || "teal"]}`} style={{ height: `${b.value ? Math.max(3, (Math.abs(b.value) / max) * 100) : 0}%` }} />
          </div>
          <span className="whitespace-nowrap text-[10px] text-slate-400">{b.label}</span>
        </div>
      ))}
    </div>
  );
}

// Horizontal bar list (department headcount, etc.) - same "pre-translated labels" contract.
function HBarList({ rows }) {

}

  const rows = useMemo(
    () => range.map((ym) => computeMonthlyReportRow(ym, employees, attendance, penalties, advances, payrollMeta, settings)),
    [range, employees, attendance, penalties, advances, payrollMeta, settings]
  );
  const deptRows = useMemo(() => computeDepartmentHeadcount(activeEmployees), [activeEmployees]);

  function monthLabel(ym) {
    const [y, m] = ym.split("-").map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString(lang === "en" ? "en-GB" : "ar-EG", { month: "short", year: "2-digit" });
  }

  const avgAttendance = useMemo(() => {
    const withData = rows.filter((r) => r.attendanceRate !== null);
    if (withData.length === 0) return null;
    return Math.round((withData.reduce((s, r) => s + r.attendanceRate, 0) / withData.length) * 10) / 10;
  }, [rows]);
  const totalPayrollThisMonth = rows[rows.length - 1]?.payrollCost || 0;
  const totalHires = rows.reduce((s, r) => s + r.hires, 0);
  const totalResignations = rows.reduce((s, r) => s + r.resignations, 0);
  const hiresResignMax = Math.max(1, ...rows.map((r) => Math.max(r.hires, r.resignations)));

  function exportExcel() {
    const sheetRows = rows.map((r) => ({
      [t("الشهر")]: r.ym,
      [t("عدد الموظفين")]: r.headcount,
      [t("معدل الحضور")]: r.attendanceRate === null ? "" : r.attendanceRate,
      [t("تكلفة المرتبات")]: r.payrollCost,
      [t("خصومات الجزاءات")]: r.penaltiesTotal,
      [t("سلف جديدة")]: r.advancesTotal,
      [t("تعيينات")]: r.hires,
      [t("استقالات")]: r.resignations,
    }));
    const deptSheetRows = deptRows.map((d) => ({ [t("القسم")]: t(d.dept), [t("عدد الموظفين")]: d.count }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheetRows), t("الاتجاه الشهري"));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(deptSheetRows), t("الأقسام"));
    const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const blob = new Blob([out], { type: "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `hr-reports-${currentYm}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  return (
    <div>
      <SectionTitle eyebrow={t("إحصائيات وتحليلات آخر {n} شهر", { n: months })} title="تقارير" action={
        <div className="flex items-center gap-2">
          <select className={`${inputCls} w-auto`} value={months} onChange={(e) => setMonths(Number(e.target.value))}>
            {REPORT_RANGES.map((n) => <option key={n} value={n}>{t("آخر {n} شهر", { n })}</option>)}
          </select>
          <button onClick={exportExcel} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">
            <FileSpreadsheet size={15} /> {t("تصدير Excel")}
          </button>
        </div>
      } />

      <div className="grid grid-cols-2 gap-4 md:grid-cols-4">
        <KpiCard label="إجمالي الموظفين النشطين" value={activeEmployees.length} icon={<Users size={18} />} tone="teal" />
        <KpiCard label="متوسط نسبة الحضور" value={avgAttendance === null ? "—" : `${avgAttendance}%`} icon={<CalendarCheck size={18} />} tone="emerald" />
        <KpiCard label="تكلفة مرتبات الشهر الحالي" value={fmtMoney(totalPayrollThisMonth)} icon={<Wallet size={18} />} tone="amber" />
        <KpiCard label="صافي التعيينات" value={totalHires - totalResignations} icon={<UserPlus size={18} />} tone={totalHires - totalResignations >= 0 ? "emerald" : "rose"} />
      </div>

      <div className="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-2">
        <Card className="p-5">
          <h3 className="mb-4 font-bold text-slate-800">{t("معدل الحضور الشهري (%)")}</h3>
          <MiniBarChart maxValue={100} formatValue={(v) => `${v}%`} bars={rows.map((r) => ({ label: monthLabel(r.ym), value: r.attendanceRate ?? 0, tone: "emerald" }))} />
        </Card>
        <Card className="p-5">
          <h3 className="mb-4 font-bold text-slate-800">{t("تكلفة المرتبات الشهرية (ج.م)")}</h3>
          <MiniBarChart formatValue={(v) => fmtMoney(v)} bars={rows.map((r) => ({ label: monthLabel(r.ym), value: r.payrollCost, tone: "teal" }))} />
        </Card>
        <Card className="p-5">
          <h3 className="mb-4 font-bold text-slate-800">{t("توزيع الموظفين حسب القسم")}</h3>
          {deptRows.length === 0 ? <EmptyState text="لسه معملتش أي موظف." /> : <HBarList rows={deptRows.map((d) => ({ label: t(d.dept), value: d.count }))} />}
        </Card>
        <Card className="p-5">
          <h3 className="mb-4 font-bold text-slate-800">{t("التعيينات والاستقالات الشهرية")}</h3>
          <div className="flex h-40 items-end gap-2">
            {rows.map((r) => (
              <div key={r.ym} className="flex flex-1 flex-col items-center gap-1">
                <div className="flex w-full flex-1 items-end gap-0.5">
                  <div className="flex-1 rounded-t-md bg-emerald-600" style={{ height: `${r.hires ? Math.max(4, (r.hires / hiresResignMax) * 100) : 0}%` }} title={t("{n} تعيين", { n: r.hires })} />
                  <div className="flex-1 rounded-t-md bg-rose-500" style={{ height: `${r.resignations ? Math.max(4, (r.resignations / hiresResignMax) * 100) : 0}%` }} title={t("{n} استقالة", { n: r.resignations })} />
                </div>
                <span className="whitespace-nowrap text-[10px] text-slate-400">{monthLabel(r.ym)}</span>
              </div>
            ))}
          </div>
          <div className="mt-3 flex items-center gap-4 text-xs">
            <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-sm bg-emerald-600" /> {t("تعيينات")}</span>
            <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-sm bg-rose-500" /> {t("استقالات")}</span>
          </div>
        </Card>
      </div>

      <Card className="mt-6 overflow-hidden p-0">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="border-b border-stone-200 bg-stone-50 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">
              <th className="px-3 py-3">{t("الشهر")}</th>
              <th className="px-3 py-3">{t("عدد الموظفين")}</th>
              <th className="px-3 py-3">{t("معدل الحضور")}</th>
              <th className="px-3 py-3">{t("تكلفة المرتبات")}</th>
              <th className="px-3 py-3">{t("خصومات الجزاءات")}</th>
              <th className="px-3 py-3">{t("سلف جديدة")}</th>
              <th className="px-3 py-3">{t("تعيينات")}</th>
              <th className="px-3 py-3">{t("استقالات")}</th>
            </tr></thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.ym} className="border-b border-stone-100 last:border-0 hover:bg-stone-50">
                  <td className="px-3 py-3 font-medium text-slate-800 whitespace-nowrap">{monthLabel(r.ym)}</td>
                  <td className="px-3 py-3 tabular-nums text-slate-600">{r.headcount}</td>
                  <td className="px-3 py-3 tabular-nums text-slate-600">{r.attendanceRate === null ? "—" : `${r.attendanceRate}%`}</td>
                  <td className="px-3 py-3 tabular-nums font-semibold text-slate-800">{fmtMoney(r.payrollCost)}</td>
                  <td className="px-3 py-3 tabular-nums text-rose-600">{r.penaltiesTotal ? `-${fmtMoney(r.penaltiesTotal)}` : "—"}</td>
                  <td className="px-3 py-3 tabular-nums text-amber-600">{r.advancesTotal ? fmtMoney(r.advancesTotal) : "—"}</td>
                  <td className="px-3 py-3 tabular-nums text-emerald-600">{r.hires || "—"}</td>
                  <td className="px-3 py-3 tabular-nums text-rose-600">{r.resignations || "—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

const CANDIDATE_STAGE_TONE = {
  "جديد": "slate", "قيد المراجعة": "teal", "مقابلة": "amber",
  "عرض عمل": "emerald", "تم التعيين": "emerald", "مرفوض": "rose",
};

function CandidateForm({ initial, positions = [], onSave, onCancel }) {
  const { t } = useLang();
  const [form, setForm] = useState({
    name: initial?.name || "", phone: initial?.phone || "", email: initial?.email || "",
    position: initial?.position || "", department: initial?.department || "",
    positionId: initial?.positionId || "",
    source: initial?.source || CANDIDATE_SOURCES[0], appliedDate: initial?.appliedDate || todayISO(),
    stage: initial?.stage || CANDIDATE_STAGES[0], notes: initial?.notes || "",
  });
  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  // اختيار شاغر مرتبط بيملأ الوظيفة/القسم تلقائي من بيانات الشاغر (لو لسه المرشح ملهاش وظيفة
  // متسجلة) - يوفّر وقت من غير ما يمنع تعديلهم يدويًا لو مختلفين.
  function setPositionId(id) {
    const pos = positions.find((p) => p.id === id);
    setForm((f) => ({ ...f, positionId: id, position: f.position || pos?.title || f.position, department: f.department || pos?.department || f.department }));
  }
  function submit(e) { e.preventDefault(); if (!form.name.trim()) return; onSave(form); }
  return (
    <form onSubmit={submit} className="space-y-4">
      <div className="grid grid-cols-2 gap-4">
        <Field label="الاسم بالكامل"><input required className={inputCls} value={form.name} onChange={(e) => set("name", e.target.value)} /></Field>
        <Field label="رقم الموبايل"><input className={inputCls} value={form.phone} onChange={(e) => set("phone", e.target.value)} /></Field>
        <Field label="الإيميل"><input type="email" className={inputCls} value={form.email} onChange={(e) => set("email", e.target.value)} /></Field>
        <Field label="الشاغر المرتبط (اختياري)">
          <select className={inputCls} value={form.positionId} onChange={(e) => setPositionId(e.target.value)}>
            <option value="">{t("— بدون شاغر محدد —")}</option>
            {positions.map((p) => <option key={p.id} value={p.id}>{p.title}{p.department ? ` (${p.department})` : ""}</option>)}
          </select>
        </Field>
        <Field label="الوظيفة المتقدم لها"><input className={inputCls} value={form.position} onChange={(e) => set("position", e.target.value)} /></Field>
        <Field label="القسم"><input className={inputCls} value={form.department} onChange={(e) => set("department", e.target.value)} placeholder={t("مثلًا المبيعات")} /></Field>
        <Field label="مصدر الترشيح"><select className={inputCls} value={form.source} onChange={(e) => set("source", e.target.value)}>{CANDIDATE_SOURCES.map((s) => <option key={s} value={s}>{t(s)}</option>)}</select></Field>
        <Field label="تاريخ التقديم"><input type="date" className={inputCls} value={form.appliedDate} onChange={(e) => set("appliedDate", e.target.value)} /></Field>
        <Field label="مرحلة التوظيف"><select className={inputCls} value={form.stage} onChange={(e) => set("stage", e.target.value)}>{CANDIDATE_STAGES.map((s) => <option key={s} value={s}>{t(s)}</option>)}</select></Field>
      </div>
      <Field label="ملاحظات"><textarea rows={3} className={inputCls} value={form.notes} onChange={(e) => set("notes", e.target.value)} placeholder={t("انطباع المقابلة، الراتب المتوقع، إلخ.")} /></Field>
      <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">
        <button type="button" onClick={onCancel} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50">{t("إلغاء")}</button>
        <button type="submit" className="rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900">{t("حفظ")}</button>
      </div>
    </form>
  );
}

function RecruitmentTab({ candidates, setCandidates, positions, setPositions, onConvert }) {
  const { t } = useLang();
  const [view, setView] = useState("candidates"); // candidates | positions
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [posModalOpen, setPosModalOpen] = useState(false);
  const [editingPos, setEditingPos] = useState(null);
  const [expandedPosId, setExpandedPosId] = useState(null);
  const [query, setQuery] = useState("");

  const filtered = useMemo(() => candidates.filter((c) => candidateMatchesQuery(c, query)), [candidates, query]);
  const pipelineCounts = useMemo(() => computeCandidatePipelineCounts(filtered), [filtered]);

  function save(data) {
    if (editing) setCandidates(candidates.map((c) => (c.id === editing.id ? { ...editing, ...data } : c)));
    else setCandidates([{ id: uid("cand"), ...data }, ...candidates]);
    setModalOpen(false);
    setEditing(null);
  }
  function remove(c) { setCandidates(candidates.filter((x) => x.id !== c.id)); }
  function changeStage(c, stage) { setCandidates(candidates.map((x) => (x.id === c.id ? { ...x, stage } : x))); }

  function savePosition(data) {
    if (editingPos) setPositions(positions.map((p) => (p.id === editingPos.id ? { ...editingPos, ...data } : p)));
    else setPositions([{ id: uid("pos"), ...data }, ...positions]);
    setPosModalOpen(false);
    setEditingPos(null);
  }
  function removePosition(p) { setPositions(positions.filter((x) => x.id !== p.id)); }

  return (
    <div>
      <SectionTitle
        eyebrow={view === "candidates" ? t("{n} مرشح مسجل", { n: candidates.length }) : t("{n} شاغر مسجل", { n: positions.length })}
        title="التعيين والتوظيف"
        action={
          <div className="flex items-center gap-2">
            <div className="flex rounded-lg border border-stone-300 bg-white p-0.5">
              <button onClick={() => setView("candidates")} className={`rounded-md px-3 py-1.5 text-xs font-semibold ${view === "candidates" ? "bg-teal-800 text-white" : "text-slate-500"}`}>{t("المرشحين")}</button>
              <button onClick={() => setView("positions")} className={`rounded-md px-3 py-1.5 text-xs font-semibold ${view === "positions" ? "bg-teal-800 text-white" : "text-slate-500"}`}>{t("الشواغر")}</button>
            </div>
            {view === "candidates" ? (
              <button onClick={() => { setEditing(null); setModalOpen(true); }} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">
                <Plus size={16} /> {t("مرشح جديد")}
              </button>
            ) : (
              <button onClick={() => { setEditingPos(null); setPosModalOpen(true); }} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">
                <Plus size={16} /> {t("شاغر جديد")}
              </button>
            )}
          </div>
        }
      />

      {view === "candidates" ? (
        <>
          <div className="mb-4 flex items-center gap-2 rounded-lg border border-stone-300 bg-white px-3 py-2">
            <Search size={16} className="text-slate-400" />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={t("دور بالاسم أو الوظيفة أو القسم...")} className="w-full text-sm outline-none" />
          </div>

          {candidates.length === 0 ? (
            <Card className="p-0"><EmptyState text="لسه معملتش أي مرشح. ابدأ بـ«مرشح جديد»." /></Card>
          ) : (
            <div className="grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-6">
              {pipelineCounts.map(({ stage, count }) => (
                <div key={stage} className="min-w-0">
                  <div className="mb-2 flex items-center justify-between px-1">
                    <StampBadge tone={CANDIDATE_STAGE_TONE[stage]}>{stage}</StampBadge>
                    <span className="text-xs font-semibold tabular-nums text-slate-400">{count}</span>
                  </div>
                  <div className="space-y-2.5">
                    {filtered.filter((c) => c.stage === stage).map((c) => (
                      <CandidateCard
                        key={c.id} candidate={c}
                        onEdit={(cand) => { setEditing(cand); setModalOpen(true); }}
                        onDelete={remove}
                        onStageChange={changeStage}
                        onConvert={onConvert}
                      />
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}

          <Modal open={modalOpen} onClose={() => { setModalOpen(false); setEditing(null); }} title={editing ? "تعديل بيانات مرشح" : "إضافة مرشح جديد"} wide>
            <CandidateForm initial={editing} positions={positions} onSave={save} onCancel={() => { setModalOpen(false); setEditing(null); }} />
          </Modal>
        </>
      ) : (
        <>
          <p className="mb-4 flex items-start gap-1.5 rounded-lg bg-stone-50 px-3 py-2 text-xs text-slate-500"><Info size={14} className="mt-0.5 shrink-0" />{t("الشاغر بيحمل الوصف الوظيفي وشروط التوظيف مرة واحدة، وأي مرشح يتقدّم له تقدر تربطه بيه من فورم المرشح - من غير ما تكتب نفس الوصف تاني لكل مرشح.")}</p>
          {positions.length === 0 ? (
            <Card className="p-0"><EmptyState text="لسه معملتش أي شاغر. ابدأ بـ«شاغر جديد»." /></Card>
          ) : (
            <div className="space-y-2.5">
              {positions.map((p) => (
                <Card key={p.id} className="p-4">

/* ================= ORG CHART ================= */

// Builds a 3-level tree (CEO -> department head -> rest of the department) purely from
// each employee's existing "department" field plus the two choices made in OrgChartTab
// (ceoEmployeeId, departmentHeads). No per-employee "manager" field needed.
function buildOrgTree(employees, orgChart) {
  const ceo = employees.find((e) => e.id === orgChart.ceoEmployeeId) || null;
  const rest = employees.filter((e) => !ceo || e.id !== ceo.id);

  const byDept = {};
  rest.forEach((e) => {
    const dept = (e.department || "").trim() || "بدون قسم";
    (byDept[dept] = byDept[dept] || []).push(e);
  });

  const departmentHeads = orgChart.departmentHeads || {};
  const departments = Object.keys(byDept)
    .sort((a, b) => a.localeCompare(b, "ar"))
    .map((dept) => {
      const members = byDept[dept];
      const headId = departmentHeads[dept];
      const head = members.find((e) => e.id === headId) || null;
      const others = members.filter((e) => !head || e.id !== head.id);
      return { dept, head, others, total: members.length };
    });

  return { ceo, departments };
}

// نفس منطق resolveApprover في بوابة الموظف (رئيس القسم، أو الرئيس التنفيذي لو الموظف نفسه
// رئيس قسم، أو محدش لو هو الرئيس التنفيذي نفسه) - بس هنا لأي استخدام عام محتاج يعرف "مين
// المدير المباشر" (زي بروفايل الموظف وتنبيه التقييمات الدورية)، مش بس توجيه الطلبات. بتدوّر في
// كل الموظفين المُمرَّرة من غير فلترة حالة، عشان مايتكررش نفس باگ "المسؤول مش نشط فاختفى".
function resolveDirectManager(employee, orgChart, employees) {
  if (!employee) return null;
  if (employee.id === orgChart.ceoEmployeeId) return null; // الرئيس التنفيذي مالوش حد فوقه
  const dept = employee.department || "";
  const headId = (orgChart.departmentHeads || {})[dept];
  if (headId === employee.id) {
    // الموظف نفسه رئيس القسم - مديره المباشر هو الرئيس التنفيذي
    return employees.find((e) => e.id === orgChart.ceoEmployeeId) || null;
  }
  return employees.find((e) => e.id === headId) || null;
}
// عكس resolveDirectManager: مين تحت إدارة الموظف ده مباشرة. الرئيس التنفيذي تحته كل رؤساء
// الأقسام، رئيس القسم تحته باقي أفراد قسمه، وأي موظف عادي تاني مفيش حد تحته (هيكل من 3 مستويات
// بس، زي buildOrgTree بالظبط).
function resolveDirectReports(employee, orgChart, employees) {
  if (!employee) return [];
  if (employee.id === orgChart.ceoEmployeeId) {
    const headIds = new Set(Object.values(orgChart.departmentHeads || {}));
    return employees.filter((e) => headIds.has(e.id) && e.id !== employee.id);
  }
  const dept = employee.department || "";
  const headId = (orgChart.departmentHeads || {})[dept];
  if (headId === employee.id) {
    return employees.filter((e) => (e.department || "") === dept && e.id !== employee.id);
  }
  return [];
}

function PersonBox({ person, role, tone = "teal", placeholder, subtitle, crown }) {
  const { t } = useLang();
  const toneCls = {
    teal: "border-teal-700 bg-teal-50",
    amber: "border-amber-500 bg-amber-50",
  }[tone];
  const placeholderBorder = tone === "teal" ? "border-teal-300" : "border-amber-300";

  if (!person) {
    return (
      <div className={`w-56 rounded-xl border-2 border-dashed ${placeholderBorder} bg-stone-50 p-3 text-center`}>
        <div className="text-[11px] font-semibold uppercase tracking-wide text-slate-400">{t(role)}</div>
        <div className="mt-1.5 text-xs text-slate-400">{t(placeholder)}</div>
      </div>
    );
  }
  return (
    <div className={`w-56 rounded-xl border-2 p-3 text-center shadow-sm ${toneCls}`}>
      <div className="flex items-center justify-center gap-1 text-[11px] font-semibold uppercase tracking-wide text-slate-500">

function OrgChartTab({ employees, orgChart, setOrgChart, onPrint }) {
  const { t } = useLang();
  const [expanded, setExpanded] = useState({});
  function toggle(dept) { setExpanded((s) => ({ ...s, [dept]: !s[dept] })); }

  const usedDepartments = useMemo(() => {
    const set = new Set();
    employees.forEach((e) => { const d = (e.department || "").trim(); if (d) set.add(d); });
    return Array.from(set).sort((a, b) => a.localeCompare(b, "ar"));
  }, [employees]);

  const tree = useMemo(() => buildOrgTree(employees, orgChart), [employees, orgChart]);
  const unassignedCount = employees.filter((e) => !(e.department || "").trim()).length;

  function setCeo(id) { setOrgChart({ ...orgChart, ceoEmployeeId: id || null }); }
  function setDeptHead(dept, id) {
    const heads = { ...(orgChart.departmentHeads || {}) };
    if (id) heads[dept] = id; else delete heads[dept];
    setOrgChart({ ...orgChart, departmentHeads: heads });
  }

  return (
    <div>
      <SectionTitle
        eyebrow={t("{n} موظف نشط", { n: employees.length })}
        title={t("الهيكل التنظيمي")}
        action={
          <button onClick={onPrint} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3.5 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50">
            <Printer size={16} /> {t("طباعة الهيكل")}
          </button>
        }
      />

      <Card className="mb-6 p-5">
        <div className="mb-4 flex items-center gap-2"><Crown size={16} className="text-amber-600" /><h3 className="font-bold text-slate-800">{t("تحديد المناصب القيادية")}</h3></div>

        <div className="max-w-sm">
          <Field label="الرئيس التنفيذي / صاحب الشركة">
            <select className={inputCls} value={orgChart.ceoEmployeeId || ""} onChange={(e) => setCeo(e.target.value)}>
              <option value="">{t("— لم يتم التحديد —")}</option>
              {employees.map((e) => <option key={e.id} value={e.id}>{e.name}{e.position ? ` — ${e.position}` : ""}</option>)}
            </select>
          </Field>
        </div>

        {usedDepartments.length > 0 ? (
          <div className="mt-5 border-t border-stone-100 pt-4">
            <div className="mb-2.5 text-sm font-medium text-slate-600">{t("رئيس/مديرة كل إدارة")}</div>
            <div className="grid grid-cols-1 gap-3 md:grid-cols-2 lg:grid-cols-3">
              {usedDepartments.map((dept) => {
                const candidates = employees.filter((e) => (e.department || "").trim() === dept && e.id !== orgChart.ceoEmployeeId);
                return (
                  <label key={dept} className="block">
                    <span className="mb-1 block text-xs font-medium text-slate-500">{dept}</span>
                    <select className={`${inputCls} text-xs`} value={(orgChart.departmentHeads || {})[dept] || ""} onChange={(e) => setDeptHead(dept, e.target.value)}>
                      <option value="">{t("— بدون تحديد —")}</option>
                      {candidates.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
                    </select>
                  </label>
                );
              })}
            </div>
          </div>
        ) : (
          <p className="mt-4 text-xs text-slate-400">{t("مفيش أقسام متسجلة لسه — اكتب قسم كل موظف من تاب \"الموظفون والعقود\" الأول عشان الهيكل يتبني.")}</p>
        )}
        {unassignedCount > 0 && (
          <p className="mt-3 text-xs text-amber-600">{t("{n} موظف من غير قسم محدد — هيظهروا تحت مجموعة \"بدون قسم\" في الهيكل.", { n: unassignedCount })}</p>
        )}
      </Card>

      {employees.length === 0 ? <EmptyState text="لسه معملتش أي موظف." /> : (
        <Card className="overflow-x-auto p-8">
          <OrgChartTree tree={tree} expanded={expanded} onToggle={toggle} />
        </Card>
      )}
    </div>
  );
}

function AdminAuthGate() {
  const [authState, setAuthState] = useState("loading"); // loading | signedOut | checking | admin | denied
  const [user, setUser] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    const unsub = onAuthStateChanged(auth, async (u) => {
      setUser(u);
      if (!u) { setAuthState("signedOut"); return; }
      setAuthState("checking");
      try {
        const snap = await getDoc(doc(db, "admins", u.uid));
        setAuthState(snap.exists() ? "admin" : "denied");
      } catch (e) {
        console.error(e);
        setAuthState("denied");
      }
    });
    return unsub;
  }, []);

  async function handleLogin(form) {
    setError(""); setBusy(true);
    try {
      await signInWithEmailAndPassword(auth, form.email.trim(), form.password);
    } catch (err) {
      setError("بيانات الدخول غلط، أو الحساب ده مش موجود.");
    } finally { setBusy(false); }
  }

  const langState = useLangState();

  let content;
  if (authState === "loading") content = <FullScreenLoader text="جاري التحقق من الدخول..." />;
  else if (authState === "signedOut") content = <AdminLoginScreen onSubmit={handleLogin} busy={busy} error={error} />;
  else if (authState === "checking") content = <FullScreenLoader text="جاري التحقق من الصلاحيات..." />;
  else if (authState === "denied") content = <AccessDeniedScreen email={user?.email} />;
  else content = <HRSystem adminUser={user} />;

  return (
    <LangContext.Provider value={langState}>
      <div dir={langState.dir} className="font-sans">{content}</div>
    </LangContext.Provider>
  );
}
