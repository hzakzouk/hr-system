            <Search size={16} className="text-slate-400" />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={t("دور باسم الموظف...")} className="w-full text-sm outline-none" />
          </div>
          <select className={`${inputCls} w-auto`} value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
            <option value="الكل">{t("كل الحالات")}</option>
            <option value="pending">{t(REQUEST_STATUS_LABELS.pending)}</option>
            <option value="approved">{t(REQUEST_STATUS_LABELS.approved)}</option>
            <option value="rejected">{t(REQUEST_STATUS_LABELS.rejected)}</option>
          </select>
          {filtersActive && (
            <button onClick={clearFilters} className="rounded-lg border border-stone-300 px-3 py-2 text-xs font-semibold text-slate-500 hover:bg-stone-50">{t("مسح الفلاتر")}</button>
          )}
        </div>
      )}

      {yearRecords.length === 0 ? (
        <Card className="p-0"><EmptyState text="مفيش زيادات رواتب مسجلة للسنة دي - جرّب تولّد اقتراحات من التقييمات المكتملة." /></Card>
      ) : filteredRecords.length === 0 ? (
        <Card className="p-0"><EmptyState text="مفيش موظفين مطابقين للفلتر." /></Card>
      ) : (
        <Card className="overflow-x-auto p-0">
          <table className="w-full text-sm">
            <thead className="bg-stone-50 text-xs text-slate-400">
              <tr>
                <th className="sticky start-0 z-10 bg-stone-50 px-4 py-2.5 text-start font-semibold">{t("الموظف")}</th>
                <th className="px-4 py-2.5 text-start font-semibold">{t("الدرجة (Grade)")}</th>
                <th className="px-4 py-2.5 text-start font-semibold">{t("المرتب الحالي")}</th>
                <th className="px-4 py-2.5 text-start font-semibold">{t("التقييم (من 5)")}</th>
                <th className="px-4 py-2.5 text-start font-semibold">{t("نسبة الزيادة %")}</th>
                <th className="px-4 py-2.5 text-start font-semibold">{t("المرتب الجديد المقترح")}</th>
                <th className="px-4 py-2.5 text-start font-semibold">{t("الحالة")}</th>
                <th className="px-4 py-2.5 text-start font-semibold"></th>
              </tr>
            </thead>
            <tbody className="divide-y divide-stone-100">
              {filteredRecords.map((s) => {
                const emp = empById[s.employeeId];
                const editable = s.status === "pending";
                const cellCls = `w-24 rounded-lg border px-2 py-1.5 text-sm tabular-nums ${editable ? "border-stone-300 bg-white focus:border-teal-600 focus:ring-2 focus:ring-teal-100 outline-none" : "border-transparent bg-transparent text-slate-500"}`;
                return (
                  <tr key={s.id} className="hover:bg-stone-50">
                    <td className="sticky start-0 z-10 bg-white px-4 py-2.5 font-medium text-slate-700">
                      {emp ? <button onClick={() => onOpenEmployee(emp.id)} className="hover:underline">{emp.name}</button> : (s.employeeId || "—")}
                    </td>
                    <td className="px-4 py-2.5">
                      {editable ? (
                        <select className={cellCls} value={s.grade} onChange={(e) => updateRecord(s.id, { grade: e.target.value })}>
                          {gradeBands.map((b) => <option key={b.grade} value={b.grade}>{b.grade}</option>)}
                        </select>
                      ) : (s.grade || "—")}
                    </td>
                    <td className="px-4 py-2.5">
                      {editable ? <input type="number" className={cellCls} value={s.currentSalary} onChange={(e) => updateRecord(s.id, { currentSalary: Number(e.target.value) })} /> : `${fmtMoney(s.currentSalary)} ${t("ج.م")}`}
                    </td>
                    <td className="px-4 py-2.5">
                      {editable ? (
                        <select className={cellCls} value={s.ratingScore} onChange={(e) => updateRecord(s.id, { ratingScore: Number(e.target.value) })}>
                          {[5, 4, 3, 2, 1].map((n) => <option key={n} value={n}>{n}</option>)}
                        </select>
                      ) : s.ratingScore}
                    </td>
                    <td className="px-4 py-2.5">
                      {editable ? <input type="number" step="0.5" className={cellCls} value={s.suggestedPercent} onChange={(e) => updateRecord(s.id, { suggestedPercent: Number(e.target.value) })} /> : `${s.suggestedPercent}%`}
                    </td>
                    <td className="px-4 py-2.5">
                      {editable ? <input type="number" className={cellCls} value={s.proposedSalary} onChange={(e) => updateRecord(s.id, { proposedSalary: Number(e.target.value) })} /> : <span className="font-semibold text-slate-700">{fmtMoney(s.proposedSalary)} {t("ج.م")}</span>}

                    <td className="px-4 py-2.5">
                      {s.status === "pending" && <StampBadge tone="amber">{t("مستني قرار")}</StampBadge>}
                      {s.status === "approved" && <StampBadge tone="emerald">{t("متوافق عليه")}</StampBadge>}
                      {s.status === "rejected" && <StampBadge tone="rose">{t("مرفوض")}</StampBadge>}
                      {!editable && s.decidedAt && <div className="mt-1 text-[11px] text-slate-400">{s.decidedAt}{s.decidedBy ? ` - ${s.decidedBy}` : ""}</div>}
                    </td>
                    <td className="px-4 py-2.5">
                      {editable ? (
                        <div className="flex items-center gap-1.5">
                          <button title={t("إعادة الحساب من الدرجة والمرتب والتقييم")} onClick={() => recalcRecord(s)} className="rounded-lg border border-stone-300 p-1.5 text-slate-500 hover:bg-stone-50"><RefreshCw size={14} /></button>
                          <button onClick={() => openApproveConfirm(s)} className="flex items-center gap-1 rounded-lg bg-emerald-600 px-2.5 py-1.5 text-xs font-semibold text-white hover:bg-emerald-700"><Check size={13} /> {t("موافقة")}</button>
                          <button onClick={() => reject(s)} className="flex items-center gap-1 rounded-lg bg-rose-600 px-2.5 py-1.5 text-xs font-semibold text-white hover:bg-rose-700"><X size={13} /> {t("رفض")}</button>
                        </div>
                      ) : null}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </Card>
      )}

      <Modal open={!!approving} onClose={closeApproveConfirm} title="تأكيد اعتماد الزيادة">
        <form onSubmit={confirmApprove} className="space-y-4">
          {approving && (
            <p className="text-sm text-slate-600">
              {t("هيتغيّر مرتب {name} من {from} لـ {to} ج.م. لازم تكتب سبب الاعتماد.", {
                name: empById[approving.employeeId]?.name || approving.employeeId,
                from: fmtMoney(approving.currentSalary),
                to: fmtMoney(approving.proposedSalary),
              })}
            </p>
          )}
          <Field label="سبب اعتماد الزيادة (إجباري)">
            <input autoFocus className={inputCls} value={approveReason} onChange={(e) => { setApproveReason(e.target.value); if (approveReasonError) setApproveReasonError(""); }} placeholder={t("مثلًا: زيادة سنوية بناءً على نتيجة التقييم")} />
          </Field>
          {approveReasonError && <p className="text-xs font-medium text-rose-600">{t(approveReasonError)}</p>}
          <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">
            <button type="button" onClick={closeApproveConfirm} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50">{t("إلغاء")}</button>
            <button type="submit" className="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700">{t("تأكيد الاعتماد")}</button>
          </div>
        </form>
      </Modal>
    </div>
  );
}

function ReportsTab({ employees, activeEmployees, attendance, penalties, advances, payrollMeta, settings, requests, reviews }) {
  const { t, lang } = useLang();
  const [months, setMonths] = useState(6);
  const currentYm = todayISO().slice(0, 7);
  const range = useMemo(() => monthRangeEndingAt(currentYm, months), [currentYm, months]);
  const rows = useMemo(
    () => range.map((ym) => computeMonthlyReportRow(ym, employees, attendance, penalties, advances, payrollMeta, settings)),
    [range, employees, attendance, penalties, advances, payrollMeta, settings]
  );
  const deptRows = useMemo(() => computeDepartmentHeadcount(activeEmployees), [activeEmployees]);

  function monthLabel(ym) {
    const [y, m] = ym.split("-").map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString(lang === "en" ? "en-GB" : "ar-EG", { month: "short", year: "2-digit" });
  }

  const avgAttendance = useMemo(() => {
    const withData = rows.filter((r) => r.attendanceRate !== null);
    if (withData.length === 0) return null;
    return Math.round((withData.reduce((s, r) => s + r.attendanceRate, 0) / withData.length) * 10) / 10;
  }, [rows]);
  const totalPayrollThisMonth = rows[rows.length - 1]?.payrollCost || 0;
  const totalHires = rows.reduce((s, r) => s + r.hires, 0);
  const totalResignations = rows.reduce((s, r) => s + r.resignations, 0);
  const hiresResignMax = Math.max(1, ...rows.map((r) => Math.max(r.hires, r.resignations)));

  function exportExcel() {
    const sheetRows = rows.map((r) => ({
      [t("الشهر")]: r.ym,
      [t("عدد الموظفين")]: r.headcount,
      [t("معدل الحضور")]: r.attendanceRate === null ? "" : r.attendanceRate,
      [t("تكلفة المرتبات")]: r.payrollCost,
      [t("خصومات الجزاءات")]: r.penaltiesTotal,
      [t("سلف جديدة")]: r.advancesTotal,
      [t("تعيينات")]: r.hires,
      [t("استقالات")]: r.resignations,
    }));
    const deptSheetRows = deptRows.map((d) => ({ [t("القسم")]: t(d.dept), [t("عدد الموظفين")]: d.count }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheetRows), t("الاتجاه الشهري"));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(deptSheetRows), t("الأقسام"));
    const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const blob = new Blob([out], { type: "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `hr-reports-${currentYm}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------- رصيد كل الحالات + تقرير شؤون الأفراد المخصّص (بفترة زمنية/موظف/نوع طلب) ---------- */
  const requestsBalance = useMemo(() => computeRequestsBalance(requests || []), [requests]);

  function ratingToneFor(label) {
    return label.includes("ممتاز") ? "emerald" : label.includes("جيد جداً") ? "teal" : label.includes("مرضي") ? "amber" : "rose";
  }
  const ratingBarToneCls = { emerald: "bg-emerald-600", teal: "bg-teal-700", amber: "bg-amber-500", rose: "bg-rose-600" };

    emerald: "bg-emerald-50 text-emerald-700 border-emerald-200",
    teal: "bg-teal-50 text-teal-700 border-teal-200",
    amber: "bg-amber-50 text-amber-700 border-amber-200",
    rose: "bg-rose-50 text-rose-700 border-rose-200",

  );
  const customReportFiltersActive = repDateFrom || repDateTo || repEmployeeId !== "الكل" || repKind !== "الكل";
  function clearCustomReportFilters() { setRepDateFrom(""); setRepDateTo(""); setRepEmployeeId("الكل"); setRepKind("الكل"); }

            <FileSpreadsheet size={15} /> {t("تصدير Excel")}

      <div className="grid grid-cols-2 gap-4 md:grid-cols-4">

        <KpiCard label="تكلفة مرتبات الشهر الحالي" value={fmtMoney(totalPayrollThisMonth)} icon={<Wallet size={18} />} tone="amber" />
        <KpiCard label="صافي التعيينات" value={totalHires - totalResignations} icon={<UserPlus size={18} />} tone={totalHires - totalResignations >= 0 ? "emerald" : "rose"} />
      </div>

      <div className="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-2">
        <Card className="p-5">
          <h3 className="mb-4 font-bold text-slate-800">{t("معدل الحضور الشهري (%)")}</h3>
          <MiniBarChart maxValue={100} formatValue={(v) => `${v}%`} bars={rows.map((r) => ({ label: monthLabel(r.ym), value: r.attendanceRate ?? 0, tone: "emerald" }))} />
        </Card>
        <Card className="p-5">
          <h3 className="mb-4 font-bold text-slate-800">{t("تكلفة المرتبات الشهرية (ج.م)")}</h3>

        </Card>
        <Card className="p-5">
          <h3 className="mb-4 font-bold text-slate-800">{t("التعيينات والاستقالات الشهرية")}</h3>
          <div className="flex h-40 items-end gap-2">
            {rows.map((r) => (
              <div key={r.ym} className="flex flex-1 flex-col items-center gap-1">
                <div className="flex w-full flex-1 items-end gap-0.5">
                  <div className="flex-1 rounded-t-md bg-emerald-600" style={{ height: `${r.hires ? Math.max(4, (r.hires / hiresResignMax) * 100) : 0}%` }} title={t("{n} تعيين", { n: r.hires })} />
                  <div className="flex-1 rounded-t-md bg-rose-500" style={{ height: `${r.resignations ? Math.max(4, (r.resignations / hiresResignMax) * 100) : 0}%` }} title={t("{n} استقالة", { n: r.resignations })} />

const CANDIDATE_STAGE_TONE = {
  "جديد": "slate", "قيد المراجعة": "teal", "مقابلة": "amber",
  "عرض عمل": "emerald", "تم التعيين": "emerald", "مرفوض": "rose",
};

function CandidateForm({ initial, positions = [], onSave, onCancel }) {
  const { t } = useLang();
  const [form, setForm] = useState({
    name: initial?.name || "", phone: initial?.phone || "", email: initial?.email || "",
    position: initial?.position || "", department: initial?.department || "",
    positionId: initial?.positionId || "",
    source: initial?.source || CANDIDATE_SOURCES[0], appliedDate: initial?.appliedDate || todayISO(),
    stage: initial?.stage || CANDIDATE_STAGES[0], notes: initial?.notes || "",
  });
  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  // اختيار شاغر مرتبط بيملأ الوظيفة/القسم تلقائي من بيانات الشاغر (لو لسه المرشح ملهاش وظيفة
  // متسجلة) - يوفّر وقت من غير ما يمنع تعديلهم يدويًا لو مختلفين.
  function setPositionId(id) {
    const pos = positions.find((p) => p.id === id);
    setForm((f) => ({ ...f, positionId: id, position: f.position || pos?.title || f.position, department: f.department || pos?.department || f.department }));
  }
  function submit(e) { e.preventDefault(); if (!form.name.trim()) return; onSave(form); }
  return (
    <form onSubmit={submit} className="space-y-4">
      <div className="grid grid-cols-2 gap-4">
        <Field label="الاسم بالكامل"><input required className={inputCls} value={form.name} onChange={(e) => set("name", e.target.value)} /></Field>
        <Field label="رقم الموبايل"><input className={inputCls} value={form.phone} onChange={(e) => set("phone", e.target.value)} /></Field>
        <Field label="الإيميل"><input type="email" className={inputCls} value={form.email} onChange={(e) => set("email", e.target.value)} /></Field>
        <Field label="الشاغر المرتبط (اختياري)">
          <select className={inputCls} value={form.positionId} onChange={(e) => setPositionId(e.target.value)}>
            <option value="">{t("— بدون شاغر محدد —")}</option>
            {positions.map((p) => <option key={p.id} value={p.id}>{p.title}{p.department ? ` (${p.department})` : ""}</option>)}
          </select>
        </Field>
        <Field label="الوظيفة المتقدم لها"><input className={inputCls} value={form.position} onChange={(e) => set("position", e.target.value)} /></Field>
        <Field label="القسم"><input className={inputCls} value={form.department} onChange={(e) => set("department", e.target.value)} placeholder={t("مثلًا المبيعات")} /></Field>
        <Field label="مصدر الترشيح"><select className={inputCls} value={form.source} onChange={(e) => set("source", e.target.value)}>{CANDIDATE_SOURCES.map((s) => <option key={s} value={s}>{t(s)}</option>)}</select></Field>
        <Field label="تاريخ التقديم"><input type="date" className={inputCls} value={form.appliedDate} onChange={(e) => set("appliedDate", e.target.value)} /></Field>
        <Field label="مرحلة التوظيف"><select className={inputCls} value={form.stage} onChange={(e) => set("stage", e.target.value)}>{CANDIDATE_STAGES.map((s) => <option key={s} value={s}>{t(s)}</option>)}</select></Field>
      </div>
      <Field label="ملاحظات"><textarea rows={3} className={inputCls} value={form.notes} onChange={(e) => set("notes", e.target.value)} placeholder={t("انطباع المقابلة، الراتب المتوقع، إلخ.")} /></Field>
      <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">
        <button type="button" onClick={onCancel} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50">{t("إلغاء")}</button>
        <button type="submit" className="rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900">{t("حفظ")}</button>
      </div>
    </form>
  );
}

function CandidateCard({ candidate, onEdit, onDelete, onStageChange, onConvert }) {
  const { t } = useLang();
  const converted = !!candidate.convertedEmployeeId;
  return (
    <Card className="p-3">
      <div className="mb-1.5 flex items-start justify-between gap-2">
        <div className="min-w-0">
          <div className="truncate text-sm font-semibold text-slate-800">{candidate.name}</div>
          <div className="truncate text-xs text-slate-400">{candidate.position || "—"}{candidate.department ? ` · ${candidate.department}` : ""}</div>
        </div>
        <div className="flex shrink-0 items-center gap-0.5">
          <button onClick={() => onEdit(candidate)} className="rounded-md p-1 text-slate-400 hover:bg-stone-100 hover:text-teal-700"><Pencil size={13} /></button>
          <button onClick={() => onDelete(candidate)} className="rounded-md p-1 text-slate-400 hover:bg-rose-50 hover:text-rose-600"><Trash2 size={13} /></button>
        </div>
      </div>
      {candidate.phone && <div className="mb-1 text-xs text-slate-500">{candidate.phone}</div>}
      <div className="mb-2 text-[11px] text-slate-400">{t("تقدّم في {date}", { date: candidate.appliedDate || "—" })}</div>
      <select
        value={candidate.stage}
        onChange={(e) => onStageChange(candidate, e.target.value)}
        className="w-full rounded-md border border-stone-200 bg-white px-2 py-1 text-xs outline-none focus:border-teal-500"
      >
        {CANDIDATE_STAGES.map((s) => <option key={s} value={s}>{t(s)}</option>)}
      </select>
      {candidate.stage === "تم التعيين" && (
        converted ? (
          <div className="mt-2 flex items-center gap-1 text-[11px] font-semibold text-emerald-700"><Check size={12} /> {t("تم التحويل لموظف")}</div>
        ) : (
          <button onClick={() => onConvert(candidate)} className="mt-2 flex w-full items-center justify-center gap-1.5 rounded-md bg-teal-800 px-2 py-1.5 text-xs font-semibold text-white hover:bg-teal-900">
            <UserPlus size={13} /> {t("تحويل لموظف")}
          </button>
        )
      )}
    </Card>
  );
}

function RecruitmentTab({ candidates, setCandidates, positions, setPositions, onConvert }) {
  const { t } = useLang();
  const [view, setView] = useState("candidates"); // candidates | positions
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [posModalOpen, setPosModalOpen] = useState(false);
  const [editingPos, setEditingPos] = useState(null);
  const [expandedPosId, setExpandedPosId] = useState(null);
  const [query, setQuery] = useState("");

  const filtered = useMemo(() => candidates.filter((c) => candidateMatchesQuery(c, query)), [candidates, query]);
  const pipelineCounts = useMemo(() => computeCandidatePipelineCounts(filtered), [filtered]);

  function save(data) {
    if (editing) setCandidates(candidates.map((c) => (c.id === editing.id ? { ...editing, ...data } : c)));
    else setCandidates([{ id: uid("cand"), ...data }, ...candidates]);
    setModalOpen(false);
    setEditing(null);
  }
  function remove(c) { setCandidates(candidates.filter((x) => x.id !== c.id)); }
  function changeStage(c, stage) { setCandidates(candidates.map((x) => (x.id === c.id ? { ...x, stage } : x))); }

  function savePosition(data) {
    if (editingPos) setPositions(positions.map((p) => (p.id === editingPos.id ? { ...editingPos, ...data } : p)));
    else setPositions([{ id: uid("pos"), ...data }, ...positions]);
    setPosModalOpen(false);
    setEditingPos(null);
  }
  function removePosition(p) { setPositions(positions.filter((x) => x.id !== p.id)); }

  return (
    <div>
      <SectionTitle
        eyebrow={view === "candidates" ? t("{n} مرشح مسجل", { n: candidates.length }) : t("{n} شاغر مسجل", { n: positions.length })}
        title="التعيين والتوظيف"
        action={
          <div className="flex items-center gap-2">
            <div className="flex rounded-lg border border-stone-300 bg-white p-0.5">
              <button onClick={() => setView("candidates")} className={`rounded-md px-3 py-1.5 text-xs font-semibold ${view === "candidates" ? "bg-teal-800 text-white" : "text-slate-500"}`}>{t("المرشحين")}</button>
              <button onClick={() => setView("positions")} className={`rounded-md px-3 py-1.5 text-xs font-semibold ${view === "positions" ? "bg-teal-800 text-white" : "text-slate-500"}`}>{t("الشواغر")}</button>
            </div>
            {view === "candidates" ? (
              <button onClick={() => { setEditing(null); setModalOpen(true); }} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">
                <Plus size={16} /> {t("مرشح جديد")}
              </button>
            ) : (
              <button onClick={() => { setEditingPos(null); setPosModalOpen(true); }} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">
                <Plus size={16} /> {t("شاغر جديد")}
              </button>
            )}
          </div>
        }
      />

      {view === "candidates" ? (
        <>
          <div className="mb-4 flex items-center gap-2 rounded-lg border border-stone-300 bg-white px-3 py-2">
            <Search size={16} className="text-slate-400" />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={t("دور بالاسم أو الوظيفة أو القسم...")} className="w-full text-sm outline-none" />
          </div>

          {candidates.length === 0 ? (
            <Card className="p-0"><EmptyState text="لسه معملتش أي مرشح. ابدأ بـ«مرشح جديد»." /></Card>
          ) : (
            <div className="grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-6">
              {pipelineCounts.map(({ stage, count }) => (
                <div key={stage} className="min-w-0">
                  <div className="mb-2 flex items-center justify-between px-1">
                    <StampBadge tone={CANDIDATE_STAGE_TONE[stage]}>{stage}</StampBadge>
                    <span className="text-xs font-semibold tabular-nums text-slate-400">{count}</span>
                  </div>
                  <div className="space-y-2.5">
                    {filtered.filter((c) => c.stage === stage).map((c) => (
                      <CandidateCard
                        key={c.id} candidate={c}
                        onEdit={(cand) => { setEditing(cand); setModalOpen(true); }}
                        onDelete={remove}
                        onStageChange={changeStage}
                        onConvert={onConvert}
                      />
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}

          <Modal open={modalOpen} onClose={() => { setModalOpen(false); setEditing(null); }} title={editing ? "تعديل بيانات مرشح" : "إضافة مرشح جديد"} wide>
            <CandidateForm initial={editing} positions={positions} onSave={save} onCancel={() => { setModalOpen(false); setEditing(null); }} />
          </Modal>
        </>
      ) : (
        <>
          <p className="mb-4 flex items-start gap-1.5 rounded-lg bg-stone-50 px-3 py-2 text-xs text-slate-500"><Info size={14} className="mt-0.5 shrink-0" />{t("الشاغر بيحمل الوصف الوظيفي وشروط التوظيف مرة واحدة، وأي مرشح يتقدّم له تقدر تربطه بيه من فورم المرشح - من غير ما تكتب نفس الوصف تاني لكل مرشح.")}</p>
          {positions.length === 0 ? (
            <Card className="p-0"><EmptyState text="لسه معملتش أي شاغر. ابدأ بـ«شاغر جديد»." /></Card>
          ) : (
            <div className="space-y-2.5">
              {positions.map((p) => (
                <Card key={p.id} className="p-4">
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0">
                      <div className="flex items-center gap-2">
                        <span className="font-semibold text-slate-800">{p.title}</span>
                        <StampBadge tone={p.status === "مفتوح" ? "emerald" : "slate"}>{p.status}</StampBadge>
                      </div>
                      <div className="text-xs text-slate-400">{p.department}{p.openedDate ? ` · ${t("فُتح في {date}", { date: p.openedDate })}` : ""}</div>
                    </div>
                    <div className="flex shrink-0 items-center gap-0.5">
                      <button onClick={() => setExpandedPosId(expandedPosId === p.id ? null : p.id)} className="rounded-md p-1.5 text-slate-400 hover:bg-stone-100 hover:text-teal-700">{expandedPosId === p.id ? <ChevronUp size={15} /> : <ChevronDown size={15} />}</button>
                      <button onClick={() => { setEditingPos(p); setPosModalOpen(true); }} className="rounded-md p-1.5 text-slate-400 hover:bg-stone-100 hover:text-teal-700"><Pencil size={14} /></button>
                      <button onClick={() => removePosition(p)} className="rounded-md p-1.5 text-slate-400 hover:bg-rose-50 hover:text-rose-600"><Trash2 size={14} /></button>
                    </div>
                  </div>
                  {expandedPosId === p.id && (
                    <div className="mt-3 grid grid-cols-2 gap-4 border-t border-stone-100 pt-3 text-sm">
                      <div>
                        <div className="mb-1 text-xs font-semibold text-slate-500">{t("الوصف الوظيفي (Job Description)")}</div>
                        <p className="whitespace-pre-line text-slate-600">{p.jobDescription || t("مفيش وصف مسجل.")}</p>
                      </div>
                      <div>
                        <div className="mb-1 text-xs font-semibold text-slate-500">{t("شروط شغل الوظيفة (Job Specifications)")}</div>
                        <p className="whitespace-pre-line text-slate-600">{p.jobSpecifications || t("مفيش شروط مسجلة.")}</p>
                      </div>
                    </div>
                  )}
                </Card>
              ))}
            </div>
          )}

          <Modal open={posModalOpen} onClose={() => { setPosModalOpen(false); setEditingPos(null); }} title={editingPos ? "تعديل بيانات شاغر" : "إضافة شاغر جديد"} wide>
            <PositionForm initial={editingPos} onSave={savePosition} onCancel={() => { setPosModalOpen(false); setEditingPos(null); }} />
          </Modal>
        </>
      )}
    </div>
  );
}

function NotificationSettingsSection({ notifySettings, setNotifySettings }) {
  const { t } = useLang();
  const [form, setForm] = useState(notifySettings);
  const [msg, setMsg] = useState(null);
  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  function save(e) {
    e.preventDefault();
    setNotifySettings(form);
    setMsg(t("تم حفظ إعدادات إشعارات الإيميل."));
    setTimeout(() => setMsg(null), 4000);
  }
  return (
    <Card className="mb-6 p-5">
      <h3 className="mb-1 flex items-center gap-2 font-bold text-slate-800"><Mail size={16} /> {t("إشعارات الإيميل")}</h3>
      <p className="mb-4 text-xs text-slate-500">
        {t("لازم تعمل حساب مجاني على EmailJS، تربطه بإيميلك، وتعمل قالب رسالة، عشان زرار «إرسال بالإيميل» في لوحة المتابعة يشتغل. القيم دي متخزنة في مستند منفصل يقدر يقراه الأدمن بس.")}
      </p>
      <form onSubmit={save} className="grid grid-cols-2 gap-4">
        <Field label="Service ID"><input className={inputCls} value={form.notifyServiceId} onChange={(e) => set("notifyServiceId", e.target.value)} placeholder="service_xxxxxxx" /></Field>
        <Field label="Template ID"><input className={inputCls} value={form.notifyTemplateId} onChange={(e) => set("notifyTemplateId", e.target.value)} placeholder="template_xxxxxxx" /></Field>
        <Field label="Public Key"><input className={inputCls} value={form.notifyPublicKey} onChange={(e) => set("notifyPublicKey", e.target.value)} placeholder="xxxxxxxxxxxxxxxx" /></Field>
        <Field label="إيميل المستلم (ممكن أكتر من إيميل مفصولين بفاصلة)"><input className={inputCls} value={form.notifyRecipientEmail} onChange={(e) => set("notifyRecipientEmail", e.target.value)} placeholder="hr@example.com" /></Field>
        <div className="col-span-2 flex items-center gap-2">
          <button type="submit" className="rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900">{t("حفظ إعدادات الإشعارات")}</button>
          {msg && <span className="text-xs font-medium text-emerald-700">{msg}</span>}
        </div>
      </form>
    </Card>
  );
}

function SettingsTab({ settings, setSettings, notifySettings, setNotifySettings, backupProps }) {
  const { t } = useLang();
  const [form, setForm] = useState(settings);
  const [holidayForm, setHolidayForm] = useState({ date: "", name: "" });

  // "وضع Password في خانة الإعدادات في حالة إجراء أي تعديل حتى من الأدمن" - لو الأدمن حط
  // كلمة سر تأكيد (settings.confirmPassword)، أي حفظ فعلي لتاب الإعدادات (سواء زرار "حفظ
  // الإعدادات" العام، أو أي إضافة/حذف بتتحفظ فورًا زي العطلات/المؤشرات/خطوات الضم والخروج)
  // بيتوقف مؤقتًا (pendingSave) لحد ما يدخل نفس كلمة السر تاني. لو لسه مفيش كلمة سر متسجلة
  // (أول مرة)، الحفظ بيعدي عادي من غير أي تأكيد - فالأدمن يقدر يحط أول كلمة سر من غير ما
  // يتقفل بره النظام. تغيير كلمة السر نفسها بيعدي من نفس المسار (زرار "حفظ الإعدادات" العام)
  // فبيتطلب هو نفسه كلمة السر القديمة للتأكيد - مايقدرش حد يغيّرها من غير ما يعرف القديمة.
  const [pendingSave, setPendingSave] = useState(null); // { next, onConfirmed } | null
  const [confirmPwInput, setConfirmPwInput] = useState("");
  const [confirmPwError, setConfirmPwError] = useState("");

  function guardedApply(next, onConfirmed) {
    if (!settings.confirmPassword) {
      setForm(next); setSettings(next); onConfirmed && onConfirmed();
      return;
    }
    setPendingSave({ next, onConfirmed: onConfirmed || null });
    setConfirmPwInput(""); setConfirmPwError("");
  }
  function confirmPendingSave(e) {
    e.preventDefault();
    if (!pendingSave) return;
    if (confirmPwInput !== settings.confirmPassword) { setConfirmPwError("كلمة السر غلط."); return; }
    setForm(pendingSave.next); setSettings(pendingSave.next);
    pendingSave.onConfirmed && pendingSave.onConfirmed();
    setPendingSave(null); setConfirmPwInput(""); setConfirmPwError("");
  }
  function cancelPendingSave() { setPendingSave(null); setConfirmPwInput(""); setConfirmPwError(""); }

  function save(e) { e.preventDefault(); guardedApply(form); }
  function addHoliday(e) {
    e.preventDefault();
    if (!holidayForm.date) return;
    const next = { ...form, publicHolidays: [...form.publicHolidays, holidayForm] };
    guardedApply(next, () => setHolidayForm({ date: "", name: "" }));
  }
  function removeHoliday(date) {
    const next = { ...form, publicHolidays: form.publicHolidays.filter((h) => h.date !== date) };
    guardedApply(next);
  }
  function updateBracket(i, patch) {
    const next = { ...form, taxBrackets: form.taxBrackets.map((b, idx) => (idx === i ? { ...b, ...patch } : b)) };
    setForm(next);
  }

  // درجات ومستويات المرتبات (Grade Bands)، وجدول نسب الزيادة السنوية حسب تقييم الأداء - بيتحفظوا
  // مع باقي الإعدادات العامة بزرار "حفظ الإعدادات" فوق (نفس منطق شرائح الضريبة بالظبط).
  function updateGradeBand(i, patch) {
    const next = { ...form, salaryGradeBands: (form.salaryGradeBands || []).map((b, idx) => (idx === i ? { ...b, ...patch } : b)) };
    setForm(next);
  }
  function updateRatingTier(i, patch) {
    const next = { ...form, salaryRatingMatrix: (form.salaryRatingMatrix || []).map((r, idx) => (idx === i ? { ...r, ...patch } : r)) };
    setForm(next);
  }

  // مؤشرات الأداء (KPIs)، وخطوات تشيك ليست الضم/الخروج الافتراضية - زي العطلات الرسمية فوق،
  // التعديلات هنا بتتحفظ فورًا (مش مربوطة بزرار "حفظ الإعدادات" العام).
  const [kpiForm, setKpiForm] = useState({ scope: "department", scopeValue: "", title: "", target: "" });
  function addKpiTemplate(e) {
    e.preventDefault();
    if (!kpiForm.scopeValue.trim() || !kpiForm.title.trim()) return;
    const next = { ...form, kpiTemplates: [...form.kpiTemplates, { id: uid("kpi"), ...kpiForm }] };
    guardedApply(next, () => setKpiForm({ scope: kpiForm.scope, scopeValue: kpiForm.scopeValue, title: "", target: "" }));
  }
  function removeKpiTemplate(id) {
    const next = { ...form, kpiTemplates: form.kpiTemplates.filter((k) => k.id !== id) };
    guardedApply(next);
  }
  const [onboardingItemText, setOnboardingItemText] = useState("");
  function addOnboardingTemplateItem(e) {
    e.preventDefault();
    if (!onboardingItemText.trim()) return;
    const next = { ...form, onboardingChecklistItems: [...form.onboardingChecklistItems, onboardingItemText.trim()] };
    guardedApply(next, () => setOnboardingItemText(""));
  }
  function removeOnboardingTemplateItem(i) {
    const next = { ...form, onboardingChecklistItems: form.onboardingChecklistItems.filter((_, idx) => idx !== i) };
    guardedApply(next);
  }
  const [offboardingItemText, setOffboardingItemText] = useState("");
  function addOffboardingTemplateItem(e) {
    e.preventDefault();
    if (!offboardingItemText.trim()) return;
    const next = { ...form, offboardingChecklistItems: [...form.offboardingChecklistItems, offboardingItemText.trim()] };
    guardedApply(next, () => setOffboardingItemText(""));
  }
  function removeOffboardingTemplateItem(i) {
    const next = { ...form, offboardingChecklistItems: form.offboardingChecklistItems.filter((_, idx) => idx !== i) };
    guardedApply(next);
  }

  return (
    <div>
      <SectionTitle eyebrow={t("نسب وقيم قابلة للتعديل")} title={t("الإعدادات")} />
      <p className="mb-5 flex items-start gap-1.5 rounded-lg bg-amber-50 px-3 py-2 text-xs text-amber-700"><Info size={14} className="mt-0.5 shrink-0" />{t("النسب دي تقديرية ومسؤوليتك تراجعها وتحدّثها مع محاسب أو مستشار قانوني، خصوصًا إن قوانين التأمينات والضرايب بتتغير كل فترة.")}</p>

      <NotificationSettingsSection notifySettings={notifySettings} setNotifySettings={setNotifySettings} />

      <BackupSection {...backupProps} />

      <form onSubmit={save} className="space-y-6">
        <Card className="p-5">
          <h3 className="mb-4 flex items-center gap-2 font-bold text-slate-800"><Landmark size={16} /> {t("التأمينات والإجازات والإضافي")}</h3>
          <div className="grid grid-cols-3 gap-4">
            <Field label="نسبة التأمينات على الموظف (%)"><input type="number" step="0.1" className={inputCls} value={form.insuranceRate} onChange={(e) => setForm({ ...form, insuranceRate: Number(e.target.value) })} /></Field>
            <Field label="مضاعف أجر الوقت الإضافي"><input type="number" step="0.1" className={inputCls} value={form.overtimeMultiplier} onChange={(e) => setForm({ ...form, overtimeMultiplier: Number(e.target.value) })} /></Field>
            <Field label="رصيد الإجازة السنوي الافتراضي (يوم)"><input type="number" className={inputCls} value={form.leaveDefaultDays} onChange={(e) => setForm({ ...form, leaveDefaultDays: Number(e.target.value) })} /></Field>
            <Field label="معاد بداية الدوام الرسمي"><input type="time" className={inputCls} value={form.workStartTime} onChange={(e) => setForm({ ...form, workStartTime: e.target.value })} /></Field>
            <Field label="فترة سماح قبل اعتباره متأخر (دقيقة)"><input type="number" className={inputCls} value={form.lateGraceMinutes} onChange={(e) => setForm({ ...form, lateGraceMinutes: Number(e.target.value) })} /></Field>
            <Field label="دورة التقييم الدوري (شهور)"><input type="number" min="1" className={inputCls} value={form.reviewCycleMonths} onChange={(e) => setForm({ ...form, reviewCycleMonths: Number(e.target.value) })} /></Field>
            <Field label="مدة فترة الاختبار (شهور)"><input type="number" min="1" className={inputCls} value={form.probationMonths} onChange={(e) => setForm({ ...form, probationMonths: Number(e.target.value) })} /></Field>
          </div>
          <p className="mt-2 text-xs text-slate-400">{t("دول بيتستخدموا لما تستورد بيانات حضور بوقت دخول بس (من جهاز البصمة) عشان نحدد تلقائي مين \"متأخر\".")}</p>
        </Card>

        <Card className="p-5">
          <h3 className="mb-4 font-bold text-slate-800">{t("شرائح ضريبة كسب العمل (سنويًا)")}</h3>
          <Field label="الإعفاء الشخصي السنوي (ج.م)"><input type="number" className={inputCls} value={form.personalExemptionAnnual} onChange={(e) => setForm({ ...form, personalExemptionAnnual: Number(e.target.value) })} /></Field>
          <div className="mt-4 space-y-2">
            {form.taxBrackets.map((b, i) => (
              <div key={i} className="grid grid-cols-2 gap-3">
                <input type="number" placeholder={t("حتى (ج.م، فارغ = بلا حد)")} className={inputCls} value={b.upTo ?? ""} onChange={(e) => updateBracket(i, { upTo: e.target.value === "" ? null : Number(e.target.value) })} />
                <div className="flex items-center gap-2">
                  <input type="number" step="0.5" className={inputCls} value={b.rate} onChange={(e) => updateBracket(i, { rate: Number(e.target.value) })} />
                  <span className="text-xs text-slate-400">%</span>
                </div>
              </div>
            ))}
          </div>
        </Card>

        <Card className="p-5">
          <h3 className="mb-1 font-bold text-slate-800">{t("درجات ومستويات المرتبات (Grade Bands)")}</h3>
          <p className="mb-4 text-xs text-slate-500">{t("كل درجة ليها حد أدنى وأوسط وأقصى للمرتب - دول أساس حساب اقتراح الزيادة السنوية في تاب «زيادات الرواتب».")}</p>
          <div className="space-y-2">
            <div className="grid grid-cols-5 gap-2 text-xs font-semibold text-slate-500">
              <span>{t("الدرجة (Grade)")}</span>
              <span>{t("المستوى الوظيفي (Level)")}</span>
              <span>{t("الحد الأدنى")}</span>
              <span>{t("المتوسط")}</span>
              <span>{t("الحد الأقصى")}</span>
            </div>
            {(form.salaryGradeBands || []).map((b, i) => (
              <div key={b.grade || i} className="grid grid-cols-5 gap-2">
                <input className={inputCls} value={b.grade} onChange={(e) => updateGradeBand(i, { grade: e.target.value })} />
                <input className={inputCls} value={b.level} onChange={(e) => updateGradeBand(i, { level: e.target.value })} />
                <input type="number" className={inputCls} value={b.min} onChange={(e) => updateGradeBand(i, { min: Number(e.target.value) })} />
                <input type="number" className={inputCls} value={b.mid} onChange={(e) => updateGradeBand(i, { mid: Number(e.target.value) })} />
                <input type="number" className={inputCls} value={b.max} onChange={(e) => updateGradeBand(i, { max: Number(e.target.value) })} />
              </div>
            ))}
          </div>
        </Card>

        <Card className="p-5">
          <h3 className="mb-1 font-bold text-slate-800">{t("جدول نسب الزيادة السنوية حسب التقييم")}</h3>
          <p className="mb-4 text-xs text-slate-500">{t("لكل تقييم (من 5) مدى نسبة زيادة مقترحة - النظام بياخد نص المدى (بين الحد الأدنى والأقصى) كنسبة مقترحة للحساب التلقائي.")}</p>
          <div className="space-y-2">
            <div className="grid grid-cols-4 gap-2 text-xs font-semibold text-slate-500">
              <span>{t("التقييم (من 5)")}</span>
              <span>{t("الوصف")}</span>
              <span>{t("أقل نسبة زيادة %")}</span>
              <span>{t("أعلى نسبة زيادة %")}</span>
            </div>
            {(form.salaryRatingMatrix || []).map((r, i) => (
              <div key={r.rating ?? i} className="grid grid-cols-4 gap-2">
                <input type="number" min="1" max="5" className={inputCls} value={r.rating} onChange={(e) => updateRatingTier(i, { rating: Number(e.target.value) })} />
                <input className={inputCls} value={r.label} onChange={(e) => updateRatingTier(i, { label: e.target.value })} />
                <input type="number" step="0.5" className={inputCls} value={r.minPct} onChange={(e) => updateRatingTier(i, { minPct: Number(e.target.value) })} />
                <input type="number" step="0.5" className={inputCls} value={r.maxPct} onChange={(e) => updateRatingTier(i, { maxPct: Number(e.target.value) })} />
              </div>
            ))}
          </div>
        </Card>

        <Card className="p-5">
          <h3 className="mb-1 flex items-center gap-2 font-bold text-slate-800"><Lock size={16} /> {t("الأمان")}</h3>
          <p className="mb-4 text-xs text-slate-500">{t("لو حطيت كلمة سر هنا، أي تعديل تاني في تاب الإعدادات (حتى منك إنت) هيطلب إدخالها تاني قبل ما يتحفظ. سيبها فاضية لو مش عايز الحماية دي.")}</p>
          <Field label="كلمة سر تأكيد التعديلات (اختياري)"><input type="password" className={inputCls} value={form.confirmPassword || ""} onChange={(e) => setForm({ ...form, confirmPassword: e.target.value })} placeholder={t("سيبها فاضية لإلغاء الحماية")} /></Field>
        </Card>

        <button type="submit" className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Save size={15} /> {t("حفظ الإعدادات")}</button>
      </form>

      <Modal open={!!pendingSave} onClose={cancelPendingSave} title="تأكيد التعديل">
        <form onSubmit={confirmPendingSave} className="space-y-4">
          <p className="text-sm text-slate-600">{t("عشان تكمّل حفظ التعديل ده في الإعدادات، أدخل كلمة سر التأكيد.")}</p>
          <Field label="كلمة السر"><input autoFocus type="password" className={inputCls} value={confirmPwInput} onChange={(e) => { setConfirmPwInput(e.target.value); setConfirmPwError(""); }} /></Field>
          {confirmPwError && <p className="text-xs font-medium text-rose-600">{t(confirmPwError)}</p>}
          <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">
            <button type="button" onClick={cancelPendingSave} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50">{t("إلغاء")}</button>
            <button type="submit" className="rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900">{t("تأكيد وحفظ")}</button>
          </div>
        </form>
      </Modal>

      <Card className="mt-6 p-5">
        <h3 className="mb-1 font-bold text-slate-800">{t("مؤشرات الأداء الثابتة (KPIs)")}</h3>
        <p className="mb-4 text-xs text-slate-500">{t("مؤشر مرتبط بقسم أو مسمى وظيفي معيّن - أي موظف قسمه أو وظيفته تطابق ده هيلاقي المؤشر ده جاهز يتحمّل تلقائي وقت تسجيل تقييمه في بروفايله.")}</p>
        <form onSubmit={addKpiTemplate} className="mb-4 grid grid-cols-4 gap-2">
          <select className={inputCls} value={kpiForm.scope} onChange={(e) => setKpiForm({ ...kpiForm, scope: e.target.value })}>
            <option value="department">{t("قسم")}</option>
            <option value="position">{t("وظيفة")}</option>
          </select>
          <input placeholder={kpiForm.scope === "department" ? t("اسم القسم") : t("اسم الوظيفة")} className={inputCls} value={kpiForm.scopeValue} onChange={(e) => setKpiForm({ ...kpiForm, scopeValue: e.target.value })} />
          <input placeholder={t("اسم المؤشر")} className={inputCls} value={kpiForm.title} onChange={(e) => setKpiForm({ ...kpiForm, title: e.target.value })} />
          <div className="flex gap-2">
            <input placeholder={t("المستهدف (اختياري)")} className={inputCls} value={kpiForm.target} onChange={(e) => setKpiForm({ ...kpiForm, target: e.target.value })} />
            <button className="flex shrink-0 items-center justify-center rounded-lg bg-teal-800 px-3 py-2 text-xs font-semibold text-white hover:bg-teal-900"><Plus size={14} /></button>
          </div>
        </form>
        {form.kpiTemplates.length === 0 ? <p className="text-sm text-slate-400">{t("مفيش مؤشرات مسجلة.")}</p> : (
          <div className="space-y-1.5">
            {form.kpiTemplates.map((k) => (
              <div key={k.id} className="flex items-center justify-between rounded-lg border border-stone-100 px-3 py-2 text-sm">
                <span className="text-slate-700">
                  <StampBadge tone={k.scope === "department" ? "teal" : "amber"}>{k.scope === "department" ? t("قسم") : t("وظيفة")}: {k.scopeValue}</StampBadge>
                  <span className="mx-2">{k.title}</span>
                  {k.target && <span className="text-xs text-slate-400">({t("المستهدف: {target}", { target: k.target })})</span>}
                </span>
                <button onClick={() => removeKpiTemplate(k.id)} className="text-slate-300 hover:text-rose-600"><Trash2 size={14} /></button>
              </div>
            ))}
          </div>
        )}
      </Card>

      <div className="mt-6 grid grid-cols-1 gap-6 md:grid-cols-2">
        <Card className="p-5">
          <h3 className="mb-4 font-bold text-slate-800">{t("خطوات ضم موظف جديد (افتراضيًا)")}</h3>

/* ================= ORG CHART ================= */

// Builds a 3-level tree (CEO -> department head -> rest of the department) purely from
// each employee's existing "department" field plus the two choices made in OrgChartTab
// (ceoEmployeeId, departmentHeads). No per-employee "manager" field needed.
function buildOrgTree(employees, orgChart) {
  const ceo = employees.find((e) => e.id === orgChart.ceoEmployeeId) || null;
  const rest = employees.filter((e) => !ceo || e.id !== ceo.id);

  const byDept = {};
  rest.forEach((e) => {
    const dept = (e.department || "").trim() || "بدون قسم";
    (byDept[dept] = byDept[dept] || []).push(e);
  });

  const departmentHeads = orgChart.departmentHeads || {};
  const departments = Object.keys(byDept)
    .sort((a, b) => a.localeCompare(b, "ar"))
    .map((dept) => {
      const members = byDept[dept];
      const headId = departmentHeads[dept];
      const head = members.find((e) => e.id === headId) || null;
      const others = members.filter((e) => !head || e.id !== head.id);
      return { dept, head, others, total: members.length };
    });

  return { ceo, departments };
}

// نفس منطق resolveApprover في بوابة الموظف (رئيس القسم، أو الرئيس التنفيذي لو الموظف نفسه
// رئيس قسم، أو محدش لو هو الرئيس التنفيذي نفسه) - بس هنا لأي استخدام عام محتاج يعرف "مين
// المدير المباشر" (زي بروفايل الموظف وتنبيه التقييمات الدورية)، مش بس توجيه الطلبات. بتدوّر في
// كل الموظفين المُمرَّرة من غير فلترة حالة، عشان مايتكررش نفس باگ "المسؤول مش نشط فاختفى".
function resolveDirectManager(employee, orgChart, employees) {
  if (!employee) return null;
  if (employee.id === orgChart.ceoEmployeeId) return null; // الرئيس التنفيذي مالوش حد فوقه
  // لازم .trim() هنا زي بالظبط buildOrgTree وOrgChartTab (usedDepartments/setDeptHead) - وإلا
  // أي مسافة زيادة/ناقصة في حقل القسم بتاع الموظف (حتى لو مش ظاهرة للعين) تخلي المطابقة مع
  // مفتاح departmentHeads تفشل بصمت، والموظف يظهر "غير محدد في الهيكل التنظيمي" رغم إنه فعلاً
  // متحدد كرئيس قسم صح في تاب الهيكل التنظيمي.
  const dept = (employee.department || "").trim();
  const headId = (orgChart.departmentHeads || {})[dept];
  if (headId === employee.id) {
    // الموظف نفسه رئيس القسم - مديره المباشر هو الرئيس التنفيذي
    return employees.find((e) => e.id === orgChart.ceoEmployeeId) || null;
  }
  return employees.find((e) => e.id === headId) || null;
}
// عكس resolveDirectManager: مين تحت إدارة الموظف ده مباشرة. الرئيس التنفيذي تحته كل رؤساء
// الأقسام، رئيس القسم تحته باقي أفراد قسمه، وأي موظف عادي تاني مفيش حد تحته (هيكل من 3 مستويات
// بس، زي buildOrgTree بالظبط).
function resolveDirectReports(employee, orgChart, employees) {
  if (!employee) return [];
  if (employee.id === orgChart.ceoEmployeeId) {
    const headIds = new Set(Object.values(orgChart.departmentHeads || {}));
    return employees.filter((e) => headIds.has(e.id) && e.id !== employee.id);
  }
  const dept = (employee.department || "").trim();
  const headId = (orgChart.departmentHeads || {})[dept];
  if (headId === employee.id) {
    return employees.filter((e) => (e.department || "").trim() === dept && e.id !== employee.id);
  }
  return [];
}

function PersonBox({ person, role, tone = "teal", placeholder, subtitle, crown }) {
  const { t } = useLang();
  const toneCls = {
    teal: "border-teal-700 bg-teal-50",
    amber: "border-amber-500 bg-amber-50",
  }[tone];
  const placeholderBorder = tone === "teal" ? "border-teal-300" : "border-amber-300";

  if (!person) {
    return (
      <div className={`w-56 rounded-xl border-2 border-dashed ${placeholderBorder} bg-stone-50 p-3 text-center`}>
        <div className="text-[11px] font-semibold uppercase tracking-wide text-slate-400">{t(role)}</div>
        <div className="mt-1.5 text-xs text-slate-400">{t(placeholder)}</div>
      </div>
    );
  }
  return (
    <div className={`w-56 rounded-xl border-2 p-3 text-center shadow-sm ${toneCls}`}>
      <div className="flex items-center justify-center gap-1 text-[11px] font-semibold uppercase tracking-wide text-slate-500">
        {crown && <Crown size={12} className="text-amber-600" />}{t(role)}

      <div className="mt-1 text-sm font-bold text-slate-800">{person.name}</div>

      {subtitle && <div className="mt-1 text-[11px] text-slate-400">{subtitle}</div>}
    </div>
  );
}

                      )}

}

function OrgChartTab({ employees, orgChart, setOrgChart, onPrint }) {
  const { t } = useLang();
  const [expanded, setExpanded] = useState({});
  function toggle(dept) { setExpanded((s) => ({ ...s, [dept]: !s[dept] })); }

  const usedDepartments = useMemo(() => {
    const set = new Set();
    employees.forEach((e) => { const d = (e.department || "").trim(); if (d) set.add(d); });
    return Array.from(set).sort((a, b) => a.localeCompare(b, "ar"));
  }, [employees]);

  const tree = useMemo(() => buildOrgTree(employees, orgChart), [employees, orgChart]);
  const unassignedCount = employees.filter((e) => !(e.department || "").trim()).length;

  function setCeo(id) { setOrgChart({ ...orgChart, ceoEmployeeId: id || null }); }
  function setDeptHead(dept, id) {
    const heads = { ...(orgChart.departmentHeads || {}) };
    if (id) heads[dept] = id; else delete heads[dept];
    setOrgChart({ ...orgChart, departmentHeads: heads });
  }

  return (
    <div>
      <SectionTitle
        eyebrow={t("{n} موظف نشط", { n: employees.length })}
        title={t("الهيكل التنظيمي")}
        action={
          <button onClick={onPrint} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3.5 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50">
            <Printer size={16} /> {t("طباعة الهيكل")}
          </button>
        }
      />

      <Card className="mb-6 p-5">
        <div className="mb-4 flex items-center gap-2"><Crown size={16} className="text-amber-600" /><h3 className="font-bold text-slate-800">{t("تحديد المناصب القيادية")}</h3></div>

        <div className="max-w-sm">
          <Field label="الرئيس التنفيذي / صاحب الشركة">
            <select className={inputCls} value={orgChart.ceoEmployeeId || ""} onChange={(e) => setCeo(e.target.value)}>
              <option value="">{t("— لم يتم التحديد —")}</option>
              {employees.map((e) => <option key={e.id} value={e.id}>{e.name}{e.position ? ` — ${e.position}` : ""}</option>)}
            </select>
          </Field>
        </div>

        {usedDepartments.length > 0 ? (
          <div className="mt-5 border-t border-stone-100 pt-4">
            <div className="mb-2.5 text-sm font-medium text-slate-600">{t("رئيس/مديرة كل إدارة")}</div>
            <div className="grid grid-cols-1 gap-3 md:grid-cols-2 lg:grid-cols-3">
              {usedDepartments.map((dept) => {
                const candidates = employees.filter((e) => (e.department || "").trim() === dept && e.id !== orgChart.ceoEmployeeId);
                return (
                  <label key={dept} className="block">
                    <span className="mb-1 block text-xs font-medium text-slate-500">{dept}</span>
                    <select className={`${inputCls} text-xs`} value={(orgChart.departmentHeads || {})[dept] || ""} onChange={(e) => setDeptHead(dept, e.target.value)}>
                      <option value="">{t("— بدون تحديد —")}</option>
                      {candidates.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
                    </select>
                  </label>
                );
              })}
            </div>
          </div>
        ) : (
          <p className="mt-4 text-xs text-slate-400">{t("مفيش أقسام متسجلة لسه — اكتب قسم كل موظف من تاب \"الموظفون والعقود\" الأول عشان الهيكل يتبني.")}</p>
        )}
        {unassignedCount > 0 && (
          <p className="mt-3 text-xs text-amber-600">{t("{n} موظف من غير قسم محدد — هيظهروا تحت مجموعة \"بدون قسم\" في الهيكل.", { n: unassignedCount })}</p>
        )}
      </Card>

      {employees.length === 0 ? <EmptyState text="لسه معملتش أي موظف." /> : (
        <Card className="overflow-x-auto p-8">
          <OrgChartTree tree={tree} expanded={expanded} onToggle={toggle} />
        </Card>
      )}
    </div>
  );
}

// Guards the whole app behind a real login. Before this, the deployed page had no
// authentication at all — anyone with the URL could open and edit every salary, penalty,
// and personal record. There is no self-serve sign-up: the first admin account is created
// once, by hand, in the Firebase Console (Authentication → Users), and then whitelisted by
// adding a matching document to the `admins` collection — see the setup notes delivered
// alongside this file. `admins` documents are never client-writable (see firestore.rules),
// so nobody can grant themselves access from the app itself.

}

function AdminAuthGate() {
  const [authState, setAuthState] = useState("loading"); // loading | signedOut | checking | admin | denied
  const [user, setUser] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    const unsub = onAuthStateChanged(auth, async (u) => {
      setUser(u);
      if (!u) { setAuthState("signedOut"); return; }
      setAuthState("checking");
      try {
        const snap = await getDoc(doc(db, "admins", u.uid));
        setAuthState(snap.exists() ? "admin" : "denied");
      } catch (e) {
        console.error(e);
        setAuthState("denied");
      }
    });
    return unsub;
  }, []);

  async function handleLogin(form) {
    setError(""); setBusy(true);
    try {
      await signInWithEmailAndPassword(auth, form.email.trim(), form.password);
    } catch (err) {
      setError("بيانات الدخول غلط، أو الحساب ده مش موجود.");
    } finally { setBusy(false); }
  }

  const langState = useLangState();

  let content;
  if (authState === "loading") content = <FullScreenLoader text="جاري التحقق من الدخول..." />;
  else if (authState === "signedOut") content = <AdminLoginScreen onSubmit={handleLogin} busy={busy} error={error} />;
  else if (authState === "checking") content = <FullScreenLoader text="جاري التحقق من الصلاحيات..." />;
  else if (authState === "denied") content = <AccessDeniedScreen email={user?.email} />;
  else content = <HRSystem adminUser={user} />;

  return (
    <LangContext.Provider value={langState}>
      <div dir={langState.dir} className="font-sans">{content}</div>
    </LangContext.Provider>
  );
}
