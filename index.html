// مفيش قناة تلقائية توصل بيها كود الدخول/الرقم السري للموظف (مفيش إيميل حقيقي ولا SMS
// متكامل مع السيستم) - عشان كده أقصى حاجة نقدر نعملها إننا نجهزله لينك واتساب جاهز
// برقم موبايله المسجل وبنص فيه الكود والرقم السري، والأدمن هو اللي يدوس إرسال.
function randomPin(length = 6) {

function phoneForWhatsApp(phone) {

/* ================= i18n (Arabic/English toggle) ================= */
// Deliberately keyed by the ARABIC text itself, not an invented id - every existing call
// site already has that string sitting right there, so wrapping it as t("<the Arabic text>")
// needs no separate key to invent or keep in sync. TRANSLATIONS is filled in further down
// this file; a phrase that's missing from it (or a value string this app doesn't recognize,
// e.g. an employee's own name) just falls back to the Arabic unchanged - t() never throws and
// never renders "undefined", so a partially-translated screen still works.
// For a phrase that needs inline variables and a different word order in English, pass a
// `{token}`-style template as the key plus a `vars` object, e.g.
// t("عقد {name} بينتهي في {date}", { name: e.name, date: e.contractEnd }).
const LangContext = createContext({ lang: "ar", dir: "rtl", t: (s) => s, toggle: () => {} });
function useLang() { return useContext(LangContext); }
// Used by the shared low-level UI primitives below (Field, SectionTitle, Modal, etc.) so
// every existing call site that passes a plain Arabic label/title/text prop gets translated
// automatically, without having to touch each of the many call sites individually. Passing
// actual JSX (an icon, a <span dir="ltr">, another component) instead of a plain string is
// left completely alone.
function autoT(t, v) { return typeof v === "string" ? t(v) : v; }
function translate(lang, ar, vars) {
  let s = lang === "en" ? (TRANSLATIONS[ar] ?? ar) : ar;
  if (vars) Object.keys(vars).forEach((k) => { s = s.split(`{${k}}`).join(vars[k]); });
  return s;
}
function useLangState() {
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem("hr_admin_lang") === "en" ? "en" : "ar"; } catch { return "ar"; }
  });
  useEffect(() => { try { localStorage.setItem("hr_admin_lang", lang); } catch {} }, [lang]);
  const dir = lang === "en" ? "ltr" : "rtl";
  const t = (ar, vars) => translate(lang, ar, vars);
  const toggle = () => setLang((l) => (l === "ar" ? "en" : "ar"));
  return { lang, dir, t, toggle };
}
// Small persistent switcher, dropped into every top-level screen (login, access-denied,
// loading, and the main app's sidebar) so the language can be changed from anywhere,
// including before signing in.
function LangToggle({ className = "" }) {
  const { lang, toggle } = useLang();
  return (
    <button onClick={toggle} className={`flex items-center gap-1.5 rounded-lg border border-stone-300 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-stone-50 ${className}`}>
      <Languages size={13} /> {lang === "ar" ? "English" : "العربية"}
    </button>
  );
}
// TRANSLATIONS (Arabic -> English) lives at the very bottom of this file, right before the
// root render call - it's a long flat dictionary and reads better out of the way of the
// actual components. t()/translate() above only read from it at call time, so definition
// order here doesn't matter.

// Firestore write batches cap at 500 operations; chunk defensively well under that so a
// large bulk-attendance import or bulk employee import never risks hitting the limit.
async function commitOpsChunked(ops, chunkSize = 400) {
  for (let i = 0; i < ops.length; i += chunkSize) {
    const batch = writeBatch(db);
    ops.slice(i, i + chunkSize).forEach((op) => {
      if (op.type === "delete") batch.delete(op.ref);
      else batch.set(op.ref, op.data);
    });
    await batch.commit();
  }
}

// Diffs a "next full array" (the shape every Tab component already produces, e.g.
// setEmployees([...employees, newOne])) against the live Firestore-backed array, and
// writes only what changed. Lets every existing add/edit/delete call site in the app work
// unmodified — only the setter passed down needed to change from localStorage to this.
async function syncCollection(colName, currentArr, nextArr) {
  const nextIds = new Set(nextArr.map((x) => x.id));
  const ops = [];
  nextArr.forEach((item) => {
    const { id, ...rest } = item;
    ops.push({ type: "set", ref: doc(db, colName, id), data: rest });
  });
  currentArr.forEach((item) => {
    if (!nextIds.has(item.id)) ops.push({ type: "delete", ref: doc(db, colName, item.id) });
  });
  await commitOpsChunked(ops);
}

// Pure diff between a collection's current array and the "next full array" every Tab already
// produces (same shape syncCollection above consumes) — used only to describe a change for the
// audit log, never to decide what to write to Firestore. `labelFn(item)` turns one item into a
// short display label (e.g. an employee's name); omit it to only get counts, no sample labels
// (used for high-volume collections like attendance where per-record labels aren't worth it).
// A field-by-field value comparison (not just presence) is what makes "updated" mean "changed",
// not "still there" - JSON.stringify is a cheap, good-enough equality check for these plain
// data objects (no functions/dates-as-objects/circular refs ever end up in them).
// Field-by-field diff between two plain data objects (an item's old vs new state) - every
// top-level key (other than "id") whose value actually changed, as {field, from, to}. This is
// what lets the audit log say WHAT changed on an "updated" item, not just THAT it changed.
// undefined is normalized to null on both sides (a field that didn't exist yet, or was
// removed) since Firestore rejects literal `undefined` field values.
function diffFieldsFor(prev, next) {
  const keys = new Set([...Object.keys(prev || {}), ...Object.keys(next || {})]);
  const changes = [];
  keys.forEach((k) => {
    if (k === "id") return;
    const a = (prev && prev[k] !== undefined) ? prev[k] : null;
    const b = (next && next[k] !== undefined) ? next[k] : null;
    if (JSON.stringify(a) !== JSON.stringify(b)) changes.push({ field: k, from: a, to: b });
  });
  return changes;
}

// short display label (e.g. an employee's name); omit it to only get counts, no sample labels
// (used for high-volume collections like attendance where per-record labels aren't worth it).
// A field-by-field value comparison (not just presence) is what makes "updated" mean "changed",
// not "still there" - JSON.stringify is a cheap, good-enough equality check for these plain
// data objects (no functions/dates-as-objects/circular refs ever end up in them). Each "updated"
// entry is {label, changes} - changes is diffFieldsFor's field-level breakdown, so the audit
// log can say e.g. "stage: جديد → مقابلة" instead of just "Ahmed's candidate record changed".
function diffSummary(currentArr, nextArr, labelFn) {
  const curById = new Map(currentArr.map((x) => [x.id, x]));
  const nextIds = new Set(nextArr.map((x) => x.id));
  const added = [], removed = [], updated = [];
  nextArr.forEach((item) => {
    const prev = curById.get(item.id);
    if (!prev) added.push(labelFn ? labelFn(item) : item.id);
    else if (JSON.stringify(prev) !== JSON.stringify(item)) {
      updated.push({ label: labelFn ? labelFn(item) : item.id, changes: diffFieldsFor(prev, item) });
    }
  });
  currentArr.forEach((item) => {
    if (!nextIds.has(item.id)) removed.push(labelFn ? labelFn(item) : item.id);
  });
  return { added, removed, updated };
}

// Same idea as diffSummary but for a single settings/orgChart-style doc rather than an array
// collection (added/removed stay empty; a settings/org-chart doc is edited in place, never
// created/deleted from this app). Each changed top-level field becomes its own {label, changes}
// entry (same shape diffSummary uses) so AuditLogEntryCard can render both collection types
// with one code path - here label is just the field's own name.
function diffDocKeys(prevObj, nextObj) {
  const updated = diffFieldsFor(prevObj, nextObj).map((change) => ({ label: change.field, changes: [change] }));
  return { added: [], removed: [], updated };
}

// Re-flattens the nested shapes upd.attendance/upd.payrollMeta pass around (see
// syncAttendanceRecords/syncPayrollMeta above) into the same flat "array with stable ids"
// shape diffSummary expects - purely for computing an audit-log diff, no Firestore access.
function flattenAttendanceForDiff(nextAttendance) {
  const out = [];
  Object.entries(nextAttendance || {}).forEach(([date, dayRec]) => {
    Object.entries(dayRec || {}).forEach(([employeeId, entry]) => {
      if (!entry || !entry.status) return;
      out.push({ id: `${date}_${employeeId}`, status: entry.status, overtimeHours: Number(entry.overtimeHours) || 0, lateMinutes: Number(entry.lateMinutes) || 0 });
    });
  });
  return out;
}
function flattenPayrollMetaDocs(docsArr) {
  const out = [];
  (docsArr || []).forEach((d) => {
    const { id: ym, ...employeesMeta } = d;
    Object.entries(employeesMeta).forEach(([empId, meta]) => out.push({ id: `${ym}_${empId}`, ...meta }));
  });
  return out;
}
function flattenPayrollMetaObj(nextObj) {
  const out = [];
  Object.entries(nextObj || {}).forEach(([ym, monthRec]) => {
    Object.entries(monthRec || {}).forEach(([empId, meta]) => out.push({ id: `${ym}_${empId}`, ...meta }));
  });
  return out;
}

// Writes one entry to the `auditLog` collection - a flat, append-only trail of who changed
// what and when, browsable from the "سجل النشاط" tab. Deliberately stores STRUCTURED counts
// and sample labels rather than a pre-built sentence, so the viewing tab can translate/format
// it (see AuditLogTab's t() templates) instead of freezing English/Arabic wording into old
// entries forever. Caps sample labels at 5 per bucket so one 300-row bulk import doesn't
// balloon a single log doc - the counts still reflect the true total.
const AUDIT_SAMPLE_CAP = 5;
async function writeAuditLog(actor, collectionLabel, diff) {
  const total = diff.added.length + diff.removed.length + diff.updated.length;
  if (total === 0) return;
  const ref = doc(collection(db, "auditLog"));
  await setDoc(ref, {
    at: new Date().toISOString(),
    actorEmail: actor?.email || "",
    actorUid: actor?.uid || "",
    collection: collectionLabel,
    addedCount: diff.added.length,
    updatedCount: diff.updated.length,
    removedCount: diff.removed.length,
    addedSample: diff.added.slice(0, AUDIT_SAMPLE_CAP),
    updatedSample: diff.updated.slice(0, AUDIT_SAMPLE_CAP),
    removedSample: diff.removed.slice(0, AUDIT_SAMPLE_CAP),
  });
}

// A deliberately "thin" mirror of `employees` holding only name/department/position/code -
// never salary or personal data. The employee portal's org-chart view and team-requests
// screen need to see teammates' names, which the `employees` Security Rules never allow
// (an employee can only read their OWN employee doc) - this collection is what they read
// instead, so a colleague's salary can never leak through those screens. Kept in sync
// automatically every time the admin app writes to `employees`.
async function syncPublicDirectory(nextEmployees, currentDirDocs) {
  const nextDir = nextEmployees.map((e) => ({
    id: e.id,
    name: e.name || "",
    department: e.department || "",
    position: e.position || "",
    employeeCode: e.employeeCode || "",
  }));
  await syncCollection("publicDirectory", currentDirDocs, nextDir);
}

// Attendance used to be one localStorage blob shaped { [date]: { [employeeId]: entry } }.
// For the employee portal's security rules to be able to grant "read your own attendance
// only" (a rule can't slice a map field down to one key), each (date, employeeId) pair is
// now its own Firestore document. This function still accepts the old nested shape — every
// existing caller (AttendanceTab, bulk import) is untouched — and diffs it into per-record
// set/delete ops against the live flat `attendanceRecords` list.
async function syncAttendanceRecords(nextAttendance, currentRecords) {
  const ops = [];
  const nextIds = new Set();
  Object.entries(nextAttendance).forEach(([date, dayRec]) => {
    Object.entries(dayRec || {}).forEach(([employeeId, entry]) => {
      if (!entry || !entry.status) return;
      const id = `${date}_${employeeId}`;
      nextIds.add(id);
      // lateExcused لازم يتبعت هنا برضو - وإلا أي عملية "set" كاملة (زي مسح موظف، أو استيراد
      // نسخة احتياطية) هتمسح علامة "الإعفاء الرسمي من التأخير" (جاية من موافقة مدير على طلب
      // تأخير) لكل الموظفين تلقائيًا، لأن entry هنا جاي أصلًا من نفس الـ attendance state
      // المحلي اللي بيتقرا منه lateExcused تحت (شوف تعليق useMemo الخاص بـ attendance).
      ops.push({ type: "set", ref: doc(db, "attendanceRecords", id), data: { date, employeeId, status: entry.status, overtimeHours: Number(entry.overtimeHours) || 0, lateMinutes: Number(entry.lateMinutes) || 0, lateExcused: !!entry.lateExcused } });
    });
  });
  currentRecords.forEach((r) => {
    const id = `${r.date}_${r.employeeId}`;
    if (!nextIds.has(id)) ops.push({ type: "delete", ref: doc(db, "attendanceRecords", id) });
  });
  await commitOpsChunked(ops);
}

// Writes ONLY the specific (date, employeeId) records in `patch` - never re-syncs the full
// known attendance history the way syncAttendanceRecords above does. This matters because
// day-to-day attendance edits (one status click, one overtime-hours edit) happen constantly,
// while syncAttendanceRecords' full-object diff re-"set"s every record currently held in the
// admin's local `attendance` snapshot on every single edit. If that local snapshot is even one
// render cycle stale - e.g. the browser tab was backgrounded (browsers throttle timers on
// inactive tabs) right when a department head approved an employee's "late" request from the
// portal (which merges { status: "late" } straight into this same attendanceRecords doc) - the
// admin's very next click anywhere in the Attendance tab would blindly re-"set" that employee's
// record back to its stale (pre-approval) status, silently clobbering the portal's write. That
// exact symptom - an approved "late" request whose attendance record still reads "present" - is
// what this patch-based path exists to make impossible: a record nobody touched this call is
// never sent to Firestore at all, so it can never be overwritten with stale data. A falsy
// `status` deletes the record (matches the toggle-off behavior below).
async function syncAttendancePatch(patch) {
  // lateExcused برضو "set" كامل (مش merge) هنا زي syncAttendanceRecords بالظبط - أي مُنادي
  // (setStatus/setOvertime/setLateMinutes/importBulk في AttendanceTab) لازم يبعت القيمة الصح
  // له صراحة عشان ميتمسحش بالغلط لو عدّل حقل تاني (زي ساعات الإضافي) في نفس اليوم المُعفى.
  const ops = patch.map(({ date, employeeId, status, overtimeHours, lateMinutes, lateExcused }) => {
    const ref = doc(db, "attendanceRecords", `${date}_${employeeId}`);
    return status
      ? { type: "set", ref, data: { date, employeeId, status, overtimeHours: Number(overtimeHours) || 0, lateMinutes: Number(lateMinutes) || 0, lateExcused: !!lateExcused } }
      : { type: "delete", ref };
  });
  await commitOpsChunked(ops);
}

// payrollMeta used to be one blob shaped { [yearMonth]: { [employeeId]: meta } }; each
// year-month is now its own doc (id = "YYYY-MM") so it stays a manageable document size.
async function syncPayrollMeta(nextObj, currentDocs) {
  const nextYms = new Set(Object.keys(nextObj));
  const ops = [];
  nextYms.forEach((ym) => ops.push({ type: "set", ref: doc(db, "payrollMeta", ym), data: nextObj[ym] }));
  currentDocs.forEach((d) => { if (!nextYms.has(d.id)) ops.push({ type: "delete", ref: doc(db, "payrollMeta", d.id) }); });
  await commitOpsChunked(ops);
}

// Turns one computed payroll row (from PayrollTab's computeRow) into the flat, already-final
// doc the employee portal reads directly - no salary-calculation logic (tax brackets,
// insurance rate, overtime multiplier...) is duplicated there, only these final numbers.
function payslipRowToDoc(ym, r) {
  return {
    id: `${ym}_${r.emp.id}`,
    employeeId: r.emp.id,
    employeeName: r.emp.name,
    ym,
    base: Number(r.emp.salary) || 0,
    absentDays: r.absentDays,
    overtimeHours: r.overtimeHours,
    lateMinutes: r.lateMinutes,
    absenceDeduction: r.absenceDeduction,
    penaltyDeduction: r.penaltyDeduction,
    advanceDeduction: r.advanceDeduction,
    lateDeduction: r.lateDeduction,
    insuranceDeduction: r.insuranceDeduction,
    taxDeduction: r.taxDeduction,
    overtimePay: r.overtimePay,
    bonus: r.bonus,
    net: r.net,
    paid: r.paid,
  };
}

// Publishes one month's computed payroll rows to the `payslips` collection so employees can
// see (and print) their own payslip from the portal. Deliberately NOT automatic - the admin
// clicks "sync" explicitly in the Payroll tab, so nothing reaches the employee portal before
// the admin has reviewed the numbers for that month. Only touches docs for THIS month
// (currentMonthDocs must already be filtered to `${ym}_*`) so other months are untouched.
async function syncPayslipsForMonth(ym, rows, currentMonthDocs) {
  const nextDocs = rows.map((r) => payslipRowToDoc(ym, r));
  await syncCollection("payslips", currentMonthDocs, nextDocs);
}

// A deleted employee may still be referenced by `requests` docs (leave/late/advance) as
// either the requester or the current approver - that collection is only ever read/written
// by the employee portal, never subscribed to here, so deleting an employee elsewhere in
// this file wouldn't otherwise touch it. This sweeps up every request that mentions any of
// the given ids, in Firestore directly. Firestore's `in` filter caps at 10 values, so this
// chunks the id list defensively; a Map (keyed by doc id) dedupes a request that would
// otherwise be matched by both the employeeId and approverId query.
async function deleteOrphanedRequests(employeeIds) {
  if (employeeIds.length === 0) return;
  const refsToDelete = new Map();
  for (let i = 0; i < employeeIds.length; i += 10) {
    const chunk = employeeIds.slice(i, i + 10);
    const [byRequester, byApprover] = await Promise.all([
      getDocs(query(collection(db, "requests"), where("employeeId", "in", chunk))),
      getDocs(query(collection(db, "requests"), where("approverId", "in", chunk))),
    ]);
    [...byRequester.docs, ...byApprover.docs].forEach((d) => refsToDelete.set(d.id, d.ref));
  }
  await commitOpsChunked([...refsToDelete.values()].map((ref) => ({ type: "delete", ref })));
}

// Creates the employee's portal login (Firebase Auth email/password account, using their
// employeeCode + a fake domain as the "email"). Runs on a throwaway secondary Firebase App
// instance — calling createUserWithEmailAndPassword on the PRIMARY app would sign the admin
// out of their own session and into the new employee account, which is exactly what must
// not happen here.
async function createEmployeeAuthAccount(employeeCode, pin) {
  const secondaryApp = initializeApp(firebaseConfig, `secondary-${Date.now()}`);
  try {
    const secondaryAuth = getAuth(secondaryApp);
    const cred = await createUserWithEmailAndPassword(secondaryAuth, employeeAuthEmail(employeeCode), pin);
    await signOut(secondaryAuth);
    return cred.user.uid;
  } finally {
    await deleteApp(secondaryApp);
  }
}

// Live-subscribes to a whole collection. `loaded` flips true after the first snapshot
// (including an empty one) so the app's loading screen doesn't hang forever on a fresh,
// empty database.
function useFirestoreCollection(colName) {
  const [data, setData] = useState([]);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    const unsub = onSnapshot(
      collection(db, colName),
      (snap) => { setData(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoaded(true); },
      (err) => { console.error(`[${colName}]`, err); setLoaded(true); }
    );
    return unsub;
  }, [colName]);
  return [data, loaded];
}

// Live-subscribes to a single doc (settings/main, orgChart/main), falling back to the
// given default when the doc doesn't exist yet (brand-new database) or a field is missing.
function useFirestoreDoc(colName, docId, defaultValue) {
  const [data, setData] = useState(defaultValue);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    const unsub = onSnapshot(
      doc(db, colName, docId),
      (snap) => { setData(snap.exists() ? { ...defaultValue, ...snap.data() } : defaultValue); setLoaded(true); },
      (err) => { console.error(`[${colName}/${docId}]`, err); setLoaded(true); }
    );
    return unsub;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [colName, docId]);
  return [data, loaded];
}

// دالة صافية (pure) بتقرر لو استيراد/مزامنة (يدوي أو تلقائي) مسموحله يكتب فوق يوم متسجل

// نفس الدالة بالظبط (بنفس الاسم) موجودة في auto_sync/sync_attendance.mjs و

// لازم يتظبط في التلاتة.
function shouldSkipAttendanceOverwrite(existing, incoming) {

  if (PROTECTED_ATTENDANCE_STATUSES.has(existing.status) && !PROTECTED_ATTENDANCE_STATUSES.has(incoming.status)) {

const COMPETENCY_ITEMS = [

const REVIEW_RATING_BANDS = [

function reviewRatingForPercentage(pct) {

}
// حساب التقدير العام النهائي (Final Score) لتقييم نصف سنوي/سنوي - نفس معادلات قالب الشركة
// بالظبط (Performance Appraisal Form.xlsx)، بفرقين اتفقنا عليهم مع المستخدم:
// 1) معادلة الـ Competencies الأصلية في الإكسل كانت (D7/4)*0.4 (تقسيم على 4 مش على عدد البنود
//    الفعلي 5) - وده كان ممكن يطلّع نتيجة نهائية فوق الـ 100% لو الموظف أخد 5/5 في كل البنود.
//    صلّحناها هنا لتقسيم على عدد البنود الفعلي (competencies.length) عشان أقصى نتيجة ممكنة
//    تفضل 100% بالظبط دايمًا.
// 2) وزن الـ KPI (k.weight) بيتكتب في الفورم كنسبة مئوية كاملة (مثلًا 20 يعني 20%، مش 0.2) -
//    عشان ده اللي المستخدم بيتوقعه طبيعي لما بيشوف "مجموع الأوزان لازم يبقى 60%" (باگ حقيقي
//    حصل: المستخدم كتب 20+20+20 متوقع إنها تبقى 60%، والفورم عرض 6000% لأنه كان بيضرب فرق
//    (0-1) في 100 فوق نسبة مئوية أصلًا مكتوبة). فبنقسم weight/100 هنا وقت الحساب عشان نرجع
//    لنفس معادلة الإكسل الأصلية (fraction × managerScore).
// مهم: الدرجة الموزونة لكل KPI بتتحسب من تقييم المدير (managerScore) مش تقييم الموظف نفسه
// (selfScore) - بالظبط زي معادلة G2='=C2*F2' في الإكسل (F = عمود المدير). تقييم الموظف الذاتي
// بيتسجّل للمقارنة/المرجعية بس، ومالوش تأثير على الرقم النهائي - قرار متعمّد من قالب الشركة.
function computeReviewScore(kpis, competencies) {
  const kpiList = kpis || [];
  const compList = competencies || [];
  const kpiWeightTotal = kpiList.reduce((s, k) => s + (Number(k.weight) || 0), 0);
  const kpiContribution = kpiList.reduce((s, k) => s + ((Number(k.weight) || 0) / 100) * (Number(k.managerScore) || 0), 0);
  const competencyCount = compList.length || 1;
  const competencySum = compList.reduce((s, c) => s + (Number(c.managerScore) || 0), 0);
  const competencyContribution = (competencySum / competencyCount) * 0.4;
  const finalScoreOutOf5 = kpiContribution + competencyContribution;
  const finalPercentage = (finalScoreOutOf5 / 5) * 100;
  const finalRating = reviewRatingForPercentage(finalPercentage);
  return { kpiWeightTotal, kpiContribution, competencySum, competencyContribution, finalScoreOutOf5, finalPercentage, finalRating };
}

/* ================= زيادات الرواتب السنوية (Salary Increase Matrix) =================
   منسوخة بالظبط من ملف "Salary Increase Matrix.xlsx" اللي المستخدم رفعه: تاب "Matrix" فيه
   جدولين - (1) نسبة الزيادة المقترحة حسب تقييم الأداء (من 1 لـ 5)، (2) شرائح الدرجات
   الوظيفية (Grade) بحدها الأدنى/منتصفها/حدها الأقصى. تاب "Salary Increase calculation" بيوضح
   طريقة الحساب: الراتب الجديد = MAX(الراتب الحالي × (1 + النسبة المقترحة)، الحد الأدنى لشريحة
   الموظف). القيم دي افتراضية بس - قابلة للتعديل بالكامل من تاب الإعدادات. */
const SALARY_GRADE_BANDS_DEFAULT = [
  { grade: "G1", level: "مبتدئ (Junior - L1)", min: 8000, mid: 10000, max: 12000 },
  { grade: "G2", level: "أخصائي (Specialist - L2)", min: 11000, mid: 14000, max: 17000 },

];
// rating: نفس نطاق finalScoreOutOf5 (من 0 لـ 5) في التقييم الدوري السنوي، مقرّب لأقرب رقم صحيح
// (ratingScoreFromFinalScore تحت) - عشان نربط تقييم الموظف مباشرة بجدول الماتريكس من غير ما
// نحتاج مقياس تاني منفصل.
const SALARY_RATING_MATRIX_DEFAULT = [
  { rating: 5, label: "استثنائي (Exceptional)", minPct: 12, maxPct: 15 },
  { rating: 4, label: "يفوق التوقعات (Exceeds Expectations)", minPct: 8, maxPct: 11 },
  { rating: 3, label: "يلبي التوقعات (Meets Expectations)", minPct: 5, maxPct: 7 },
  { rating: 2, label: "يحتاج تحسين (Needs Improvement)", minPct: 0, maxPct: 0 },
  { rating: 1, label: "غير مقبول (Unsatisfactory)", minPct: 0, maxPct: 0 },
];

// تقييم الموظف السنوي (finalScoreOutOf5، من 0 لـ 5 كسري) بيتقرّب لأقرب رقم صحيح (1-5) عشان
// يتربط بصف واحد في جدول الماتريكس (اللي مكتوب فيه "5/5"، "4/5"...). محصور بين 1 و5 دايمًا
// حتى لو الدرجة الفعلية طلعت صفر أو أقل (أسوأ تقدير ممكن لسه بياخد صف "1/5" مش يتكسر).
function ratingScoreFromFinalScore(finalScoreOutOf5) {
  const n = Math.round(Number(finalScoreOutOf5) || 0);
  return Math.min(5, Math.max(1, n));
}
function findGradeBand(gradeBands, grade) {
  return (gradeBands || []).find((b) => b.grade === grade) || null;
}
function findRatingTier(ratingMatrix, ratingScore) {
  return (ratingMatrix || []).find((r) => r.rating === ratingScore) || null;
}
// الحساب الأساسي: من راتب الموظف الحالي + درجته + تقييمه السنوي، بيرجّع نسبة الزيادة المقترحة
// (منتصف نطاق الماتريكس للتقدير ده) والراتب الجديد المقترح - بنفس معادلة الإكسل بالظبط
// (K = الراتب الحالي × (1+النسبة)، L = MAX(K, الحد الأدنى لشريحة الموظف) عشان الراتب الجديد
// مايقعش تحت أدنى حد لدرجته الحالية حتى لو النسبة المقترحة صغيرة). النتيجة دي بداية مقترحة
// بس - شؤون الأفراد تقدر تعدّل أي رقم فيها يدويًا قبل الموافقة.
function computeSuggestedIncrease(currentSalary, grade, ratingScore, gradeBands, ratingMatrix) {
  const tier = findRatingTier(ratingMatrix, ratingScore);
  const band = findGradeBand(gradeBands, grade);
  const minPct = tier ? Number(tier.minPct) || 0 : 0;
  const maxPct = tier ? Number(tier.maxPct) || 0 : 0;
  const suggestedPercent = Math.round(((minPct + maxPct) / 2) * 100) / 100;
  const salary = Number(currentSalary) || 0;
  const computedSalary = salary * (1 + suggestedPercent / 100);
  const floor = band ? Number(band.min) || 0 : 0;
  const proposedSalary = Math.round(Math.max(computedSalary, floor));
  return { suggestedPercent, proposedSalary, ratingLabel: tier?.label || "", gradeLevel: band?.level || "" };
}
// آخر تقييم سنوي "مكتمل" (completed) للموظف - ده اللي زيادة المرتب بتتحسب عليه، مش نصف
// السنوي (المستخدم قال صراحة "زياده المرتبات بناءً على نتيجة التقييم السنوي"). بيرتّب بالسنة
// الأحدث الأول، وبعدين بتاريخ الاكتمال لو فيه أكتر من تقييم سنوي في نفس السنة (نادر).
function latestCompletedAnnualReview(reviews, employeeId) {
  return (reviews || [])
    .filter((r) => r.employeeId === employeeId && r.reviewType === "سنوي" && r.status === "completed")
    .sort((a, b) => {
      if (a.year !== b.year) return a.year < b.year ? 1 : -1;
      return (a.completedAt || a.date || "") < (b.completedAt || b.date || "") ? 1 : -1;
    })[0] || null;
}
// زي latestCompletedAnnualReview بالظبط، بس بتشمل الاتنين (نصف سنوي وسنوي) مش السنوي بس - عشان
// "أحدث تقييم دوري مكتمل للموظف" اللي رسم Bell Curve محتاج يعرضه (لقطة حالية عن مستوى أدائه)،
// مش مقصورة على قرار زيادة المرتب اللي عمدًا بيتحسب من السنوي بس (latestCompletedAnnualReview
// فوق فاضلة زي ما هي لنفس السبب، ملهاش علاقة بالتوزيع هنا).
function latestCompletedPeriodicReview(reviews, employeeId) {
  return (reviews || [])
    .filter((r) => r.employeeId === employeeId && PERIODIC_REVIEW_TYPES.includes(r.reviewType) && r.status === "completed")
    .sort((a, b) => {
      if (a.year !== b.year) return a.year < b.year ? 1 : -1;
      return (a.completedAt || a.date || "") < (b.completedAt || b.date || "") ? 1 : -1;
    })[0] || null;
}
// توزيع "التقدير النهائي" (finalRating - نفس REVIEW_RATING_BANDS) لكل قسم، بناءً على أحدث
// تقييم دوري مكتمل لكل موظف (latestCompletedPeriodicReview) - ده اللي بيغذي رسم الـ "Bell
// Curve" في تاب التقارير. موظف من غير أي تقييم دوري مكتمل بيتستبعد بالكامل من القسم بتاعه هنا
// (مش هناك "تقدير" نحسب نسبته منه أصلًا)، فـ totalRated ممكن يبقى أقل من إجمالي عدد موظفي
// القسم - ده متعمّد ومختلف عن headcount العادي.
function computeDepartmentRatingDistribution(employees, reviews) {
  const byDept = {};
  employees.forEach((e) => {
    const review = latestCompletedPeriodicReview(reviews, e.id);
    if (!review || !review.finalRating) return;
    const dept = (e.department || "").trim() || "بدون قسم";
    if (!byDept[dept]) byDept[dept] = {};
    if (!byDept[dept][review.finalRating]) byDept[dept][review.finalRating] = [];
    byDept[dept][review.finalRating].push(e.name);
  });
  return Object.keys(byDept)
    .sort((a, b) => a.localeCompare(b, "ar"))
    .map((dept) => {
      const tiersMap = byDept[dept];
      const totalRated = Object.values(tiersMap).reduce((s, names) => s + names.length, 0);
      const tiers = REVIEW_RATING_BANDS.map((b) => {
        const employeeNames = tiersMap[b.label] || [];
        return {
          label: b.label,
          count: employeeNames.length,
          pct: totalRated ? Math.round((employeeNames.length / totalRated) * 1000) / 10 : 0,
          employeeNames,
        };
      });
      return { department: dept, totalRated, tiers };
    });
}

// مساعد عام لتصدير Excel - نفس بالظبط منطق exportExcel الموجود جوه ReportsTab (XLSX.utils.book_new
// -> json_to_sheet -> write -> Blob -> رابط تنزيل مؤقت)، اتنقل هنا كدالة واحدة مشتركة عشان كل
// تاب فيه فلتر (الحضور والانصراف/المرتبات/زيادات الرواتب/السلف/موظفون سابقون) يقدر يصدّر
// نتيجة الفلتر الحالية بنفس الطريقة من غير ما يكرر نفس الكود المتكرر (book/blob/link) في كل تاب
// لوحده. `rows` مصفوفة كائنات عادية (المفاتيح هي عناوين الأعمدة زي ما هيظهروا في الملف).
function exportRowsToExcel(rows, sheetName, filenamePrefix) {
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheetName.slice(0, 31)); // اسم التاب في Excel محدود بـ31 حرف
  const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const blob = new Blob([out], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${filenamePrefix}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function weekdayIndex(name) { return WEEKDAYS.indexOf(name); }
// بيضيف شهور لتاريخ ISO ("2026-01-15") من غير ما يستخدم Date.now()/new Date() الفارغة (ممنوعين
// جوه سكريبتات الـ workflow، وأي منطق تجاري هنا لازم يفضل قابل للاختبار بنفس الطريقة). بيرجّع
// تاريخ ISO تاني.
function addMonthsISO(dateISO, months) {
  const d = new Date(dateISO);
  d.setMonth(d.getMonth() + months);
  return d.toISOString().slice(0, 10);
}
function daysBetween(fromISO, toISO) {
  return Math.round((new Date(toISO) - new Date(fromISO)) / 86400000);
}
// استطلاع "مفتوح للرد" لازم يكون: (أ) الأدمن نشره فعلاً (published) - لسه ما نشرهوش يبقى مسودة
// ومحدش من الموظفين شايفه أصلاً، (ب) محدش قفله بدري (closedEarly) - زرار يدوي للأدمن يقفل بيه
// الاستطلاع قبل ميعاده لو حاب، و(ج) آخر ميعاد الرد لسه ما فاتش (أو مفيش ميعاد أصلاً محدد).
// الدالة دي متكررة بالظبط في بوابة الموظف (employee-portal.jsx) - الملفين مالهمش أي imports
// مشتركة، فأي تعديل هنا لازم يتظبط هناك كمان.
function isSurveyOpen(survey, todayISOStr) {
  return !!survey.published && !survey.closedEarly && (!survey.deadline || todayISOStr <= survey.deadline);
}
// بيضيف أيام لتاريخ ISO، نفس منطق addMonthsISO بالظبط بس بالأيام - مستخدمة لحساب المواعيد
// القانونية للتحقيقات (7 أيام لبدء التحقيق، 30 يوم لإصدار القرار، 3 أيام للتظلم...).
function addDaysISO(dateISO, days) {
  const d = new Date(dateISO);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

// بيحسب "حالة الموعد القانوني" لقضية تأديبية واحدة (مادة 138 من قانون العمل رقم 14 لسنة 2025):
// - لسه ماتفتحش رسميًا (مفيش investigationOpenedDate): عداد بدء التحقيق (7 أيام من تاريخ العلم
//   بالمخالفة).
// - اتفتحت ولسه شغالة (مفيش investigationClosedDate): عداد قفل التحقيق (3 شهور من فتحها، أو 6
//   شهور لو اتمدّدت مرة واحدة - investigationExtended).
// - اتقفلت ولسه القرار ما صدرش (status === "pending_decision"): عداد إصدار القرار (30 يوم من
//   تاريخ قفل التحقيق).
// بيرجّع null لو القضية "decided"/"appealed"/"closed" (مفيش موعد قانوني لسه معلّق)، أو لو مفيش
// violationDate خالص (سجلات الجزاء المباشر القديمة اللي من غير مسار تحقيق رسمي).
function computePenaltyCaseDeadline(p, todayISOStr) {
  const status = p.status || "decided";
  if (status !== "investigating" && status !== "pending_decision") return null;
  if (!p.violationDate) return null;
  if (status === "pending_decision") {
    if (!p.investigationClosedDate) return null;
    const deadline = addDaysISO(p.investigationClosedDate, DECISION_DEADLINE_DAYS);
    return { stage: "issueDecision", deadline, overdue: todayISOStr > deadline };
  }
  if (!p.investigationOpenedDate) {
    const deadline = addDaysISO(p.violationDate, INVESTIGATION_START_DEADLINE_DAYS);
    return { stage: "startInvestigation", deadline, overdue: todayISOStr > deadline };
  }
  const months = INVESTIGATION_MAX_MONTHS * (p.investigationExtended ? 2 : 1);
  const deadline = addMonthsISO(p.investigationOpenedDate, months);
  return { stage: "closeInvestigation", deadline, overdue: todayISOStr > deadline };
}

// حالة فترة الاختبار (3 شهور افتراضيًا، من settings.probationMonths): "لا ينطبق" لو مفيش
// hireDate، "مثبّت" لو اتثبّت صراحة (probationConfirmedAt)، "تحت التجربة" لو لسه جوه المدة،
// "محتاجة قرار" لو المدة خلصت من غير تثبيت صريح - ده عمدًا مش بيتحول لـ"مثبّت" تلقائي، القرار
// ده قرار بشري لازم الأدمن ياخده بنفسه.
function computeProbationStatus(employee, settings, todayISOStr) {
  if (!employee.hireDate) return { status: "n/a", endDate: null };
  if (employee.probationConfirmedAt) return { status: "confirmed", endDate: null, confirmedAt: employee.probationConfirmedAt };
  const endDate = addMonthsISO(employee.hireDate, settings.probationMonths ?? 3);
  const status = todayISOStr >= endDate ? "awaiting_decision" : "probation";
  return { status, endDate };
}

// آخر تاريخ تقييم دوري (نصف سنوي/سنوي) مكتمل للموظف ده - null لو مفيش. مهم: بنستبعد (أ) تقييمات
// فترة الاختبار (PROBATION_REVIEW_TYPES) عشان ماتأثّرش على دورة استحقاق التقييم الدوري، و(ب) أي
// تقييم دوري لسه "awaiting_manager" (بدأه الموظف من البوابة ولسه المدير ماكملوش) - ده عشان تقييم
// نص مكتمل مايمنعش تنبيه "تقييم دوري مستحق" من الظهور غلط؛ الفورم بيسجّل date بس وقت الاكتمال
// (status: "completed")، فأي تقييم awaiting_manager أصلاً معندوش date لسه، لكن الفلتر هنا حماية
// إضافية صريحة لو حصل تغيير مستقبلي.
function lastReviewDate(employeeId, reviews) {
  const dates = reviews
    .filter((r) => r.employeeId === employeeId && PERIODIC_REVIEW_TYPES.includes(r.reviewType) && r.status !== "awaiting_manager")
    .map((r) => r.date)
    .filter(Boolean)
    .sort();
  return dates.length ? dates[dates.length - 1] : null;
}
// موعد الاستحقاق القادم لتقييم دوري - من آخر تقييم لو موجود، وإلا من تاريخ التعيين (عشان
// موظف اتعين ولسه ماتقيّمش يفضل بياخد تنبيه بدل ما ينسى للأبد لمجرد مفيش baseline).
function nextReviewDueDate(employee, reviews, settings) {
  const base = lastReviewDate(employee.id, reviews) || employee.hireDate;
  if (!base) return null;
  return addMonthsISO(base, settings.reviewCycleMonths ?? 6);
}

function computeTax(annualTaxable, brackets) {
  if (annualTaxable <= 0) return 0;
  let tax = 0, lower = 0;
  for (const b of brackets) {
    const upper = b.upTo === null ? Infinity : b.upTo;
    if (annualTaxable > lower) {
      const slice = Math.min(annualTaxable, upper) - lower;
      tax += slice * (b.rate / 100);
      lower = upper;
    }
    if (annualTaxable <= upper) break;
  }
  return Math.round(tax);
}

function getWeeklyOffDays(emp) {
  if (Array.isArray(emp.weeklyOffDays) && emp.weeklyOffDays.length) return emp.weeklyOffDays;
  if (emp.weeklyOffDay) return [emp.weeklyOffDay]; // backward compatibility with older single-day records
  return ["الجمعة"];
}

function isNonWorkday(emp, dateStr, holidays) {
  const dow = new Date(dateStr + "T00:00:00").getDay();
  const offDays = getWeeklyOffDays(emp);
  if (offDays.some((d) => weekdayIndex(d) === dow)) return "إجازة أسبوعية";
  const h = (holidays || []).find((x) => x.date === dateStr);
  if (h) return h.name || "عطلة رسمية";
  return null;
}

function parseTimeToMinutes(val) {
  if (val === null || val === undefined || val === "") return null;
  if (typeof val === "number") {
    // Excel time serial (fraction of a day) or already-minutes guard
    if (val > 0 && val < 1) return Math.round(val * 24 * 60);
    return null;
  }
  const s = String(val).trim();
  const m = s.match(/(\d{1,2}):(\d{2})/);
  if (!m) return null;
  let h = parseInt(m[1], 10);
  const min = parseInt(m[2], 10);
  if (/pm/i.test(s) && h < 12) h += 12;
  if (/am/i.test(s) && h === 12) h = 0;
  return h * 60 + min;
}

function excelSerialToISODate(val) {
  if (val === null || val === undefined || val === "") return null;
  if (typeof val === "number") {
    const utcDays = val - 25569;
    const d = new Date(utcDays * 86400 * 1000);
    return d.toISOString().slice(0, 10);
  }
  const s = String(val).trim();
  // try common formats: YYYY-MM-DD, DD/MM/YYYY, DD-MM-YYYY
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  const d = new Date(s);
  if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
  return null;
}

// الترتيب هنا مهم: "sick" و"mission" لازم يتفحصوا قبل "leave" - نص زي "إجازة مرضية" فيه كلمة
// "إجازة" برضه، فلو "leave" اتفحص الأول هيلقطها غلط كإجازة عادية بدل مرضي. نفس الشيء لأي نص
// فيه "مأمورية" - المفروض يتصنف "mission" مستقل مش "present" (كان قبل كده بيتحط تحت "present"
// في سكريبتات المزامنة بس، ودلوقتي بقى نفس المنطق موحّد في كل مكان).
const STATUS_KEYWORDS = {
  sick: ["sick", "مرضي", "مريض", "مرضية"],
  mission: ["mission", "مأمورية", "ماموري"],
  present: ["present", "حاضر", "حضور", "in"],
  absent: ["absent", "غائب", "غياب"],
  late: ["late", "متأخر", "تأخير"],
  leave: ["leave", "إجازة", "اجازة", "vacation", "عطلة"],
};
function normalizeStatusText(val) {
  if (!val) return null;
  const s = String(val).trim().toLowerCase();
  for (const [key, words] of Object.entries(STATUS_KEYWORDS)) {
    if (words.some((w) => s.includes(w))) return key;
  }
  return null;
}

function getAttEntry(attendance, date, empId) {
  const raw = (attendance[date] || {})[empId];
  if (!raw) return null;
  if (typeof raw === "string") return { status: raw, overtimeHours: 0, lateMinutes: 0 };
  return { lateMinutes: 0, ...raw };
}

function advanceDeductionForMonth(adv, ym) {
  const start = adv.date.slice(0, 7);
  const [sy, sm] = start.split("-").map(Number);
  const [cy, cm] = ym.split("-").map(Number);
  const passed = (cy - sy) * 12 + (cm - sm);
  if (passed < 0 || passed >= adv.installments) return 0;
  return Math.round(adv.totalAmount / adv.installments);
}

function advanceRemaining(adv) {
  const nowYm = todayISO().slice(0, 7);
  let paidMonths = 0;
  const start = adv.date.slice(0, 7);
  const [sy, sm] = start.split("-").map(Number);
  const [cy, cm] = nowYm.split("-").map(Number);
  const passed = (cy - sy) * 12 + (cm - sm) + 1;
  paidMonths = Math.max(0, Math.min(passed, adv.installments));
  const paid = Math.round((adv.totalAmount / adv.installments) * paidMonths);
  return Math.max(0, adv.totalAmount - paid);
}

// One employee's full payroll breakdown for one month - the single source of truth used by
// both PayrollTab (live, editable view of the CURRENT month) and ReportsTab (read-only trend
// across past months). Pulled out as a standalone function (rather than staying a closure
// inside PayrollTab) specifically so ReportsTab can reuse the exact same math instead of
// drifting out of sync with a second copy of it.
// كل بند محسوب في المرتب (غير الأساسي، اللي بقى إجازة PayrollTab يعدّله مباشرة في سجل الموظف
// نفسه) بقى ممكن الأدمن "يعدّله" شهريًا من تاب المرتبات - override بيتخزّن في payrollMeta[empId]
// (نفس مكان "مكافأة" بالظبط)، ومعاه سبب إجباري (Reason) في نفس الـ payrollMeta - فبيتسجّل
// تلقائيًا في سجل النشاط زي أي تعديل تاني في payrollMeta (upd.payrollMeta بيعمل diffSummary
// عام أصلًا، مش محتاج أي كود إضافي زي ما عملنا مع الراتب الأساسي). لو مفيش override محفوظ
// (null/undefined) بيرجع يستخدم القيمة المحسوبة تلقائيًا زي ما هي - مفيش أي تغيير في السلوك
// الافتراضي، فمفيش خطر على أي مرتب متسجل بالفعل من غير أي override.
function applyPayrollOverride(computed, empMeta, overrideKey) {
  const raw = empMeta ? empMeta[overrideKey] : undefined;
  return raw !== undefined && raw !== null && raw !== "" ? Number(raw) || 0 : computed;
}
function computePayrollRow(e, ym, attendance, penalties, advances, settings, meta) {
  let absentDays = 0, overtimeHours = 0, lateMinutes = 0;
  Object.keys(attendance).forEach((date) => {
    if (monthKey(date) !== ym) return;
    const entry = getAttEntry(attendance, date, e.id);
    if (!entry) return;
    // يوم عطلة رسمية/أسبوعية (isNonWorkday) مايتحسبش غياب ولا تأخير حتى لو فيه سجل حضور قديم
    // متبقي عليه حالة "غايب"/"متأخر" من قبل ما العطلة تتسجل في الإعدادات - ده بالظبط الباگ اللي
    // اتبلّغ عنه (هاني زكزوك أيام 27-28-29 محسوبة تأخير مع إنها أيام عطلة). ساعات الإضافي لسه
    // بتتحسب عادي - شغل فعلي في يوم عطلة لازم يتحسب.
    const nonWork = isNonWorkday(e, date, settings.publicHolidays);
    if (!nonWork) {
      if (entry.status === "absent") absentDays++;
      // Late-minute deductions only ever come from a day actually marked "late" - AttendanceTab
      // and the file importer both clear lateMinutes back to 0 whenever a record's status moves
      // away from "late" (see AttendanceTab.setStatus / AttendanceImportWizard.buildResult), but
      // this guard is the belt-and-suspenders backstop against any older/imported record that
      // happens to carry a stray lateMinutes value under a different status.
      if (entry.status === "late") lateMinutes += Number(entry.lateMinutes) || 0;
    }
    overtimeHours += Number(entry.overtimeHours) || 0;
  });
  const base = Number(e.salary) || 0;
  const perDay = base / 30;
  const empMeta = (meta || {})[e.id] || {};
  const computedAbsenceDeduction = Math.round(perDay * absentDays);
  const absenceDeduction = applyPayrollOverride(computedAbsenceDeduction, empMeta, "absenceDeductionOverride");
  const monthPenalties = penalties.filter((p) => p.employeeId === e.id && monthKey(p.date) === ym && p.actionType === "خصم مالي");
  const computedPenaltyDeduction = monthPenalties.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const penaltyDeduction = applyPayrollOverride(computedPenaltyDeduction, empMeta, "penaltyDeductionOverride");
  const empAdvances = advances.filter((a) => a.employeeId === e.id);
  const computedAdvanceDeduction = empAdvances.reduce((s, a) => s + advanceDeductionForMonth(a, ym), 0);
  const advanceDeduction = applyPayrollOverride(computedAdvanceDeduction, empMeta, "advanceDeductionOverride");
  const hourlyRate = base / (30 * 8);
  const computedOvertimePay = Math.round(hourlyRate * settings.overtimeMultiplier * overtimeHours);
  const overtimePay = applyPayrollOverride(computedOvertimePay, empMeta, "overtimePayOverride");
  // Same per-hour basis as overtimePay above (base / (30 days * 8 hours)), just further divided
  // into a per-minute rate - so an hour of lateness costs exactly as much as an hour of
  // overtime pays, before the overtime multiplier.
  const computedLateDeduction = Math.round((hourlyRate / 60) * lateMinutes);
  const lateDeduction = applyPayrollOverride(computedLateDeduction, empMeta, "lateDeductionOverride");
  const bonus = Number(empMeta.bonus) || 0;

  const computedInsuranceDeduction = Math.round((base * settings.insuranceRate) / 100);
  const insuranceDeduction = applyPayrollOverride(computedInsuranceDeduction, empMeta, "insuranceDeductionOverride");
  const annualTaxable = Math.max(0, base * 12 - computedInsuranceDeduction * 12 - settings.personalExemptionAnnual);
  const computedTaxDeduction = Math.round(computeTax(annualTaxable, settings.taxBrackets) / 12);
  const taxDeduction = applyPayrollOverride(computedTaxDeduction, empMeta, "taxDeductionOverride");

  const net = base - absenceDeduction - penaltyDeduction - advanceDeduction - insuranceDeduction - taxDeduction - lateDeduction + overtimePay + bonus;
  return {
    emp: e, absentDays, overtimeHours, lateMinutes,
    absenceDeduction, penaltyDeduction, advanceDeduction, lateDeduction, insuranceDeduction, taxDeduction, overtimePay, bonus, net, paid: !!empMeta.paid,
    // القيم المحسوبة تلقائيًا (قبل أي override) - عشان شاشة التعديل تقدر تعرضها كمرجع، ومقارنة
    // overridden تحدد لو الأدمن كان عدّل البند ده يدويًا (يعني القيمتين مختلفتين).
    computed: {
      absenceDeduction: computedAbsenceDeduction, penaltyDeduction: computedPenaltyDeduction, advanceDeduction: computedAdvanceDeduction,
      lateDeduction: computedLateDeduction, insuranceDeduction: computedInsuranceDeduction, taxDeduction: computedTaxDeduction, overtimePay: computedOvertimePay,
    },
  };
}

// نسخة تفصيلية من computePayrollRow فوق - نفس بالظبط المعادلات (perDay/hourlyRate/التأمينات/
// الضريبة...) بس بترجّع تفاصيل كل بند (المعدل، عدد الوحدات، وقايمة الجزاءات/الأقساط الفردية)
// مش بس الرقم النهائي - عشان تتعرض في شاشة "تفاصيل الخصم" (بالضغط على اسم الموظف في تاب
// المرتبات). اتعملت كدالة منفصلة قصدًا (مش بتنادي ولا بتتنادى من computePayrollRow) عشان صفر
// مخاطرة على computePayrollRow الأصلية ومصفوفة الاختبارات الموجودة ليها بالفعل في
// test_reports.mjs - اختبارات test_payroll_breakdown.mjs الجديدة بتتأكد إن أرقامها النهائية
// مطابقة بالظبط لأرقام computePayrollRow لنفس المدخلات، فمفيش احتمال يحصل اختلاف بين الاتنين
// بمرور الوقت من غير ما اختبار يمسكه فورًا.
function computePayrollBreakdown(e, ym, attendance, penalties, advances, settings, meta) {
  let absentDays = 0, overtimeHours = 0, lateMinutes = 0;
  Object.keys(attendance).forEach((date) => {
    if (monthKey(date) !== ym) return;
    const entry = getAttEntry(attendance, date, e.id);
    if (!entry) return;
    // نفس منطق computePayrollRow بالظبط: يوم عطلة رسمية/أسبوعية مايتحسبش غياب ولا تأخير.
    const nonWork = isNonWorkday(e, date, settings.publicHolidays);
    if (!nonWork) {
      if (entry.status === "absent") absentDays++;
      if (entry.status === "late") lateMinutes += Number(entry.lateMinutes) || 0;
    }
    overtimeHours += Number(entry.overtimeHours) || 0;
  });
  const base = Number(e.salary) || 0;
  const empMeta = (meta || {})[e.id] || {};
  const perDayRate = base / 30;
  const computedAbsenceDeduction = Math.round(perDayRate * absentDays);
  const absenceDeduction = applyPayrollOverride(computedAbsenceDeduction, empMeta, "absenceDeductionOverride");
  const hourlyRate = base / (30 * 8);
  const perMinuteRate = hourlyRate / 60;
  const computedLateDeduction = Math.round(perMinuteRate * lateMinutes);
  const lateDeduction = applyPayrollOverride(computedLateDeduction, empMeta, "lateDeductionOverride");
  const overtimeMultiplier = settings.overtimeMultiplier;
  const computedOvertimePay = Math.round(hourlyRate * overtimeMultiplier * overtimeHours);
  const overtimePay = applyPayrollOverride(computedOvertimePay, empMeta, "overtimePayOverride");

  const monthPenalties = penalties.filter((p) => p.employeeId === e.id && monthKey(p.date) === ym && p.actionType === "خصم مالي");
  const computedPenaltyDeduction = monthPenalties.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const penaltyDeduction = applyPayrollOverride(computedPenaltyDeduction, empMeta, "penaltyDeductionOverride");

  const empAdvances = advances.filter((a) => a.employeeId === e.id);
  const advanceLines = empAdvances
    .map((a) => ({ advance: a, monthlyInstallment: advanceDeductionForMonth(a, ym) }))
    .filter((l) => l.monthlyInstallment > 0);
  const computedAdvanceDeduction = advanceLines.reduce((s, l) => s + l.monthlyInstallment, 0);
  const advanceDeduction = applyPayrollOverride(computedAdvanceDeduction, empMeta, "advanceDeductionOverride");

  const insuranceRate = settings.insuranceRate;
  const computedInsuranceDeduction = Math.round((base * insuranceRate) / 100);
  const insuranceDeduction = applyPayrollOverride(computedInsuranceDeduction, empMeta, "insuranceDeductionOverride");
  const annualTaxable = Math.max(0, base * 12 - computedInsuranceDeduction * 12 - settings.personalExemptionAnnual);
  const computedTaxDeduction = Math.round(computeTax(annualTaxable, settings.taxBrackets) / 12);
  const taxDeduction = applyPayrollOverride(computedTaxDeduction, empMeta, "taxDeductionOverride");

  const bonus = Number(empMeta.bonus) || 0;

  const net = base - absenceDeduction - penaltyDeduction - advanceDeduction - insuranceDeduction - taxDeduction - lateDeduction + overtimePay + bonus;

  return {
    emp: e, base,
    absentDays, perDayRate, absenceDeduction,
    lateMinutes, hourlyRate, perMinuteRate, lateDeduction,
    overtimeHours, overtimeMultiplier, overtimePay,
    monthPenalties, penaltyDeduction,
    advanceLines, advanceDeduction,
    insuranceRate, insuranceDeduction,
    annualTaxable, taxBrackets: settings.taxBrackets, taxDeduction,
    bonus, net,
    // زي computePayrollRow بالظبط - القيم المحسوبة تلقائيًا (قبل أي override) وأسباب أي تعديل
    // يدوي مسجّل، عشان شاشة "تفاصيل الخصم" توضّح لما رقم يكون معدّل يدويًا وليه.
    computed: {
      absenceDeduction: computedAbsenceDeduction, penaltyDeduction: computedPenaltyDeduction, advanceDeduction: computedAdvanceDeduction,
      lateDeduction: computedLateDeduction, insuranceDeduction: computedInsuranceDeduction, taxDeduction: computedTaxDeduction, overtimePay: computedOvertimePay,
    },
    reasons: {
      absenceDeduction: empMeta.absenceDeductionReason || "", penaltyDeduction: empMeta.penaltyDeductionReason || "", advanceDeduction: empMeta.advanceDeductionReason || "",
      lateDeduction: empMeta.lateDeductionReason || "", insuranceDeduction: empMeta.insuranceDeductionReason || "", taxDeduction: empMeta.taxDeductionReason || "", overtimePay: empMeta.overtimePayReason || "",
    },
  };
}

/* ---------- reports (pure, testable helpers - see ReportsTab for the tab that renders them) ---------- */

// True if the employee was on the books at ANY point during month `ym` ("YYYY-MM") - hired on
// or before the month's end, and (still active, or resigned/terminated on or after the
// month's start). Missing hireDate/resignationDate default to "always counted" rather than
// excluding an employee whose record is simply incomplete.
function wasActiveInMonth(e, ym) {
  if (e.hireDate && monthKey(e.hireDate) > ym) return false;
  if (e.resignationDate && monthKey(e.resignationDate) < ym) return false;
  return true;
}

// `count` consecutive "YYYY-MM" months, oldest first, ending at (and including) `ym`.
function monthRangeEndingAt(ym, count) {
  const [y, m] = ym.split("-").map(Number);
  const out = [];
  for (let i = count - 1; i >= 0; i--) {
    const d = new Date(y, m - 1 - i, 1);
    out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  }
  return out;
}

// Attendance rate (% present, of every present/absent/late entry recorded that month) across
// the given employee ids only - so a past month correctly reflects only who was employed then.
function computeAttendanceRateForMonth(employeeIds, attendance, ym) {
  const idSet = new Set(employeeIds);
  let present = 0, absent = 0, late = 0;
  Object.keys(attendance).forEach((date) => {
    if (monthKey(date) !== ym) return;
    Object.entries(attendance[date] || {}).forEach(([empId, entry]) => {
      if (!idSet.has(empId)) return;
      const status = typeof entry === "string" ? entry : entry?.status;
      // المتأخر لسه حاضر فعليًا - بيتحسب جوه present زي لوحة المتابعة بالظبط، و late
      // بتتعد لوحدها كمان للتوضيح بس، مش بتتحسب مرتين في total.
      if (status === "present") present++;
      else if (status === "late") { present++; late++; }
      else if (status === "absent") absent++;
    });
  });
  const total = present + absent;
  return { present, absent, late, rate: total === 0 ? null : Math.round((present / total) * 1000) / 10 };
}

// One full row of the monthly trend report - headcount, attendance rate, payroll cost,
// penalties/advances totals, hires and resignations - all for a single month `ym`.
function computeMonthlyReportRow(ym, employees, attendance, penalties, advances, payrollMeta, settings) {
  const activeIds = employees.filter((e) => wasActiveInMonth(e, ym)).map((e) => e.id);
  const activeEmps = employees.filter((e) => activeIds.includes(e.id));
  const meta = payrollMeta[ym] || {};
  const payrollCost = activeEmps.reduce((s, e) => s + computePayrollRow(e, ym, attendance, penalties, advances, settings, meta).net, 0);
  const penaltiesTotal = penalties.filter((p) => monthKey(p.date) === ym && p.actionType === "خصم مالي").reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const advancesTotal = advances.filter((a) => monthKey(a.date) === ym).reduce((s, a) => s + (Number(a.totalAmount) || 0), 0);
  const hires = employees.filter((e) => e.hireDate && monthKey(e.hireDate) === ym).length;
  const resignations = employees.filter((e) => e.resignationDate && monthKey(e.resignationDate) === ym).length;
  const { rate: attendanceRate } = computeAttendanceRateForMonth(activeIds, attendance, ym);
  return { ym, headcount: activeEmps.length, attendanceRate, payrollCost, penaltiesTotal, advancesTotal, hires, resignations };
}

// Active headcount grouped by department (today's snapshot, not historical) - same "بدون قسم"
// fallback bucket used by the org chart, sorted by headcount descending.
function computeDepartmentHeadcount(activeEmployees) {
  const counts = {};
  activeEmployees.forEach((e) => {
    const dept = (e.department || "").trim() || "بدون قسم";
    counts[dept] = (counts[dept] || 0) + 1;
  });
  return Object.entries(counts).map(([dept, count]) => ({ dept, count })).sort((a, b) => b.count - a.count);
}

// رصيد كل الحالات (إجازة/إجازة عارضة/مرضية/مأمورية/إذن تأخير/سلفة/استقالة) عبر كل الطلبات
// المسجلة - عدد كل نوع مقسّم على حالته (معلّق/موافق عليه/مرفوض) عشان يبان بسرعة في تاب
// التقارير من غير الدخول على تاب طلبات الموظفين وتصفيته يدوي.
function computeRequestsBalance(requests) {
  return Object.keys(REQUEST_KIND_LABELS).map((kind) => {
    const forKind = requests.filter((r) => r.kind === kind);
    const pending = forKind.filter((r) => r.status === "pending" || r.status === "pending_ceo").length;
    const approved = forKind.filter((r) => r.status === "approved").length;
    const rejected = forKind.filter((r) => r.status === "rejected").length;
    return { kind, total: forKind.length, pending, approved, rejected };
  });
}

// تقرير شؤون الأفراد المخصّص: فلترة الطلبات بفترة زمنية (تاريخ تقديم الطلب) + اختياريًا موظف
// بعينه و/أو نوع طلب بعينه من قايمة شؤون الأفراد - بيغذي شاشة "تقرير مخصص" في تاب التقارير
// وتصديرها لإكسل. الأحدث أولًا زي باقي شاشات الطلبات في السيستم.
function filterRequestsReport(requests, opts) {
  const dateFrom = (opts && opts.dateFrom) || "";
  const dateTo = (opts && opts.dateTo) || "";
  const employeeId = (opts && opts.employeeId) || "";
  const kind = (opts && opts.kind) || "";
  return requests
    .filter((r) => {
      const d = (r.createdAt || "").slice(0, 10);
      if (dateFrom && d < dateFrom) return false;
      if (dateTo && d > dateTo) return false;
      if (employeeId && employeeId !== "الكل" && r.employeeId !== employeeId) return false;
      if (kind && kind !== "الكل" && r.kind !== kind) return false;
      return true;
    })
    .sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
}

/* ---------- recruitment (pure, testable helpers - see RecruitmentTab for the tab itself) ---------- */

// One count per CANDIDATE_STAGES entry (0 for a stage nobody is currently in), in pipeline
// order - drives both the Kanban column headers and the small KPI row above them.
function computeCandidatePipelineCounts(candidates) {
  const counts = {};
  CANDIDATE_STAGES.forEach((s) => { counts[s] = 0; });
  candidates.forEach((c) => { if (counts[c.stage] !== undefined) counts[c.stage]++; });
  return CANDIDATE_STAGES.map((stage) => ({ stage, count: counts[stage] }));
}

// Simple case-insensitive substring match across the fields RecruitmentTab's search box
// covers, used by both the live UI filter and (indirectly) this test suite.
function candidateMatchesQuery(candidate, query) {
  const q = String(query || "").trim().toLowerCase();
  if (!q) return true;
  return [candidate.name, candidate.position, candidate.department, candidate.phone]
    .some((v) => String(v || "").toLowerCase().includes(q));
}

// Shared confirmation step for a hard employee delete (one or many) - used by both
// EmployeesTab and FormerEmployeesTab. Deliberately spells out everything the delete cascades
// into (see HRSystem.deleteEmployees), since it's irreversible and touches several
// collections at once.
function EmployeeDeleteConfirmModal({ employees, onConfirm, onCancel }) {
  const { t } = useLang();
  if (!employees || employees.length === 0) return null;
  const many = employees.length > 1;
  return (
    <Modal open title={many ? t("حذف {n} موظفين نهائيًا", { n: employees.length }) : "حذف موظف نهائيًا"} onClose={onCancel}>

        <div className="flex items-start gap-2 rounded-lg bg-rose-50 px-3 py-2.5 text-sm text-rose-700">

          <span>{t("الإجراء ده نهائي ومش هيتم التراجع عنه. هيتم حذف ملف الموظف كامل مع الحضور والجزاءات والسلف والمستندات والتقييمات وسجلات المرتب الخاصة بيه.")}</span>
        </div>
        <ul className="max-h-48 space-y-1 overflow-y-auto rounded-lg border border-stone-200 p-2 text-sm">
          {employees.map((e) => (
            <li key={e.id} className="flex items-center justify-between rounded-md px-2 py-1.5 hover:bg-stone-50">
              <span className="font-medium text-slate-700">{e.name}</span>
              <span className="text-xs text-slate-400">{e.employeeCode || "—"}{e.department ? ` · ${e.department}` : ""}</span>
            </li>
          ))}
        </ul>
        <p className="text-xs text-slate-400">{t("لو أي حد منهم فعّل بوابة الموظف بتاعته قبل كده، حساب الدخول (Firebase Auth) مش بيتحذف تلقائي من هنا - بس هيفضل عاجز يقرأ أي حاجة لأن ملفه اتحذف. لو عايز تقفل الحساب ده نهائي، احذفه يدويًا من Firebase Console.")}</p>
        <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">
          <button type="button" onClick={onCancel} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50">{t("إلغاء")}</button>
          <button type="button" onClick={onConfirm} className="flex items-center gap-1.5 rounded-lg bg-rose-600 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-700"><Trash2 size={15} /> {many ? t("حذف {n} موظفين", { n: employees.length }) : t("حذف نهائيًا")}</button>
        </div>
      </div>
    </Modal>
  );
}

/* ================= MAIN APP ================= */
function HRSystem({ adminUser }) {
  const { t, dir } = useLang();
  const [tab, setTab] = useState("dashboard");
  const [openEmployeeId, setOpenEmployeeId] = useState(null);
  const [saving, setSaving] = useState(false);

  const [employees, employeesLoaded] = useFirestoreCollection("employees");
  const [attendanceRecords, attendanceLoaded] = useFirestoreCollection("attendanceRecords");
  const [penalties, penaltiesLoaded] = useFirestoreCollection("penalties");
  // محاضر التحقيق والتظلمات (نص حر ممكن يتضمن أقوال شهود/زملاء) - مجموعة منفصلة مقفولة قراءة
  // وكتابة على الأدمن بس (firestore.rules)، عشان مقدرش تتسرب للموظف صاحب القضية نفسه أو لأي
  // موظف تاني من بوابته حتى لو حصل تعديل مستقبلي على قواعد مجموعة penalties العامة.
  const [penaltyCaseNotes] = useFirestoreCollection("penaltyCaseNotes");
  const [payrollMetaDocs, payrollLoaded] = useFirestoreCollection("payrollMeta");
  const [advances, advancesLoaded] = useFirestoreCollection("advances");
  const [documents, documentsLoaded] = useFirestoreCollection("documents");
  const [reviews, reviewsLoaded] = useFirestoreCollection("reviews");
  const [salaryIncreases] = useFirestoreCollection("salaryIncreases");
  const [settings, settingsLoaded] = useFirestoreDoc("settings", "main", DEFAULT_SETTINGS);
  const [orgChart, orgChartLoaded] = useFirestoreDoc("orgChart", "main", DEFAULT_ORG_CHART);
  const [notifySettings] = useFirestoreDoc("settings", "notifications", DEFAULT_NOTIFY_SETTINGS);
  const [publicDirectory, publicDirectoryLoaded] = useFirestoreCollection("publicDirectory");
  const [payslipDocs, payslipsLoaded] = useFirestoreCollection("payslips");
  const [auditLog] = useFirestoreCollection("auditLog");
  const [candidates] = useFirestoreCollection("candidates");
  // "requests" (طلبات إجازة/تأخير/سلفة من بوابة الموظف) بيتقرا هنا بس عرض - القرار (موافقة/رفض)
  // بيتاخد من بوابة الموظف نفسها (من رئيس القسم/الرئيس التنفيذي)، مش من هنا. الهدف إن Head of
  // HR يشوف كل حاجة معلّقة في مكان واحد (تاب المعلقات) من غير ما يحتاج يدخل بوابة تانية.
  const [requests] = useFirestoreCollection("requests");
  const [assets] = useFirestoreCollection("assets");
  const [checklistItems] = useFirestoreCollection("checklistItems");
  const [positions] = useFirestoreCollection("positions");
  const [surveys] = useFirestoreCollection("surveys");
  const [surveyResponses] = useFirestoreCollection("surveyResponses");
  // إشعارات لوحة المتابعة اللي HR عمللها "إخفاء" (زرار delete) - كل سجل { id: alertDismissKey,
  // dismissedAt } - id السجل هو مفتاح الإخفاء نفسه، فمفيش حاجة تتكرر. عملية تشغيلية بحتة (بتخفي
  // عرض بس، مش بتمس أي سجل HR فعلي) فمش بتتسجل في سجل التدقيق (auditLog) - زي payslips بالظبط.
  const [dismissedAlerts] = useFirestoreCollection("dismissedAlerts");
  const [orgChartPrintOpen, setOrgChartPrintOpen] = useState(false);
  const [printPenaltyCase, setPrintPenaltyCase] = useState(null);
  // Set by RecruitmentTab's "تحويل لموظف" action on a hired candidate - EmployeesTab watches
  // this to auto-open its "New Employee" modal pre-filled with the candidate's info, then
  // reports back (via handleCandidateConverted) once that employee is actually saved.
  const [prefillCandidate, setPrefillCandidate] = useState(null);

  const loading = !employeesLoaded || !attendanceLoaded || !penaltiesLoaded || !payrollLoaded
    || !advancesLoaded || !documentsLoaded || !reviewsLoaded || !settingsLoaded || !orgChartLoaded
    || !publicDirectoryLoaded || !payslipsLoaded;

  // Reconstructed to the exact same { [date]: { [employeeId]: { status, overtimeHours } } }
  // shape the whole app already expects (getAttEntry, isNonWorkday, leave/payroll math),
  // so none of that existing logic had to change — only where the records come from did.
  const attendance = useMemo(() => {
    const out = {};
    attendanceRecords.forEach((r) => {
      if (!out[r.date]) out[r.date] = {};
      // lateExcused لازم تتحمل هنا زي أي حقل تاني - ده أصل الباگ اللي بلّغ عنه هاني: يوم "متأخر"
      // اتسامح فيه المدير (lateExcused: true مسجّلة في Firestore من بوابة الموظف) كان بيترجع
      // بيانات دقايق التأخير الحقيقية أول ما أي عملية "set" كاملة تحصل هنا (استيراد ملف حضور،
      // مسح موظف، استرجاع نسخة احتياطية...) - لأن العلامة دي كانت بتتشال من غير قصد في إعادة
      // البناء دي، فـ shouldSkipAttendanceOverwrite ما كانتش بتشوفها أبدًا (existing.lateExcused
      // كان دايمًا undefined) فالحماية كانت بتفشل بصمت.
      out[r.date][r.employeeId] = { status: r.status, overtimeHours: r.overtimeHours || 0, lateMinutes: r.lateMinutes || 0, lateExcused: !!r.lateExcused };
    });
    return out;
  }, [attendanceRecords]);

  const payrollMeta = useMemo(() => {
    const out = {};
    payrollMetaDocs.forEach((d) => { const { id, ...rest } = d; out[id] = rest; });
    return out;
  }, [payrollMetaDocs]);

  // Employee id -> display name, used only to make audit-log samples readable
  // (e.g. "أحمد علي" instead of a raw employeeId) for collections keyed by employeeId.
  const employeeNameById = useMemo(() => {
    const out = {};
    employees.forEach((e) => { out[e.id] = e.name || e.id; });
    return out;
  }, [employees]);

  // Fire-and-forget wrapper matching every existing call site's expectation (setX(next) with
  // no await), while still surfacing a transient "saving" indicator and logging write failures
  // (most commonly a Security Rules rejection) instead of swallowing them silently.
  function track(promise) {
    setSaving(true);
    promise.catch((err) => { console.error(err); alert(t("تعذّر حفظ التعديل — راجع صلاحيات الدخول أو الاتصال بالإنترنت.")); })
      .finally(() => setSaving(false));
  }

  const upd = {
    // salaryReasonNote (اختياري): { employeeName, reason } - لما EmployeesTab.save يكتشف إن
    // المرتب اتغيّر فعليًا، بيمرّر السبب الإجباري اللي الأدمن كتبه هنا. diffSummary فوق أصلًا
    // بيسجّل التغيير نفسه (salary: القديم → الجديد) لأنه حقل عادي في كائن الموظف، فده بس بيضيف
    // سطر تاني منفصل في سجل النشاط بنفس اسم الموظف يوضّح "السبب" - بدل ما نلوّث سجل الموظف
    // الدائم بحقل مؤقت (سبب التعديل ده خاص باللحظة دي بس، مش جزء من بيانات الموظف الثابتة).
    employees: (n, salaryReasonNote) => {
      track(syncCollection("employees", employees, n));
      track(syncPublicDirectory(n, publicDirectory));
      track(writeAuditLog(adminUser, "employees", diffSummary(employees, n, (e) => e.name || e.id)));
      if (salaryReasonNote) {
        track(writeAuditLog(adminUser, "employees", {
          added: [], removed: [],
          updated: [{ label: salaryReasonNote.employeeName, changes: [{ field: "reason", from: null, to: salaryReasonNote.reason }] }],
        }));
      }
    },
    attendance: (n) => {
      track(syncAttendanceRecords(n, attendanceRecords));
      track(writeAuditLog(adminUser, "attendance", diffSummary(flattenAttendanceForDiff(attendance), flattenAttendanceForDiff(n))));
    },
    // Used by AttendanceTab (day-to-day status/overtime edits + file import) instead of
    // `attendance` above - see syncAttendancePatch's comment for why: it writes only the exact
    // records this call actually touched, so it can never clobber a concurrent write (e.g. a
    // "late" request just approved from the employee portal) with a stale local snapshot.
    attendancePatch: (patch) => {
      track(syncAttendancePatch(patch));
      const before = {}, after = {};
      patch.forEach(({ date, employeeId, status, overtimeHours, lateMinutes }) => {
        const cur = getAttEntry(attendance, date, employeeId);
        if (cur && cur.status) { if (!before[date]) before[date] = {}; before[date][employeeId] = cur; }
        if (status) { if (!after[date]) after[date] = {}; after[date][employeeId] = { status, overtimeHours, lateMinutes }; }
      });
      track(writeAuditLog(adminUser, "attendance", diffSummary(flattenAttendanceForDiff(before), flattenAttendanceForDiff(after))));
    },
    penalties: (n) => {
      track(syncCollection("penalties", penalties, n));
      track(writeAuditLog(adminUser, "penalties", diffSummary(penalties, n, (p) => `${employeeNameById[p.employeeId] || p.employeeId} - ${p.actionType || ""}`)));
    },
    penaltyCaseNotes: (n) => {
      track(syncCollection("penaltyCaseNotes", penaltyCaseNotes, n));
      track(writeAuditLog(adminUser, "penaltyCaseNotes", diffSummary(penaltyCaseNotes, n, (note) => `${employeeNameById[penalties.find((p) => p.id === note.id)?.employeeId] || note.id}`)));
    },
    payrollMeta: (n) => {
      track(syncPayrollMeta(n, payrollMetaDocs));
      track(writeAuditLog(adminUser, "payrollMeta", diffSummary(flattenPayrollMetaObj(payrollMeta), flattenPayrollMetaObj(n))));
    },
    advances: (n) => {
      track(syncCollection("advances", advances, n));
      track(writeAuditLog(adminUser, "advances", diffSummary(advances, n, (a) => `${employeeNameById[a.employeeId] || a.employeeId} - ${a.totalAmount || ""} ج.م`)));
    },
    documents: (n) => {
      track(syncCollection("documents", documents, n));
      track(writeAuditLog(adminUser, "documents", diffSummary(documents, n, (d) => `${employeeNameById[d.employeeId] || d.employeeId} - ${d.name || ""}`)));
    },
    reviews: (n) => {
      track(syncCollection("reviews", reviews, n));
      track(writeAuditLog(adminUser, "reviews", diffSummary(reviews, n, (r) => `${employeeNameById[r.employeeId] || r.employeeId}`)));
    },
    salaryIncreases: (n) => {
      track(syncCollection("salaryIncreases", salaryIncreases, n));
      track(writeAuditLog(adminUser, "salaryIncreases", diffSummary(salaryIncreases, n, (s) => `${employeeNameById[s.employeeId] || s.employeeId} - ${s.year || ""}`)));
    },
    settings: (n) => {
      track(setDoc(doc(db, "settings", "main"), n));
      track(writeAuditLog(adminUser, "settings", diffDocKeys(settings, n)));
    },
    orgChart: (n) => {
      track(setDoc(doc(db, "orgChart", "main"), n));
      track(writeAuditLog(adminUser, "orgChart", diffDocKeys(orgChart, n)));
    },
    notifySettings: (n) => {
      track(setDoc(doc(db, "settings", "notifications"), n));
      track(writeAuditLog(adminUser, "notifySettings", diffDocKeys(notifySettings, n)));
    },
    payslips: (ym, rows) => track(syncPayslipsForMonth(ym, rows, payslipDocs.filter((d) => d.id.startsWith(`${ym}_`)))),
    dismissedAlerts: (n) => track(syncCollection("dismissedAlerts", dismissedAlerts, n)),
    candidates: (n) => {
      track(syncCollection("candidates", candidates, n));
      track(writeAuditLog(adminUser, "candidates", diffSummary(candidates, n, (c) => `${c.name || c.id} - ${c.stage || ""}`)));
    },
    assets: (n) => {
      track(syncCollection("assets", assets, n));
      track(writeAuditLog(adminUser, "assets", diffSummary(assets, n, (a) => `${employeeNameById[a.employeeId] || a.employeeId} - ${a.name || ""}`)));
    },
    checklistItems: (n) => {
      track(syncCollection("checklistItems", checklistItems, n));
      track(writeAuditLog(adminUser, "checklistItems", diffSummary(checklistItems, n, (c) => `${employeeNameById[c.employeeId] || c.employeeId} - ${c.text || ""}`)));
    },
    positions: (n) => {
      track(syncCollection("positions", positions, n));
      track(writeAuditLog(adminUser, "positions", diffSummary(positions, n, (p) => `${p.title || ""}`)));
    },
    surveys: (n) => {
      track(syncCollection("surveys", surveys, n));
      track(writeAuditLog(adminUser, "surveys", diffSummary(surveys, n, (s) => s.title || "")));
    },
    surveyResponses: (n) => {
      track(syncCollection("surveyResponses", surveyResponses, n));
      track(writeAuditLog(adminUser, "surveyResponses", diffSummary(surveyResponses, n, (r) => `${employeeNameById[r.employeeId] || r.employeeId}`)));
    },
  };

  // RecruitmentTab's "تحويل لموظف" on a hired candidate: hand off to EmployeesTab (switch tab,
  // hand it the candidate to prefill from) rather than creating the employee record directly -
  // that way the admin still reviews/completes the details (salary, contract, etc.) that a
  // candidate record was never meant to carry, before anything is actually saved.
  function handleConvertCandidate(candidate) {
    setPrefillCandidate(candidate);
    setTab("employees");
  }
  // Called by EmployeesTab once the prefilled "New Employee" form is actually saved - marks
  // the source candidate as converted so RecruitmentTab stops offering the button again.
  function handleCandidateConverted(candidateId, employeeId) {
    upd.candidates(candidates.map((c) => (c.id === candidateId ? { ...c, convertedEmployeeId: employeeId, convertedAt: todayISO() } : c)));
  }

  // Permanently deletes one or more employees and sweeps their data out of every other
  // collection this app owns - attendance, penalties, advances, documents, reviews, and
  // per-month payroll meta (mirrors the remap logic DuplicateMergeWizard already uses, minus
  // the "keep one" part) - plus `publicDirectory` (automatic, via upd.employees already
  // calling syncPublicDirectory) and any stray `requests` docs that mention them (Firestore-
  // direct, see deleteOrphanedRequests). Also clears them out of orgChart if they were a
  // department head or the CEO, so a stale id never silently blocks request routing.
  // NOTE: this does NOT delete their Firebase Auth portal login (if the portal was ever
  // activated for them) - the client SDK can't delete another user's auth account, only the
  // Firebase Console can. That's harmless here: with no employees doc left, every Security
  // Rule keyed off isOwnEmployeeRecord() denies them everywhere, so an orphaned login account
  // simply can't read or write anything - but if it's an activated login who is no longer
  // trusted, revoke it by hand from Firebase Console -> Authentication.
  function deleteEmployees(ids) {
    const idSet = new Set(ids);
    if (idSet.size === 0) return;

    if (openEmployeeId && idSet.has(openEmployeeId)) setOpenEmployeeId(null);

    upd.employees(employees.filter((e) => !idSet.has(e.id)));

    const nextAttendance = {};
    Object.keys(attendance).forEach((date) => {
      const dayRec = { ...attendance[date] };
      ids.forEach((id) => delete dayRec[id]);
      nextAttendance[date] = dayRec;
    });
    upd.attendance(nextAttendance);

    upd.penalties(penalties.filter((p) => !idSet.has(p.employeeId)));
    upd.advances(advances.filter((a) => !idSet.has(a.employeeId)));
    upd.documents(documents.filter((d) => !idSet.has(d.employeeId)));
    upd.reviews(reviews.filter((r) => !idSet.has(r.employeeId)));
    upd.salaryIncreases(salaryIncreases.filter((s) => !idSet.has(s.employeeId)));
    upd.surveyResponses(surveyResponses.filter((r) => !idSet.has(r.employeeId)));

    const nextPayrollMeta = {};
    Object.keys(payrollMeta).forEach((ym) => {
      const monthRec = { ...payrollMeta[ym] };
      ids.forEach((id) => delete monthRec[id]);
      nextPayrollMeta[ym] = monthRec;
    });
    upd.payrollMeta(nextPayrollMeta);

    const nextHeads = { ...(orgChart.departmentHeads || {}) };
    let orgChartChanged = false;
    Object.keys(nextHeads).forEach((dept) => {
      if (idSet.has(nextHeads[dept])) { delete nextHeads[dept]; orgChartChanged = true; }
    });
    let nextCeo = orgChart.ceoEmployeeId;
    if (idSet.has(nextCeo)) { nextCeo = null; orgChartChanged = true; }
    if (orgChartChanged) upd.orgChart({ ...orgChart, departmentHeads: nextHeads, ceoEmployeeId: nextCeo });

    track(deleteOrphanedRequests(ids));
  }

  const activeEmployees = useMemo(() => employees.filter((e) => e.status === "active" || !e.status), [employees]);
  const formerEmployees = useMemo(() => employees.filter((e) => e.status === "resigned" || e.status === "terminated"), [employees]);

  if (loading) {
    return (
      <div className="flex h-[600px] w-full items-center justify-center bg-stone-50">
        <div className="flex flex-col items-center gap-3 text-teal-700">
          <Loader2 className="animate-spin" size={28} />
          <span className="text-sm font-medium">{t("جاري تحميل بيانات الموارد البشرية...")}</span>
        </div>
      </div>
    );
  }

  const openEmployee = employees.find((e) => e.id === openEmployeeId);

  return (
    <div dir={dir} className="min-h-[700px] w-full bg-stone-50 font-sans text-slate-800 print:bg-white">
      <style>{`@media print { .no-print { display: none !important; } .print-area { display: block !important; } }`}</style>
      <div className="mx-auto flex max-w-7xl flex-col gap-6 p-4 lg:flex-row lg:p-6">
        <aside className="no-print w-full shrink-0 rounded-2xl border border-stone-200 bg-white p-4 shadow-sm lg:sticky lg:top-6 lg:h-fit lg:max-h-[calc(100vh-3rem)] lg:w-60 lg:self-start lg:overflow-y-auto">
          <div className="mb-6 flex items-center gap-2 px-2">
            <div className="flex h-9 w-9 items-center justify-center rounded-lg bg-teal-800 text-white"><Users size={18} /></div>
            <div>
              <div className="text-sm font-bold text-slate-800">{t("شؤون الأفراد")}</div>
              <div className="text-[11px] text-slate-400">{t("إدارة الموظفين والمرتبات")}</div>
            </div>
          </div>
          <LangToggle className="mb-4 w-full justify-center" />
          <nav className="flex flex-col gap-1">
            <NavItem icon={<LayoutDashboard size={17} />} label="لوحة المتابعة" active={tab === "dashboard"} onClick={() => setTab("dashboard")} />
            <NavItem icon={<Users size={17} />} label="الموظفون والعقود" active={tab === "employees"} onClick={() => setTab("employees")} />
            <NavItem icon={<Network size={17} />} label="الهيكل التنظيمي" active={tab === "orgchart"} onClick={() => setTab("orgchart")} />
            <NavItem icon={<Star size={17} />} label="التقييمات" active={tab === "evaluations"} onClick={() => setTab("evaluations")} />
            <NavItem icon={<CalendarCheck size={17} />} label="الحضور والانصراف" active={tab === "attendance"} onClick={() => setTab("attendance")} />
            <NavItem icon={<ClipboardList size={17} />} label="طلبات الموظفين" active={tab === "requests"} onClick={() => setTab("requests")} />
            <NavItem icon={<Wallet size={17} />} label="المرتبات" active={tab === "payroll"} onClick={() => setTab("payroll")} />
