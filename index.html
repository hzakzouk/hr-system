/* ================= ORG CHART ================= */

// Builds a 3-level tree (CEO -> department head -> rest of the department) purely from
// each employee's existing "department" field plus the two choices made in OrgChartTab
// (ceoEmployeeId, departmentHeads). No per-employee "manager" field needed.
function buildOrgTree(employees, orgChart) {
  const ceo = employees.find((e) => e.id === orgChart.ceoEmployeeId) || null;
  const rest = employees.filter((e) => !ceo || e.id !== ceo.id);

  const byDept = {};
  rest.forEach((e) => {
    const dept = (e.department || "").trim() || "بدون قسم";
    (byDept[dept] = byDept[dept] || []).push(e);
  });

  const departmentHeads = orgChart.departmentHeads || {};
  const departments = Object.keys(byDept)
    .sort((a, b) => a.localeCompare(b, "ar"))
    .map((dept) => {
      const members = byDept[dept];
      const headId = departmentHeads[dept];
      const head = members.find((e) => e.id === headId) || null;
      const others = members.filter((e) => !head || e.id !== head.id);
      return { dept, head, others, total: members.length };
    });

  return { ceo, departments };
}

function PersonBox({ person, role, tone = "teal", placeholder, subtitle, crown }) {
  const toneCls = {
    teal: "border-teal-700 bg-teal-50",
    amber: "border-amber-500 bg-amber-50",
  }[tone];
  const placeholderBorder = tone === "teal" ? "border-teal-300" : "border-amber-300";

  if (!person) {
    return (
      <div className={`w-56 rounded-xl border-2 border-dashed ${placeholderBorder} bg-stone-50 p-3 text-center`}>
        <div className="text-[11px] font-semibold uppercase tracking-wide text-slate-400">{role}</div>
        <div className="mt-1.5 text-xs text-slate-400">{placeholder}</div>
      </div>
    );
  }
  return (
    <div className={`w-56 rounded-xl border-2 p-3 text-center shadow-sm ${toneCls}`}>
      <div className="flex items-center justify-center gap-1 text-[11px] font-semibold uppercase tracking-wide text-slate-500">
        {crown && <Crown size={12} className="text-amber-600" />}{role}
      </div>
      <div className="mt-1 text-sm font-bold text-slate-800">{person.name}</div>
      <div className="text-xs text-slate-500">{person.position || "—"}</div>
      {subtitle && <div className="mt-1 text-[11px] text-slate-400">{subtitle}</div>}
    </div>
  );
}

// Shared between the interactive tab and the print view — `forceExpanded` skips the
// show/hide toggle and just renders every department's members (used for printing).
function OrgChartTree({ tree, expanded, onToggle, forceExpanded }) {
  const { ceo, departments } = tree;

  return (
    <div className="flex min-w-max flex-col items-center px-4">
      <PersonBox person={ceo} role="الرئيس التنفيذي" tone="teal" placeholder="لم يتم تحديد الرئيس التنفيذي" crown />

      {departments.length > 0 && (
        <>
          <div className="h-6 w-px bg-stone-300" />
          <div className="flex items-start justify-center border-t border-stone-300 pt-6">
            {departments.map((d) => {
              const isOpen = forceExpanded || !!expanded[d.dept];
              return (
                <div key={d.dept} className="relative flex flex-col items-center px-4">
                  <div className="absolute -top-6 h-6 w-px bg-stone-300" />
                  <PersonBox
                    person={d.head}
                    role={d.dept}
                    tone="amber"
                    placeholder="لم يتم تحديد رئيس الإدارة"
                    subtitle={`${d.total} ${d.total === 1 ? "موظف" : "موظفين"}`}
                  />
                  {d.others.length > 0 && (
                    <>
                      {!forceExpanded && (
                        <button
                          onClick={() => onToggle(d.dept)}
                          className="mt-2 flex items-center gap-1 text-xs font-medium text-teal-700 hover:underline"
                        >
                          <ChevronDown size={13} className={`transition-transform ${isOpen ? "rotate-180" : ""}`} />
                          {isOpen ? "إخفاء الموظفين" : `عرض الموظفين (${d.others.length})`}
                        </button>
                      )}
                      {isOpen && (
                        <div className="mt-2 flex flex-col items-center">
                          <div className="h-4 w-px bg-stone-300" />
                          <div className="flex w-56 flex-col gap-1.5 rounded-xl border border-dashed border-stone-300 bg-stone-50/70 p-2.5">
                            {d.others.map((e) => (
                              <div key={e.id} className="rounded-lg border border-stone-200 bg-white px-2.5 py-1.5 text-right">
                                <div className="text-xs font-semibold text-slate-700">{e.name}</div>
                                <div className="text-[11px] text-slate-400">{e.position || "—"}</div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </>
                  )}
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

function OrgChartTab({ employees, orgChart, setOrgChart, onPrint }) {
  const [expanded, setExpanded] = useState({});
  function toggle(dept) { setExpanded((s) => ({ ...s, [dept]: !s[dept] })); }

  const usedDepartments = useMemo(() => {
    const set = new Set();
    employees.forEach((e) => { const d = (e.department || "").trim(); if (d) set.add(d); });
    return Array.from(set).sort((a, b) => a.localeCompare(b, "ar"));
  }, [employees]);

  const tree = useMemo(() => buildOrgTree(employees, orgChart), [employees, orgChart]);
  const unassignedCount = employees.filter((e) => !(e.department || "").trim()).length;

  function setCeo(id) { setOrgChart({ ...orgChart, ceoEmployeeId: id || null }); }
  function setDeptHead(dept, id) {
    const heads = { ...(orgChart.departmentHeads || {}) };
    if (id) heads[dept] = id; else delete heads[dept];
    setOrgChart({ ...orgChart, departmentHeads: heads });
  }

  return (
    <div>
      <SectionTitle
        eyebrow={`${employees.length} موظف نشط`}
        title="الهيكل التنظيمي"
        action={
          <button onClick={onPrint} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3.5 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50">
            <Printer size={16} /> طباعة الهيكل
          </button>
        }
      />

      <Card className="mb-6 p-5">
        <div className="mb-4 flex items-center gap-2"><Crown size={16} className="text-amber-600" /><h3 className="font-bold text-slate-800">تحديد المناصب القيادية</h3></div>

        <div className="max-w-sm">
          <Field label="الرئيس التنفيذي / صاحب الشركة">
            <select className={inputCls} value={orgChart.ceoEmployeeId || ""} onChange={(e) => setCeo(e.target.value)}>
              <option value="">— لم يتم التحديد —</option>
              {employees.map((e) => <option key={e.id} value={e.id}>{e.name}{e.position ? ` — ${e.position}` : ""}</option>)}
            </select>
          </Field>
        </div>

        {usedDepartments.length > 0 ? (
          <div className="mt-5 border-t border-stone-100 pt-4">
            <div className="mb-2.5 text-sm font-medium text-slate-600">رئيس/مديرة كل إدارة</div>
            <div className="grid grid-cols-1 gap-3 md:grid-cols-2 lg:grid-cols-3">
              {usedDepartments.map((dept) => {
                const candidates = employees.filter((e) => (e.department || "").trim() === dept && e.id !== orgChart.ceoEmployeeId);
                return (
                  <label key={dept} className="block">
                    <span className="mb-1 block text-xs font-medium text-slate-500">{dept}</span>
                    <select className={`${inputCls} text-xs`} value={(orgChart.departmentHeads || {})[dept] || ""} onChange={(e) => setDeptHead(dept, e.target.value)}>
                      <option value="">— بدون تحديد —</option>
                      {candidates.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
                    </select>
                  </label>
                );
              })}
            </div>
          </div>
        ) : (
          <p className="mt-4 text-xs text-slate-400">مفيش أقسام متسجلة لسه — اكتب قسم كل موظف من تاب "الموظفون والعقود" الأول عشان الهيكل يتبني.</p>
        )}
        {unassignedCount > 0 && (
          <p className="mt-3 text-xs text-amber-600">{unassignedCount} موظف من غير قسم محدد — هيظهروا تحت مجموعة "بدون قسم" في الهيكل.</p>
        )}
      </Card>

      {employees.length === 0 ? <EmptyState text="لسه معملتش أي موظف." /> : (
        <Card className="overflow-x-auto p-8">
          <OrgChartTree tree={tree} expanded={expanded} onToggle={toggle} />
        </Card>
      )}
    </div>
  );
}

}

/* ================= ADMIN AUTH GATE ================= */
// Guards the whole app behind a real login. Before this, the deployed page had no
// authentication at all — anyone with the URL could open and edit every salary, penalty,
// and personal record. There is no self-serve sign-up: the first admin account is created
// once, by hand, in the Firebase Console (Authentication → Users), and then whitelisted by
// adding a matching document to the `admins` collection — see the setup notes delivered
// alongside this file. `admins` documents are never client-writable (see firestore.rules),
// so nobody can grant themselves access from the app itself.
function FullScreenLoader({ text }) {
  return (
    <div className="flex min-h-[500px] w-full items-center justify-center bg-stone-50">
      <div className="flex flex-col items-center gap-3 text-teal-700">
        <Loader2 className="animate-spin" size={28} />
        <span className="text-sm font-medium">{text}</span>
      </div>
    </div>
  );
}

      <div className="w-full max-w-sm rounded-2xl border border-stone-200 bg-white p-6 shadow-sm">

          <div className="mb-3 flex h-11 w-11 items-center justify-center rounded-xl bg-teal-800 text-white"><Lock size={20} /></div>

        </div>
        <form onSubmit={(e) => { e.preventDefault(); onSubmit(form); }} className="space-y-3">
          <Field label="الإيميل"><input type="email" required autoFocus className={inputCls} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} /></Field>
          <Field label="كلمة المرور"><input type="password" required className={inputCls} value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} /></Field>
          {error && <p className="rounded-lg bg-rose-50 px-3 py-2 text-xs text-rose-600">{error}</p>}
          <button disabled={busy} className="flex w-full items-center justify-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2.5 text-sm font-semibold text-white hover:bg-teal-900 disabled:opacity-50">
            {busy ? <Loader2 size={15} className="animate-spin" /> : <LogIn size={15} />} دخول
          </button>
        </form>
      </div>
    </div>
  );
}

function AccessDeniedScreen({ email }) {
  return (
    <div dir="rtl" className="flex min-h-[500px] w-full items-center justify-center bg-stone-50 p-6 font-sans">
      <div className="w-full max-w-sm rounded-2xl border border-rose-200 bg-white p-6 text-center shadow-sm">
        <div className="mb-3 flex justify-center text-rose-500"><ShieldAlert size={28} /></div>
        <h1 className="mb-1 text-lg font-bold text-slate-800">الحساب ده مش مصرح له بدخول الأدمن</h1>
        <p className="mb-4 text-xs text-slate-400">الحساب <span dir="ltr">{email}</span> اتسجل دخول صح، بس مش من ضمن حسابات الأدمن المسموح لها. لو ده حساب صح، أضف الـ UID بتاعه في مجموعة <code>admins</code> بقاعدة البيانات.</p>
        <button onClick={() => signOut(auth)} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50">تسجيل خروج</button>
      </div>
    </div>
  );
}

function AdminAuthGate() {
  const [authState, setAuthState] = useState("loading"); // loading | signedOut | checking | admin | denied
  const [user, setUser] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    const unsub = onAuthStateChanged(auth, async (u) => {
      setUser(u);
      if (!u) { setAuthState("signedOut"); return; }
      setAuthState("checking");
      try {
        const snap = await getDoc(doc(db, "admins", u.uid));
        setAuthState(snap.exists() ? "admin" : "denied");
      } catch (e) {
        console.error(e);
        setAuthState("denied");
      }
    });
    return unsub;
  }, []);

  async function handleLogin(form) {
    setError(""); setBusy(true);
    try {
      await signInWithEmailAndPassword(auth, form.email.trim(), form.password);
    } catch (err) {
      setError("بيانات الدخول غلط، أو الحساب ده مش موجود.");
    } finally { setBusy(false); }
  }

  if (authState === "loading") return <FullScreenLoader text="جاري التحقق من الدخول..." />;
  if (authState === "signedOut") return <AdminLoginScreen onSubmit={handleLogin} busy={busy} error={error} />;
  if (authState === "checking") return <FullScreenLoader text="جاري التحقق من الصلاحيات..." />;
  if (authState === "denied") return <AccessDeniedScreen email={user?.email} />;
  return <HRSystem adminUser={user} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AdminAuthGate />);
</script>
</body>
</html>
