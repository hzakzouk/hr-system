                <button onClick={() => onUpdate({ investigationOpenedDate: today })} className="rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">{t("تسجيل بدء التحقيق رسميًا (النهاردة)")}</button>
              )}
            </div>
            {!p.investigationOpenedDate && <p className="text-xs text-slate-500">{t("لازم يبدأ تحقيق رسمي خلال {n} أيام من تاريخ العلم بالمخالفة.", { n: INVESTIGATION_START_DEADLINE_DAYS })}</p>}
            {p.investigationOpenedDate && (
              <>
                <Field label="محضر التحقيق (أقوال الموظف والشهود)"><textarea className={inputCls} rows={4} value={recordDraft} onChange={(e) => setRecordDraft(e.target.value)} onBlur={() => { if (recordDraft !== (note.investigationRecord || "")) onSaveNote({ investigationRecord: recordDraft }); }} placeholder={t("اكتب محضر التحقيق هنا - النص ده داخلي، الموظف مش بيشوفه من بوابته.")} /></Field>
                <label className="flex items-center gap-2 text-xs text-slate-600"><input type="checkbox" checked={!!p.investigationExtended} onChange={() => onUpdate({ investigationExtended: !p.investigationExtended })} /> {t("تمديد التحقيق 3 شهور إضافية (لو ظهرت أدلة جديدة)")}</label>
                <div className="grid grid-cols-2 gap-3 items-end">
                  <Field label="تاريخ قفل التحقيق"><input type="date" className={inputCls} value={p.investigationClosedDate || ""} onChange={(e) => setInvestigationClosedDate(e.target.value)} /></Field>
                  {!p.investigationClosedDate && status === "investigating" && (
                    <button onClick={() => setInvestigationClosedDate(today)} className="rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">{t("قفل التحقيق")}</button>
                  )}
                </div>
              </>
            )}
          </div>
        </Card>
      )}

      {(status === "pending_decision" || p.actionType || p.cleared) && (
        <Card className="p-4">
          <h4 className="mb-3 text-sm font-bold text-slate-700">{t("القرار")}</h4>
          <form onSubmit={saveDecision} className="space-y-3">
            <div className="grid grid-cols-2 gap-3">
              <Field label="تاريخ القرار"><input type="date" className={inputCls} value={decisionForm.date} onChange={(e) => setDecisionForm((f) => ({ ...f, date: e.target.value }))} /></Field>
              <Field label="نوع الجزاء"><select className={inputCls} value={decisionForm.actionType} onChange={(e) => setDecisionForm((f) => ({ ...f, actionType: e.target.value }))}><option value="">{t("غلق التحقيق - ثبوت البراءة")}</option>{ACTION_TYPES.map((at) => <option key={at} value={at}>{t(at)}</option>)}</select></Field>
            </div>
            {decisionForm.actionType === "خصم مالي" && (
              <Field label="قيمة الخصم (ج.م)">
                <input type="number" min="0" className={inputCls} value={decisionForm.amount} onChange={(e) => setDecisionForm((f) => ({ ...f, amount: e.target.value }))} />
                {cap > 0 && Number(decisionForm.amount) > cap && <p className="mt-1 text-xs font-semibold text-rose-600">{t("تنبيه: تجاوزت الحد القانوني للخصم في المخالفة الواحدة (5 أيام أجر ≈ {cap} ج.م)", { cap: fmtMoney(cap) })}</p>}
              </Field>
            )}
            <Field label="السبب"><input required className={inputCls} value={decisionForm.reason} onChange={(e) => setDecisionForm((f) => ({ ...f, reason: e.target.value }))} /></Field>
            <button type="submit" className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Save size={15} /> {(p.actionType || p.cleared) ? t("حفظ") : t("إصدار القرار")}</button>
          </form>
        </Card>
      )}

      {p.violationDate && (
        <Card className="p-4">
          <h4 className="mb-3 flex items-center gap-1.5 text-sm font-bold text-slate-700"><ShieldOff size={15} /> {t("إيقاف على ذمة التحقيق (بأجر كامل)")}</h4>
          {!p.suspended ? (
            <form onSubmit={saveSuspension} className="space-y-3">
              <div className="grid grid-cols-2 gap-3">
                <Field label="من"><input type="date" className={inputCls} value={suspendForm.start} onChange={(e) => setSuspendForm((f) => ({ ...f, start: e.target.value }))} /></Field>
                <Field label="لغاية"><input type="date" className={inputCls} value={suspendForm.end} onChange={(e) => setSuspendForm((f) => ({ ...f, end: e.target.value }))} /></Field>
              </div>
              {suspendForm.start && suspendForm.end && daysBetween(suspendForm.start, suspendForm.end) > SUSPENSION_MAX_DAYS && <p className="text-xs font-semibold text-rose-600">{t("تجاوزت الحد الأقصى للإيقاف ({n} يوم)", { n: SUSPENSION_MAX_DAYS })}</p>}
              <button type="submit" className="rounded-lg border border-amber-600 bg-amber-50 px-3.5 py-2 text-sm font-semibold text-amber-700 hover:bg-amber-100">{t("تسجيل الإيقاف")}</button>
            </form>
          ) : (
            <div className="space-y-2">
              <div className="grid grid-cols-2 gap-3">
                <Field label="من"><input type="date" className={inputCls} value={p.suspensionStart || ""} onChange={(e) => onUpdate({ suspensionStart: e.target.value })} /></Field>
                <Field label="لغاية"><input type="date" className={inputCls} value={p.suspensionEnd || ""} onChange={(e) => onUpdate({ suspensionEnd: e.target.value })} /></Field>
              </div>
              {suspensionDays > SUSPENSION_MAX_DAYS && <p className="text-xs font-semibold text-rose-600">{t("تجاوزت الحد الأقصى للإيقاف ({n} يوم)", { n: SUSPENSION_MAX_DAYS })}</p>}
              <button onClick={() => onUpdate({ suspended: false, suspensionStart: "", suspensionEnd: "" })} className="text-xs font-semibold text-rose-600 hover:underline">{t("إلغاء الإيقاف")}</button>
            </div>
          )}
        </Card>
      )}

      {p.actionType && (
        <Card className="p-4">
          <h4 className="mb-3 text-sm font-bold text-slate-700">{t("تظلم الموظف")}</h4>
          {!p.appealFiledDate ? (
            <>
              <p className="mb-2 text-xs text-slate-500">{t("مهلة التظلم: {n} أيام من علم الموظف بالقرار.", { n: APPEAL_WINDOW_DAYS })}</p>
              <form onSubmit={fileAppeal} className="space-y-3">
                <Field label="تاريخ التظلم"><input type="date" className={inputCls} value={appealForm.filedDate} onChange={(e) => setAppealForm((f) => ({ ...f, filedDate: e.target.value }))} /></Field>
                <Field label="ملاحظات التظلم"><textarea className={inputCls} rows={2} value={appealForm.notes} onChange={(e) => setAppealForm((f) => ({ ...f, notes: e.target.value }))} /></Field>
                <button type="submit" className="rounded-lg border border-amber-600 bg-amber-50 px-3.5 py-2 text-sm font-semibold text-amber-700 hover:bg-amber-100">{t("تسجيل تظلم")}</button>
              </form>
            </>
          ) : (
            <div className="space-y-3">
              <Field label="تاريخ التظلم"><input type="date" className={inputCls} value={p.appealFiledDate} onChange={(e) => onUpdate({ appealFiledDate: e.target.value })} /></Field>
              <Field label="ملاحظات التظلم"><textarea className={inputCls} rows={2} value={appealNotesDraft} onChange={(e) => setAppealNotesDraft(e.target.value)} onBlur={() => { if (appealNotesDraft !== (note.appealNotes || "")) onSaveNote({ appealNotes: appealNotesDraft }); }} /></Field>
            </div>
          )}
        </Card>
      )}
      {p.appealFiledDate && (
        <Card className="p-4">
          <h4 className="mb-3 text-sm font-bold text-slate-700">{t("قرار التظلم")}</h4>
          {!p.appealDecision ? (
            <form onSubmit={resolveAppeal} className="space-y-3">
              <Field label="القرار"><select className={inputCls} value={resolveForm.decision} onChange={(e) => setResolveForm((f) => ({ ...f, decision: e.target.value }))}><option value="accepted">{t("قبول التظلم")}</option><option value="rejected">{t("رفض التظلم")}</option></select></Field>
              <Field label="تاريخ قرار التظلم"><input type="date" className={inputCls} value={resolveForm.date} onChange={(e) => setResolveForm((f) => ({ ...f, date: e.target.value }))} /></Field>
              <Field label="ملاحظات (اختياري)"><textarea className={inputCls} rows={2} value={resolveForm.notes} onChange={(e) => setResolveForm((f) => ({ ...f, notes: e.target.value }))} /></Field>
              <button type="submit" className="rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">{t("حفظ قرار التظلم")}</button>
            </form>
          ) : (
            <div className="space-y-3">
              <Field label="القرار"><select className={inputCls} value={p.appealDecision} onChange={(e) => onUpdate({ appealDecision: e.target.value })}><option value="accepted">{t("قبول التظلم")}</option><option value="rejected">{t("رفض التظلم")}</option></select></Field>
              <Field label="تاريخ قرار التظلم"><input type="date" className={inputCls} value={p.appealDecisionDate || ""} onChange={(e) => onUpdate({ appealDecisionDate: e.target.value })} /></Field>
            </div>
          )}
        </Card>
      )}

      <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">
        <button onClick={onPrint} className="flex items-center gap-1.5 rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50"><Printer size={15} /> {t("طباعة")}</button>
        <button onClick={onClose} className="rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900">{t("تم")}</button>
      </div>
    </div>
  );
}

/* ================= SURVEYS (استطلاعات الرأي) ================= */
// أداة إنشاء استطلاعات مرنة - الأدمن بيبني الاستطلاع بنفسه بأي عدد أسئلة وأي نوع (تقييم 1-5،
// اختيار من متعدد، نعم/لا، نص حر)، ولما ينشره بيظهر لكل الموظفين النشطين في بوابتهم مع إشعار
// وآخر ميعاد. الردود معروفة (مربوطة باسم الموظف) - المستخدم طلب ده صراحة عشان يقدر يتابع مين
// لسه محتاج يرد ومين رد بإيه بالظبط، عكس استطلاعات الرأي المجهولة العادية.
function SurveysTab({ employees, surveys, setSurveys, surveyResponses, setSurveyResponses }) {
  const { t } = useLang();
  const [modalOpen, setModalOpen] = useState(false);
  const [editingSurvey, setEditingSurvey] = useState(null);
  const [resultsSurveyId, setResultsSurveyId] = useState(null);
  const today = todayISO();

  function openNew() { setEditingSurvey(null); setModalOpen(true); }
  function openEdit(s) { setEditingSurvey(s); setModalOpen(true); }
  function save(data) {
    if (editingSurvey) {
      setSurveys(surveys.map((s) => (s.id === editingSurvey.id ? { ...s, ...data } : s)));
    } else {
      setSurveys([{ id: uid("srv"), published: false, closedEarly: false, createdAt: today, ...data }, ...surveys]);
    }
    setModalOpen(false);
    setEditingSurvey(null);
  }
  function togglePublish(s) { setSurveys(surveys.map((x) => (x.id === s.id ? { ...x, published: !x.published } : x))); }
  function toggleClosedEarly(s) { setSurveys(surveys.map((x) => (x.id === s.id ? { ...x, closedEarly: !x.closedEarly } : x))); }
  function remove(id) {
    setSurveys(surveys.filter((s) => s.id !== id));
    setSurveyResponses(surveyResponses.filter((r) => r.surveyId !== id));
    if (resultsSurveyId === id) setResultsSurveyId(null);
  }
  function statusOf(s) {
    if (!s.published) return "draft";
    return isSurveyOpen(s, today) ? "open" : "closed";
  }
  const statusTone = { draft: "slate", open: "teal", closed: "amber" };
  const statusLabel = { draft: "مسودة", open: "تحت الرد", closed: "مقفول" };

  const sorted = [...surveys].sort((a, b) => ((a.createdAt || "") < (b.createdAt || "") ? 1 : -1));
  const resultsSurvey = resultsSurveyId ? surveys.find((s) => s.id === resultsSurveyId) : null;

  return (
    <div>
      <SectionTitle eyebrow={t("{n} استطلاع مسجل", { n: surveys.length })} title="استطلاعات الرأي" action={
        <button onClick={openNew} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">
          <Plus size={16} /> {t("استطلاع جديد")}
        </button>
      } />
      {sorted.length === 0 ? <Card className="p-0"><EmptyState text="مفيش استطلاعات مسجلة." /></Card> : (
        <div className="space-y-3">
          {sorted.map((s) => {
            const status = statusOf(s);
            const respondedCount = surveyResponses.filter((r) => r.surveyId === s.id).length;
            return (
              <Card key={s.id} className="p-4">
                <div className="flex items-start justify-between gap-3">
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2">
                      <span className="font-semibold text-slate-800">{t(s.title)}</span>
                      <StampBadge tone={statusTone[status]}>{t(statusLabel[status])}</StampBadge>
                    </div>
                    {s.description && <p className="mt-1 text-sm text-slate-500">{t(s.description)}</p>}
                    <div className="mt-2 flex flex-wrap items-center gap-3 text-xs text-slate-400">
                      <span>{t("آخر ميعاد")}: {s.deadline || "—"}</span>
                      <span>{t("{n} سؤال", { n: (s.questions || []).length })}</span>
                      <span>{t("{count} من {total} ردوا", { count: respondedCount, total: employees.length })}</span>
                    </div>
                  </div>
                  <div className="flex shrink-0 items-center gap-1">
                    <button onClick={() => setResultsSurveyId(s.id)} title={t("النتائج")} className="rounded-md p-1.5 text-slate-400 hover:bg-teal-50 hover:text-teal-700"><BarChart3 size={15} /></button>
                    <button onClick={() => openEdit(s)} title={t("تعديل")} className="rounded-md p-1.5 text-slate-400 hover:bg-teal-50 hover:text-teal-700"><Pencil size={15} /></button>
                    <button onClick={() => remove(s.id)} title={t("حذف")} className="rounded-md p-1.5 text-slate-400 hover:bg-rose-50 hover:text-rose-600"><Trash2 size={15} /></button>
                  </div>
                </div>
                <div className="mt-3 flex items-center gap-2 border-t border-stone-100 pt-3">
                  {!s.published ? (
                    <button onClick={() => togglePublish(s)} className="rounded-lg bg-teal-800 px-3 py-1.5 text-xs font-semibold text-white hover:bg-teal-900">{t("نشر للموظفين")}</button>
                  ) : (
                    <>
                      <span className="text-xs font-semibold text-emerald-700">{t("منشور للموظفين")}</span>
                      {!s.closedEarly && status === "open" && (
                        <button onClick={() => toggleClosedEarly(s)} className="text-xs font-semibold text-slate-500 hover:underline">{t("إغلاق الاستطلاع الآن")}</button>
                      )}
                      {s.closedEarly && (
                        <button onClick={() => toggleClosedEarly(s)} className="text-xs font-semibold text-teal-700 hover:underline">{t("إعادة فتح الاستطلاع")}</button>
                      )}
                    </>
                  )}
                </div>
              </Card>
            );
          })}
        </div>
      )}
      <Modal open={modalOpen} onClose={() => { setModalOpen(false); setEditingSurvey(null); }} title={editingSurvey ? t("تعديل الاستطلاع") : t("استطلاع رأي جديد")} wide>
        <SurveyForm survey={editingSurvey} onSave={save} onCancel={() => { setModalOpen(false); setEditingSurvey(null); }} />
      </Modal>
      {resultsSurvey && (
        <Modal open onClose={() => setResultsSurveyId(null)} title={t("نتائج: {title}", { title: resultsSurvey.title })} wide>
          <SurveyResultsView survey={resultsSurvey} responses={surveyResponses.filter((r) => r.surveyId === resultsSurvey.id)} employees={employees} />
        </Modal>
      )}
    </div>
  );
}
function blankSurveyQuestion() { return { id: uid("sq"), type: "rating5", text: "", options: [], required: true }; }
function SurveyForm({ survey, onSave, onCancel }) {
  const { t } = useLang();
  const [form, setForm] = useState(() => survey ? {
    title: survey.title || "", description: survey.description || "", deadline: survey.deadline || "",
    questions: (survey.questions || []).map((q) => ({ ...q, optionsText: (q.options || []).join("\n") })),
  } : {
    title: "", description: "", deadline: "", questions: [{ ...blankSurveyQuestion(), optionsText: "" }],
  });
  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  function addQuestion() { setForm((f) => ({ ...f, questions: [...f.questions, { ...blankSurveyQuestion(), optionsText: "" }] })); }
  function updateQuestion(id, field, value) { setForm((f) => ({ ...f, questions: f.questions.map((q) => (q.id === id ? { ...q, [field]: value } : q)) })); }
  function removeQuestion(id) { setForm((f) => ({ ...f, questions: f.questions.filter((q) => q.id !== id) })); }

  const questionsValid = form.questions.length > 0 && form.questions.every((q) => q.text.trim() && (q.type !== "multipleChoice" || q.optionsText.split("\n").map((o) => o.trim()).filter(Boolean).length >= 2));
  const formValid = form.title.trim() && form.deadline && questionsValid;

  function submit(e) {
    e.preventDefault();
    if (!formValid) return;
    onSave({
      title: form.title.trim(),
      description: form.description.trim(),
      deadline: form.deadline,
      questions: form.questions.map((q) => ({
        id: q.id, type: q.type, text: q.text.trim(), required: q.required !== false,
        options: q.type === "multipleChoice" ? q.optionsText.split("\n").map((o) => o.trim()).filter(Boolean) : [],
      })),
    });
  }

  return (
    <form onSubmit={submit} className="space-y-4">
      <Field label="عنوان الاستطلاع"><input required className={inputCls} value={form.title} onChange={(e) => set("title", e.target.value)} placeholder={t("مثلًا: استطلاع نبض العمل - أغسطس 2026")} /></Field>
      <Field label="وصف مختصر (اختياري)"><textarea className={inputCls} rows={2} value={form.description} onChange={(e) => set("description", e.target.value)} /></Field>
      <Field label="آخر ميعاد للرد"><input required type="date" className={inputCls} value={form.deadline} onChange={(e) => set("deadline", e.target.value)} /></Field>

      <div>
        <div className="mb-2 flex items-center justify-between">
          <span className="text-sm font-semibold text-slate-700">{t("الأسئلة")}</span>
          <button type="button" onClick={addQuestion} className="flex items-center gap-1 text-xs font-semibold text-teal-700 hover:text-teal-900"><Plus size={13} /> {t("إضافة سؤال")}</button>
        </div>
        <div className="space-y-3">
          {form.questions.map((q, i) => (
            <div key={q.id} className="rounded-lg border border-stone-200 p-3">
              <div className="mb-2 flex items-center gap-2">
                <span className="text-xs font-semibold text-slate-400">{t("سؤال {n}", { n: i + 1 })}</span>
                <select className={`${inputCls} w-auto`} value={q.type} onChange={(e) => updateQuestion(q.id, "type", e.target.value)}>
                  {SURVEY_QUESTION_TYPES.map((qt) => <option key={qt} value={qt}>{t(SURVEY_QUESTION_TYPE_LABELS[qt])}</option>)}
                </select>
                <label className="flex items-center gap-1 text-xs text-slate-500"><input type="checkbox" checked={q.required !== false} onChange={(e) => updateQuestion(q.id, "required", e.target.checked)} /> {t("إجباري")}</label>
                {form.questions.length > 1 && (
                  <button type="button" onClick={() => removeQuestion(q.id)} className="me-auto rounded-md p-1 text-slate-400 hover:bg-rose-50 hover:text-rose-600"><Trash2 size={14} /></button>
                )}
              </div>
              <input required className={inputCls} value={q.text} onChange={(e) => updateQuestion(q.id, "text", e.target.value)} placeholder={t("نص السؤال")} />
              {q.type === "multipleChoice" && (
                <textarea className={`${inputCls} mt-2`} rows={3} value={q.optionsText} onChange={(e) => updateQuestion(q.id, "optionsText", e.target.value)} placeholder={t("اكتب كل اختيار في سطر لوحده (سطرين على الأقل)")} />
              )}
            </div>
          ))}
        </div>
      </div>

      <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">
        <button type="button" onClick={onCancel} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50">{t("إلغاء")}</button>
        <button type="submit" disabled={!formValid} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900 disabled:opacity-40"><Save size={15} /> {t("حفظ")}</button>
      </div>
    </form>
  );
}
// نتائج الاستطلاع: ملخص مجمّع لكل سؤال (متوسط + توزيع للتقييمات، أعمدة نسبة لكل اختيار، وكل
// الردود النصية) + جدول ردود لكل موظف بالاسم (الردود معروفة مش مجهولة) + قايمة اللي لسه محدش رد.
function SurveyResultsView({ survey, responses, employees }) {
  const { t } = useLang();
  const respondedIds = new Set(responses.map((r) => r.employeeId));
  const notResponded = employees.filter((e) => !respondedIds.has(e.id));
  const rate = employees.length ? Math.round((respondedIds.size / employees.length) * 100) : 0;
  function empName(id) { return employees.find((e) => e.id === id)?.name || t("موظف سابق"); }
  function answerFor(resp, questionId) { return (resp.answers || []).find((a) => a.questionId === questionId)?.value; }

  return (
    <div className="space-y-5">
      <div className="grid grid-cols-3 gap-3">
        <div className="rounded-xl bg-stone-100 px-3 py-2.5 text-center"><div className="text-lg font-bold tabular-nums">{responses.length}</div><div className="text-[11px] text-slate-500">{t("عدد الردود")}</div></div>
        <div className="rounded-xl bg-stone-100 px-3 py-2.5 text-center"><div className="text-lg font-bold tabular-nums">{employees.length}</div><div className="text-[11px] text-slate-500">{t("إجمالي الموظفين")}</div></div>
        <div className="rounded-xl bg-teal-50 px-3 py-2.5 text-center"><div className="text-lg font-bold tabular-nums text-teal-700">{rate}%</div><div className="text-[11px] text-teal-600">{t("نسبة الاستجابة")}</div></div>
      </div>

      {responses.length === 0 ? (
        <EmptyState text="لسه محدش رد على الاستطلاع ده." />
      ) : (
        <div className="space-y-4">
          {(survey.questions || []).map((q, qi) => {
            const values = responses.map((r) => answerFor(r, q.id)).filter((v) => v !== undefined && v !== "");
            return (
              <Card key={q.id} className="p-4">
                <div className="mb-3 text-sm font-semibold text-slate-800">{qi + 1}. {t(q.text)}</div>
                {q.type === "rating5" && (() => {
                  const nums = values.map(Number).filter((n) => !isNaN(n));
                  const avg = nums.length ? (nums.reduce((s, n) => s + n, 0) / nums.length) : 0;
                  return (
                    <div>
                      <div className="mb-2 text-xs text-slate-500">{t("متوسط التقييم")}: <span className="font-bold text-teal-700">{avg.toFixed(1)}</span> / 5 ({nums.length} {t("رد")})</div>
                      <div className="space-y-1">
                        {[5, 4, 3, 2, 1].map((n) => {
                          const count = nums.filter((v) => v === n).length;
                          const pct = nums.length ? Math.round((count / nums.length) * 100) : 0;
                          return (
                            <div key={n} className="flex items-center gap-2 text-xs">
                              <span className="w-3 text-slate-500">{n}</span>
                              <div className="h-2 flex-1 overflow-hidden rounded-full bg-stone-100"><div className="h-full rounded-full bg-teal-700" style={{ width: `${pct}%` }} /></div>
                              <span className="w-10 text-left text-slate-400 tabular-nums">{count}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })()}
                {(q.type === "multipleChoice" || q.type === "yesno") && (() => {
                  const opts = q.type === "yesno" ? SURVEY_YESNO_OPTIONS : (q.options || []);
                  return (
                    <div className="space-y-1">
                      {opts.map((opt) => {
                        const count = values.filter((v) => v === opt).length;
                        const pct = values.length ? Math.round((count / values.length) * 100) : 0;
                        return (
                          <div key={opt} className="flex items-center gap-2 text-xs">
                            <span className="w-24 shrink-0 truncate text-slate-600">{t(opt)}</span>
                            <div className="h-2 flex-1 overflow-hidden rounded-full bg-stone-100"><div className="h-full rounded-full bg-teal-700" style={{ width: `${pct}%` }} /></div>
                            <span className="w-10 text-left text-slate-400 tabular-nums">{count}</span>
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}
                {q.type === "text" && (
                  values.length === 0 ? <p className="text-xs text-slate-400">{t("مفيش ردود على السؤال ده لسه.")}</p> : (
                    <div className="space-y-2">
                      {responses.filter((r) => { const v = answerFor(r, q.id); return v !== undefined && v !== ""; }).map((r) => (
                        <div key={r.id} className="rounded-lg bg-stone-50 px-3 py-2 text-xs">
                          <div className="mb-0.5 font-semibold text-slate-600">{empName(r.employeeId)}</div>
                          <div className="whitespace-pre-line text-slate-600">{answerFor(r, q.id)}</div>
                        </div>
                      ))}
                    </div>
                  )
                )}
              </Card>
            );
          })}
        </div>
      )}

      <div>
        <div className="mb-2 text-sm font-semibold text-slate-700">{t("الردود حسب الموظف")}</div>
        {responses.length === 0 ? <p className="text-xs text-slate-400">{t("لسه محدش رد.")}</p> : (
          <div className="space-y-2">
            {responses.map((r) => (
              <details key={r.id} className="rounded-lg border border-stone-200 p-3">
                <summary className="cursor-pointer text-sm font-semibold text-slate-700">{empName(r.employeeId)} <span className="font-normal text-slate-400">- {r.submittedAt ? r.submittedAt.slice(0, 10) : "—"}</span></summary>
                <div className="mt-2 space-y-1.5">
                  {(survey.questions || []).map((q) => (
                    <div key={q.id} className="text-xs">
                      <span className="text-slate-500">{t(q.text)}: </span>
                      <span className="font-medium text-slate-700">{t(String(answerFor(r, q.id) ?? "—"))}</span>
                    </div>
                  ))}
                </div>
              </details>
            ))}
          </div>
        )}
      </div>

      {notResponded.length > 0 && (
        <div>
          <div className="mb-2 text-sm font-semibold text-slate-700">{t("لسه محدش رد ({n})", { n: notResponded.length })}</div>
          <div className="flex flex-wrap gap-1.5">
            {notResponded.map((e) => <StampBadge key={e.id} tone="slate">{e.name}</StampBadge>)}
          </div>
        </div>
      )}
    </div>
  );
}

  const [statusFilter, setStatusFilter] = useState("الكل");
  function add(data) { setAdvances([{ id: uid("adv"), ...data }, ...advances]); setModalOpen(false); }
  function remove(id) { setAdvances(advances.filter((a) => a.id !== id)); }
  function empName(id) { return employees.find((e) => e.id === id)?.name || t("موظف سابق"); }

  // الفلتر هنا (اسم/حالة السداد) بيأثر بس على الجدول والتصدير - عدد السلف في الـ eyebrow بيفضل يعكس الكل.
  const filteredAdvances = useMemo(() => {
    const q = query.trim().toLowerCase();
    return advances.filter((a) => {
      if (q && !empName(a.employeeId).toLowerCase().includes(q)) return false;
      const settled = advanceRemaining(a) === 0;
      if (statusFilter === "settled" && !settled) return false;
      if (statusFilter === "outstanding" && settled) return false;
      return true;
    });
  }, [advances, query, statusFilter, employees]);
  const filtersActive = query.trim() || statusFilter !== "الكل";
  function clearFilters() { setQuery(""); setStatusFilter("الكل"); }

  function exportExcel() {
    const rows = filteredAdvances.map((a) => ({

      [t("القيمة")]: a.totalAmount,
      [t("عدد الأقساط")]: a.installments,
      [t("القسط الشهري")]: Math.round(a.totalAmount / a.installments),

        <div className="flex items-center gap-2">

          <button onClick={() => setModalOpen(true)} disabled={employees.length === 0} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900 disabled:opacity-40"><Plus size={16} /> {t("سلفة جديدة")}</button>

          </div>
          <select className={`${inputCls} w-auto`} value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
            <option value="الكل">{t("كل الحالات")}</option>

            </tr></thead>
            <tbody>
              {filteredAdvances.map((a) => (
                <tr key={a.id} className="border-b border-stone-100 last:border-0 hover:bg-stone-50">

function AdvanceForm({ employees, onSave, onCancel }) {
  const { t } = useLang();
  const [form, setForm] = useState({ employeeId: employees[0]?.id || "", date: todayISO(), totalAmount: "", installments: 1, notes: "" });
  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  function submit(e) { e.preventDefault(); if (!form.employeeId || !form.totalAmount) return; onSave({ ...form, totalAmount: Number(form.totalAmount) || 0, installments: Number(form.installments) || 1 }); }
  return (
    <form onSubmit={submit} className="space-y-4">
      <Field label="الموظف"><select required className={inputCls} value={form.employeeId} onChange={(e) => set("employeeId", e.target.value)}>{employees.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}</select></Field>

        <Field label="تاريخ الصرف"><input type="date" className={inputCls} value={form.date} onChange={(e) => set("date", e.target.value)} /></Field>

      </div>
      <Field label="ملاحظات (اختياري)"><textarea className={inputCls} rows={2} value={form.notes} onChange={(e) => set("notes", e.target.value)} /></Field>
      <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">

/* ================= EMPLOYEE REQUESTS (كل الطلبات الجايه من بوابة الموظف - كل الأنواع وكل
   الحالات، مش بس المعلّقة اللي ظاهرة في لوحة المتابعة أو بانر الاستقالة في تاب الموظفين) =================
   بيتوزّن على "requests" (نفس الـ collection اللي بوابة الموظف بتكتب فيها وبتقرأ منها) - كل
   مستند فيه بالفعل employeeName/kind/status جاهزين من وقت الإرسال، فمحتاجينش أي lookup تاني على
   قايمة الموظفين هنا. */
function EmployeeRequestsTab({ requests }) {
  const { t } = useLang();
  const [query, setQuery] = useState("");
  const [kindFilter, setKindFilter] = useState("الكل");
  const [statusFilter, setStatusFilter] = useState("الكل");

  function requestDetail(r) { return formatRequestDetail(r, t); }

  const sorted = useMemo(() => [...requests].sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1)), [requests]);

  // الفلتر هنا (اسم/نوع/حالة) بيأثر بس على الجدول والتصدير - الـ eyebrow بيفضل يعكس إجمالي كل الطلبات.
  const filteredRequests = useMemo(() => {
    const q = query.trim().toLowerCase();
    return sorted.filter((r) => {
      if (q && !(r.employeeName || "").toLowerCase().includes(q)) return false;
      if (kindFilter !== "الكل" && r.kind !== kindFilter) return false;
      if (statusFilter !== "الكل" && r.status !== statusFilter) return false;
      return true;
    });
  }, [sorted, query, kindFilter, statusFilter]);
  const filtersActive = query.trim() || kindFilter !== "الكل" || statusFilter !== "الكل";
  function clearFilters() { setQuery(""); setKindFilter("الكل"); setStatusFilter("الكل"); }

  function exportExcel() {
    const rows = filteredRequests.map((r) => ({
      [t("الموظف")]: r.employeeName,
      [t("النوع")]: t(REQUEST_KIND_LABELS[r.kind] || r.kind),
      [t("التفاصيل")]: requestDetail(r),
      [t("السبب")]: r.reason || "",
      [t("الحالة")]: t(REQUEST_STATUS_LABELS[r.status] || r.status),
      [t("تاريخ الطلب")]: (r.createdAt || "").slice(0, 10),
      [t("تم البت بواسطة")]: r.decidedByName || "",
      [t("تاريخ القرار")]: (r.decidedAt || "").slice(0, 10),
    }));
    exportRowsToExcel(rows, t("طلبات الموظفين"), "employee-requests");
  }

  return (
    <div>
      <SectionTitle eyebrow={t("{n} طلب مسجل", { n: requests.length })} title="طلبات الموظفين" action={
        <button onClick={exportExcel} disabled={filteredRequests.length === 0} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50 disabled:opacity-40"><FileSpreadsheet size={15} /> {t("تصدير Excel")}</button>
      } />
      {requests.length > 0 && (
        <div className="mb-4 flex flex-wrap items-center gap-2">
          <div className="flex min-w-[220px] flex-1 items-center gap-2 rounded-lg border border-stone-300 bg-white px-3 py-2">
            <Search size={16} className="text-slate-400" />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={t("دور باسم الموظف...")} className="w-full text-sm outline-none" />
          </div>
          <select className={`${inputCls} w-auto`} value={kindFilter} onChange={(e) => setKindFilter(e.target.value)}>
            <option value="الكل">{t("كل الأنواع")}</option>
            {Object.keys(REQUEST_KIND_LABELS).map((k) => <option key={k} value={k}>{t(REQUEST_KIND_LABELS[k])}</option>)}
          </select>
          <select className={`${inputCls} w-auto`} value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
            <option value="الكل">{t("كل الحالات")}</option>
            <option value="pending">{t(REQUEST_STATUS_LABELS.pending)}</option>
            <option value="pending_ceo">{t(REQUEST_STATUS_LABELS.pending_ceo)}</option>
            <option value="approved">{t(REQUEST_STATUS_LABELS.approved)}</option>
            <option value="rejected">{t(REQUEST_STATUS_LABELS.rejected)}</option>
          </select>
          {filtersActive && (
            <button onClick={clearFilters} className="rounded-lg border border-stone-300 px-3 py-2 text-xs font-semibold text-slate-500 hover:bg-stone-50">{t("مسح الفلاتر")}</button>
          )}
        </div>
      )}
      {requests.length === 0 ? (
        <Card className="p-0"><EmptyState text="مفيش طلبات مسجلة لسه." /></Card>
      ) : filteredRequests.length === 0 ? (
        <Card className="p-0"><EmptyState text="مفيش طلبات مطابقة للفلتر." /></Card>
      ) : (
        <Card className="overflow-x-auto p-0">
          <table className="w-full text-sm">
            <thead><tr className="border-b border-stone-200 bg-stone-50 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">
              <th className="px-4 py-3">{t("الموظف")}</th><th className="px-4 py-3">{t("النوع")}</th><th className="px-4 py-3">{t("التفاصيل")}</th><th className="px-4 py-3">{t("الحالة")}</th><th className="px-4 py-3">{t("تاريخ الطلب")}</th>
            </tr></thead>
            <tbody>
              {filteredRequests.map((r) => (
                <tr key={r.id} className="border-b border-stone-100 last:border-0 hover:bg-stone-50">
                  <td className="px-4 py-3 font-medium text-slate-800 whitespace-nowrap">{r.employeeName}</td>
                  <td className="px-4 py-3 text-slate-600 whitespace-nowrap">{t(REQUEST_KIND_LABELS[r.kind] || r.kind)}</td>
                  <td className="px-4 py-3 text-slate-500">
                    {requestDetail(r)}
                    {r.reason && <span className="mx-1.5 text-xs text-slate-400">({r.reason})</span>}
                  </td>
                  <td className="px-4 py-3">
                    <span className={`rounded-full border px-2.5 py-0.5 text-xs font-semibold ${REQUEST_STATUS_COLORS[r.status] || ""}`}>{t(REQUEST_STATUS_LABELS[r.status] || r.status)}</span>
                    {r.status !== "pending" && r.status !== "pending_ceo" && r.decidedByName && (
                      <div className="mt-1 text-[11px] text-slate-400">{t("تم البت بواسطة {name}", { name: r.decidedByName })}</div>
                    )}
                  </td>
                  <td className="px-4 py-3 whitespace-nowrap text-slate-500">{(r.createdAt || "").slice(0, 10)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
      )}
    </div>
  );
}

/* ================= FORMER EMPLOYEES ================= */
function FormerEmployeesTab({ employees, setEmployees, allEmployees, onDelete }) {
  const { t } = useLang();
  const [editing, setEditing] = useState(null);
  const [selected, setSelected] = useState(() => new Set());
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [query, setQuery] = useState("");
  function saveSettlement(id, data) {
    setEmployees(allEmployees.map((e) => (e.id === id ? { ...e, ...data } : e)));
    setEditing(null);
  }
  function reactivate(id) {
    setEmployees(allEmployees.map((e) => (e.id === id ? { ...e, status: "active" } : e)));
  }
  function toggleSelected(id) {
    setSelected((s) => { const n = new Set(s); if (n.has(id)) n.delete(id); else n.add(id); return n; });
  }
  // الفلتر (اسم) بيأثر بس على الجدول والتصدير - عدد الموظفين السابقين في الـ eyebrow بيفضل يعكس الكل.
  // "تحديد الكل" بيشتغل على الصفوف الظاهرة (بعد الفلتر) بس، مش على كل الموظفين السابقين.
  const filteredEmployees = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return employees;
    return employees.filter((e) => (e.name || "").toLowerCase().includes(q));
  }, [employees, query]);
  const filtersActive = query.trim().length > 0;
  function clearFilters() { setQuery(""); }
  const allSelected = filteredEmployees.length > 0 && filteredEmployees.every((e) => selected.has(e.id));
  const someSelected = filteredEmployees.some((e) => selected.has(e.id));
  function toggleSelectAll() {
    setSelected((s) => {
      const n = new Set(s);
      if (allSelected) filteredEmployees.forEach((e) => n.delete(e.id));
      else filteredEmployees.forEach((e) => n.add(e.id));
      return n;
    });
  }
  function runConfirmedDelete() {
    onDelete(confirmDelete.map((e) => e.id));
    setSelected((s) => { const n = new Set(s); confirmDelete.forEach((e) => n.delete(e.id)); return n; });
    setConfirmDelete(null);
  }
  function exportExcel() {
    const rows = filteredEmployees.map((e) => ({
      [t("الاسم")]: e.name,
      [t("تاريخ التعيين")]: e.hireDate,
      [t("تاريخ الاستقالة")]: e.resignationDate,
      [t("تسوية نهاية الخدمة")]: e.settlementAmount || 0,
    }));
    exportRowsToExcel(rows, t("موظفون سابقون"), "former-employees");
  }
  return (
    <div>
      <SectionTitle eyebrow={t("{n} موظف سابق", { n: employees.length })} title={t("موظفون سابقون")} action={
        <div className="flex items-center gap-2">
          <button onClick={exportExcel} disabled={filteredEmployees.length === 0} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50 disabled:opacity-40"><FileSpreadsheet size={15} /> {t("تصدير Excel")}</button>
          {selected.size > 0 && (
            <button onClick={() => setConfirmDelete(employees.filter((e) => selected.has(e.id)))} className="flex items-center gap-1.5 rounded-lg border border-rose-500 bg-rose-50 px-3.5 py-2 text-sm font-semibold text-rose-700 hover:bg-rose-100">
              <Trash2 size={16} /> {t("حذف المحدد ({n})", { n: selected.size })}
            </button>
          )}
        </div>
      } />
      {employees.length > 0 && (
        <div className="mb-4 flex flex-wrap items-center gap-2">
          <div className="flex min-w-[220px] flex-1 items-center gap-2 rounded-lg border border-stone-300 bg-white px-3 py-2">
            <Search size={16} className="text-slate-400" />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={t("دور باسم الموظف...")} className="w-full text-sm outline-none" />
          </div>
          {filtersActive && (
            <button onClick={clearFilters} className="rounded-lg border border-stone-300 px-3 py-2 text-xs font-semibold text-slate-500 hover:bg-stone-50">{t("مسح الفلاتر")}</button>
          )}
        </div>
      )}
      {employees.length === 0 ? (
        <Card className="p-0"><EmptyState text="مفيش موظفين سابقين مسجلين." /></Card>
      ) : filteredEmployees.length === 0 ? (
        <Card className="p-0"><EmptyState text="مفيش موظفين مطابقين للفلتر." /></Card>
      ) : (
        <Card className="overflow-x-auto p-0">
          <table className="w-full text-sm">
            <thead><tr className="border-b border-stone-200 bg-stone-50 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">
              <th className="w-8 px-4 py-3">
                <input type="checkbox" checked={allSelected} ref={(el) => { if (el) el.indeterminate = someSelected && !allSelected; }} onChange={toggleSelectAll} className="h-4 w-4 rounded border-stone-300" />
              </th>
              <th className="px-4 py-3">{t("الاسم")}</th><th className="px-4 py-3">{t("تاريخ التعيين")}</th><th className="px-4 py-3">{t("تاريخ الاستقالة")}</th><th className="px-4 py-3">{t("تسوية نهاية الخدمة")}</th><th className="px-4 py-3"></th>
            </tr></thead>
            <tbody>
              {filteredEmployees.map((e) => (
                <tr key={e.id} className={`border-b border-stone-100 last:border-0 hover:bg-stone-50 ${selected.has(e.id) ? "bg-rose-50/40" : ""}`}>
                  <td className="px-4 py-3"><input type="checkbox" checked={selected.has(e.id)} onChange={() => toggleSelected(e.id)} className="h-4 w-4 rounded border-stone-300" /></td>
                  <td className="px-4 py-3 font-medium text-slate-800">{e.name}</td>
                  <td className="px-4 py-3 text-slate-500">{e.hireDate}</td>
                  <td className="px-4 py-3 text-slate-500">{e.resignationDate}</td>
                  <td className="px-4 py-3 tabular-nums text-slate-700">{e.settlementAmount ? `${fmtMoney(e.settlementAmount)} ${t("ج.م")}` : "—"}</td>
                  <td className="px-4 py-3">
                    <div className="flex items-center gap-1">
                      <button onClick={() => setEditing(e)} className="rounded-md p-1.5 text-slate-400 hover:bg-stone-100 hover:text-teal-700"><Pencil size={15} /></button>
                      <button onClick={() => reactivate(e.id)} title={t("إعادة تفعيل")} className="rounded-md p-1.5 text-slate-400 hover:bg-emerald-50 hover:text-emerald-600"><Check size={15} /></button>
                      <button onClick={() => setConfirmDelete([e])} title={t("حذف نهائي")} className="rounded-md p-1.5 text-slate-400 hover:bg-rose-50 hover:text-rose-600"><Trash2 size={15} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
      )}
      <Modal open={!!editing} onClose={() => setEditing(null)} title={t("تسوية نهاية الخدمة")}>
        {editing && <SettlementForm emp={editing} onSave={(d) => saveSettlement(editing.id, d)} onCancel={() => setEditing(null)} />}
      </Modal>
      {confirmDelete && (
        <EmployeeDeleteConfirmModal employees={confirmDelete} onConfirm={runConfirmedDelete} onCancel={() => setConfirmDelete(null)} />
      )}
    </div>
  );
}
function SettlementForm({ emp, onSave, onCancel }) {
  const { t } = useLang();
  const [form, setForm] = useState({ resignationDate: emp.resignationDate || todayISO(), lastWorkingDay: emp.lastWorkingDay || "", settlementAmount: emp.settlementAmount || "", settlementNotes: emp.settlementNotes || "" });
  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  function submit(e) { e.preventDefault(); onSave({ ...form, settlementAmount: Number(form.settlementAmount) || 0 }); }
  return (
    <form onSubmit={submit} className="space-y-4">
      <div className="grid grid-cols-2 gap-4">
        <Field label="تاريخ تقديم الاستقالة"><input type="date" className={inputCls} value={form.resignationDate} onChange={(e) => set("resignationDate", e.target.value)} /></Field>
        <Field label="آخر يوم عمل"><input type="date" className={inputCls} value={form.lastWorkingDay} onChange={(e) => set("lastWorkingDay", e.target.value)} /></Field>
      </div>
      <Field label="قيمة تسوية نهاية الخدمة (ج.م)"><input type="number" min="0" className={inputCls} value={form.settlementAmount} onChange={(e) => set("settlementAmount", e.target.value)} /></Field>
      <Field label="ملاحظات"><textarea rows={2} className={inputCls} value={form.settlementNotes} onChange={(e) => set("settlementNotes", e.target.value)} /></Field>
      <div className="flex justify-end gap-2 border-t border-stone-200 pt-4">
        <button type="button" onClick={onCancel} className="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-stone-50">{t("إلغاء")}</button>
        <button type="submit" className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-900"><Save size={15} /> {t("حفظ")}</button>
      </div>
    </form>
  );
}

/* ================= PAYROLL ================= */
// بنود المرتب المحسوبة (غير الأساسي، اللي بيتعدّل في سجل الموظف نفسه) اللي ممكن الأدمن يعدّلها
// يدويًا شهريًا من تاب المرتبات - كل بند مربوط بمفتاح override ومفتاح سبب في payrollMeta[empId]
// (راجع applyPayrollOverride وcomputePayrollRow/computePayrollBreakdown فوق). sign بس للعرض
// (+/- قبل الرقم في الجدول ولون الخط).
const PAYROLL_LINE_ITEMS = [
  { key: "absenceDeduction", overrideKey: "absenceDeductionOverride", reasonKey: "absenceDeductionReason", label: "خصم الغياب", sign: -1 },
  { key: "lateDeduction", overrideKey: "lateDeductionOverride", reasonKey: "lateDeductionReason", label: "خصم التأخير", sign: -1 },
  { key: "penaltyDeduction", overrideKey: "penaltyDeductionOverride", reasonKey: "penaltyDeductionReason", label: "جزاءات", sign: -1 },
  { key: "advanceDeduction", overrideKey: "advanceDeductionOverride", reasonKey: "advanceDeductionReason", label: "سلف", sign: -1 },
  { key: "insuranceDeduction", overrideKey: "insuranceDeductionOverride", reasonKey: "insuranceDeductionReason", label: "تأمينات", sign: -1 },
  { key: "taxDeduction", overrideKey: "taxDeductionOverride", reasonKey: "taxDeductionReason", label: "ضريبة", sign: -1 },
  { key: "overtimePay", overrideKey: "overtimePayOverride", reasonKey: "overtimePayReason", label: "إضافي", sign: 1 },
];
function PayrollTab({ employees, setEmployees, attendance, penalties, payrollMeta, setPayrollMeta, advances, settings, payslipDocs, onSyncPayslips }) {
  const { t, lang } = useLang();
  // عمود اسم الموظف بيفضل ثابت (sticky) وانت بتعمل سكرول أفقي في الجدول العريض ده - عشان
  // تعرف صاحب الصف وانت شايف أي بند. start-0 (بدل left-0/right-0) بتتبع اتجاه اللغة تلقائيًا
  // (يمين في RTL عربي، شمال في LTR إنجليزي) - نفس فكرة text-start المستخدمة في EvaluationsTab/
  // SalaryIncreaseTab، مدعومة في نفس نسخة Tailwind (CDN) المستخدمة في الملف.
  const stickyColCls = "sticky start-0";
  const [ym, setYm] = useState(todayISO().slice(0, 7));
  const [payslipEmp, setPayslipEmp] = useState(null);
  const [breakdownEmpId, setBreakdownEmpId] = useState(null);
  const [query, setQuery] = useState("");
  const [paidFilter, setPaidFilter] = useState("الكل");
  const meta = payrollMeta[ym] || {};

  // تعديل مباشر للراتب الأساسي من نفس تاب المرتبات - المكان اللي الأدمن أصلًا بيراجع فيه
  // الأرقام شهريًا، بدل ما يضطر يفتح فورم تعديل الموظف الكامل. زي أي تعديل تاني في المرتب،
  // لازم سبب إجباري - نفس بالظبط منطق EmployeeForm وSalaryIncreaseTab.approve (راجع
  // upd.employees في HRSystem: بيسجّل التغيير نفسه تلقائيًا + سطر منفصل للسبب في سجل النشاط).
  const [editingSalary, setEditingSalary] = useState(null); // { empId, empName, currentSalary }
  const [salaryInput, setSalaryInput] = useState("");
  const [salaryReason, setSalaryReason] = useState("");
  const [salaryReasonError, setSalaryReasonError] = useState("");
  function openSalaryEdit(emp) {
    setEditingSalary({ empId: emp.id, empName: emp.name, currentSalary: Number(emp.salary) || 0 });
    setSalaryInput(String(emp.salary ?? ""));
    setSalaryReason("");
    setSalaryReasonError("");
  }
  function closeSalaryEdit() {
    setEditingSalary(null);
    setSalaryInput("");
    setSalaryReason("");
    setSalaryReasonError("");
  }
  function confirmSalaryEdit(e) {
    e.preventDefault();
    const nextSalary = Number(salaryInput);
    if (!(nextSalary >= 0)) { setSalaryReasonError("لازم تدخل رقم صحيح للمرتب."); return; }
    if (nextSalary === editingSalary.currentSalary) { closeSalaryEdit(); return; } // مفيش تغيير فعلي - مفيش داعي لسبب ولا تعديل
    if (!salaryReason.trim()) { setSalaryReasonError("لازم تكتب سبب تعديل المرتب."); return; }
    setEmployees(
      employees.map((e2) => (e2.id === editingSalary.empId ? { ...e2, salary: nextSalary } : e2)),
      { employeeName: editingSalary.empName, reason: salaryReason.trim() }
    );
    closeSalaryEdit();
  }

  function setMetaFor(empId, patch) { setPayrollMeta({ ...payrollMeta, [ym]: { ...meta, [empId]: { ...(meta[empId] || {}), ...patch } } }); }

  // تعديل أي بند تاني من مفردات المرتب (غياب/تأخير/جزاءات/سلف/تأمينات/ضريبة/إضافي) - مش بس
  // الأساسي. القيمة بتتخزّن كـ override في payrollMeta[empId] لنفس الشهر (زي "مكافأة" بالظبط)،
  // فبتتسجّل تلقائيًا في سجل النشاط لأن upd.payrollMeta أصلًا بيعمل diffSummary عام على كل
  // حقول payrollMeta - مش محتاجين أي كود إضافي زي ما عملنا مع الراتب الأساسي (upd.employees).
  const [editingLine, setEditingLine] = useState(null); // { empId, empName, item, currentValue, computedValue, overridden }
  const [lineInput, setLineInput] = useState("");
  const [lineReason, setLineReason] = useState("");
  const [lineReasonError, setLineReasonError] = useState("");
  function openLineEdit(item, row) {
    const currentValue = row[item.key];
    const computedValue = row.computed[item.key];
    setEditingLine({ empId: row.emp.id, empName: row.emp.name, item, currentValue, computedValue, overridden: currentValue !== computedValue });
    setLineInput(String(currentValue ?? ""));
    setLineReason(meta[row.emp.id]?.[item.reasonKey] || "");
    setLineReasonError("");
  }
  function closeLineEdit() {
    setEditingLine(null);
    setLineInput("");
    setLineReason("");
    setLineReasonError("");
  }
  function confirmLineEdit(e) {
    e.preventDefault();
    const nextValue = Number(lineInput);
    if (!(nextValue >= 0)) { setLineReasonError("لازم تدخل رقم صحيح."); return; }
    if (nextValue === editingLine.currentValue) { closeLineEdit(); return; } // مفيش تغيير فعلي
    if (!lineReason.trim()) { setLineReasonError("لازم تكتب سبب التعديل."); return; }
    setMetaFor(editingLine.empId, { [editingLine.item.overrideKey]: nextValue, [editingLine.item.reasonKey]: lineReason.trim() });
    closeLineEdit();
  }
  // رجوع البند لقيمته المحسوبة تلقائيًا (إلغاء الـ override) - بيمسح مفتاحي القيمة والسبب سوا.
  function resetLineToComputed(item, row) {
    setMetaFor(row.emp.id, { [item.overrideKey]: null, [item.reasonKey]: null });
  }
  // بنحسب تفاصيل الخصم بس للموظف المفتوح حاليًا (مش لكل صف في الجدول) - نفس فلسفة payslipEmp
  // جنبه، توفير حساب مش لازم يتكرر لكل موظف كل render.
  const breakdownEmp = employees.find((e) => e.id === breakdownEmpId);
  const breakdown = breakdownEmp ? computePayrollBreakdown(breakdownEmp, ym, attendance, penalties, advances, settings, meta) : null;

  const rows = employees.map((e) => computePayrollRow(e, ym, attendance, penalties, advances, settings, meta));
  const syncedCount = payslipDocs.filter((d) => d.id.startsWith(`${ym}_`)).length;
  const totals = rows.reduce((acc, r) => {
    acc.base += Number(r.emp.salary) || 0;
    acc.deductions += r.absenceDeduction + r.lateDeduction + r.penaltyDeduction + r.advanceDeduction + r.insuranceDeduction + r.taxDeduction;
    acc.additions += r.overtimePay + r.bonus;
    acc.net += r.net;
    return acc;
  }, { base: 0, deductions: 0, additions: 0, net: 0 });

  // الفلتر هنا (اسم/حالة الصرف) بيأثر بس على الجدول والتصدير - كروت الإجماليات فوق بتفضل
  // بتعكس كل الموظفين في الشهر المحدد (نفس منطق تاب الحضور والانصراف).
  const filteredRows = useMemo(() => {
    const q = query.trim().toLowerCase();
    return rows.filter((r) => {
      if (q && !r.emp.name.toLowerCase().includes(q)) return false;
      if (paidFilter === "paid" && !r.paid) return false;
      if (paidFilter === "unpaid" && r.paid) return false;
      return true;
    });
  }, [rows, query, paidFilter]);
  const filtersActive = query.trim() || paidFilter !== "الكل";
  function clearFilters() { setQuery(""); setPaidFilter("الكل"); }

  function exportExcel() {
    const sheetRows = filteredRows.map((r) => ({
      [t("الموظف")]: r.emp.name,
      [t("الأساسي")]: r.emp.salary,
      [t("غياب")]: -r.absenceDeduction,
      [t("خصم تأخير")]: -r.lateDeduction,
      [t("جزاءات")]: -r.penaltyDeduction,
      [t("سلف")]: -r.advanceDeduction,
      [t("تأمينات")]: -r.insuranceDeduction,
      [t("ضريبة")]: -r.taxDeduction,
      [t("إضافي")]: r.overtimePay,
      [t("مكافأة")]: r.bonus,
      [t("الصافي")]: r.net,
      [t("الحالة")]: r.paid ? t("تم الصرف") : t("لسه"),
    }));
    exportRowsToExcel(sheetRows, t("المرتبات"), `payroll-${ym}`);
  }

  function shiftMonth(delta) {
    const [y, m] = ym.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    setYm(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  }

  return (
    <div>
      <SectionTitle eyebrow={t("كشف رواتب شهري")} title={t("المرتبات")} action={
        <div className="flex items-center gap-2">
          <button onClick={exportExcel} disabled={filteredRows.length === 0} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50 disabled:opacity-40">
            <FileSpreadsheet size={15} /> {t("تصدير Excel")}
          </button>
          <button onClick={() => shiftMonth(-1)} className="rounded-lg border border-stone-300 p-2 hover:bg-stone-50">{lang === "en" ? <ChevronLeft size={16} /> : <ChevronRight size={16} />}</button>
          <input type="month" value={ym} onChange={(e) => setYm(e.target.value)} className={`${inputCls} w-auto`} />
          <button onClick={() => shiftMonth(1)} className="rounded-lg border border-stone-300 p-2 hover:bg-stone-50">{lang === "en" ? <ChevronRight size={16} /> : <ChevronLeft size={16} />}</button>
        </div>
      } />

      <p className="mb-4 flex items-start gap-1.5 rounded-lg bg-amber-50 px-3 py-2 text-xs text-amber-700"><Info size={14} className="mt-0.5 shrink-0" />{t("خصومات التأمينات والضريبة تقديرية حسب النسب في تاب «الإعدادات» — راجعها مع محاسبك قبل الاعتماد عليها فعليًا.")}</p>

      <div className="mb-4 flex items-center justify-between gap-3 rounded-lg border border-teal-200 bg-teal-50 px-3 py-2.5">
        <p className="text-xs text-teal-700">
          {syncedCount === 0 ? t("بوابة الموظفين لسه ما شافتش مرتب الشهر ده.") : t("متزامن مع بوابة الموظفين: {synced} من {total} موظف.", { synced: syncedCount, total: rows.length })}
          {" "}{t("الموظفين مش هيشوفوا أي تعديل هنا غير بعد ما تدوس «مزامنة».")}
        </p>
        <button onClick={() => onSyncPayslips(ym, rows)} className="flex shrink-0 items-center gap-1.5 rounded-lg bg-teal-800 px-3 py-1.5 text-xs font-semibold text-white hover:bg-teal-900">
          <Upload size={13} /> {t("مزامنة مع بوابة الموظفين")}
        </button>
      </div>

      <div className="mb-5 grid grid-cols-4 gap-3">
        <div className="rounded-xl bg-stone-100 px-4 py-3"><div className="text-lg font-bold tabular-nums text-slate-800">{fmtMoney(totals.base)}</div><div className="text-xs font-medium text-slate-500">{t("إجمالي الرواتب الأساسية")}</div></div>
        <div className="rounded-xl bg-rose-50 px-4 py-3"><div className="text-lg font-bold tabular-nums text-rose-700">-{fmtMoney(totals.deductions)}</div><div className="text-xs font-medium text-rose-600">{t("إجمالي الخصومات")}</div></div>
        <div className="rounded-xl bg-emerald-50 px-4 py-3"><div className="text-lg font-bold tabular-nums text-emerald-700">+{fmtMoney(totals.additions)}</div><div className="text-xs font-medium text-emerald-600">{t("إضافي ومكافآت")}</div></div>
        <div className="rounded-xl bg-teal-800 px-4 py-3"><div className="text-lg font-bold tabular-nums text-white">{fmtMoney(totals.net)}</div><div className="text-xs font-medium text-teal-100">{t("صافي المستحق")}</div></div>
      </div>

      {rows.length > 0 && (
        <div className="mb-4 flex flex-wrap items-center gap-2">
          <div className="flex min-w-[220px] flex-1 items-center gap-2 rounded-lg border border-stone-300 bg-white px-3 py-2">
            <Search size={16} className="text-slate-400" />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder={t("دور باسم الموظف...")} className="w-full text-sm outline-none" />
          </div>
          <select className={`${inputCls} w-auto`} value={paidFilter} onChange={(e) => setPaidFilter(e.target.value)}>
            <option value="الكل">{t("كل الحالات")}</option>
            <option value="paid">{t("تم الصرف")}</option>
            <option value="unpaid">{t("لسه")}</option>
          </select>
          {filtersActive && (
            <button onClick={clearFilters} className="rounded-lg border border-stone-300 px-3 py-2 text-xs font-semibold text-slate-500 hover:bg-stone-50">{t("مسح الفلاتر")}</button>
          )}
        </div>
      )}

      {rows.length === 0 ? <Card className="p-0"><EmptyState text="لسه معملتش أي موظف نشط." /></Card> : filteredRows.length === 0 ? (
        <Card className="p-0"><EmptyState text="مفيش موظفين مطابقين للفلتر." /></Card>
      ) : (
        <Card className="overflow-x-auto p-0">
          <table className="w-full text-sm">
            <thead><tr className="border-b border-stone-200 bg-stone-50 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">
              <th className={`${stickyColCls} z-10 bg-stone-50 px-2.5 py-2.5`}>{t("الموظف")}</th><th className="px-2 py-2.5">{t("الأساسي")}</th><th className="px-2 py-2.5">{t("غياب")}</th><th className="px-2 py-2.5">{t("خصم تأخير")}</th><th className="px-2 py-2.5">{t("جزاءات")}</th>
              <th className="px-2 py-2.5">{t("سلف")}</th><th className="px-2 py-2.5">{t("تأمينات")}</th><th className="px-2 py-2.5">{t("ضريبة")}</th><th className="px-2 py-2.5">{t("إضافي")}</th>
              <th className="px-2 py-2.5">{t("مكافأة")}</th><th className="px-2 py-2.5">{t("الصافي")}</th><th className="px-2 py-2.5">{t("الحالة")}</th><th className="px-2 py-2.5"></th>
            </tr></thead>
            <tbody>
              {filteredRows.map((r) => (
                <tr key={r.emp.id} className="border-b border-stone-100 last:border-0 hover:bg-stone-50">
                  <td className={`${stickyColCls} z-10 bg-white px-2.5 py-2 font-medium text-slate-800 whitespace-nowrap`}><button onClick={() => setBreakdownEmpId(r.emp.id)} className="hover:underline hover:text-teal-800">{r.emp.name}</button></td>
                  <td className="px-2 py-2 tabular-nums text-slate-600 whitespace-nowrap">

  );

// شاشة "تفاصيل خصم المرتب" - بالضغط على اسم الموظف في تاب المرتبات. على عكس PayslipModal (إيصال
// نهائي للطباعة، أرقام بس) الهدف هنا إنه يوضّح "إزاي اتحسب كل رقم" (المعادلة والمدخلات) - عشان
// المستخدم يقدر يراجع صحة الخصم بنفسه من غير ما يفتح ملف الإكسل أو يحسبها يدوي.
function PayrollBreakdownModal({ b, ym, onClose }) {
  const { t, lang } = useLang();
  const dateFmt = (d) => d || "—";
  // لما بند يكون معدّل يدويًا من تاب المرتبات (overridden - مختلف عن القيمة المحسوبة تلقائيًا في
  // b.computed)، بيظهر توضيح تحت الصيغة الأصلية يوضّح القيمة اللي كانت هتتحسب، والسبب المسجّل.
  function overrideNoteFor(key) {
    if (!b.computed || b[key] === b.computed[key]) return null;
    return t("معدّل يدويًا (كان {computed} ج.م تلقائيًا) - السبب: {reason}", { computed: fmtMoney(b.computed[key]), reason: (b.reasons && b.reasons[key]) || t("بدون سبب مسجل") });
  }
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4">
      <div className="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-2xl bg-white shadow-xl">
        <div className="flex items-center justify-between border-b border-stone-200 px-6 py-4">
          <div>
            <h3 className="text-lg font-bold text-slate-800">{t("تفاصيل خصم المرتب")}</h3>
            <p className="text-xs text-slate-400">{b.emp.name} — {ym}</p>
          </div>
          <button onClick={onClose} className="rounded-full p-1.5 text-slate-400 hover:bg-stone-100"><X size={18} /></button>
        </div>
        <div className="space-y-3 p-6">
          <BreakdownLine title={t("الراتب الأساسي")} formula={t("—")} amount={b.base} positive />

          <BreakdownLine
            title={t("خصم الغياب")}
            formula={b.absentDays > 0
              ? t("{days} يوم غياب × {rate} ج.م/يوم (الأساسي ÷ 30)", { days: b.absentDays, rate: fmtMoney(b.perDayRate) })
              : t("مفيش أيام غياب مسجلة الشهر ده")}
            amount={-b.absenceDeduction}
            overrideNote={overrideNoteFor("absenceDeduction")}
          />

          <BreakdownLine
            title={t("خصم التأخير")}
            formula={b.lateMinutes > 0
              ? t("{mins} دقيقة تأخير × {rate} ج.م/دقيقة (الأساسي ÷ 240 ساعة ÷ 60)", { mins: b.lateMinutes, rate: (Math.round(b.perMinuteRate * 100) / 100).toLocaleString("en-US") })
              : t("مفيش دقايق تأخير مسجلة الشهر ده")}
            amount={-b.lateDeduction}
            overrideNote={overrideNoteFor("lateDeduction")}
          />

          <BreakdownLine
            title={t("خصم الجزاءات")}
            formula={b.monthPenalties.length === 0 ? t("مفيش جزاءات مالية الشهر ده") : null}
            amount={-b.penaltyDeduction}
            overrideNote={overrideNoteFor("penaltyDeduction")}
          >
            {b.monthPenalties.length > 0 && (
              <ul className="mt-1 space-y-0.5 text-[11px] text-slate-400">
                {b.monthPenalties.map((p) => (
                  <li key={p.id}>{dateFmt(p.date)} — {p.reason || t("بدون سبب مسجل")} — {fmtMoney(p.amount)} {t("ج.م")}</li>
                ))}
              </ul>
            )}
          </BreakdownLine>

          <BreakdownLine
            title={t("خصم أقساط السلف")}
            formula={b.advanceLines.length === 0 ? t("مفيش سلف نشطة الشهر ده") : null}
            amount={-b.advanceDeduction}
            overrideNote={overrideNoteFor("advanceDeduction")}
          >
            {b.advanceLines.length > 0 && (
              <ul className="mt-1 space-y-0.5 text-[11px] text-slate-400">
                {b.advanceLines.map((l) => (
                  <li key={l.advance.id}>{t("سلفة {date} — قسط شهري {amount} ج.م", { date: dateFmt(l.advance.date), amount: fmtMoney(l.monthlyInstallment) })}</li>
                ))}
              </ul>
            )}
          </BreakdownLine>

          <BreakdownLine
            title={t("التأمينات الاجتماعية")}
            formula={t("{rate}% × الأساسي ({base} ج.م)", { rate: b.insuranceRate, base: fmtMoney(b.base) })}
            amount={-b.insuranceDeduction}
            overrideNote={overrideNoteFor("insuranceDeduction")}
          />

          <BreakdownLine
            title={t("ضريبة كسب العمل")}
            formula={t("الوعاء السنوي الخاضع للضريبة {taxable} ج.م، حسب شرائح الضريبة في الإعدادات — القيمة هنا نصيب الشهر (÷12)", { taxable: fmtMoney(b.annualTaxable) })}
            amount={-b.taxDeduction}
            overrideNote={overrideNoteFor("taxDeduction")}
          />

          <BreakdownLine
            title={t("مقابل الوقت الإضافي")}
            formula={b.overtimeHours > 0
              ? t("{hours} ساعة × {rate} ج.م/ساعة × {mult} (معامل الإضافي)", { hours: b.overtimeHours, rate: fmtMoney(b.hourlyRate), mult: b.overtimeMultiplier })
              : t("مفيش ساعات إضافي مسجلة الشهر ده")}
            amount={b.overtimePay}
            positive
            overrideNote={overrideNoteFor("overtimePay")}
          />

          <BreakdownLine title={t("مكافأة")} formula={t("مُدخلة يدويًا لهذا الشهر")} amount={b.bonus} positive />

          <div className="flex items-center justify-between rounded-xl bg-teal-800 px-4 py-3">
            <span className="text-sm font-bold text-white">{t("صافي المستحق")}</span>
            <span className="text-lg font-bold tabular-nums text-white">{fmtMoney(b.net)} {t("ج.م")}</span>
          </div>
        </div>
      </div>
    </div>
  );
}
function BreakdownLine({ title, formula, amount, positive, overrideNote, children }) {

/* ================= SETTINGS ================= */
// Same JSON shape as the old localStorage-era backup file (hr_employees, hr_attendance,
// hr_payroll, ...) so a file downloaded before the Firestore migration is still a valid
// import here — this doubles as the one-time migration tool: export from Firestore any
// time as a safety copy, or import an old localStorage backup straight into Firestore.
const BACKUP_KEYS = ["hr_employees", "hr_attendance", "hr_penalties", "hr_payroll", "hr_advances", "hr_documents", "hr_reviews", "hr_settings", "hr_orgchart"];

function BackupSection({ employees, attendance, penalties, payrollMeta, advances, documents, reviews, settings, orgChart, upd }) {
  const { t } = useLang();
  const fileRef = useRef(null);
  const [msg, setMsg] = useState(null); // { tone: "teal" | "rose", text }
  const [busy, setBusy] = useState(false);

  function exportBackup() {
    const payload = {
      app: "hr-system", exportedAt: new Date().toISOString(),
      data: {
        hr_employees: employees, hr_attendance: attendance, hr_penalties: penalties,
        hr_payroll: payrollMeta, hr_advances: advances, hr_documents: documents,
        hr_reviews: reviews, hr_settings: settings, hr_orgchart: orgChart,
      },
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `hr-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setMsg({ tone: "teal", text: t("تم تحميل نسخة احتياطية من قاعدة البيانات الحالية.") });
  }

  async function handleImportFile(file) {
    setMsg(null);
    setBusy(true);
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const data = parsed && parsed.data ? parsed.data : parsed;
      const imported = [];
      if (data.hr_employees) { upd.employees(data.hr_employees); imported.push("الموظفين"); }
      if (data.hr_attendance) { upd.attendance(data.hr_attendance); imported.push("الحضور"); }
      if (data.hr_penalties) { upd.penalties(data.hr_penalties); imported.push("الجزاءات"); }
      if (data.hr_payroll) { upd.payrollMeta(data.hr_payroll); imported.push("المرتبات"); }
      if (data.hr_advances) { upd.advances(data.hr_advances); imported.push("السلف"); }
      if (data.hr_documents) { upd.documents(data.hr_documents); imported.push("المستندات"); }
      if (data.hr_reviews) { upd.reviews(data.hr_reviews); imported.push("التقييمات"); }
      if (data.hr_settings) { upd.settings({ ...DEFAULT_SETTINGS, ...data.hr_settings }); imported.push("الإعدادات"); }
      if (data.hr_orgchart) { upd.orgChart({ ...DEFAULT_ORG_CHART, ...data.hr_orgchart }); imported.push("الهيكل التنظيمي"); }
      if (imported.length === 0) { setMsg({ tone: "rose", text: t("الملف ده مش نسخة احتياطية من النظام ده — مفيش أي بيانات معروفة فيه.") }); return; }
      setMsg({ tone: "teal", text: t("تم إرسال {n} من مجموعات البيانات لقاعدة البيانات — التحديث بيظهر تلقائي في الشاشة خلال ثواني.", { n: imported.length }) });
    } catch (err) {
      setMsg({ tone: "rose", text: t("تعذّر قراءة الملف — تأكد إنه ملف JSON صحيح من نسخة احتياطية سابقة.") });
    } finally {
      setBusy(false);
      if (fileRef.current) fileRef.current.value = "";
    }
  }

  return (
    <Card className="mb-6 p-5">
      <h3 className="mb-1 flex items-center gap-2 font-bold text-slate-800"><Save size={16} /> {t("النسخ الاحتياطي والاستعادة")}</h3>
      <p className="mb-4 text-xs text-slate-500">
        {t("البيانات دلوقتي متخزنة في قاعدة بيانات Firestore المشتركة، مش في متصفحك بس. برضه خد نسخة احتياطية بانتظام واحفظها في مكان آمن — نفس الزرار بيستخدم كمان لاستيراد نسخة قديمة (حتى لو كانت من زمن التخزين المحلي) مباشرة في قاعدة البيانات.")}
      </p>
      <div className="flex flex-wrap items-center gap-2">
        <button onClick={exportBackup} className="flex items-center gap-1.5 rounded-lg bg-teal-800 px-3.5 py-2 text-sm font-semibold text-white hover:bg-teal-900">
          <Save size={15} /> {t("تحميل نسخة احتياطية (JSON)")}
        </button>
        <button onClick={() => fileRef.current?.click()} disabled={busy} className="flex items-center gap-1.5 rounded-lg border border-teal-700 px-3.5 py-2 text-sm font-semibold text-teal-800 hover:bg-teal-50 disabled:opacity-50">
          {busy ? <Loader2 size={15} className="animate-spin" /> : <Upload size={15} />} {t("استيراد نسخة احتياطية")}
        </button>
        <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={(e) => e.target.files[0] && handleImportFile(e.target.files[0])} />
      </div>
      {msg && <p className={`mt-3 text-xs font-medium ${msg.tone === "rose" ? "text-rose-600" : "text-teal-700"}`}>{msg.text}</p>}
    </Card>
  );
}

const AUDIT_COLLECTION_LABELS = {

  advances: "السلف",

// Turns one changed field's raw value (from or to) into short displayable text - passed
// through t() by the caller afterwards, so a canonical Arabic value (a status, a stage, an
// action type) still translates correctly in English mode.
function formatAuditValue(v) {
  if (v === null || v === undefined || v === "") return "—";
  if (Array.isArray(v)) return v.length === 0 ? "—" : v.map((x) => (typeof x === "object" && x !== null ? JSON.stringify(x) : String(x))).join("، ");
  if (typeof v === "boolean") return v ? "نعم" : "لا";
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}

// Small hand-rolled vertical bar chart (no external charting library) - callers pass already-
// translated `label` strings, so this component never needs useLang() itself.
function MiniBarChart({ bars, formatValue, maxValue }) {
  const max = maxValue ?? Math.max(1, ...bars.map((b) => Math.abs(b.value) || 0));
  const toneCls = { teal: "bg-teal-700", emerald: "bg-emerald-600", rose: "bg-rose-600", amber: "bg-amber-500" };
  return (
    <div className="flex h-40 items-end gap-2">
      {bars.map((b, i) => (
        <div key={i} className="flex flex-1 flex-col items-center gap-1">
          <span className="text-[10px] font-semibold tabular-nums text-slate-500">{formatValue ? formatValue(b.value) : b.value}</span>
          <div className="flex w-full flex-1 items-end">
            <div className={`w-full rounded-t-md ${toneCls[b.tone || "teal"]}`} style={{ height: `${b.value ? Math.max(3, (Math.abs(b.value) / max) * 100) : 0}%` }} />
          </div>
          <span className="whitespace-nowrap text-[10px] text-slate-400">{b.label}</span>
        </div>
      ))}
    </div>
  );
}

// (باستخدام computeSuggestedIncrease وجداول settings.salaryGradeBands/salaryRatingMatrix)،
// وبيسيب لـ HR حرية التعديل في أي خانة قبل الموافقة/الرفض. الموافقة هي الحاجة الوحيدة اللي
// بتلمس مرتب الموظف الفعلي (employee.salary) - الرفض بيسجّل بس من غير أي تعديل.
function SalaryIncreaseTab({ employees, allEmployees, reviews, salaryIncreases, setSalaryIncreases, setEmployees, settings, adminUser, onOpenEmployee }) {
  const { t } = useLang();
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("الكل");
  // اعتماد زيادة راتب بيغيّر مرتب الموظف فعليًا (زي فورم تعديل الموظف بالظبط) - فلازم سبب
  // إجباري هنا كمان، مش بس في فورم التعديل اليدوي. approving بيحمل السجل (s) اللي مستني تأكيد.
  const [approving, setApproving] = useState(null);
  const [approveReason, setApproveReason] = useState("");
  const [approveReasonError, setApproveReasonError] = useState("");
  const empById = useMemo(() => Object.fromEntries((allEmployees || []).map((e) => [e.id, e])), [allEmployees]);
  const gradeBands = settings.salaryGradeBands || [];
  const ratingMatrix = settings.salaryRatingMatrix || [];

  const years = useMemo(() => {
    const fromReviews = reviews.filter((r) => r.reviewType === "سنوي" && r.status === "completed").map((r) => r.year).filter(Boolean);
    const fromRecords = (salaryIncreases || []).map((s) => s.year).filter(Boolean);
    return Array.from(new Set([...fromReviews, ...fromRecords])).sort().reverse();
  }, [reviews, salaryIncreases]);
  const [year, setYear] = useState(() => years[0] || new Date().getFullYear());

  const existingKeys = useMemo(() => new Set((salaryIncreases || []).map((s) => `${s.employeeId}__${s.year}`)), [salaryIncreases]);
  const pendingCandidates = useMemo(
    () => (employees || []).filter((e) => !existingKeys.has(`${e.id}__${year}`) && reviews.some((r) => r.employeeId === e.id && r.reviewType === "سنوي" && r.year === year && r.status === "completed")),
    [employees, reviews, year, existingKeys]
  );

  function generateForYear() {
    const additions = pendingCandidates.map((e) => {
      const review = reviews.find((r) => r.employeeId === e.id && r.reviewType === "سنوي" && r.year === year && r.status === "completed");
      const ratingScore = ratingScoreFromFinalScore(review?.finalScoreOutOf5);
      const calc = computeSuggestedIncrease(e.salary, e.grade, ratingScore, gradeBands, ratingMatrix);
      return {
        id: uid("sal"), employeeId: e.id, year, reviewId: review?.id || "",
        currentSalary: Number(e.salary) || 0, grade: e.grade || "", ratingScore,
        suggestedPercent: calc.suggestedPercent, proposedSalary: calc.proposedSalary,
        status: "pending", createdAt: todayISO(), decidedAt: "", decidedBy: "",
      };
    });
    if (additions.length) setSalaryIncreases([...(salaryIncreases || []), ...additions]);
  }

  function updateRecord(id, patch) {
    setSalaryIncreases((salaryIncreases || []).map((s) => (s.id === id ? { ...s, ...patch } : s)));
  }
  function recalcRecord(s) {
    const calc = computeSuggestedIncrease(s.currentSalary, s.grade, s.ratingScore, gradeBands, ratingMatrix);
    updateRecord(s.id, { suggestedPercent: calc.suggestedPercent, proposedSalary: calc.proposedSalary });
  }
  function approve(s, reason) {
    const emp = empById[s.employeeId];
    setEmployees(
      employees.map((e) => (e.id === s.employeeId ? { ...e, salary: s.proposedSalary } : e)),
      { employeeName: emp?.name || s.employeeId, reason }
    );
    updateRecord(s.id, { status: "approved", decidedAt: todayISO(), decidedBy: adminUser?.email || "" });
  }
  function reject(s) {
    updateRecord(s.id, { status: "rejected", decidedAt: todayISO(), decidedBy: adminUser?.email || "" });
  }
  function openApproveConfirm(s) {
    setApproving(s);
    setApproveReason("");
    setApproveReasonError("");
  }
  function closeApproveConfirm() {
    setApproving(null);
    setApproveReason("");
    setApproveReasonError("");
  }
  function confirmApprove(e) {
    e.preventDefault();
    if (!approveReason.trim()) { setApproveReasonError("لازم تكتب سبب اعتماد الزيادة."); return; }
    approve(approving, approveReason.trim());
    closeApproveConfirm();
  }

  const yearRecords = useMemo(() => (salaryIncreases || []).filter((s) => s.year === year).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1)), [salaryIncreases, year]);
  const filteredRecords = useMemo(() => {
    const q = query.trim().toLowerCase();
    return yearRecords.filter((s) => {
      if (q && !(empById[s.employeeId]?.name || "").toLowerCase().includes(q)) return false;
      if (statusFilter !== "الكل" && (s.status || "pending") !== statusFilter) return false;
      return true;
    });
  }, [yearRecords, empById, query, statusFilter]);
  const filtersActive = query.trim() || statusFilter !== "الكل";
  function clearFilters() { setQuery(""); setStatusFilter("الكل"); }

  function exportExcel() {

      [t("المرتب الجديد المقترح")]: s.proposedSalary,
      [t("الحالة")]: t(REQUEST_STATUS_LABELS[s.status || "pending"] || s.status),
    }));
    exportRowsToExcel(rows, t("زيادات الرواتب"), `salary-increases-${year}`);

  return (

          <FileSpreadsheet size={15} /> {t("تصدير Excel")}
        </button>
      } />

      <div className="mb-4 flex flex-wrap items-center justify-between gap-2">
        <select className={`${inputCls} w-auto`} value={year} onChange={(e) => setYear(Number(e.target.value))}>
          {years.length === 0 && <option value={year}>{year}</option>}

        <button

        >

        </button>

      {yearRecords.length > 0 && (
        <div className="mb-4 flex flex-wrap items-center gap-2">
